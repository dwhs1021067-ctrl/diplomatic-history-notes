    narrative:"1923年，德國無力支付凡爾賽條約鉅額賠款，法國、比利時逕自出兵佔領德國魯爾工業區作為抵押，德國政府號召消極抵抗、大量印鈔支應罷工工人薪資，導致惡性通貨膨脹徹底失控，馬克淪為廢紙。1924年，美國銀行家道威斯出面斡旋《道威斯計畫》，重新安排德國賠款支付方式並提供美國貸款協助德國經濟穩定，法國同意撤出魯爾區，是美國首次以金融外交手段介入歐洲賠款問題。同一時期，法國另扶植捷克斯洛伐克、羅馬尼亞、南斯拉夫組成小協約國，圍堵匈牙利復辟野心、填補中歐權力真空，作為東翼安全保障的替代方案。1925年歐洲強權簽訂《羅加諾公約》，德國自願承認與法比之間的西部邊界（萊茵公約條款）不可侵犯，隨後於1926年加入國際聯盟，重返國際社會核心。1928年美法主導簽訂《非戰公約》，多國宣示放棄以戰爭解決爭端，但無實質約束力。1929年進一步簽訂《楊格計畫》，調降德國賠款總額並延長支付期限，但計畫甫定案即遇上同年華爾街股市崩盤引發全球經濟大蕭條，連帶重創德國經濟，楊格計畫形同具文，也為極端民族主義提供溫床，希特勒於1933年掌權。1932年《洛桑協定》中，列強務實承認德國已無力繼續支付賠款，凡爾賽賠款體系至此實質破產。然而國際聯盟結構性缺陷始終未解：美國未加入、全體一致決效率低落、無常設武力執行決議。日本早於1931年發動九一八事變，國聯雖裁定其侵略屬實卻無力制裁，日本乾脆退出國聯（1933）。1935年義大利入侵衣索比亞，國聯同樣制裁無效。1936年希特勒進兵萊茵蘭非軍事區，英法姑息未加阻止；1938年英法在慕尼黑會議對希特勒兼併捷克蘇台德區採取姑息政策。1939年德國入侵波蘭，英法對德宣戰，二戰爆發，20年和平嘗試徹底失敗。",
    knowledge:["魯爾危機（1923）展現法國單邊強制執行凡爾賽條約的失敗——非但未能逼德國就範，反而重創歐洲經濟穩定，是後續改採美國主導金融外交手段的直接背景","道威斯計畫（1924）、楊格計畫（1929）、洛桑協定（1932）是德國賠款問題逐步調降、最終破產的三個階段，常考年代先後順序題","小協約國（捷克斯洛伐克、羅馬尼亞、南斯拉夫）是法國版的東歐圍堵同盟體系，可與俾斯麥同盟體系做操作邏輯對照","萊茵公約（保證德法比邊界不可侵犯、由英義擔任擔保國）是羅加諾公約整套條約群的核心條款，兩者常被混用，不是各自獨立的事件","《羅加諾公約》最大贏家是德國——藉此重返國際社會、加入國聯，卻未實質放棄對東部領土的修正主張","《非戰公約》（1928）雖具重要象徵意義，但完全缺乏執行機制","國際聯盟結構性缺陷：全體一致決、無常設武力、美國未加入，三者疊加導致完全無力制裁侵略","{{姑息政策}}是常考關鍵詞，指英法對修正主義國家擴張採取退讓妥協，結果適得其反","經濟大蕭條（1929）是連結一戰後秩序崩潰與二戰爆發的關鍵結構性因素"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：國際聯盟集體安全機制的失敗，印證缺乏強制力的國際制度終將淪為紙老虎——當修正主義強權決心以武力改變現狀，道德譴責與經濟制裁完全無法產生嚇阻效果。"},{label:"依賴理論／IPE",text:"角度：經濟大蕭條的全球連鎖效應，顯示國際政治經濟結構性因素如何直接催化極端政治勢力崛起。"},{label:"外交史方法論",text:"角度：{{姑息政策}}適合做個人與國家層次分析——英法對一戰慘烈傷亡記憶猶新的心理狀態，與自身國力相對衰落的結構性侷限交織。"},{label:"建構主義",text:"角度：凡爾賽條約強加的戰爭罪責條款深刻傷害德國民族自尊，為納粹復仇雪恥的民族主義敘事提供了肥沃土壤。"}]},
  {id:"nazi-expansion",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1933–1941",title:"納粹德國擴張與第二次世界大戰前期",spec:"core",
    narrative:"1933年希特勒憑藉經濟大蕭條催化的民怨與民族主義訴求合法掌權，隨即撕毀凡爾賽條約軍力限制，秘密重整軍備、恢復徵兵制。1936年進兵萊茵蘭非軍事區，英法姑息未加阻止。法國因對德國重整軍備憂心忡忡，稍早已於1935年與蘇聯簽訂《法蘇互助條約》，但條約缺乏具體軍事協調機制，實際效果有限。同年，西班牙爆發內戰，佛朗哥領導的國民軍叛變對抗共和政府，德義派兵支援佛朗哥（禿鷹軍團，並藉機測試新式武器戰術，格爾尼卡轟炸震驚國際），蘇聯則支援共和政府，英法採取不干涉政策，是二戰前最重要的意識形態代理人戰爭與姑息心態預演。同年德義簽訂軸心協定，隔年日本加入形成三國軸心雛形。1938年德國兼併奧地利（德奧合併），同年英國與義大利簽訂《復活節協定》，承認義大利對衣索比亞的佔領換取義大利安撫承諾，是姑息政策邏輯的另一案例；同年英法在慕尼黑會議對希特勒兼併捷克蘇台德區的要求採取姑息政策，幻想以退讓換取和平。1939年3月，德國進一步佔領捷克斯洛伐克全境，徹底暴露姑息政策的失敗；同年8月，德國與蘇聯簽訂《德蘇互不侵犯條約》，雙方秘密協議瓜分波蘭與東歐勢力範圍，解除了德國東西兩線同時作戰的疑慮。1939年9月1日，德國入侵波蘭，英法對德宣戰，第二次世界大戰正式爆發。1940年，德國以閃電戰迅速擊敗丹麥、挪威、荷蘭、比利時，並繞過法國馬奇諾防線攻陷法國，法國投降，僅剩英國在邱吉爾領導下孤軍奮戰、頑強抵抗德國空軍的不列顛戰役轟炸。1941年6月，希特勒撕毀德蘇互不侵犯條約，發動{{巴巴羅薩行動}}入侵蘇聯，戰事自此進入更大規模的擴張階段。",
    knowledge:["希特勒的擴張採取「切香腸」戰術——每次僅推進一小步（萊茵蘭、奧地利、蘇台德區），試探英法反應底線，待確認對方持續姑息後才進行下一步更大膽的擴張","《德蘇互不侵犯條約》（1939）是意識形態極端對立的納粹德國與蘇聯基於各自現實利益考量而締結的合作，是現實主義「敵人的敵人未必是朋友，但共同利益可以暫時凌駕意識形態」的經典案例","法國馬奇諾防線的失敗，展現靜態防禦工事在機械化閃電戰面前的過時侷限，是軍事戰略思想演進的重要教材","不列顛戰役是英國首次成功抵禦德國空中攻勢的關鍵戰役，也是希特勒放棄跨海入侵英國計畫的轉捩點","美國國會於1935年通過《中立法》，禁止對交戰國提供軍火與貸款，反映美國此時仍深陷孤立主義，同時期小羅斯福總統忙於推動新政因應經濟大蕭條、重建國內經濟，也是美國此時外交政策相對消極孤立的重要背景因素","小羅斯福總統於1937年發表隔離演說，首次公開呼籲對侵略者採取圍堵而非姑息態度，但受限國內孤立主義氛圍，實際政策並未立即跟進，是美國輿論從孤立主義逐漸轉向國際干預主義的重要轉折點"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：希特勒的漸進式擴張精準利用了英法姑息政策的心理弱點，每一步都在測試對手的抵抗意志底線，是「切香腸戰術」與「試探性擴張」的教科書案例。"},{label:"外交史方法論",text:"角度：適合比較希特勒的擴張策略與俾斯麥鐵血政策的差異——俾斯麥精算「有限戰爭達成有限目標」後即收手，希特勒則缺乏這種節制、擴張野心不斷升級，最終導致失控。"},{label:"建構主義",text:"角度：納粹意識形態中的生存空間論、種族優越論，將侵略擴張建構為德意志民族生存所必需的道德正當性敘事，是意識形態如何形塑國家對外行為的極端案例。"},{label:"依賴理論／IPE",text:"角度：德蘇互不侵犯條約背後也包含經濟合作條款（德國以工業品換取蘇聯原料），顯示意識形態對立的兩國仍可能因經濟互補性而在短期內達成戰略合作。"}]},
  {id:"wwii-course",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1941–1945",title:"第二次世界大戰的擴大與結束",spec:"core",
    narrative:"納粹德國於1941年6月發動{{巴巴羅薩行動}}入侵蘇聯，撕毀先前的德蘇互不侵犯條約，東線戰事全面展開，蘇聯雖初期節節敗退，但憑藉戰略縱深與嚴冬拖垮德軍攻勢（莫斯科保衛戰）。此前日本已於1940年9月與德、義簽訂三國同盟，1941年4月與蘇聯簽訂中立條約以穩定北方，7月進駐法屬印度支那南部，美國隨即凍結日本在美資產並實施石油禁運，11月美方提出要求日本自中國與印度支那撤軍的赫爾備忘錄，美日談判破裂。同年12月，日本偷襲珍珠港，美國正式參戰，太平洋戰爭全面爆發，美國同時對德義宣戰，歐洲、太平洋兩大戰場合流為真正的世界大戰。1942–43年是戰爭轉捩點：史達林格勒戰役蘇軍重創德軍主力、中途島海戰美軍重挫日本海軍優勢，同盟國自此轉守為攻。1943年11月，美英中三國領袖於埃及召開開羅會議，發表《開羅宣言》，明訂戰後日本應歸還台灣、澎湖予中華民國，並同意戰後朝鮮獨立。1944年6月盟軍於諾曼第登陸，開闢歐洲第二戰場；同年蘇聯亦自東線大舉反攻。1945年4月希特勒自殺，德國於5月無條件投降，歐戰結束。同年7月26日，美英中三國發表《波茨坦宣言》（蔣中正未與會，以電報表示同意；蘇聯於8月8日對日宣戰時加入），要求日本無條件投降，第8條並重申「開羅宣言之條件必將實施」，遭拒後，美國於8月對廣島、長崎投下原子彈，蘇聯同時對日宣戰，日本於8月15日宣布投降，9月2日簽署降書，第二次世界大戰正式結束。",
    knowledge:["《開羅宣言》（1943）明訂台灣、澎湖歸還中華民國，是我國主張對台灣主權的重要國際法依據之一，也是常考的關鍵條約性文件","《波茨坦宣言》（1945）是對日本要求無條件投降的文件，發布時希特勒已死、德國已投降，不要與處理德國問題的文件搞混——這是考古題明確考過的陷阱","史達林格勒戰役與中途島海戰分別是歐洲、太平洋戰場的關鍵轉捩點，常考戰爭轉折點比較題","原子彈使用是人類史上首次、也是唯一一次在實戰中使用核武器，直接催生戰後核武嚇阻理論與軍備管制議題","戰後同盟國於德國組成{{紐倫堡大審}}，追究納粹戰犯的戰爭罪責與危害人類罪，是近代國際法首次系統性追究國家領導人罪責的重要先例","太平洋戰爭的外交前因常考排序：三國同盟（1940年9月）→日蘇中立條約（1941年4月）→日軍進駐南印度支那與美國石油禁運（1941年7–8月）→赫爾備忘錄（1941年11月）→珍珠港事變（1941年12月7日，夏威夷時間）","《波茨坦宣言》第8條「開羅宣言之條件必將實施」，把開羅宣言歸還台澎的安排納入日本投降條件，日本於降書中接受波茨坦宣言，是我國主張台澎主權的法律鏈條之一，詳見詞條{{台灣地位未定論／已定論}}","同盟國另於東京設立{{東京審判（遠東國際軍事法庭）}}（1946–1948）審判日本甲級戰犯，與紐倫堡大審並列為戰後國際刑事審判的兩大先例；1951年舊金山和約第11條規定日本接受該法庭判決"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：同盟國基於共同威脅暫時擱置意識形態差異結盟，是敵人的敵人是朋友的極致案例，也預示戰後共同威脅消失後同盟必然瓦解、走向冷戰對抗。"},{label:"外交史方法論",text:"角度：適合層次分析——個人層次（高峰會外交）、國家層次（美國龐大工業產能）、系統層次（兩大陣營結盟對抗軸心國）。"},{label:"國際公法",text:"角度：《開羅宣言》雖非正式條約，卻在戰後被視為具有國際法效力的重要文件，是研究政治宣言法律效力的經典案例。"},{label:"依賴理論／IPE",text:"角度：美國透過租借法案大量軍援盟國，本土未受戰火波及、工業產能全速擴張，奠定戰後美國成為全球經濟霸權的物質基礎。"}]},
  {id:"bretton-woods",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1944",title:"布雷頓森林體系與戰後國際經濟秩序",spec:"core",
    narrative:"有鑑於兩次大戰間期各國競相採取保護主義、貨幣競貶，導致國際貿易萎縮、加深經濟大蕭條的慘痛教訓，1944年7月，44個同盟國代表於美國新罕布夏州布雷頓森林召開會議，由美國主導設計戰後國際貨幣與金融秩序。會議確立布雷頓森林體系：美元與黃金掛鉤，其他國家貨幣則與美元掛鉤形成固定匯率制度，美元成為事實上的國際準備貨幣。同時創設兩大國際經濟組織：國際貨幣基金（IMF），負責監督匯率穩定、提供國際收支危機國家短期融通；國際復興開發銀行（即世界銀行前身），負責提供戰後重建與開發中國家長期貸款。這套體系奠定了戰後西方陣營經濟合作的制度基礎，直到1971年美國尼克森總統宣布美元與黃金脫鉤為止，運作近30年。",
    knowledge:["IMF核心任務是確保國際支付體系穩定（而非直接消除貧窮或推動永續發展，那是世界銀行與聯合國其他機構的任務）——常考的功能區分題","布雷頓森林體系是自由主義國際政治經濟學國際制度促進合作理論的具體實踐案例，直接呼應戰間期經濟大蕭條保護主義的慘痛教訓","美元與黃金掛鉤、各國貨幣與美元掛鉤的雙層固定匯率設計，確立美元作為國際準備貨幣的核心地位，是美國戰後經濟霸權的制度基礎","1971年尼克森宣布美元金本位脫鉤（尼克森震撼），布雷頓森林固定匯率體系正式終結，但IMF、世界銀行兩大機構持續運作至今"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：布雷頓森林體系具體實踐新自由制度主義核心主張——透過國際制度設計協助國家因應經濟危機、減少各國以自利方式轉嫁自我損失的誘因，可與戰間期經濟大蕭條的教訓直接對照。若套用[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]框架，這是美國選擇制度化約束／制度戰略的成熟實踐，與一戰後美國棄守國際聯盟的退出戰略形成鮮明對比。"},{label:"依賴理論／IPE",text:"角度：美元作為國際準備貨幣的核心地位，某種程度上讓美國得以用本國貨幣融通全球貿易與債務，享有{{囂張特權}}，是理解戰後美元霸權與國際金融結構性不對等的重要起點。"},{label:"現實主義",text:"角度：儘管以國際合作包裝，布雷頓森林體系的設計主導權掌握在美國手中，美元中心地位本質上仍是美國在戰後權力真空期鞏固自身經濟霸權的策略性安排。"}]},
  {id:"yalta-potsdam",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1945",title:"雅爾達會議與戰後歐洲秩序安排",spec:"core",
    narrative:"1945年2月，德國敗象已定，美國羅斯福、英國邱吉爾、蘇聯史達林於克里米亞半島雅爾達召開會議，商討戰後歐洲秩序與對日作戰安排。會議決定：德國戰敗後由美英法蘇四國分區佔領、柏林市同樣劃分四區共管；波蘭東部領土劃歸蘇聯，波蘭則向西擴張、以德國東部領土補償；蘇聯承諾在歐戰結束後三個月內對日宣戰，換取庫頁島南部、千島群島及在中國東北（大連、旅順、中東鐵路）的特殊權益（此項安排事先未徵詢中華民國同意，埋下戰後中蘇交涉的爭議）；同時確立戰後成立聯合國的基本框架，安理會五常任理事國享有否決權設計。會議中，史達林同意波蘭戰後應舉行自由選舉，但戰後蘇聯實際扶植親蘇共產政權，並未履行承諾，成為冷戰爆發的重要導火線之一。為落實雅爾達密約安排，中華民國政府與蘇聯於1945年8月14日正式簽訂《中蘇友好同盟條約》，蘇聯承諾尊重中國對東北的主權、不干涉新疆內部事務，換取中國同意外蒙古若經公民投票確認獨立意願即予承認；同年蒙古舉行公投，以壓倒性比例通過獨立，中華民國政府隨即承認外蒙古獨立，直到1953年韓戰期間，中華民國政府因蘇聯違反條約承諾（援助中共等），經立法院決議正式宣告該條約失效、不再承認外蒙古獨立地位。同年7月，美英蘇三國於柏林近郊波茨坦召開會議，進一步確認戰後德國去納粹化、去軍事化、民主化原則，並劃定波蘭西界。",
    knowledge:["雅爾達會議中蘇聯對日參戰換取的東北特殊權益，事先未徵詢中華民國同意，是戰後中蘇交涉、乃至外蒙古獨立公投的直接源頭","《中蘇友好同盟條約》（1945）與其後外蒙古獨立公投，是雅爾達密約具體轉化為中蘇雙邊法律安排的關鍵節點，也是近代中國喪失外蒙古主權的正式法理依據","1953年中華民國政府片面宣告中蘇友好同盟條約失效、不再承認外蒙古獨立，是國際法上一國片面撤回承認的特殊案例，常與國際法承認理論的可撤回性問題相互呼應","波蘭自由選舉承諾未履行，是雅爾達體系最大的道德爭議，也是冷戰史觀中西方對蘇聯過度信任、事後才發現被騙敘事的關鍵起點","聯合國安理會五常任理事國否決權設計，即源自雅爾達會議的基本框架，其思想源頭可追溯至小羅斯福二戰期間提出的{{四警察}}構想（美英蘇中四大國共治），常與國際聯盟全體一致決設計做對比申論，聯合國從理念倡議到正式成立的完整制度建構過程，詳見[[west|un-founding|聯合國成立過程]]事件卡","波茨坦會議（1945年7月，處理歐洲德國問題）與波茨坦宣言（1945年7月，要求日本投降的最後通牒）是兩份不同文件，時間相近但處理對象不同，常考混淆題","《中蘇友好同盟條約》於1945年8月14日由外交部長王世杰在莫斯科簽署，附帶協定約定將中東鐵路與南滿鐵路幹線合併為中國長春鐵路、由中蘇共同經營30年（名稱沿革詳見詞條{{中東鐵路／南滿鐵路／中國長春鐵路}}），旅順為兩國共用海軍基地，大連闢為自由港；外蒙古於1945年10月20日舉行公民投票，我國於1946年1月5日承認其獨立","我國以蘇聯違約為由向聯合國提出「控蘇案」，聯合國大會於1952年2月1日通過第505號決議，認定蘇聯未履行條約義務（原案用語「違反」，經泰國提案修正為「未履行」）；1953年2月立法院決議廢止該條約","考點陷阱：1945年《中蘇友好同盟條約》（中華民國與蘇聯）與1950年《中蘇友好同盟互助條約》（中共與蘇聯）名稱相近、締約主體不同，後者詳見[[china|prc-founding-1949|中華人民共和國建政與「一邊倒」外交]]事件卡"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：雅爾達會議本質是三強依實際軍事佔領態勢劃分戰後勢力範圍的權力政治操作，波蘭自由選舉承諾之所以未履行，正因為協議本身缺乏強制執行機制。"},{label:"外交史方法論",text:"角度：適合比較雅爾達體系（強權劃分勢力範圍）與稍早布雷頓森林體系（制度化多邊合作）兩種戰後秩序建構邏輯的差異——政治安全領域傾向現實主義權力劃分，經濟領域則傾向自由制度主義的多邊合作。若套用[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]框架，雅爾達會議屬於支配與棄守的混合體，缺乏制度戰略所需要的自我克制與拘束，這正是波蘭自由選舉承諾未獲履行的結構性原因。"},{label:"建構主義",text:"角度：西方對蘇聯在雅爾達的承諾抱持信任、事後才驚覺遭到背棄，反映了戰時同盟建立的共同敵人認同一旦消失，雙方對彼此意圖的認知便迅速走向猜忌與敵對。"}]},
  {id:"un-founding",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1941–1945",title:"聯合國成立過程",spec:"light",
    narrative:"1941年8月，美國小羅斯福總統與英國邱吉爾首相會晤，發表《大西洋憲章》，揭示戰後世界應建立更廣泛、恆久的普遍安全體系等原則性主張，是戰後國際組織構想的最初雛形。1942年1月1日，美、英、蘇、中四國於華盛頓領銜簽署《聯合國家宣言》，其餘22國隨後簽署，共26個對抗軸心國的同盟國家，首次正式使用「聯合國」（United Nations）一詞，承諾共同對抗軸心國、絕不單獨媾和。1943年10月，美、英、蘇、中四國外長於莫斯科發表《四國宣言》，正式宣示戰後應盡速成立一個以主權平等為基礎、普遍性的國際組織以維護和平，四強共治的基本構想至此確立。1944年8月至10月，美、英、蘇、中四國於華盛頓近郊敦巴頓橡樹園舉行會談；由於蘇聯尚未對日宣戰、不願與中華民國同桌，會談分兩階段進行：8月21日至9月28日由美、英、蘇三國會商，9月29日至10月7日再由美、英、中三國會商，草擬聯合國組織架構的具體藍圖，包括大會、安全理事會、秘書處等主要機關的職權設計，但常任理事國否決權範圍等細節仍有爭議，留待[[west|yalta-potsdam|雅爾達會議]]進一步協商定案。1945年4月至6月，50國代表齊聚舊金山召開聯合國國際組織會議，正式討論並通過《聯合國憲章》，同年10月24日，憲章正式生效，聯合國宣告成立。",
    causal:"這條制度建構過程完整串起大西洋憲章（理念）→聯合國家宣言（陣營確立）→四國宣言（機構化共識）→敦巴頓橡樹園會議（藍圖草擬）→[[west|yalta-potsdam|雅爾達會議]]（否決權細節拍板）→舊金山會議（正式定案）的完整敘事鏈，也與GLOSSARY詞條{{四警察}}構想相互呼應，說明安理會否決權設計並非雅爾達會議憑空拍板，而是歷經四年多輪國際協商逐步成形的制度化過程。考點陷阱（112年三等考古題）：敦巴頓橡樹園會議的參與國是美、英、蘇、中，法國並未參與，「中華民國與美、英、法共同宣布《聯合國組織案》」為錯誤選項；四國也從未同時同桌開會。"},
  {id:"cold-war-origins",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1945–1949",title:"冷戰起源：鐵幕演說、杜魯門主義與圍堵政策",spec:"core",
    narrative:"二戰結束後，蘇聯在東歐扶植一系列親蘇共產政權，西方國家對蘇聯意圖日益警惕，多起具體危機接連爆發，逐步累積成冷戰對抗的實質基礎。1946年初，蘇聯軍隊在二戰期間進駐伊朗北部後，遲遲不依約定期限撤軍，甚至扶植當地亞塞拜然自治政權，直到美英強力施壓、伊朗向新成立的聯合國安理會提出申訴後，蘇聯才於同年5月完成撤軍，史稱伊朗危機，常被視為冷戰爆發後最早的具體危機案例之一。同年稍後，蘇聯要求修改《蒙特勒公約》、主張與土耳其共管博斯普魯斯與達達尼爾海峽，遭土耳其在美國支持下拒絕，形成土耳其危機。同一時期，希臘國內爆發內戰，共產游擊隊與英國支持的王室政府軍激烈交戰，希臘政府財政軍事俱疲，亟需外部援助。1946年3月，英國前首相邱吉爾（此時已下野）應邀在美國密蘇里州富爾頓的威斯敏斯特學院發表演說（杜魯門總統在場引介，但演說者是邱吉爾本人，非杜魯門），提出鐵幕一詞，形容自波羅的海斯德汀到亞德里亞海的里雅斯特已降下一道鐵幕，蘇聯正對東歐國家進行嚴密控制，是冷戰對抗意識形態化的重要象徵性起點。1947年，英國因自身財政困窘、國力衰退，宣布無力繼續援助深陷內戰的希臘與遭受蘇聯壓力的土耳其，美國總統杜魯門評估這將造成權力真空，於國會發表演說，宣示美國將援助任何遭受共產主義威脅的自由國家，史稱杜魯門主義，正式確立美國圍堵政策（由外交官喬治．肯楠提出理論基礎）作為冷戰時期美國對蘇戰略主軸。同年，美國進一步推出馬歇爾計畫，以鉅額經濟援助協助西歐國家戰後重建。蘇聯則以共產情報局（Cominform）整合東歐共產黨陣營作為回應——這與列寧1919年創立、史達林已於1943年為向盟國示好而主動解散的共產國際（Comintern）是性質相近但時期不同的兩個組織，不宜混淆。東西方陣營壁壘日益分明。1948–49年，蘇聯封鎖西柏林對外陸路交通，美英發動大規模空運突破封鎖，蘇聯最終讓步解除封鎖，同年西方國家成立北大西洋公約組織，冷戰兩極對抗格局正式確立。",
    knowledge:["伊朗危機（1946）常被視為冷戰最早的具體危機案例，甚至早於鐵幕演說，蘇聯遲不撤軍、扶植亞塞拜然自治政權，是戰後蘇聯在勢力範圍邊緣試探西方反應底線的早期案例","土耳其危機的核心爭議是蘇聯要求共管博斯普魯斯、達達尼爾海峽（修改蒙特勒公約），與19世紀近東問題的海峽爭議一脈相承，展現地緣政治焦點的歷史延續性","希臘內戰（共產游擊隊vs王室政府軍）與土耳其海峽爭議，合稱杜魯門主義演說中明確點名援助的兩個國家，共產國際（Comintern，1919–1943列寧創立、史達林主動解散）與共產情報局（Cominform，1947年蘇聯回應馬歇爾計畫而成立）是不同時期的兩個組織，常被混淆出題","鐵幕一詞是邱吉爾（非杜魯門）於1946年在美國發表演說時提出，常考的人物誤植陷阱題","杜魯門主義的直接背景是英國因財政困窘退出東地中海（希臘、土耳其）援助責任，美國藉此填補權力真空","{{圍堵政策}}由喬治．肯楠提出理論基礎，核心是圍堵而非推翻共產勢力，透過長期消耗迫使蘇聯體制自我瓦解","馬歇爾計畫是杜魯門主義的具體經濟實踐，顯示冷戰對抗不只是軍事議題，經濟援助同樣是重要的地緣政治工具","柏林封鎖與空運是冷戰第一次重大危機考驗，雙方都刻意避免直接軍事衝突"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：{{圍堵政策}}的核心邏輯是傳統權力平衡思維在冷戰情境下的延伸，直接對比戰間期對納粹德國姑息政策失敗的教訓。"},{label:"建構主義",text:"角度：鐵幕一詞本身就是一種話語建構，將原本模糊的地緣政治分歧，轉化為清晰的意識形態陣營對立敘事，深刻形塑了往後近半世紀的國際關係認知框架。"},{label:"依賴理論／IPE",text:"角度：馬歇爾計畫展現經濟援助作為地緣政治工具的操作邏輯，援助西歐不僅是人道考量，更是鞏固資本主義陣營經濟穩定、防止共產主義藉經濟蕭條坐大的策略性投資。"},{label:"外交史方法論",text:"角度：杜魯門主義與圍堵政策某種程度上是美國決策者記取一戰後姑息政策教訓、決心及早果斷因應威脅的心理與制度學習過程，可做跨時代的政策學習比較。"}]},
  {id:"japan-korea-annexation",region:"eastasia",period:"日本近代化起點",year:"1910",title:"日韓合併",spec:"core",
    narrative:"日俄戰爭確立日本在朝鮮半島的優勢地位後，日本逐步透過《乙巳條約》（1905，取得朝鮮外交權）、《丁未條約》（1907，取得朝鮮內政監督權）蠶食朝鮮主權，並解散朝鮮軍隊。1909年，朝鮮民族志士安重根於哈爾濱刺殺主導對朝政策的日本元老伊藤博文，反而給予日本國內強硬派併吞朝鮮的藉口。1910年8月，日本強迫朝鮮簽訂《日韓合併條約》，正式將朝鮮納入版圖，改設朝鮮總督府統治，朝鮮王朝滅亡，直到1945年二戰結束後才恢復獨立。",
    knowledge:["日韓合併是日俄戰爭後果的延續，是先取得外交監督權、再取得內政監督權、最終正式併吞的三階段蠶食模式的完成","朝鮮總督府採取高壓殖民統治，推行同化政策，禁止朝鮮語教育","與同時期日本對台灣的殖民統治、對中國東北的擴張形成日本帝國版圖擴張的完整拼圖"],
    theory:[{label:"現實主義",text:"最貼近：日韓合併是日本地緣政治擴張邏輯（第一島鏈、大陸政策）的具體實現，朝鮮半島作為連接日本與滿洲大陸的戰略跳板，其重要性在日俄戰爭後已無可替代。"},{label:"民族主義",text:"角度：安重根刺殺伊藤博文是朝鮮民族主義武裝抵抗的象徵性事件，但個人恐怖主義行動未能阻止、反而加速了併吞進程。"},{label:"比較政府與政治",text:"角度：可比較日本對朝鮮（總督府直接統治）與對台灣（同樣總督府體制）殖民模式的異同。"}]},
  {id:"taisho-shidehara",region:"eastasia",period:"日本近代化起點",year:"1920s",title:"大正民主與協調外交（幣原外交）",spec:"core",
    narrative:"明治天皇逝世後進入大正時期，日本國內政黨政治與自由主義思潮一度興盛，史稱大正民主。外交路線上，外相幣原喜重郎主張協調外交，強調與英美等列強協調合作、避免片面武力擴張，並對中國採取相對溫和的不干涉內政政策。日本並簽署《九國公約》（1922年華盛頓會議），承諾尊重中國主權完整。然而，1929年全球經濟大蕭條重創日本經濟，國內軍部勢力與右翼民族主義迅速崛起，強烈批判協調外交軟弱，主張以武力解決日本的資源與市場需求，協調外交路線逐漸失勢，最終在1931年九一八事變後被徹底拋棄，日本轉向軍部主導的對外侵略路線。",
    knowledge:["大正民主與協調外交是理解日本並非從明治維新起就注定走向軍國主義侵略的重要糾正——1920年代曾有過相對溫和、與國際協調的路線選項","幣原外交的失敗展現經濟危機如何催化激進民族主義、顛覆既有溫和路線的一般性模式，可與同時期德國威瑪共和的崩潰相互比較","軍部勢力崛起、文人政府對軍隊失去控制，是理解九一八事變未經東京中央政府正式授權、由關東軍擅自發動這一特殊模式的關鍵背景"],
    theory:[{label:"外交史方法論",text:"最貼近：協調外交路線的興衰，展現國內政治結構（文人政府vs軍部）如何直接決定對外政策的溫和或激進走向，是內政決定外交的經典案例。"},{label:"依賴理論／IPE",text:"角度：經濟大蕭條的全球連鎖效應同樣重創日本經濟，為軍部激進路線提供社會土壤，可與同期德國納粹崛起的邏輯相互呼應。"},{label:"建構主義",text:"角度：1920年代溫和的協調外交與1930年代激進的大陸擴張路線，展現同一個國家的對外行為認同可以在短短十年內因國內政治結構劇變而徹底翻轉。"}]},
  {id:"taiwan-strait-crises",region:"crossstrait",period:"①軍事對峙期 1949–1979",year:"1949–1960",title:"台海危機與台美共同防禦",spec:"core",
    narrative:"1949年10月，國共內戰仍在進行之際，共軍渡海進犯金門，國軍在古寧頭一役全殲登陸共軍，是兩岸分治後最早的軍事交鋒，也讓國軍得以暫時穩住金門防線。同年10月中華人民共和國成立（詳見[[china|prc-founding-1949|中華人民共和國建政與「一邊倒」外交]]事件卡），年底中華民國政府播遷來台，美國初期採取觀望態度，一度考慮放棄協防台灣。1950年6月[[modern|korean-war|韓戰]]爆發，美國評估台灣海峽若落入中共控制將威脅西太平洋防線，杜魯門總統隨即宣布台海中立化政策，派遣第七艦隊巡弋台灣海峽，防止中共渡海攻台、也防止國府反攻大陸，雙重圍堵。1954年9月3日，中共砲擊金門（九三砲戰），爆發第一次台海危機；同年12月2日，中美簽訂《中美共同防禦條約》，確立美國協防台灣的條約義務，但條約適用範圍僅明列台灣與澎湖，並另以換文約定我國對大陸使用武力須經雙方共同協議。1955年1月共軍攻佔一江山島，美國國會隨即通過「福爾摩沙決議案」，授權總統於必要時使用武力防衛台澎及相關陣地與領土；2月國軍在美軍協助下自大陳島撤退。危機期間周恩來在萬隆會議表態願與美國談判，中美大使級會談遂於同年8月開始。1958年8月23日，中共再度砲擊金門（八二三砲戰），爆發第二次台海危機，美國海軍協助國軍運補金門；10月中共宣布「單打雙不打」，危機逐漸降溫，同月蔣中正與美國國務卿杜勒斯發表聯合公報，宣示恢復大陸人民自由的主要途徑在於實行三民主義，而非憑藉武力。1960年6月，美國總統艾森豪訪問台灣，是首位在任內訪台的美國總統，進一步鞏固中美邦誼。",
    knowledge:["古寧頭戰役（1949）是兩岸分治後最早的軍事交鋒，早於1954年第一次台海危機，常考事件先後順序","台海中立化政策宣布於韓戰爆發後（1950），不是1949年政府遷台當下——常考時序陷阱","中美共同防禦條約簽訂於第一次台海危機之後（1954年底），早於第二次台海危機（1958）——這個先後順序常被出成陷阱題","艾森豪1960年訪台是美國總統首次在任內訪問台灣，深化了條約關係之外的象徵性邦誼","《中美共同防禦條約》（1954年12月2日簽署、1955年3月生效）第6條適用範圍僅明列台灣與澎湖，金門、馬祖未列入；另以葉公超—杜勒斯換文約定我國對大陸使用武力須經雙方共同協議，美方兼有協防與約束國府反攻的雙重目的；條約依第10條於一方通知後一年終止，美國於1979年1月1日通知，1980年1月1日正式失效，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡","「福爾摩沙決議案」（1955年1月）是美國國會的授權決議而非條約，授權總統必要時動武防衛台澎及相關地區，1974年廢止","1958年10月蔣中正—杜勒斯聯合公報宣示「實行三民主義，而非憑藉武力」，是我國政府首度公開淡化武力反攻的重要文件；中共同月宣布的「單打雙不打」使砲擊轉為象徵性，一直延續到1979年","兩次台海危機都是杜勒斯{{邊緣策略}}的實踐場域；第二次危機時毛澤東並未事先告知赫魯雪夫，蘇聯的消極態度加深了中蘇嫌隙，詳見[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美國協防台灣的決策核心是圍堵共產主義擴張的地緣戰略考量，是冷戰圍堵政策在亞洲的具體實踐，而非單純道義承諾。"},{label:"外交史方法論",text:"角度：美國對台政策從1949年後期觀望考慮放棄，到韓戰後180度轉向積極協防，展現外部結構性事件如何直接扭轉一國對特定盟友的戰略評估。"},{label:"國際公法",text:"角度：共同防禦條約適用範圍不含金馬、以福爾摩沙決議案的國內授權補足條約空白，以及條約依終止條款於1980年失效，都是條約適用範圍與終止的國際法案例。"}]},
  {id:"china-representation-un",region:"crossstrait",period:"①軍事對峙期 1949–1979",year:"1950–1971",title:"中國代表權問題與聯合國大會第2758號決議",spec:"core",
    narrative:"中華人民共和國成立後隨即要求取代中華民國在聯合國的席位，蘇聯並於1950年1月為此杯葛安理會。中國代表權之爭本質上是「由哪一個政府代表中國」的{{政府承認／國家承認}}問題，而非新國家入會問題。1950年代，美國主導以「緩議案」方式，每年在聯合國大會決議暫不討論代表權問題；隨著亞非新興國家大量加入聯合國，緩議案的支持票數逐年減少，美國遂改採「{{重要問題案}}」策略：1961年聯合國大會通過第1668號決議，認定任何改變中國代表權的提案均屬重要問題，須經出席並投票會員國三分之二多數始能通過，這道防線維持到1970年。1971年7月季辛吉秘密訪華後國際情勢丕變。同年秋天第26屆聯合國大會，美、日等國提出「變相重要問題案」（又稱逆重要問題案），主張排除中華民國代表權屬重要問題，並準備「雙重代表權案」讓兩岸同時保有會籍；但10月25日變相重要問題案以55票贊成、59票反對、15票棄權遭否決，我國代表團團長、外交部長周書楷隨即在下一案表決前宣布退出聯合國。大會隨後以76票贊成、35票反對、17票棄權通過由阿爾巴尼亞、阿爾及利亞等國提出的第2758號決議（又稱兩阿提案），恢復中華人民共和國的一切權利，承認其政府代表為中國在聯合國組織的唯一合法代表，並立即驅逐「蔣介石的代表」；雙重代表權案因而未付表決。",
    knowledge:["第2758號決議（1971）處理的是中國代表權，決議文本完全未提及台灣或台灣的主權歸屬；近年中共持續將此決議擴大解釋為台灣是中國一省的國際法依據，遭美、英、日、加、歐洲議會等多國政府與國會公開駁斥，是當代台灣國際法地位論戰的核心焦點","三種表決策略時序常考：緩議案（1950年代）→重要問題案（1961–1970，須三分之二多數）→變相重要問題案（1971，遭否決）；雙重代表權案在1971年並未付諸表決","我國是在第2758號決議表決前主動宣布退出聯合國，而非在決議通過後才被動離開，這個先後順序是常考細節","考點陷阱（108年三等考古題）：聯合國中國席位問題已於1971年解決，並非美中關係遲至1979年才正常化的關鍵障礙，真正的核心障礙是台灣問題，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡","代表權之爭的背景還包括韓戰中聯合國大會認定中共為侵略者（詳見[[modern|korean-war|韓戰與聯合國集體安全]]事件卡）、1964年中法建交（詳見[[china|sino-french-recognition-1964|中法建交與戴高樂獨立外交]]事件卡），以及亞非新興國家大量入會，說明國際承認的累積效應最終反映在聯合國票數上"],
    theory:[{label:"國際公法",text:"最貼近考古題方向：代表權問題屬政府承認而非國家承認，因此中共取得的是「中國」這個創始會員國的席位（含安理會常任理事國席位），而非以新會員國身分入會；第2758號決議的適用範圍僅及於代表權，無法推導出台灣主權歸屬，這是我國主張的法理核心。"},{label:"建構主義",text:"角度：中共持續透過論述將第2758號決議與「一個中國原則」掛鉤，美國等國則以「一個中國政策」加以區隔，顯示同一份國際文件的意義是在各方論述競爭中被建構出來的，詳見[[policy|one-china-policy-principle|一個中國政策 vs 一個中國原則]]卡。"},{label:"現實主義",text:"角度：1971年表決與季辛吉第二次訪華同時發生，美國聯中制蘇的戰略調整削弱了其在聯合國為我國拉票的力道，顯示大國戰略利益最終決定小國在國際組織中的處境。"},{label:"外交史方法論",text:"角度：我國長期堅持{{漢賊不兩立}}，對雙重代表權方案態度保留，是能動性與結構限制交互作用的典型案例——國際承認的潮流在結構上已難逆轉，但決策者的選擇仍影響了退出的方式與時點。"}]},
  {id:"martial-law-end-crossstrait-institutions",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1990–1992",title:"終止動員戡亂時期與兩岸法制建構",spec:"core",
    narrative:"《動員戡亂時期臨時條款》自1948年5月公布施行以來，長期凍結憲法本文對總統連任等規定的限制，是威權體制運作的憲政基礎。1990年3月，野百合學生運動要求廢除臨時條款、召開國是會議；同年6月，李登輝總統召開國是會議凝聚朝野共識。1991年4月，第一屆國民大會第二次臨時會三讀通過廢止臨時條款，並公布《中華民國憲法增修條文》第一次增修，5月1日由總統明令廢止臨時條款、同時宣告終止動員戡亂時期，我國自此在法制上不再視中共為叛亂團體，而將其定位為對等的「政治實體」。同一時期，兩岸交流機制陸續建立：1990年9月《金門協議》由我方中華民國紅十字會與大陸紅十字會簽署，是兩岸分治以來首份書面協議；1990年10月，行政院設立大陸委員會（陸委會），統籌處理大陸事務；1991年3月，政府與部分民間人士共同捐助成立財團法人海峽交流基金會（海基會），推選辜振甫為首任董事長，同年12月，中國大陸成立對口的海峽兩岸關係協會（海協會）。1992年7月，立法院三讀通過《臺灣地區與大陸地區人民關係條例》，是規範兩岸人民往來與交流事務最重要的基本法律，此後兩岸事務性協商即在此一法律架構與海基會、海協會的中介機制下展開。",
    knowledge:["終止動員戡亂時期（1991年5月1日）與《臺灣地區與大陸地區人民關係條例》公布施行（1992年7月）之間，是我國從法制上視中共為叛亂團體轉向視為對等政治實體的關鍵轉折，兩者常考先後順序","考點陷阱：1990年《金門協議》簽署代表是中華民國紅十字會，而非海基會或陸委會——海基會、海協會此時皆尚未成立，詳見[[crossstrait|cross-strait-negotiation-history|兩岸兩會協商史：從金門協議到王張會]]事件卡","陸委會（1990年10月成立）是我國統籌處理大陸事務的主管機關，而海基會是受政府委託、以民間名義處理事務性協商與人民服務的中介機構，兩者層級與性質不同，詳見[[institution|sef|財團法人海峽交流基金會（海基會）]]卡","《臺灣地區與大陸地區人民關係條例》是規範兩岸交流最基本的法律，其中「協議」的定義、簽署後的立法院審議或備查程序、大陸地區人民入出境許可等規定，是兩岸關係考科法制類題目最主要的命題來源","李登輝總統任內兩岸關係政策時序：終止動員戡亂（1991）→國統綱領（1991）→辜汪會談（1993）→兩國論（1999），常考單一任期內政策排序題（cs-mc-120）"],
    theory:[{label:"國際公法",text:"最貼近考古題方向：終止動員戡亂時期是我國片面調整對中共法律定性的重大宣示，從「叛亂團體」轉為「政治實體」，此一用語選擇刻意迴避對中華人民共和國的國家承認問題，屬於國際法上政府承認理論的特殊操作。"},{label:"比較政府與政治",text:"角度：廢止臨時條款、回歸憲法本文限制，是台灣從威權體制走向民主憲政的關鍵制度轉折點，往往與同一時期的第一次憲法增修（國會全面改選時程）並列討論。"},{label:"外交史方法論",text:"角度：以「民間對民間、白手套對白手套」的授權中介機構模式處理兩岸事務，是在雙方主權定位無法達成共識的結構限制下，由決策者創造出的能動性解方，直接影響此後二十餘年的兩岸協商框架。"}]},
  {id:"open-visit-1987",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1987",title:"開放兩岸探親",spec:"light",
    narrative:"1987年，蔣經國總統宣布解除長達38年的戒嚴令，同年11月，政府正式開放台灣民眾赴大陸探親，是兩岸隔絕近四十年來，首次由官方允許民間恢復往來，正式終結了兩岸軍事對峙期以來完全隔絕的狀態，開啟兩岸民間交流的序幕。",
    causal:"是①軍事對峙期→②交流開放期的分界事件，113年司法人員/調查人員特考（代號3401）第21題直接以此作為兩岸關係歷史分期節點命題。"},
  {id:"tiananmen-1989",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1989",title:"天安門事件",spec:"light",
    narrative:"1989年4月至6月，北京天安門廣場爆發大規模學生民主運動，訴求政治改革與新聞自由，中國政府於6月4日出動軍隊武力鎮壓清場，造成重大傷亡，史稱六四天安門事件。此事件震驚國際社會，七大工業國隨即發表聯合聲明譴責，歐美等國對中國實施武器禁運與外交制裁，其中歐盟對中國的武器禁運至今仍然有效，也重挫剛開放不久的兩岸交流氛圍——台灣社會對中共政權性質的疑慮加深，兩岸關係在民間探親剛起步之際蒙上陰影。",
    causal:"天安門事件是評估中共政權對內政治控制手段的重要指標案例，也常與既有[[theory|new-interventionism-r2p|新干預主義／國家保護責任]]理論卡討論的國家對內鎮壓與國際介入正當性議題相互呼應對照。 值得注意的是，六四事件恰好發生在[[china|deng-xiaoping-diplomacy|鄧小平時代外交：改革開放、獨立自主與中蘇關係正常化]]事件卡描述的鄧戈會談同一時期，國際媒體原為採訪中蘇關係正常化而聚集北京，意外成為六四事件對外報導的關鍵因素。"},
  {id:"third-taiwan-strait-crisis",region:"crossstrait",period:"②法理與國際框架建立期 1970s–2019",year:"1995–1996",title:"第三次台海危機（臺海飛彈危機）",spec:"light",
    narrative:"1995年1月，中共發表對台政策綱領「江八點」；同年4月，李登輝總統提出回應性的「李六條」。同年6月，李登輝以私人身分訪問美國母校康乃爾大學並發表演說，中共認為此舉突破美方長期堅持的非官方往來限制，強烈抗議之餘，自同年7月起在台灣北部外海進行一系列飛彈試射與軍事演習，形成第一波軍事威嚇；1996年3月，適逢我國首次總統直選前夕，中共再度於基隆、高雄外海進行飛彈試射與大規模軍演，試圖影響選情。美國柯林頓政府因應派遣獨立號與尼米茲號兩個航空母艦戰鬥群巡弋台灣海峽及周邊海域，是美國自1979年美中建交、與我國斷交以來首度出動如此規模的軍力展示。同年3月23日，李登輝、連戰以壓倒性得票率當選我國首任民選正副總統，危機隨後降溫。",
    causal:"這是延續1954年第一次、1958年第二次台海危機之後，兩岸軍事對峙的第三次高峰，也是美中三份聯合公報體制建立後美國首度以實際軍力介入台海緊張情勢，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡對美台關係分期的整體敘述。此次危機也促成美國國會日後持續強化對台安全承諾的立法動作（如2018年《臺灣旅行法》），並使「戰略模糊」政策在實務上首次面臨重大考驗，詳見詞條{{戰略模糊}}。"},
  {id:"pelosi-visit-2022",region:"crossstrait",period:"⑤緊張升溫期 2016–迄今",year:"2022",title:"裴洛西訪臺與中共環台軍演",spec:"light",
    narrative:"2022年8月2日晚間，美國眾議院議長裴洛西的專機降落台北松山機場，是自1997年時任眾議院議長金瑞契訪台以來，25年間訪台層級最高的美國國會領袖，她表示此行是為了兌現43年前《臺灣關係法》對台灣民主的承諾。裴洛西在台停留約19小時，於3日下午離台，期間會晤總統蔡英文、拜會立法院，並與多位人權運動人士會面。中共強烈反對此行，指控其為「竄訪」，於裴洛西專機降落當晚即宣布共軍將於8月4日至7日在台灣周邊劃設6處海空域，進行為期72小時、涵蓋實彈射擊的大規模軍事演習，多處演習區域已越過台灣海峽中線、甚至逼近台灣領海。演習期間，解放軍發射多枚東風系列彈道飛彈，其中數枚飛越台灣本島上空，另有多枚落入日本專屬經濟海域，引發日本政府嚴正抗議；共機並多次大規模逾越海峽中線。中共同時片面宣布中斷與美國在氣候變遷、非法移民遣返、軍事磋商等多項領域的對話交流管道，但教育交流等民間層級管道並未列入中斷範圍。",
    causal:"這次軍演的規模與越過海峽中線的常態化，被視為繼1995–96年第三次台海危機以來，中共對台軍事威懾力道最大幅度的升級，詳見[[crossstrait|third-taiwan-strait-crisis|第三次台海危機（臺海飛彈危機）]]事件卡；共機、共艦此後常態性逾越海峽中線巡弋，也成為理解此後2025–2026年美中台關係新發展的重要背景，詳見[[crossstrait|trump-xi-taiwan-2026|川普2.0時期美中台關係新發展]]事件卡。"},
  {id:"national-unification-council",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1990–2006",title:"國家統一委員會與國統綱領",spec:"light",
    narrative:"1990年，李登輝總統召開國是會議凝聚朝野共識後，成立國家統一委員會，並於1991年通過《國家統一綱領》，揭示兩岸關係應循近程交流互惠、中程互信合作、遠程協商統一三階段循序漸進，是台灣官方首次系統性提出處理兩岸關係的政策綱領。2006年2月，陳水扁總統宣布國家統一委員會終止運作、國家統一綱領終止適用，此舉在兩岸關係與台灣內部政治都引發高度爭議。",
    causal:"與同一時期成立的海基會、隨後展開的辜汪會談，共同構成李登輝執政初期兩岸關係機制化的整體佈局。"},
  {id:"koo-wang-talks",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1993",title:"辜汪會談",spec:"core",
    narrative:"1993年4月，海基會董事長辜振甫與海協會會長汪道涵在新加坡舉行會談，史稱辜汪會談，是兩岸自1949年分治以來，首次由雙方官方授權的民間中介機構代表進行正式協商對話。雙方簽署《兩岸公證書使用查證協議》《兩岸掛號函件查詢補償事宜協議》等多項事務性協議，確立了兩岸「以民間對民間、白手套對白手套」授權協商模式的基本框架，此次會談本身即建立在1992年兩岸兩會香港會談求同存異的默契基礎之上。",
    knowledge:["112年外交領事人員特考（代號2101）第20題確認辜汪會談屬於李登輝總統任內政策之一","辜汪會談建立的授權民間中介機構協商模式，此後成為兩岸處理事務性議題的長期基本框架，直到2008年後兩岸兩會恢復制度化協商，仍延續此一模式"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：辜汪會談以民間授權機構對話取代官方直接接觸，是雙方在缺乏正式外交關係、且各自堅持一個中國原則詮釋分歧的情況下，發展出的一套務實變通協商機制，可與既有[[theory|english-school|英國學派／國際社會理論]]理論卡的共同外交慣例概念相互呼應。"}]},
  {id:"qiandao-lake-incident",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1994",title:"千島湖事件",spec:"light",
    narrative:"1994年3月，一艘載有24名台灣旅客的遊船在浙江省千島湖遭歹徒縱火搶劫，全數旅客與船員罹難，史稱千島湖事件。中國大陸對案件處理態度與資訊揭露方式引發台灣社會強烈不滿，質疑案情真相遭到掩蓋，兩岸協商關係一度降溫、民間交流互信嚴重受挫。",
    causal:"是兩岸交流開放期少數重大挫折案例，展現兩岸民間交流雖已展開、但雙方在司法互助、資訊透明等制度性信任基礎仍相當薄弱。"},
  {id:"cross-strait-charter-flights",region:"crossstrait",period:"③政黨輪替與冷對抗期 2000–2008",year:"2003–2008",title:"兩岸包機開放",spec:"light",
    narrative:"2003年農曆春節，兩岸首度開放台商包機返鄉過節，但受限於當時政治氛圍，班機須經第三地（澳門）落地轉降、不得直接飛越對方領空，史稱澳門模式，是兩岸隔絕以來首次的定期航空往來嘗試。此後包機逐步擴大為節慶包機、假日包機，直到2008年馬英九執政後，兩岸簽署包機直航協議，首度實現貨運與客運包機直接飛越對方領空、不再需要經第三地轉降，並於同年底進一步擴大為常態化直航班機。",
    causal:"是兩岸交流從完全隔絕走向實質通航的重要漸進指標，澳門模式的權宜設計展現雙方在主權立場僵局下，仍能透過技術性安排逐步累積實質交流的務實操作模式，可與既有[[crossstrait|cross-strait-negotiation-history|兩岸兩會協商史]]事件卡2008年後江陳會談簽署的直航協議相互呼應。"},
  {id:"lien-hu-meeting-2005",region:"crossstrait",period:"③政黨輪替與冷對抗期 2000–2008",year:"2005",title:"連胡會",spec:"light",
    narrative:"2005年4月，時任國民黨主席連戰應中共中央總書記胡錦濤邀請，率團訪問中國大陸，並於北京與胡錦濤會面，是國共兩黨自1949年分裂對峙以來，雙方最高層級領導人首次會晤，也是連戰以在野黨主席身分（而非政府官員）進行的政黨層級交流，雙方會後發布新聞公報，就促進兩岸經貿交流、恢復兩岸協商等議題達成若干共識。",
    causal:"連胡會促成此後[[crossstrait|kmt-ccp-forum|國共論壇]]的定期化舉行，是國共兩黨層級交流機制化的重要起點，與政府層級的兩岸兩會協商機制並行不悖、各自發揮不同的溝通功能。"},
  {id:"kmt-ccp-forum",region:"crossstrait",period:"③政黨輪替與冷對抗期 2000–2008",year:"2005–迄今",title:"國共論壇",spec:"light",
    narrative:"2005年連胡會後，國民黨與中國共產黨共同倡議定期舉行「兩岸經貿文化論壇」（一般俗稱國共論壇），邀集兩岸政商學界人士就經貿、文化等議題交換意見並提出政策建議，是國共兩黨層級、而非政府對政府層級的長期性交流平台，補充了政府間兩岸兩會協商機制之外的另一條溝通管道。",
    causal:"與既有[[crossstrait|lien-hu-meeting-2005|連胡會]]事件卡及[[institution|cppcc-and-liaison-dept|中國人民政治協商會議與中共中央對外聯絡部]]體制架構卡相互呼應，共同構成國共政黨層級交流的制度化網絡。"},
  {id:"second-power-transition-2008",region:"crossstrait",period:"③政黨輪替與冷對抗期 2000–2008",year:"2008",title:"第二次政黨輪替",spec:"light",
    narrative:"2008年3月，中國國民黨籍候選人馬英九當選中華民國總統，是台灣自2000年首次政黨輪替（國民黨轉為在野）後，再度出現的政黨輪替，也象徵此後兩岸關係從陳水扁執政時期的冷對抗，轉向以九二共識為基礎、追求和緩交流的新階段。",
    causal:"馬英九就任後迅速恢復兩岸兩會制度化協商（詳見既有[[crossstrait|cross-strait-negotiation-history|兩岸兩會協商史]]事件卡2008年後江陳會談段落），是理解④和緩交流期整體政策轉向的關鍵起點事件。"},
  {id:"cross-strait-negotiation-history",region:"crossstrait",period:"②交流開放期 1987–1999",year:"1990–2014",title:"兩岸兩會協商史：從金門協議到王張會",spec:"core",
    narrative:"1990年9月，兩岸紅十字會組織代表在金門商談偷渡客遣返作業，簽署《金門協議》，是兩岸分治以來首次達成的書面協議，我方簽署代表為中華民國紅十字會，而非日後成立的海基會或陸委會，這是常見的機構誤植陷阱。1991年，海基會、海協會相繼成立，1992年雙方在香港會談前，海基會秘書長焦仁和與海協會常務副會長唐樹備先行展開預備性磋商（焦唐會談），為同年香港會談求同存異的默契、以及隔年（1993年）的[[crossstrait|koo-wang-talks|辜汪會談]]鋪路。1998年，辜振甫再度率團赴北京、上海與汪道涵會晤，史稱第二次辜汪會談，雙方同意汪道涵回訪台灣，但因1999年李登輝提出兩國論、兩岸關係急遽降溫，此行終未能成真，兩岸兩會協商自此中斷近十年。2008年馬英九執政後，兩岸兩會恢復制度化協商，海基會董事長江丙坤與海協會會長陳雲林展開多達八次的江陳會談（2008–2012），簽署包括兩岸包機、直航、以及2010年《海峽兩岸經濟合作架構協議》（ECFA）等重要協議。ECFA本身是架構性協議，明定雙方應於協議生效後半年內就建立爭端解決程序展開磋商；其後續協商項目原規劃包含貨品貿易協議、服務貿易協議、投資協議、爭端解決協議等，但貨品貿易協議因故未能完成簽署，服務貿易協議（服貿協議）雖已簽署，審查過程觸發太陽花學運，詳見[[policy|cssta-and-goods-trade|服貿與貨貿協議]]卡；金門協議（1990）簽署時間早於ECFA，並非ECFA下的協議項目之一。2014年，兩岸首度出現兩會體制之外、以官銜直接互稱的正式接觸——陸委會主委王郁琦與國台辦主任張志軍在南京會晤（王張會），象徵兩岸公權力機關首次跳脫民間授權機構模式、正式以官方身分互動；同年稍後，陸委會主委夏立言與張志軍再度會晤（夏張會），延續此一新模式。",
    knowledge:["《金門協議》（1990）簽署代表是中華民國紅十字會，而非海基會或陸委會——海基會、海協會此時皆尚未成立，112年外交領事人員特考（代號2101）第27題直接命中此細節","焦唐會談（1992）是辜汪會談前的預備性磋商，由海基會秘書長焦仁和與海協會常務副會長唐樹備進行，注意與正式辜汪會談（董事長／會長層級）的層級差異","第二次辜汪會談（1998）原訂汪道涵回訪台灣，卻因隔年李登輝兩國論引發兩岸關係急遽降溫而未能成行，兩岸兩會協商中斷近十年，直到2008年才恢復","王張會（2014）與夏張會是兩岸公權力機關首次以官銜直接互稱進行正式接觸，跳脫此前海基會／海協會民間授權機構的協商模式，是兩岸互動模式演變的重要分水嶺"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：這條兩岸協商史完整呈現「民間授權機構協商」（金門協議、辜汪會談、江陳會談）逐步過渡到「官方直接接觸」（王張會、夏張會、馬習會）的制度演變軌跡，可與既有[[crossstrait|koo-wang-talks|辜汪會談]]、[[crossstrait|ma-xi-summit|馬習會]]兩張卡片共同構成完整的兩岸協商機制演進敘事線。"},{label:"建構主義",text:"角度：兩岸互動模式從堅持民間白手套授權、到願意官銜互稱直接對話，展現雙方對彼此政治定位認知的漸進式調整，即使核心主權爭議始終未解，互動形式本身仍能隨情勢演變而創新。"}]},
  {id:"beijing-apec-2014",region:"crossstrait",period:"④和緩交流期 2008–2016",year:"2014",title:"北京APEC峰會兩岸非正式接觸",spec:"light",
    narrative:"2014年11月，北京主辦APEC領袖峰會，台灣依國際慣例由非現任正副元首的代表與會，前副總統連戰代表馬英九總統與會，並利用會議場合與中國國家主席習近平進行簡短會晤，是隔年馬習會前，兩岸領導人代表層級的重要非正式接觸。",
    causal:"為隔年（2015年）的[[crossstrait|ma-xi-summit|馬習會]]鋪墊了氣氛與默契基礎。"},
  {id:"ma-xi-summit",region:"crossstrait",period:"④和緩交流期 2008–2016",year:"2015",title:"馬習會",spec:"core",
    narrative:"2015年11月，馬英九總統與中國國家主席習近平在新加坡舉行會面，雙方互稱「先生」，是1949年兩岸分治以來，兩岸最高領導人首次直接會面。雙方就推動兩岸關係和平發展、維持台海和平穩定交換意見，但會後並未簽署任何協議、也未發表聯合聲明，性質上屬於象徵意義大於實質政策產出的歷史性會晤。",
    knowledge:["馬習會是兩岸領導人層級接觸的最高潮，此前[[crossstrait|beijing-apec-2014|北京APEC峰會]]的代表層級接觸可視為其鋪墊","會談雙方互稱先生、而非官銜（總統／主席），是刻意迴避對方官方頭銜承認爭議的外交巧思，呼應兩岸長期以來對彼此政治定位各說各話的現實","考點陷阱（112年外交領事人員特考cs-mc-118）：馬習會舉行年份是**2015年**，並非2012、2013或2014年——馬英九是在2016年卸任總統前夕（任期最後一年）與習近平會面，時間點常被誤植"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：雙方互稱先生的稱謂設計，與既有GLOSSARY詞條「一個中國政策vs一個中國原則」的精確用詞策略邏輯相通——透過模糊化正式頭銜稱謂，讓雙方都能各自對內宣稱維護己方立場，同時完成歷史性會晤的政治操作。"}]},
  {id:"san-francisco-treaty",region:"crossstrait",period:"①軍事對峙期 1949–1979",year:"1951–1952",title:"舊金山和約與中日和約",spec:"core",
    narrative:"二戰結束後，同盟國與日本的正式和平條約遲遲未能簽訂，主要因中國代表權問題懸而未決，加上冷戰對抗態勢逐漸成形。對日本而言，舊金山和約的簽訂也是美國對日政策從懲罰性佔領轉向扶植反共盟友這條路線（詳見[[eastasia|us-japan-cold-war-realignment|美國對日政策轉變與美日安保條約]]事件卡）的具體法律成果——條約內容相對寬鬆，未如原先盟軍規劃般嚴苛限制日本主權與軍備。1951年9月，美國主導在舊金山召開對日和會，49個同盟國與日本簽訂《舊金山和約》，日本正式結束佔領狀態、恢復主權，並宣布放棄對台灣、澎湖的一切權利、名義與要求，但和約並未明訂台澎主權歸屬何方，成為日後台灣國際地位爭議的重要法理根源。由於中國代表權爭議，中華民國與中華人民共和國均未受邀參加舊金山和會。隔年（1952年），日本轉而與中華民國單獨簽訂《中日和約》（台北和約），確認雙方戰爭狀態結束。",
    knowledge:["舊金山和約只講日本放棄台澎主張，未明訂歸屬對象，這個法律空白正是後續台灣地位未定論爭議的條約文本根源","中日和約（1952）是中華民國在未受邀參與舊金山和會的情況下，另闢管道確立與日本正式和平關係的替代方案","兩份條約常被放在一起比較考處理台灣問題的異同","舊金山和約簽署當天，美日同時另簽《美日安保條約》，確立美軍得繼續駐留日本、協防日本安全，是戰後美日同盟關係的法律基礎","《中日和約》（台北和約）於1972年中日建交當日，因日本外相大平正芳宣布「已失去存在意義而告終了」，我國隨即與日本斷交，詳見[[china|sino-japan-normalization-1972|中日建交與中日和平友好條約]]事件卡"],
    theory:[{label:"國際公法",text:"最貼近：舊金山和約放棄但不明訂歸屬的文字設計，是研究條約文本模糊性如何延伸出長期政治法律爭議的經典案例。"},{label:"現實主義",text:"角度：中國代表權爭議直接反映冷戰兩大陣營對峙下，國際條約簽署本身也成為承認與否的政治工具。"}]},
  {id:"us-japan-cold-war-realignment",region:"eastasia",period:"日本近代化起點",year:"1948–1960",title:"美國對日政策轉變與美日安保條約",spec:"light",
    narrative:"二戰結束後，美國對日本的佔領政策原本以懲罰性的非軍事化、民主化改造為核心目標，仿效對德國的嚴厲處置。然而隨著冷戰對抗態勢日益明朗、中國大陸情勢對國民政府日趨不利，美國國家安全會議於1948年通過NSC 13/2號文件，主張應調整佔領政策方向，優先重建日本經濟、將日本打造成亞洲反共陣營的穩定夥伴，而非持續推行懲罰性改造，史稱「逆轉路線」（reverse course）。1949年，NSC 13/3號文件進一步落實此一方向，加碼推動日本經濟復興措施。1950年，國務院政策規劃處主導起草NSC-68號文件，這是規模更宏大的冷戰全球戰略總綱領，主張美國應大幅擴軍、以壓倒性軍事實力全面圍堵蘇聯，而不僅仰賴馬歇爾計畫式的經濟援助，韓戰爆發後，這份文件才真正被杜魯門政府採納執行，美國對日、對亞太整體圍堵佈局自此明顯轉向軍事化。1951年9月，與《舊金山和約》同日，美日另簽署《美日安保條約》，確立美軍得繼續駐留日本、協防日本安全，是美日同盟關係的法律基礎，1960年條約修訂（引發日本國內大規模反安保運動）後持續運作至今。",
    causal:"這條「逆轉路線」與NSC-68的政策轉變，補上既有[[west|cold-war-origins|冷戰起源：鐵幕演說、杜魯門主義與圍堵政策]]事件卡歐洲視角之外，美國在亞洲佈局冷戰同盟體系的關鍵環節，也是[[crossstrait|san-francisco-treaty|舊金山和約與中日和約]]事件卡日本得以相對寬鬆條件恢復主權的政策背景。"},
  {id:"third-world-rise",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1946–1961",title:"第一次印支戰爭、日內瓦會議與萬隆會議、不結盟運動",spec:"core",
    narrative:"法國自19世紀末殖民越南、寮國、柬埔寨（法屬印度支那），二戰期間曾遭日本佔領。戰後法國試圖恢復殖民統治，胡志明領導的越盟隨即展開抵抗，爆發第一次印支戰爭（1946–1954）。1954年，越盟軍隊在奠邊府戰役重創法軍主力，法國喪失繼續作戰的意志。同年，美、英、法、蘇、中及印支三邦代表齊聚瑞士召開日內瓦會議，達成停戰協議，越南暫時以北緯17度線分為南北兩部分（北由胡志明領導、南由法國扶植政權統治），約定兩年後舉行全國統一選舉，但選舉最終未能舉行，南北分治格局延續，為日後越戰埋下伏筆。日內瓦會議也是中共建政後首次以五大國之一身分參與的重大國際會議，由周恩來率團；會議休會期間周恩來訪問印度、緬甸，與兩國總理發表聯合聲明，將1954年4月中印協定序言所揭櫫的和平共處五項原則推廣為處理一般國際關係的準則。1955年4月，印尼、印度、埃及、中共等29個亞非國家齊聚印尼萬隆召開亞非會議，通過納入和平共處五項原則的「萬隆十項原則」，反對殖民主義與新舊帝國主義；周恩來在會中提出「求同存異」，並公開表示願與美國談判緩和台灣地區緊張局勢，促成同年8月開始的中美大使級會談，是戰後亞非新興國家首次不透過歐美列強、自行召開的國際會議，象徵第三世界國家集體登上國際舞台。萬隆會議的精神進一步制度化為1961年成立的不結盟運動，由南斯拉夫狄托、印度尼赫魯、埃及納瑟等領袖倡議，主張會員國不加入美蘇任何一方軍事同盟集團，在冷戰兩極對抗中尋求獨立自主的第三條路線。",
    knowledge:["考點陷阱：和平共處五項原則最早見於1954年4月29日中印《關於中國西藏地方和印度之間的通商和交通協定》序言，同年6月周恩來與尼赫魯、緬甸總理吳努分別發表聯合聲明加以推廣；1955年萬隆會議通過的是「萬隆十項原則」，五項原則只是其中一部分，不要把五項原則的出處誤認為萬隆會議","五項原則內容：互相尊重主權和領土完整、互不侵犯、互不干涉內政、平等互惠、和平共處，本質上是對西發里亞主權規範的嚴格詮釋，至今仍是中共官方外交原則","1954年日內瓦會議包含韓國問題與印度支那問題兩部分：韓國問題毫無成果，印度支那問題達成停戰協議；美國並未簽署最後宣言，僅發表單方聲明，為日後介入越南留下空間","萬隆會議（1955）→不結盟運動（1961年貝爾格勒首屆高峰會）是第三世界集體發聲的制度化過程；萬隆會議期間周恩來表態願與美國談判，直接促成1955年8月開始的中美大使級會談，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡","本卡補上冷戰前期四大衝突與越戰之間的空白，顯示冷戰史並非只有美蘇兩強，是理解當代全球南方（Global South）概念歷史源頭的起點，後續發展詳見[[modern|vietnam-war|越戰與越戰越南化政策]]事件卡；五項原則的倡議國中印在1962年即爆發戰爭，詳見[[china|sino-indian-war-1962|中印邊界戰爭]]事件卡"],
    theory:[{label:"英國學派",text:"最貼近考古題方向：萬隆十項原則與五項原則強調主權平等與不干涉內政，顯示新興國家並非推翻既有國際社會的規範，而是援引西發里亞主權規範來對抗殖民主義，是國際社會擴張的典型案例。"},{label:"馬克思主義／依賴理論",text:"角度：亞非新興國家雖取得政治獨立，經濟上仍依附前殖民母國，萬隆會議強調的經濟合作是日後南北對話與新國際經濟秩序主張的源頭。"},{label:"現實主義",text:"角度：不結盟運動的本質是弱小國家在兩極體系下避免選邊、爭取迴旋空間的策略；中共積極參與萬隆會議，則是為了突破美國的外交圍堵、拉攏亞非國家。"},{label:"民族主義",text:"角度：反殖民民族主義是戰後亞非國家獨立與萬隆精神的核心動力，可與19世紀歐洲民族主義運動相互比較。"}]},
  {id:"berlin-wall-1961",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1958–1961",title:"第二次柏林危機與柏林圍牆興建",spec:"light",
    narrative:"1958年，蘇聯領導人赫魯雪夫發出最後通牒，要求美英法撤出西柏林、將其轉為非軍事化自由城市，否則蘇聯將與東德單獨簽署和約、終止四強對柏林的共同管理地位，引發第二次柏林危機。1961年6月，甘迺迪與赫魯雪夫在維也納舉行高峰會談判破裂，東德人民持續大量經由西柏林逃往西方的問題日益嚴峻。同年8月13日，東德一夜之間沿東西柏林分界線築起圍牆並佈設鐵絲網，阻絕人員自由往來，柏林圍牆自此矗立近28年，成為冷戰兩極對抗、鐵幕分裂歐洲最具體的實體象徵。",
    causal:"與既有[[modern|cold-war-crises|冷戰前期四大衝突]]事件卡（柏林封鎖1948–49、韓戰、蘇伊士運河危機、古巴飛彈危機）共同構成冷戰前期美蘇危機管理的完整系列案例；柏林圍牆最終於1989年倒塌，詳見[[modern|cold-war-end|冷戰結束與蘇聯解體]]事件卡，兩者首尾呼應完整了柏林在冷戰史上的象徵地位。"},
  {id:"yom-kippur-oil-crisis",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1973",title:"贖罪日戰爭與第一次石油危機",spec:"light",
    narrative:"1973年10月，埃及、敘利亞聯手於猶太教贖罪日當天突襲以色列，企圖收復1967年六日戰爭中失去的西奈半島與戈蘭高地，史稱贖罪日戰爭（阿拉伯世界稱十月戰爭）。以色列初期措手不及，隨後在美國緊急空運軍援下扭轉戰局並展開反攻，美蘇兩強介入斡旋，聯合國安理會通過決議促成停火，美國國務卿季辛吉展開穿梭外交，促成埃以雙方簽署脫離接觸協議。戰爭期間，阿拉伯石油輸出國組織成員國以西方國家支持以色列為由，聯合對美國及其盟邦實施石油禁運並大幅減產，油價在短短數月內暴漲近四倍，重創西方已開發國家經濟，引發第一次石油危機，全球經濟自此進入停滯性通膨的艱困年代。",
    causal:"是石油作為地緣政治武器最經典的歷史案例，可與既有[[org|opec|石油輸出國組織（OPEC）]]組織卡相互呼應；季辛吉的穿梭外交也為1978–79年埃及、以色列在美國卡特總統斡旋下簽署大衛營和平協議鋪路，是中東和平進程的重要中期節點。"},
  {id:"cold-war-crises",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1948–1962",title:"冷戰前期四大衝突",spec:"core",
    narrative:"冷戰初期美蘇雖未直接兵戎相見，但透過一系列代理危機與直接對峙持續測試彼此底線。1950年6月，北韓在蘇聯與中共支持下越過38度線入侵南韓，美國主導聯合國部隊介入，中共其後派遣志願軍參戰，戰事膠著至1953年停戰協定，朝鮮半島分裂狀態延續至今（詳見[[modern|korean-war|韓戰與聯合國集體安全]]事件卡）。1956年，埃及將蘇伊士運河收歸國有，英法夥同以色列出兵介入，美蘇罕見一致反對此軍事行動，英法被迫撤軍，象徵英法傳統殖民強權地位的終結、美蘇兩極格局的確立。1962年，蘇聯在古巴部署可攻擊美國本土的核子飛彈，美國甘迺迪政府實施海上封鎖，雙方一度瀕臨核戰邊緣，最終蘇聯撤除飛彈、美國則秘密承諾撤除土耳其飛彈並保證不入侵古巴，化解危機，是冷戰史上最接近核戰爆發的時刻。",
    knowledge:["這四場危機的正確時序常考排序題：柏林封鎖（1948–49）→韓戰（1950–53）→蘇伊士運河危機（1956）→古巴飛彈危機（1962）","蘇伊士運河危機中美蘇立場一致（皆反對英法出兵），是冷戰中罕見超越陣營對立的案例，也標誌英法傳統殖民強權從此讓位於美蘇兩極格局","古巴飛彈危機的化解方式（蘇聯撤飛彈、美國秘密撤土耳其飛彈）展現危機管理中私下換利益、公開保留顏面的外交操作模式"],
    theory:[{label:"現實主義",text:"最貼近：四場危機都圍繞著美蘇兩強在各自勢力範圍邊界的探測與反制，古巴飛彈危機尤其是核子嚇阻與危機管理理論的經典教材。"},{label:"外交史方法論",text:"角度：古巴飛彈危機的化解過程（公開與私下協議並存），是研究雙軌談判與保留顏面式外交操作手法的重要案例。"}]},
  {id:"korean-war",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1950–1953",title:"韓戰與聯合國集體安全",spec:"core",
    narrative:"二戰結束後，朝鮮半島以北緯38度線為界由美蘇分區受降，1948年南北分別成立大韓民國與朝鮮民主主義人民共和國。1950年6月25日，北韓在蘇聯同意與支持下越過38度線大舉南侵。聯合國安全理事會當時因蘇聯自1950年1月起以中國代表權問題為由杯葛缺席，得以迅速通過第82、83、84號決議，認定北韓破壞和平、建議會員國援助南韓，並授權成立由美國指揮的聯合國軍。杜魯門政府同時宣布台灣海峽中立化，派遣第七艦隊巡弋台海。同年9月麥克阿瑟指揮仁川登陸扭轉戰局，聯合國軍越過38度線北進；10月，中共以「抗美援朝」為名派遣中國人民志願軍參戰，戰線其後在38度線附近陷入膠著。蘇聯於8月重返安理會後，美國推動聯合國大會於1950年11月通過第377號「聯合一致共策和平」決議，使大會在安理會因否決權陷入僵局時得以建議集體措施；1951年2月，聯合國大會再通過第498號決議，認定中共在朝鮮從事侵略。1951年4月，主張將戰爭擴大到中國大陸的麥克阿瑟遭杜魯門解職。停戰談判自1951年7月起斷續進行，戰俘遣返是主要爭點，最終於1953年7月27日在板門店簽署停戰協定，由聯合國軍司令部、朝鮮人民軍與中國人民志願軍三方簽署，南韓總統李承晚拒絕簽字。同年10月，美韓簽訂《美韓共同防禦條約》。",
    knowledge:["韓戰是聯合國首次以{{集體安全}}名義出兵制止侵略的案例（110年四等考古題）；安理會決議之所以能通過，關鍵在於蘇聯當時正杯葛安理會而缺席，實務上常任理事國缺席或棄權不構成否決","考點陷阱：停戰協定由聯合國軍司令部、朝鮮人民軍、中國人民志願軍三方簽署，南韓並未簽署；由於只有停戰協定而無和平條約，南北韓在法律上至今仍未正式結束戰爭狀態","第377號「聯合一致共策和平」決議（Uniting for Peace，1950）讓聯合國大會在安理會因常任理事國否決而無法履行職責時，得以建議會員國採取集體措施，是聯合國大會職權擴張的重要先例","韓戰對兩岸的影響：美國從1949年《中國白皮書》的棄台傾向轉為派遣第七艦隊協防台海，並間接促成1954年《中美共同防禦條約》；戰後拒絕遣返的一萬四千餘名志願軍戰俘於1954年1月23日抵台，我國訂該日為「一二三自由日」，詳見[[crossstrait|taiwan-strait-crises|台海危機與台美共同防禦]]事件卡","韓戰使中共與美國直接交戰，確立此後約20年的敵對關係；聯合國大會1951年通過譴責中共侵略及對其實施戰略物資禁運的決議，使中共在聯合國代表權問題上更加不利，詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡","冷戰前期四大衝突排序：柏林封鎖（1948–49）→韓戰（1950–53）→蘇伊士運河危機（1956）→古巴飛彈危機（1962），詳見[[modern|cold-war-crises|冷戰前期四大衝突]]事件卡"],
    theory:[{label:"自由主義（集體安全）",text:"最貼近考古題方向：韓戰是集體安全理論在聯合國體制下的首次實踐，詳見[[theory|collective-security|集體安全理論]]卡；但聯合國軍實質上由美國主導指揮，也引發集體安全是否淪為大國利益工具的批判。"},{label:"現實主義",text:"角度：北韓南侵被美國視為蘇聯測試圍堵決心的代理戰爭，美國迅速介入是為了維護圍堵政策的可信度；中共參戰則出於不容美軍兵臨鴨綠江的安全考量。"},{label:"國際公法",text:"角度：安理會常任理事國缺席的法律效果、第377號決議的合憲性爭議，以及只有停戰協定而無和平條約所造成的持續戰爭狀態，都是國際法申論的經典素材。"},{label:"地緣政治學",text:"角度：朝鮮半島是陸權與海權勢力交會的緩衝地帶，從甲午戰爭、日俄戰爭到韓戰一再成為大國角力的戰場，可與[[china|sino-japanese|甲午戰爭]]事件卡串連論述。"}]},
  {id:"sino-soviet-split",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1956–1969",title:"中蘇交惡與珍寶島事件",spec:"core",
    narrative:"中共建政初期與蘇聯締結同盟、關係緊密，但1956年蘇共二十大赫魯雪夫發表秘密報告批判史達林個人崇拜，毛澤東對此深感不滿，加上雙方在意識形態路線（毛澤東批評蘇聯背離馬列主義正統、走修正主義路線）、地緣戰略利益（蘇聯對中國核武發展的猶豫支持、中印邊境衝突時蘇聯保持中立未支持中國）等多重分歧持續累積，中蘇關係自1950年代末起急遽惡化：1959年蘇聯片面中止1957年簽訂的國防新技術協定，拒絕提供原子彈樣品與技術資料；1960年7月蘇聯更片面召回全部在華專家、終止技術援助，中蘇分歧自此公開化，1963年起雙方展開公開論戰，中共發表「九評」批判蘇共。中共隨後自力研製核武，於1964年10月16日成功試爆第一枚原子彈，1967年再試爆氫彈。1969年3月，中蘇雙方軍隊在烏蘇里江珍寶島爆發武裝衝突，雙方均有死傷，是社會主義陣營內部首次公開兵戎相見，邊境緊張情勢一度瀕臨全面戰爭邊緣，蘇聯甚至評估對中國核設施實施先發制人打擊的可能性；同年8月雙方又在新疆鐵列克提爆發衝突，直到9月周恩來與蘇聯部長會議主席柯西金在北京機場會談，緊張情勢才稍獲緩和。這場衝突促使中國重新評估外交戰略，體認到蘇聯已取代美國成為其國家安全的首要威脅，為日後聯美制蘇、接受尼克森訪華鋪路。",
    knowledge:["中蘇交惡時序常考：1956年蘇共二十大批判史達林→1958年長波電台與聯合艦隊爭議、第二次台海危機蘇聯事前未獲告知→1959年蘇聯中止國防新技術協定、在中印邊境衝突中表態中立→1960年7月撤回在華專家（分裂公開化）→1963年公開論戰→1969年珍寶島事件","中共第一枚原子彈（1964年10月16日）是在蘇聯撤回技術援助後自力完成，與赫魯雪夫下台幾乎同時；1963年美英蘇簽訂《部分禁止核試驗條約》時，中共即批評這是美蘇壟斷核武的安排。108年三等考古題將中共核試列為美國重新評估對中共政策的因素之一","珍寶島事件（1969年3月）是社會主義陣營內部首次公開兵戎相見；1968年蘇聯以「布里茲涅夫主義」（社會主義國家主權有限論）為由入侵捷克斯洛伐克，強化了中共對蘇聯可能干涉中國的危機感","1962年中印邊界戰爭中蘇聯保持中立，被中共視為背叛，詳見[[china|sino-indian-war-1962|中印邊界戰爭]]事件卡","中蘇交惡是理解美中關係正常化的關鍵：沒有中蘇對立，就難以理解毛澤東為何願意在1972年接待尼克森，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡；也可與[[china|soviet-beijing|蘇聯對北京政府的統戰工作]]及[[china|prc-founding-1949|中華人民共和國建政與「一邊倒」外交]]事件卡對照，看出中蘇關係從1920年代的扶助、1950年的同盟到1960年代公開決裂的完整弧線"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：中蘇同盟瓦解說明同盟關係最終取決於國家利益；當蘇聯被中共視為比美國更直接的威脅時，中共轉而聯美制蘇，符合Walt的威脅平衡論，詳見[[theory|balance-of-threat|威脅平衡理論]]卡。"},{label:"社會主義／共產主義",text:"角度：中蘇論戰表面上是正統馬列主義與「修正主義」之爭，涉及和平共處、和平過渡等路線問題，可用來分析共產主義陣營內部的意識形態分歧如何包裝國家利益衝突。"},{label:"建構主義",text:"角度：中共把蘇聯從「老大哥」重新定位為「社會帝國主義」，敵友認知的重構先於戰略轉向，說明身分與認知在外交政策轉變中的作用。"},{label:"外交史方法論",text:"角度：毛澤東與赫魯雪夫的個人猜忌（能動性），與兩國在核武、邊界、陣營領導權上的結構性矛盾交織，是能動性與結構分析的典型案例。"}]},
  {id:"us-china-normalization",region:"crossstrait",period:"②法理與國際框架建立期 1970s–2019",year:"1970s–2019",title:"美中關係正常化與台美關係轉折",spec:"core",
    narrative:"1960年代中蘇關係持續惡化（詳見[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡），加上美國深陷越戰泥沼，美國開始重新評估與中共關係的可能性。美中雖無邦交，雙方自1955年8月1日起即在日內瓦舉行大使級會談，1958年後移往華沙，到1970年共舉行136次，是兩國在無外交關係下的主要溝通管道。尼克森早在1967年就在《外交事務》季刊撰文，主張不能讓中國永遠被排除在國際社會之外；1969年珍寶島事件後，中共也體認到蘇聯才是首要威脅。1971年4月，中共邀請參加世界桌球錦標賽的美國桌球隊訪問中國大陸，史稱「乒乓外交」；同年7月，國家安全顧問季辛吉取道巴基斯坦秘密訪問北京，7月15日尼克森宣布將訪問中國大陸，震驚國際。同年10月，聯合國大會通過第2758號決議，中華民國喪失聯合國中國代表權席位（表決過程詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡）。1972年2月，美國總統尼克森正式訪問中國大陸，成為首位在任內訪問中國大陸的美國總統，與毛澤東會晤、並與周恩來多次會談，雙方於2月28日在上海發表《上海公報》，美國表示認知台灣海峽兩岸中國人均認為只有一個中國、台灣是中國一部分的立場，並確認隨區域緊張情勢緩和將逐步減少駐台美軍與軍事設施，但公報並未提及終止《中美共同防禦條約》，是美中關係正常化的第一步。1978年底，美國宣布將於隔年與中華民國斷交、與中華人民共和國建交，1979年1月發表《建交公報》，美國正式承認中華人民共和國政府為中國唯一合法政府，同時認知台灣屬於中國的立場，並與中華民國斷絕正式外交關係。為因應斷交後如何維繫與台灣的實質關係，美國國會迅速通過《臺灣關係法》（1979），以國內法形式規範美台間非官方但持續的關係。1982年，因美國對台軍售問題持續存在爭議，雙方簽署《八一七公報》，美國表示將逐步減少對台軍售，但同一時期美國政府也私下向中華民國提出六項保證，強調不會設定對台軍售的終止期限、不會事先徵詢北京意見。1995年，李登輝總統以私人身分訪問美國母校康乃爾大學發表演說，中國強烈抗議並於1995–96年在台灣海峽周邊試射飛彈進行軍事演習，史稱第三次台海危機，美國派遣兩個航空母艦戰鬥群巡弋台灣海峽周邊海域因應，是台美關係在斷交後首度面臨的重大軍事緊張考驗。進入21世紀，美台關係在維持非官方形式的架構下持續深化：美國持續依台灣關係法定期對台軍售，並隨中國軍力提升逐步調整軍售項目與頻率；2018年，美國國會通過《臺灣旅行法》，鼓勵美台各層級官員互訪；2019年適逢中華民國政府遷台70週年，美台關係在實質交流層面已遠較斷交初期深化，但正式外交關係迄今未能恢復，「一個中國政策」的基本框架至今仍是美台關係運作的根本前提。",
    knowledge:["聯合國大會第2758號決議（1971）僅處理中國代表權、未提及台灣地位，其表決過程與當代解釋爭議詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡","三份聯合公報（上海公報1972、建交公報1979、八一七公報1982）加上台灣關係法（1979）與六項保證（1982），合稱美國一中政策的五大支柱文件，詳見[[policy|taiwan-relations-act-six-assurances|臺灣關係法與六項保證]]卡——考古題常考哪個文件不屬於一中政策依據","三份公報用詞都是認知（acknowledge）兩岸中國人的立場，而非美國自己承認（recognize）台灣屬於中國，這個用詞差異是常考的精確法律語言題","六項保證與八一七公報同年（1982）但立場相對，前者是美方對台的口頭政治承諾，後者是美中之間的正式聯合公報，兩者法律位階不同","1995–96年第三次台海危機是李登輝訪美引發，美國派遣航母戰鬥群因應，是台美斷交後首次重大軍事緊張考驗，可作為1949–2019年70年台美關係分期論述的重要中期節點","2018年《臺灣旅行法》鼓勵美台各層級官員互訪，是近年美台關係實質深化的具體指標，但美台關係的基本框架（非官方、一個中國政策）迄今未變","美中關係正常化的前奏常考排序：1955年起中美大使級會談（日內瓦→華沙，共136次）→1967年尼克森《外交事務》撰文（109年四等考古題）→1969年珍寶島事件→1971年4月乒乓外交→1971年7月季辛吉秘密訪華→1972年2月尼克森訪華與《上海公報》","考點陷阱（108年三等考古題）：1964年中共試爆原子彈、中蘇交惡都是美國重新評估對中共政策的因素；「聯合國中國席位爭議是雙方關係遲至1979年才確立的關鍵」為錯誤敘述，席位問題1971年即已解決，真正障礙是台灣問題","考點陷阱（113年三等考古題）：尼克森、雷根、川普等美國總統都曾在任內訪問中國大陸，完成美中建交的卡特反而任內未曾訪問","考點陷阱（cs-mc-052）：《上海公報》的重點內容包括美中關係正常化符合雙方利益、美國認知一個中國原則台灣是中國一部分、承諾階段性減少駐台美軍及軍事設施，但**並未**提及終止《中美共同防禦條約》——該條約直到1979年美中建交後才依約定程序終止，詳見[[crossstrait|taiwan-strait-crises|台海危機與台美共同防禦]]事件卡","1995–96年第三次台海危機的完整經過，詳見[[crossstrait|third-taiwan-strait-crisis|第三次台海危機（臺海飛彈危機）]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美中關係正常化的根本動機是聯中制蘇的地緣戰略考量，而非意識形態趨同；1995–96年台海危機美國派遣航母因應，展現即使在非正式邦交關係下，美國仍願意展示嚇阻決心，可與既有{{延伸嚇阻}}概念相互呼應。"},{label:"外交史方法論",text:"角度：台灣關係法作為美國國內法而非國際條約，展現美國在斷交後透過法律工具創新維繫實質關係的操作模式；適合做1949–2019年70年台美關係的分期論述——建交前（1949–1979）、建交轉折期（1979–1982三份公報與台灣關係法確立框架）、深化期（1990年代起實質交流升溫但正式框架不變）三階段。"},{label:"國際公法",text:"角度：三公報認知而非承認的用詞設計，保留了美國在台灣地位問題上的策略性模糊空間，可與GLOSSARY詞條{{戰略模糊}}相互呼應。"}]},
  {id:"vietnam-war",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1955–1975",title:"越戰與越戰越南化政策",spec:"core",
    narrative:"二戰後越南分裂為南北兩部分，北越在蘇聯與中共支持下推動共產統一，美國基於圍堵政策的骨牌理論（擔心一國赤化將引發鄰近國家連鎖倒向共產陣營），自1950年代起逐步介入南越內戰，1965年後大規模派遣地面部隊直接參戰。然而戰爭陷入長期消耗，美軍傷亡持續攀升，國內反戰運動高漲。1969年就任的尼克森總統推動越戰越南化政策，逐步將地面作戰責任移交南越政府軍隊、同步撤出美軍地面部隊，象徵美國明確表達不再積極以地面部隊涉入亞洲地區戰事的立場轉變。美軍於1973年完全撤出，1975年北越攻陷西貢，南越政府瓦解，越南實現共產統一。",
    knowledge:["越戰越南化是尼克森政府提出的政策，用以逐步將作戰責任轉交南越政府，減少美軍直接介入——常考的政策提出者配對題","越戰失敗深刻影響美國此後數十年的外交決策心理（越戰症候群），成為理解後續美國對海外軍事介入更加謹慎的重要背景","越戰是骨牌理論在實踐中失敗的重要案例，直接影響美國此後對圍堵政策操作方式的反思"],
    theory:[{label:"現實主義",text:"最貼近：越戰是圍堵政策骨牌理論的具體實踐，但實踐結果顯示地緣政治理論的機械式套用可能忽略在地民族主義等其他變數。"},{label:"外交史方法論",text:"角度：越戰症候群展現重大外交挫敗如何深刻形塑此後數十年的政策決策心理，可與一戰後歐洲的姑息政策心理做跨案例比較。"}]},
  {id:"european-integration",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1950–2024",title:"歐洲整合史",spec:"core",
    narrative:"二戰後歐洲滿目瘡痍，法國外長舒曼於1950年提出舒曼計畫，主張將法德兩國的煤礦與鋼鐵生產置於共同管理機構之下，透過經濟利益的深度綁定，讓法德再度兵戎相見在實務上變得不可行。此構想由莫內、舒曼、義大利總理卡斯佩里等人共同推動，被稱為歐洲整合之父。1952年，法、德、義、荷、比、盧六國成立歐洲煤鋼共同體，是歐洲整合最早成功的機構性嘗試，採取由下而上的功能主義路徑，從低階技術性經濟合作領域逐步外溢至更高階的政治合作領域。此後歐洲整合持續深化：1957年羅馬條約成立歐洲經濟共同體；1993年馬斯垂克條約生效，正式成立歐洲聯盟，確立三大支柱架構；2009年里斯本條約生效，設立歐盟高峰會主席與外交安全政策高級代表等職位，強化歐盟整體對外代表性。目前歐盟主要機構包括：歐洲理事會（由各成員國元首或政府首長組成，負責制定整體政治方向）、歐盟理事會（部長理事會，代表各國政府協商立法）、歐洲議會（唯一由公民直選產生的機構，與理事會共同行使立法權）、歐盟執行委員會（負責提案立法、執行政策，是歐盟的行政機關）、歐洲法院（負責解釋歐盟法律、確保各國一致適用）。2024年6月舉行的歐洲議會選舉，中右翼歐洲人民黨黨團繼續保持最大黨地位（186席），但德國另類選擇黨、法國國民聯盟、義大利梅洛尼政黨等歐洲各國極右翼與歐洲懷疑論政黨席次大幅增加，中間派復興歐洲黨團與綠黨則明顯受挫，選後歐盟高峰會提名馮德萊恩續任執委會主席。法國總統馬克宏因其政黨在歐洲議會選舉中大敗於國民聯盟，宣布解散國民議會、提前舉行國內國會選舉，展現歐洲議會選舉雖屬次級選舉，卻能直接牽動成員國國內政治版圖的連動效應。目前歐盟擁有27個成員國、4億人口，官方語言多達24種。",
    knowledge:["歐洲整合三位公認的整合之父：莫內、舒曼、卡斯佩里——常考人物配對題","歐洲整合採取由下而上的功能主義路徑，而非由上而下先政治後經濟——常見的錯誤陷阱選項方向","歐洲煤鋼共同體（1952）是最早成功的整合機構，也是後續歐洲經濟共同體、歐盟的制度起點","馬斯垂克條約（1993）三大支柱架構、里斯本條約（2009）強化歐盟對外代表性的職位設計，是歐盟機構演變的關鍵節點","歐盟五大主要機構（歐洲理事會、歐盟理事會、歐洲議會、執行委員會、歐洲法院）的功能區分是常考的機構配對題，注意歐洲理事會（元首高峰會）與歐盟理事會（部長理事會）名稱相近但層級與功能不同","2024年歐洲議會選舉極右翼與歐洲懷疑論政黨席次大增，反映歐盟境內對移民、烏克蘭援助、環保政策等議題的路線分歧加深，也直接導致法國總統馬克宏解散國會、提前改選，展現歐洲議會選舉牽動成員國國內政治的連動效應"],
    theory:[{label:"自由主義／國際制度",text:"最貼近考古題方向：歐洲整合是功能主義與新功能主義理論最重要的實踐案例，驗證國際制度能夠深化國家間合作、甚至逐步侵蝕傳統主權疆界。"},{label:"建構主義",text:"角度：歐洲整合過程也伴隨著歐洲認同的逐步建構，是觀察超國家認同如何在制度合作基礎上逐漸形成的案例；2024年極右翼崛起則展現這種超國家認同建構過程仍面臨會員國內部民族主義、歐洲懷疑論的持續反撲與挑戰。"},{label:"現實主義",text:"角度：部分學者仍以現實主義角度解讀歐洲整合，認為其本質仍是法德兩大強權透過制度化合作管理彼此權力關係、避免重蹈兩次大戰覆轍的權力政治安排。"},{label:"自由政府間主義",text:"角度：可套用[[theory|liberal-intergovernmentalism|自由政府間主義]]理論卡提出另一種對立解釋——歐洲整合的深度與方向，其實是主要會員國政府基於自身國內經濟利益團體偏好，透過理性計算與政府間協商談判所達成的結果，而非功能主義所強調的社會自發性外溢過程，是分析同一段歐洲整合歷程時可以並陳比較的兩種理論視角。"}]},
  {id:"iranian-revolution-1979",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1978–1979",title:"伊朗革命",spec:"light",
    narrative:"伊朗國王巴列維長期是美國在波斯灣地區最重要的戰略盟友，其推動的世俗化、西化改革（白色革命）雖帶動經濟現代化，卻也激起什葉派宗教階層與傳統社會的強烈不滿，加上其政權高壓統治、貧富差距擴大，反對聲浪自1978年起迅速升高。1979年1月，巴列維被迫出走流亡海外；同年2月，長期流亡海外的什葉派宗教領袖何梅尼返回德黑蘭，領導建立政教合一的伊斯蘭共和國，是20世紀最重要的宗教革命之一，也徹底終結美國在波斯灣最重要的戰略夥伴關係。同年11月，激進學生佔領美國駐德黑蘭大使館，挾持人質引爆伊朗人質危機（詳見[[modern|iran-war-2026|美伊戰爭]]事件卡）。",
    causal:"伊朗革命是理解此後美伊關係決裂、以及區域權力真空的關鍵起點——什葉派伊斯蘭共和國的建立，直接刺激鄰國遜尼派政權（尤其伊拉克海珊）的不安全感，是隔年爆發[[modern|iran-iraq-war|兩伊戰爭]]的重要背景因素。"},
  {id:"soviet-afghan-war",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1979–1989",title:"蘇聯入侵阿富汗",spec:"light",
    narrative:"1979年底，蘇聯出兵阿富汗，扶植並支持親蘇政權鎮壓伊斯蘭聖戰士反抗軍，企圖穩固其在中亞地緣戰略的南翼屏障。然而蘇軍很快陷入曠日持久的游擊戰泥沼，難以徹底肅清分散於崎嶇山區的反抗勢力。美國中央情報局透過巴基斯坦秘密軍援聖戰士組織（包括提供刺針飛彈等先進武器），沙烏地阿拉伯等波斯灣國家也提供龐大資金，召募包括賓拉登在內的阿拉伯各國聖戰士前往阿富汗參戰，形成一場美蘇冷戰代理人戰爭。1989年，蘇聯在付出慘重傷亡與龐大軍費後被迫全面撤軍，此役因此被稱為蘇聯的越戰，也是促成蘇聯經濟崩潰、加速冷戰終結的重要因素之一（詳見[[modern|cold-war-end|冷戰結束與蘇聯解體]]事件卡）。蘇軍撤離後，阿富汗隨即陷入軍閥割據混戰，塔利班趁勢崛起奪取政權，賓拉登也在此役中累積人脈與經驗、逐步建立蓋達組織的雛形。",
    causal:"這場戰爭是理解[[modern|911-war-on-terror|九一一襲擊事件與全球反恐戰爭]]事件卡賓拉登與蓋達組織起源、以及[[modern|afghanistan-withdrawal|美國阿富汗撤軍]]事件卡塔利班政權淵源的關鍵前置背景，沒有這場戰爭的鋪陳，就無法完整理解美國為何最終要在阿富汗打上近20年的反恐戰爭。"},
  {id:"iran-iraq-war",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1980–1988",title:"兩伊戰爭",spec:"light",
    narrative:"伊朗革命後政局動盪之際，伊拉克總統海珊評估有機可乘，於1980年出兵入侵伊朗，企圖奪取邊境爭議油田並遏止什葉派革命思想向遜尼派世界擴散，雙方隨即陷入長達8年的慘烈消耗戰，期間雙方皆曾動用化學武器、伊朗更以人海戰術（大量徵召青少年士兵）進行自殺式衝鋒。美國基於圍堵伊朗革命輸出的地緣戰略考量，選擇暗中提供海珊政權軍事情報與物資支援，儘管海珊政權當時已因對本國庫德族使用化學武器等行為備受國際批評。戰爭最終於1988年在雙方均無力再戰的情況下簽署停火協議，未有任何一方獲得決定性勝利，但兩國均付出數十萬人傷亡的慘重代價。",
    causal:"美國此時暗中支持海珊對抗伊朗，與後續1990年海珊入侵科威特、美國轉而主導多國聯軍反擊的[[modern|gulf-war-1991|波斯灣戰爭]]形成強烈的歷史諷刺對照，展現地緣政治盟友關係如何隨情勢變化而快速翻轉。"},
  {id:"cold-war-end",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1985–1991",title:"冷戰結束與蘇聯解體",spec:"core",
    narrative:"1985年戈巴契夫就任蘇聯領導人後，推動開放政策與重建政策，嘗試對蘇聯僵化的政治經濟體制進行改革，卻意外加速了體制本身的鬆動與東歐衛星國的離心力。蘇聯因長期軍備競賽與入侵阿富汗戰爭（1979–89）的龐大軍費支出，經濟已瀕臨崩潰邊緣，難以再支撐對東歐集團的控制力道。1989年，東歐各國共產政權相繼垮台，同年11月柏林圍牆倒塌，成為冷戰結束最具象徵性的畫面。1990年，東西德在國際各方協商下完成統一。1991年，波羅的海三國率先宣布脫離蘇聯獨立，成為蘇聯解體的第一槍，同年12月，俄羅斯、烏克蘭、白俄羅斯三國領導人簽署《別洛韋日協定》，宣告蘇聯不復存在、成立獨立國協取而代之；蘇聯正式解體，長達近半世紀的冷戰兩極對抗格局宣告終結。俄羅斯隨後承繼蘇聯在聯合國安全理事會的常任理事國席位，未經過如中國代表權問題般的正式表決程序。",
    knowledge:["戈巴契夫是積極推動改革（開放與重建政策），而非拒絕改革——常考的因果方向陷阱題","蘇聯因軍備競賽與阿富汗戰爭幾近經濟崩潰，是促成戈巴契夫改革與蘇聯解體的重要結構性背景","波羅的海三國宣布獨立（1991）被視為冷戰結束、蘇聯解體的重要先聲，早於蘇聯正式解體","東西德統一（1990）也是加速冷戰結束進程的重要指標性事件","俄羅斯自動承繼蘇聯在安理會的常任理事國席位，屬國際法上的國家繼承而非另立新席位，與1971年中國代表權變更須經聯合國大會正式表決（詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡）形成鮮明對比，是常考的比較案例"],
    theory:[{label:"現實主義",text:"最貼近：蘇聯經濟實力的相對衰退是解釋其最終無法維持超級強權地位、被迫從東歐撤出控制力的物質性因素。"},{label:"建構主義",text:"角度：戈巴契夫改革所釋放的思想自由化氛圍，動搖了東歐各國對共產意識形態正當性的認同基礎，觀念層次與物質層次的變化交織，共同促成冷戰終結。"},{label:"外交史方法論",text:"角度：適合做漸進式改革意外引發體制崩潰的分析——戈巴契夫原意是挽救蘇聯體制，最終卻加速了體制的瓦解。"}]},
  {id:"gulf-war-1991",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1990–1991",title:"波斯灣戰爭",spec:"light",
    narrative:"1990年8月，伊拉克總統海珊以科威特過度採油損害伊拉克利益、且科威特原屬伊拉克歷史領土為由，出兵入侵並併吞科威特。聯合國安理會迅速通過多項決議譴責入侵、要求伊拉克無條件撤軍，並授權會員國採取一切必要手段恢復科威特主權。美國主導組成一支涵蓋34國、逾50萬兵力的多國聯軍，1991年1月發動代號沙漠風暴的空襲行動，2月展開地面攻勢，僅用100小時即擊潰伊拉克軍隊、收復科威特，海珊被迫接受停火條件。",
    causal:"是冷戰結束後集體安全機制少數成功運作的案例——聯合國安理會授權、多國聯軍集體行動、迅速恢復現狀，可與既有{{集體安全}}理論詞條、國際聯盟時期集體安全機制失靈的歷史案例（衣索比亞、滿洲國）形成強烈對比，展現後冷戰初期美蘇不再對立、安理會得以順暢運作的短暫國際合作氛圍。"},
  {id:"bosnia-kosovo",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1992–1999",title:"波士尼亞內戰與科索沃戰爭",spec:"light",
    narrative:"南斯拉夫聯邦於1991年起逐步解體，各加盟共和國陸續宣布獨立，其中波士尼亞赫塞哥維納境內塞爾維亞裔、克羅埃西亞裔、穆斯林裔三大族群爆發長期內戰（1992–95），期間發生史雷布尼查大屠殺等種族清洗慘案，震驚國際社會，最終在美國斡旋下簽署岱頓和平協議結束戰爭。1998–99年，塞爾維亞境內科索沃地區阿爾巴尼亞裔尋求獨立，塞爾維亞總統米洛塞維奇展開武力鎮壓，北約在未獲聯合國安理會授權的情況下，於1999年對南斯拉夫（塞爾維亞）展開為期78天的空襲行動，最終迫使塞爾維亞撤軍，科索沃於2008年片面宣布獨立。",
    causal:"科索沃戰爭是北約史上首次未經聯合國安理會授權即採取的軍事介入行動，是評估[[theory|new-interventionism-r2p|新干預主義／國家保護責任]]理論卡人道干預正當性爭議的關鍵歷史案例——干預雖阻止了種族清洗持續擴大，卻也開創了繞過安理會授權逕行軍事介入的先例，引發國際法上主權與人道干預孰輕孰重的長期辯論，可與既有GLOSSARY詞條「南海爭端較少涉及民族認同衝突」一句中提及的科索沃對照案例相互呼應。"},
  {id:"china-wto-2001",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2001",title:"中國加入WTO與和平崛起",spec:"core",
    narrative:"1990年代起，中國積極尋求加入世界貿易組織前身關稅暨貿易總協定，歷經長達15年的多輪談判，於2001年12月正式成為世界貿易組織第143個會員國。加入WTO要求中國大幅開放市場、降低關稅、改革國營企業體制，換取中國商品得以在最惠國待遇基礎下進入全球市場，此後中國經濟出口導向高速成長，迅速成為世界工廠與全球供應鏈核心樞紐。與此同時，中國官方提出和平崛起（後改稱和平發展）論述，強調中國經濟與軍事實力提升不會挑戰既有國際秩序、不會走向歷史上崛起強權訴諸武力擴張的老路，試圖化解國際社會對中國崛起的疑慮。然而隨著中國經濟與軍事實力持續增長，美國等西方國家逐漸質疑中國是否真正遵循和平崛起承諾，這條疑慮最終在2018年演變為[[modern|us-china-trade-war|美中貿易戰]]的爆發。",
    knowledge:["中國加入WTO被視為美國柯林頓政府對中交往政策的重要成果，當時普遍預期經濟開放將促成中國政治體制自由化，此一預期至今未能實現，是理解21世紀美中關係轉折的重要背景","和平崛起論述與後續美中貿易戰、南海爭端、台海緊張情勢的發展形成鮮明對比，是評估中國對外政策承諾與實際行為落差的重要分析案例","我國（中華民國）緊接於中國之後，於2002年初正式加入WTO，入會名稱為「臺灣、澎湖、金門及馬祖個別關稅領域」（簡稱中華臺北關稅領域），而非「中國臺北」「臺灣」或「中國臺灣」等常見混淆名稱，也並非與中國同於2001年入會——110年外交特考四等第17題直接命中此精確年份與正式名稱的辨析"],
    theory:[{label:"自由主義／國際制度",text:"最貼近考古題方向：中國加入WTO是自由制度主義相信經濟整合能促成政治自由化的重要實踐案例，但這項預期最終未能實現，也成為後續自由制度主義受到現實主義批評的具體例證。"},{label:"權力轉移理論",text:"角度：中國藉WTO架構快速累積經濟實力，為21世紀美中權力轉移態勢的具體物質基礎，可與既有[[theory|power-transition|權力轉移理論]]理論卡相互呼應。"}]},
  {id:"911-war-on-terror",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2001–迄今",title:"九一一襲擊事件與全球反恐戰爭",spec:"core",
    narrative:"2001年9月11日，蓋達組織劫持四架民航客機，分別衝撞紐約世貿中心雙塔、美國國防部五角大廈，另一架墜毀於賓州曠野，造成近3000人死亡，是美國本土遭受最嚴重的單日恐怖攻擊。小布希政府隨即宣布展開全球反恐戰爭，同年10月出兵阿富汗，推翻窩藏蓋達組織首腦賓拉登的塔利班政權（此後美軍在阿富汗駐留近20年，詳見[[modern|afghanistan-withdrawal|美國阿富汗撤軍]]事件卡）。2002年，小布希在國情咨文中將伊拉克、伊朗、北韓並列為邪惡軸心，為2003年出兵伊拉克鋪墊輿論基礎。911事件也促使美國學者杭廷頓原先備受批評的文明衝突論一度被重新評價為具有洞見，部分西方輿論將這場攻擊理解為伊斯蘭極端主義與西方文明衝突的具體展現。反恐戰爭期間，美國國內通過《愛國者法案》擴大政府監控權限，並在關達那摩灣設立拘留設施羈押恐怖主義嫌疑人，引發國際社會對人權與國家安全孰輕孰重的長期爭議。",
    knowledge:["911事件促使杭廷頓文明衝突論被重新評價為具有洞見，可與既有[[theory|clash-of-civilizations|文明衝突論]]理論卡相互呼應","邪惡軸心（伊拉克、伊朗、北韓）是小布希政府反恐戰爭時期的重要外交論述框架，阿富汗雖為反恐戰爭焦點但並不屬於邪惡軸心所指範疇——常考的邪惡軸心名單精確辨析題","反恐戰爭直接開啟美國此後近20年在阿富汗的軍事介入，2021年美軍撤離、塔利班重新掌權，詳見既有阿富汗撤軍事件卡"],
    theory:[{label:"文明衝突論",text:"最貼近考古題方向：911事件後西方社會部分將蓋達組織攻擊理解為伊斯蘭文明與西方文明衝突的具體展現，直接呼應[[theory|clash-of-civilizations|文明衝突論]]理論卡的核心命題，但這種文明衝突框架也因過度簡化伊斯蘭世界內部多元性而備受批評。"},{label:"現實主義",text:"角度：反恐戰爭展現美國以壓倒性軍事力量對非國家行為者（蓋達組織）進行報復與清剿，是傳統國家中心現實主義理論面對非傳統安全威脅時的調適與延伸應用。"},{label:"國際公法",text:"角度：關達那摩灣拘留設施與愛國者法案擴大監控權限，引發國際人權法與國家安全利益之間的長期法律與倫理爭議。"}]},
  {id:"iraq-war-2003",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2003–2011",title:"2003年伊拉克戰爭",spec:"core",
    narrative:"小布希政府以情報顯示伊拉克海珊政權擁有大規模毀滅性武器、且與蓋達組織恐怖網絡有所勾連為由，主張必須先制解除此一威脅。然而聯合國安理會並未通過明確授權動武的決議，美國遂於2003年3月聯合英國等國組成志願聯盟，未獲安理會授權即出兵伊拉克，迅速擊潰伊拉克軍隊、推翻海珊政權，海珊本人隨後被捕並處以絞刑。然而美軍占領期間始終未能尋獲情報所稱的大規模毀滅性武器，出兵正當性的情報依據備受國際社會質疑；伊拉克戰後陷入什葉派、遜尼派教派衝突與武裝叛亂游擊戰，美軍傷亡持續攀升，直到2011年歐巴馬政府才完成美軍全面撤離。然而伊拉克戰後長期存在的教派對立與治理真空，日後成為極端組織伊斯蘭國（ISIS）崛起坐大的溫床。",
    knowledge:["伊拉克戰爭與既有911事件反恐戰爭卡片涵蓋的阿富汗戰爭是兩場不同戰爭，前者未獲聯合國安理會授權、後者則有安理會決議背書，兩者國際法正當性基礎並不相同，是常考的精確辨析題","出兵伊拉克的大規模毀滅性武器情報依據事後證實有誤，是評估先制攻擊正當性與情報決策風險的重要當代案例","伊拉克戰後教派對立與治理真空，直接埋下伊斯蘭國崛起的種子，詳見[[modern|arab-spring-syria|阿拉伯之春與敘利亞內戰]]事件卡"],
    theory:[{label:"國際公法",text:"最貼近考古題方向：伊拉克戰爭未獲聯合國安理會明確授權即逕行出兵，是評估片面先制攻擊合法性、以及大國如何在缺乏多邊授權下仍訴諸武力的重要案例，可與既有科索沃戰爭（同樣未獲安理會授權）相互對照比較。"},{label:"現實主義",text:"角度：美國以先制攻擊邏輯處理潛在威脅，展現冷戰後單極時刻美國自認擁有足夠實力單邊行動、無須仰賴多邊授權的權力自信，但這場戰爭的高昂代價也逐漸促成美國此後對海外軍事介入更趨審慎。"}]},
  {id:"financial-crisis-2008",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2008–2009",title:"2008年全球金融危機",spec:"light",
    narrative:"美國次級房貸市場泡沫於2007年起逐漸浮現裂痕，2008年9月，具百年歷史的大型投資銀行雷曼兄弟宣告破產，引爆全球金融體系連鎖性危機，是自1929年經濟大蕭條以來最嚴重的全球性經濟衰退。各國政府相繼推出大規模財政刺激方案與量化寬鬆貨幣政策因應，避免金融體系全面崩潰。這場危機促使原本僅屬財長層級的二十國集團（G20）於同年11月升格為元首峰會層級，反映中國、印度、巴西等新興經濟體在全球經濟治理中角色的提升（詳見既有[[org|g20|二十國集團（G20）]]組織卡）。這場危機也重創西方社會對自由市場資本主義體制的信心，貧富差距擴大與民眾對建制派的不滿情緒持續累積，為後續民粹主義、保護主義浪潮興起提供了溫床。",
    causal:"是21世紀對國際政治經濟秩序衝擊最深遠的單一事件，可與既有「重商主義vs自由主義」理論卡、「去風險化」GLOSSARY詞條相互呼應，展現金融全球化風險與各國經濟治理權力格局的重組。"},
  {id:"arab-spring-syria",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2010–迄今",title:"阿拉伯之春與敘利亞內戰",spec:"light",
    narrative:"2010年底，突尼西亞一名街頭小販因不堪警察暴力執法而自焚抗議，這起悲劇迅速點燃延燒整個阿拉伯世界的大規模反威權示威浪潮，史稱阿拉伯之春。突尼西亞、埃及、利比亞、葉門等國長期執政的威權統治者相繼在強大民意壓力下垮台，但多數國家未能順利轉型為穩定民主體制，反而陷入長期政治動盪。利比亞強人格達費在北約空襲協助反抗軍的軍事行動下遭推翻並當場處死；敘利亞總統阿塞德則在俄羅斯、伊朗強力軍事與外交支持下頑強鎮壓國內反抗勢力，敘利亞自此陷入長達十餘年的血腥內戰，造成數十萬人死亡、數百萬難民被迫外逃，大量難民湧入歐洲，直接衝擊歐洲各國政局穩定與移民政策辯論（可與既有[[modern|european-integration|歐洲整合史]]事件卡相互呼應）。內戰期間，極端組織伊斯蘭國（ISIS）趁勢崛起，一度占領敘利亞與伊拉克大片領土並宣布建國，直至2019年才在國際聯合軍事行動下瓦解其主要據點。",
    causal:"利比亞、敘利亞的不同結局（前者政權迅速垮台、後者政權在外部強權支持下存活）是評估外部強權軍事介入決定性、以及新干預主義理論實踐侷限性的重要對照案例，可與既有[[theory|new-interventionism-r2p|新干預主義／國家保護責任]]理論卡相互呼應；伊斯蘭國的崛起也與既有[[modern|iraq-war-2003|2003年伊拉克戰爭]]事件卡遺留的治理真空直接相關。"},
  {id:"hong-kong-2019",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2019–2020",title:"香港反送中運動與港版國安法",spec:"light",
    narrative:"香港政府2019年提出《逃犯條例》修訂草案（俗稱送中條例），港人擔憂修法後恐遭引渡至中國大陸受審、動搖香港司法獨立，觸發大規模反送中示威運動，示威持續數月並多次演變為警民激烈衝突，國際社會高度關注。2020年6月，中國全國人大常委會繞過香港立法會，直接制定並頒布《香港國安法》，將分裂國家、顛覆國家政權、恐怖活動、勾結外國勢力四類行為定為刑事罪行，賦予香港警方與中央駐港機構擴大執法權限。國際社會普遍認為國安法實質架空香港《基本法》原先承諾的一國兩制高度自治框架，美國、英國等國相繼實施制裁並調整對港政策（如美國取消香港特殊關稅地位）。",
    causal:"香港一國兩制框架的實質崩解，常被拿來與台灣潛在一國兩制模式的可行性辯論相互對照，也直接影響台灣內部民意對一國兩制接受度的轉變，是評估中國對港、對台政策一致性的重要當代案例。"},
  {id:"covid-pandemic",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2019–2023",title:"COVID-19全球疫情",spec:"light",
    narrative:"2019年底，中國武漢出現不明肺炎病例，2020年初新型冠狀病毒疫情迅速擴散全球，世界衛生組織於2020年1月30日宣布構成國際關注公共衛生緊急事件，同年3月11日進一步定性為全球大流行。各國相繼採取邊境封鎖、社交距離限制、疫苗研發等因應措施，疫情對全球供應鏈、國際旅行、多邊合作機制造成前所未有的衝擊。美中雙方就病毒起源問題（實驗室洩漏論vs自然人畜共通傳播論）持續互相指責，加劇美中關係緊張；台灣因應得宜的防疫成果（Taiwan can help）也成為近年爭取國際參與世界衛生大會的重要論述基礎。",
    causal:"是{{非傳統安全}}理論詞條最鮮活的當代實踐案例，疫情催化的供應鏈斷裂經驗，也直接強化了此後{{去風險化}}、{{友岸外包}}等政策論述的正當性基礎。"},
  {id:"us-china-trade-war",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2018–迄今",title:"美中貿易戰",spec:"core",
    narrative:"2017年川普就任美國總統後，提出「美國優先」政策，責令商務部與貿易代表署調查中國是否存在不公平貿易行為。2018年3月22日，川普依據《1974年貿易法》第301條，公布對中國調查結果，認定中國以強制技術移轉、智慧財產權侵害等不正當手段取得技術，損害美國利益，是美中貿易戰的正式序曲。同年7月起，美國分批對中國輸美產品加徵懲罰性關稅，涵蓋航太、資通訊、機械等與「中國製造2025」高度相關的高科技產品，中國隨即對等課徵報復性關稅，雙方陷入互相加徵關稅的升級循環。經過多輪經貿磋商，雙方於2020年1月15日簽署《美中第一階段貿易協議》，中國承諾大幅改革經貿體制並增加自美採購2000億美元商品以縮減貿易逆差，但後續中國實際採購僅完成約六成、且結構性改革承諾多未兌現。拜登政府上任後，延續並持續加碼對中國的科技出口管制與投資審查，美中貿易與科技對抗自此進入長期化、結構化的戰略競爭階段。",
    knowledge:["301條款是美國總統依國內法單邊授權對他國採取貿易制裁的法律依據，不需經過WTO爭端解決程序，是美中貿易戰爭議性的法源核心","中國曾就301關稅向WTO爭端解決機制提出申訴，凸顯美中貿易戰不僅是雙邊經貿摩擦，也牽動多邊貿易規則的合法性辯論","第一階段貿易協議（2020）的採購承諾未能足額履行，是後續美中貿易關係持續緊張、拜登政府延續制裁的重要背景","貿易戰逐漸從單純關稅問題，擴大至華為等中國科技企業的出口管制與投資審查，展現貿易戰向科技戰、供應鏈脫鉤方向演變的趨勢","美中戰略競爭近年常被討論是否構成新冷戰，與冷戰時期美蘇對抗相比，美中經濟高度相互依賴（貿易額龐大、供應鏈深度交織）是最關鍵的結構性差異，美蘇之間幾乎沒有實質經貿往來，這也是評估美中對抗性質是否等同於冷戰時常被提出的核心論點","2022年8月，美國通過《晶片與科學法案》，其中針對中國大陸的核心限制措施是「護欄條款」：禁止接受聯邦補助的企業在中國大陸大幅擴增先進製程晶片產能，而非禁止使用中國製零件或禁止陸籍人士擔任董事——111年四等第1題直接命中此精確內容"],
    theory:[{label:"重商主義／自由主義",text:"最貼近考古題方向：可直接套用[[theory|mercantilism-vs-liberalism|重商主義vs自由主義]]理論卡分析——川普政府301關稅政策的邏輯正是重商主義將貿易視為國家安全與相對利益競逐工具的具體實踐，與自由主義主張自由貿易互利雙贏的立場形成直接對立。"},{label:"相對利益vs絕對利益",text:"角度：中國堅持自由貿易對雙方皆有利（絕對利益觀），美國則強調貿易逆差與技術外流損及自身相對地位（相對利益觀），兩種利益觀的根本分歧是貿易戰難以化解的深層原因。"},{label:"依賴理論／IPE",text:"角度：美國以出口管制、投資審查等手段試圖降低對中國供應鏈的依賴，可與{{去風險化}}概念相互呼應，是已開發國家重新評估全球化下相互依賴風險的具體政策實踐。"}]},
  {id:"afghanistan-withdrawal",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2020–2021",title:"美國阿富汗撤軍",spec:"core",
    narrative:"美國自2001年911事件後出兵阿富汗，推翻窩藏蓋達組織的塔利班政權，此後陷入近20年的反恐與國家重建泥沼。2020年2月29日，川普政府與塔利班在卡達杜哈簽署《為阿富汗帶來和平的協議》，美國承諾循序漸進全面撤軍、換取塔利班承諾不再庇護恐怖組織並與阿富汗政府展開談判，協議獲巴基斯坦、俄羅斯、中國支持及聯合國安理會一致認可，但協議中要求阿富汗政府釋放5000名塔利班戰俘，客觀上壯大了塔利班聲勢。拜登就任後決定延續撤軍承諾，2021年4月宣布美軍將於5月1日起啟動最終階段撤軍、9月11日（911事件20週年）前完成。然而塔利班趁美軍撤離之際迅速反攻，以「農村包圍城市」之勢席捲全國，8月中旬兵臨喀布爾，阿富汗政府軍幾乎未做抵抗，總統加尼倉皇出逃，美國緊急加派兵力協助撤離使館人員與滯留外國公民，喀布爾機場一度陷入混亂，8月30日美軍完成最後撤離，阿富汗戰爭正式落幕，塔利班重新掌權。",
    knowledge:["杜哈協議（2020）由川普政府與塔利班簽署，拜登政府選擇延續而非推翻此協議，是跨政府延續性外交承諾的案例，也常考撤軍決策究竟該歸咎川普或拜登的責任歸屬辯論","協議規定的塔利班戰俘釋放，是後續塔利班迅速坐大反攻的關鍵背景因素之一","阿富汗政府軍在缺乏美軍直接支援下迅速潰散，凸顯美國過去20年扶植的阿富汗政府欠缺自主防衛能力與正當性基礎的結構性問題","喀布爾機場撤離混亂場面，是美國近年對外軍事介入政策形象受創最嚴重的事件之一，直接衝擊美國對外承諾可信度的國際觀感"],
    theory:[{label:"權力平衡理論",text:"最貼近考古題方向：可套用[[theory|balance-of-power|權力平衡理論]]分析美國自阿富汗撤軍的動機——美國評估阿富汗反恐目標已大致達成、繼續駐軍的邊際效益遞減，決定將戰略資源與注意力轉向印太區域制衡中國崛起，是一種資源重新分配式的權力平衡再調整；撤軍後，俄羅斯、中國、巴基斯坦等區域強權則需重新評估各自在阿富汗真空後的勢力範圍與影響力布局，構成美中俄三方在中亞、南亞區域權力平衡的新一輪動態調整。"},{label:"外交史方法論",text:"角度：適合做美國對外軍事介入決策的層次分析——個人層次（川普與拜登兩任總統的決策風格差異）、國家層次（美國國內厭戰情緒與反恐政策路線辯論）、系統層次（美國全球戰略重心從反恐轉向大國競爭的結構性轉移）。"},{label:"依賴理論／IPE",text:"角度：阿富汗政府高度依賴美國軍事與財政支持，一旦外部支持撤除即迅速崩潰，是研究依賴型政權脆弱性的當代案例。"}]},
  {id:"russia-ukraine-war",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2014–迄今",title:"俄羅斯入侵烏克蘭／俄烏戰爭",spec:"core",
    narrative:"2014年，烏克蘭爆發廣場革命，親俄總統亞努科維奇遭罷黜流亡，俄羅斯隨即出兵併吞克里米亞，烏克蘭東部頓巴斯地區（頓涅茨克、盧甘斯克）也爆發親俄武裝分離勢力與烏克蘭政府軍的頓巴斯戰爭，雙方雖於2014年、2015年兩度簽署《明斯克協議》試圖降溫，但邊境對峙從未真正終結。烏克蘭自此放棄中立地位，2018年修憲將加入北約與歐盟列為國家首要戰略目標。2021年10月起，俄羅斯在烏克蘭邊境及白俄羅斯境內大規模集結軍隊（估計逾13萬人），並向北約提出因歷年東擴而產生地緣安全威脅的談判要求，多國警告俄羅斯正籌劃入侵。2022年2月21日，俄羅斯承認頓涅茨克、盧甘斯克兩個親俄政權為獨立國家；2月24日，俄羅斯總統普丁以「去軍事化」「去納粹化」為由宣布展開「特別軍事行動」，從北、東、南、東南四個方向對烏克蘭發動全面入侵，這是二戰結束以來歐洲大陸規模最大的戰爭。烏克蘭在總統澤倫斯基領導下展開激烈抵抗，成功擋下俄軍對基輔的閃電攻勢，戰事自此陷入長期消耗戰，並演變為西方陣營對烏克蘭大規模軍援、對俄羅斯全面經濟制裁的代理人戰爭態勢。川普就任美國總統後，自2025年初起將促成俄烏停火列為外交優先要務，特使凱洛格原訂目標為上任100天內促成協議，但實際進度遠不如預期：2025年3月一度達成局部停火（期間美方曾短暫暫停對烏軍援與情報分享作為施壓手段）；5月伊斯坦堡會談，雙方領袖皆未親自出席；川普本人多次分別與普丁、澤倫斯基會晤（包括阿拉斯加高峰會、海湖莊園會談）。進入2026年，美俄烏三方在阿布達比（1月）、日內瓦（2月，首次將領土問題正式排入議程）多輪磋商，逐漸凝聚出一份「20點和平框架」草案，聚焦停火條款、安全保障、爭議領土（尤以頓巴斯地區最具爭議）等議題，但核心分歧至今未解。2026年4月、5月分別出現短暫停火（復活節32小時停火、5月9日俄國勝利日3天停火），雙方仍持續互控對方違反停火條款，戰爭至今尚未真正終結。",
    knowledge:["2014年克里米亞併吞與頓巴斯戰爭是2022年全面入侵的直接前奏，兩者常被視為同一場地緣政治衝突的不同升級階段，而非各自獨立的事件","《明斯克協議》（2014、2015）兩度簽署卻未能真正止戰，展現外交協議在缺乏強制執行機制下難以凍結既成軍事對峙的侷限性，可與既有歷史案例（如柏林會議波士尼亞代管安排）相互呼應比較","烏克蘭2018年修憲將入北約入歐盟列為首要國家戰略，是俄羅斯將北約東擴視為直接安全威脅、進而採取先制軍事行動的重要背景因素","戰爭爆發後西方對俄羅斯採取前所未有規模的金融制裁（凍結外匯存底、剔除SWIFT系統等），展現當代大國衝突中經濟制裁作為準軍事手段的操作模式","川普政府2025–2026年推動的多輪停火協議屢簽屢破，展現在缺乏第三方強制執行機制、且雙方核心利益（領土、安全保障）仍存根本分歧的情況下，短期停火協議難以轉化為長期和平安排的結構性侷限，可與既有集體安全機制失靈的歷史案例相互呼應比較"],
    theory:[{label:"安全困境",text:"最貼近考古題方向：可套用[[theory|security-dilemma|安全困境]]理論分析——北約東擴本意是強化中東歐國家自身安全，卻被俄羅斯解讀為對其戰略縱深與地緣安全的直接威脅，促使俄羅斯採取先制軍事行動因應，雙方安全認知的結構性錯位是這場戰爭最根本的理論解釋；此外，歐巴馬政府在2014年俄國併吞克里米亞時選擇不提供烏克蘭致命性軍事援助（避免直接刺激俄羅斯），拜登政府則在2022年全面入侵後大舉軍援烏克蘭，兩屆政府對俄羅斯威脅認知與嚇阻手段選擇的落差，也是安全困境理論可以延伸分析的政策比較素材。"},{label:"權力平衡理論／內部與外部抗衡",text:"角度：可套用[[theory|internal-external-balancing|內部抗衡與外部抗衡]]理論分析烏克蘭在2022年全面入侵前的因應策略——內部抗衡展現於烏克蘭自身持續強化國防預算、軍隊整編訓練；外部抗衡則展現於烏克蘭積極尋求北約安全保證、爭取西方國家軍事與情報支持，這正是113年三等申論題直接考過的分析角度。"},{label:"建構主義",text:"角度：俄羅斯官方論述將烏克蘭定位為歷史上與俄羅斯不可分割的一部分、烏克蘭獨立國族認同則被塑造為西方操弄下的人為產物，雙方對烏克蘭民族認同的建構性敘事直接衝突，是意識形態與歷史記憶如何形塑國家行為的當代案例。"}]},
  {id:"israel-hamas-conflict",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2023–迄今",title:"以色列與哈瑪斯衝突",spec:"core",
    narrative:"加薩走廊自2007年由哈瑪斯實質統治以來，與以色列間歇爆發多次大規模武裝衝突。2023年10月7日清晨，哈瑪斯發動代號「阿克薩洪水行動」的突襲，向以色列發射逾3000枚火箭彈，同時約3000名武裝分子突破邊境隔離牆，襲擊以色列南部猶太社區與軍事基地，造成逾1200名以色列人與外國公民死亡，另有200餘人被劫持至加薩作為人質，是1948年以阿戰爭以來以色列領土首次遭受如此大規模的入侵，也是自納粹大屠殺以來猶太人單日死亡人數最多的事件。以色列隨即宣布進入戰爭狀態，發動「鐵劍行動」空襲加薩走廊，並於10月9日對加薩實施全面封鎖，切斷糧食、飲水、電力與燃料供應，10月27日起發動大規模地面攻勢，戰事持續延燒，加薩走廊平民傷亡與人道危機持續攀升，聯合國大會雖多次通過呼籲立即停火的決議，但缺乏強制執行力，衝突至今仍未能徹底止息，期間雙方曾透過埃及、卡達等中介國多次達成臨時停火及人質交換協議，但均未能轉化為長期和平安排。2025年10月，在美國川普政府主導斡旋下，以色列與哈瑪斯終於達成較全面的停火協議，哈瑪斯釋放全部剩餘在世人質，並同意由巴勒斯坦技術官僚治理委員會接管加薩民政事務，哈瑪斯宣布解散其加薩政府機構，但拒絕解除武裝，以色列則持續對其認定的零星威脅目標採取軍事行動，這場戰爭的最終政治解方（加薩治理歸屬、哈瑪斯武裝力量存廢）仍懸而未決。",
    knowledge:["哈瑪斯突襲行動代號「阿克薩洪水行動」，以色列反擊行動代號「鐵劍行動」，是這場衝突最基本、也最常見的專有名詞","加薩走廊自2007年起由哈瑪斯實質統治，與約旦河西岸由巴勒斯坦自治政府管轄形成巴勒斯坦內部治理分裂的格局，是理解以巴衝突複雜性的重要背景","埃及、卡達在這場衝突中扮演關鍵斡旋中介角色，展現區域中等強權在無法直接介入軍事對抗的情況下，仍能透過外交斡旋發揮實質影響力","聯合國大會多次通過停火呼籲決議但缺乏強制力，可與既有國際聯盟集體安全機制失靈的歷史案例（衣索比亞、滿洲國等）相互呼應比較","2025年10月停火協議雖解決人質問題並促成哈瑪斯解散加薩政府機構，但哈瑪斯拒絕解除武裝、加薩戰後治理歸屬未定，展現這類停火協議往往只能凍結衝突表象、未能觸及根本政治解方的常見侷限"],
    theory:[{label:"權力轉移理論",text:"最貼近考古題方向：可套用[[theory|power-transition|權力轉移理論]]分析——雖然以色列與哈瑪斯之間並非傳統意義上對等的國家實力轉移關係，但可從區域權力格局角度延伸分析：伊朗支持的什葉派抵抗軸心（哈瑪斯、真主黨、青年運動等代理人網絡）試圖挑戰以色列在中東的既有安全優勢地位，這場衝突某種程度上是區域內修正主義聯盟試探挑戰既有地緣權力平衡的具體展現，可與既有理論卡權力轉移論的核心命題（崛起挑戰者對霸權地位的挑戰行為）相互對照。"},{label:"現實主義",text:"角度：以色列採取大規模軍事反擊、試圖徹底瓦解哈瑪斯軍事能力，展現現實主義安全至上、以壓倒性武力嚇阻未來威脅的邏輯，但也引發國際社會對軍事手段是否符合比例原則的廣泛爭議。"},{label:"建構主義",text:"角度：這場衝突牽動的猶太人大屠殺歷史創傷記憶、巴勒斯坦民族自決訴求等意識形態與集體記憶因素，使衝突難以化約為單純的領土或資源爭奪，是研究歷史記憶如何持續形塑當代國際衝突的重要案例。"}]},
  {id:"rwanda-genocide",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1994",title:"1994盧安達內戰與安理會處理",spec:"light",
    narrative:"盧安達境內胡圖族與圖西族的族群矛盾，可追溯至比利時殖民時期刻意扶植圖西族統治胡圖族多數的分而治之政策，獨立後兩族長期積怨。1994年4月，盧安達總統座機遭擊落身亡，胡圖族極端派隨即發動蓄謀已久的種族清洗行動，針對圖西族及溫和派胡圖族展開大規模屠殺，短短約100天內造成約80萬人死亡。當時聯合國已在盧安達部署維和部隊（聯合國盧安達援助團，UNAMIR），但兵力與授權範圍皆嚴重不足，安理會在屠殺爆發後未能及時擴大授權或增派兵力介入制止，主要大國（尤其美國，鑑於稍早索馬里維和行動挫敗的陰影）也缺乏出兵意願，導致聯合國實質上未能阻止這場種族滅絕，事後飽受國際社會嚴厲批評，成為冷戰後集體安全機制失靈最慘痛的案例之一。",
    causal:"與既有[[theory|collective-security|集體安全理論]]直接呼應——盧安達案例展現集體安全機制即使在冷戰結束、意識形態對抗消除後，仍可能因大國出兵意願不足、決策遲緩而失靈，與國際聯盟時期衣索比亞、滿洲國等案例同屬集體安全機制失效的歷史教材，但盧安達發生在後冷戰時期、聯合國架構下，性質更令人反思——制度存在本身不保證有效執行。"},
  {id:"embassy-bombing-ep3",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1999–2001",title:"1999年中國駐南斯拉夫使館遭轟炸與2001年中美南海撞機事件",spec:"light",
    narrative:"1999年5月7日，北約在對南斯拉夫的空襲行動中，以美軍B-2轟炸機投擲精確導引炸彈擊中中國駐貝爾格勒大使館，造成3名中國記者身亡、多人受傷。美國政府事後表示係因使用過時地圖、誤將使館認定為軍事目標所致的意外，但此說法遭中國政府與民間高度質疑，北京、上海等地隨即爆發大規模反美示威，中美關係一度陷入緊張，美方其後同意支付賠償金。2001年4月1日，一架美國海軍EP-3偵察機在南海上空與一架中國殲-8戰機發生擦撞，中方飛行員王偉跳傘失蹤（其後認定罹難），美機受損後迫降海南島；機上24名美軍機組人員遭中方扣留11天，經雙方交涉，美方以模糊措辭的「兩封信」（表達遺憾但未道歉）換取機組人員獲釋，飛機則遭中方拆解後歸還。兩起事件都發生在中美關係尚在磨合的關鍵時期，是observing中國民族主義情緒與中美危機管理機制的重要當代案例。",
    causal:"兩起事件都發生在北約東擴、中國加入WTO談判進入尾聲的前後，可與[[modern|china-wto-2001|中國加入WTO與和平崛起]]事件卡對照，顯示中美關係即使在經貿合作深化的同時，仍存在軍事與主權敏感神經；使館轟炸事件也可與科索沃戰爭的國際干預爭議一併討論，詳見[[modern|bosnia-kosovo|波士尼亞內戰與科索沃戰爭]]事件卡。"},
  {id:"south-china-sea",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1947–迄今",title:"南海爭端",spec:"core",
    narrative:"南海主權爭端源於1947年中華民國政府公布「十一段線」，主張南海諸島（東沙、西沙、中沙、南沙）主權，1949年後中華人民共和國承襲此一主張並簡化為「九段線」。隨著《聯合國海洋法公約》（UNCLOS）於1994年生效，各國得依據領海基線主張200浬專屬經濟區，南海周邊的越南、菲律賓、馬來西亞、汶萊等國陸續對南沙群島部分島礁提出重疊主權主張，形成多方角力的複雜局面。2002年，東協十國與中國簽署《南海各方行為宣言》（DOC），雖無法律拘束力，但承諾各方自我克制、不採取使爭端複雜化或擴大化的行動，並同意進一步協商具拘束力的「南海行為準則」（COC），但COC談判至今仍未能完成。2013年，菲律賓片面向常設仲裁法院提起仲裁，控告中國九段線主張及在南海的填海造陸行為違反UNCLOS，中國拒絕承認仲裁庭管轄權、拒不出庭。2016年7月，常設仲裁法院做出最終判決，裁定中國九段線的歷史性權利主張缺乏法律依據，且部分中國佔領島礁的填海造陸行為屬非法擴建，但中國拒絕承認判決效力，堅持透過雙邊談判解決爭端。",
    knowledge:["十一段線（中華民國1947）→九段線（中華人民共和國簡化版）的演變，是南海主權主張的歷史源頭，兩岸立場在此議題上高度一致","與中國有南海主權爭端的國家包括越南、菲律賓、馬來西亞、汶萊，但新加坡並無爭端——111年三等第9題直接命中的陷阱","2016年常設仲裁法院對菲律賓南海仲裁案做出判決，裁定九段線缺乏法律依據——110年三等第7題直接命中的年份","《南海各方行為宣言》（DOC，2002）無法律拘束力，具拘束力的《南海行為準則》（COC）談判至今未竟全功，是東協與中國多邊協商機制效力有限的具體案例","南海爭端主要涉及主權、海洋權益與資源爭奪，較少涉及族群或國族認同衝突成分——與克里米亞、喀什米爾、科索沃等民族認同型領土爭端形成對比，是110年四等第10題測試的關鍵特殊性","2024–2025年間，菲律賓與中國海警船隻在仁愛礁、仙賓礁等南沙島礁周邊持續發生噴水砲驅離、船體碰撞等對峙事件，即使2016年仲裁判決已確立中國九段線主張缺乏法律依據，實際海上對峙態勢並未因此緩解，展現國際仲裁判決對實際地緣行為約束力有限的現實困境"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：南海蘊藏豐富漁業資源與潛在油氣蘊藏，且扼守重要國際航運要道，是典型的資源與地緣戰略雙重驅動的主權爭奪，中國持續填海造陸擴建軍事設施，展現既成事實外交（fait accompli）的操作邏輯。"},{label:"國際公法",text:"角度：菲律賓南海仲裁案是UNCLOS爭端解決機制的重要實踐案例，但中國拒絕承認判決效力，凸顯國際仲裁判決在缺乏強制執行機制下、對大國實際約束力有限的現實困境，可與國際聯盟集體安全機制失靈的歷史案例相互呼應。"},{label:"自由主義／國際制度",text:"角度：《南海各方行為宣言》展現東協與中國嘗試透過多邊宣示性文件管理爭端，但缺乏法律拘束力的COC談判牛步化，顯示制度性合作在觸及核心主權議題時的侷限性。"},{label:"地緣政治",text:"角度：南海是連結印度洋與太平洋的重要航運咽喉，也是美國印太戰略、中國近海防禦戰略直接交會的前沿地帶，可與既有大賽局、近東問題等列強地緣角力概念做跨時代對照。"}]},
  {id:"trump-xi-taiwan-2026",region:"crossstrait",period:"⑤緊張升溫期 2016–迄今",year:"2025–2026",title:"川普2.0時期美中台關係新發展",spec:"core",
    narrative:"川普二度就任美國總統後，2025年4月對台灣及多數貿易夥伴加徵關稅，是其經濟民族主義路線的具體展現。同年9月，中國就日本首相高市早苗在國會答詢中表示，若中國對台灣動用武力可能構成日本存亡危機事態的言論，向日本政府強烈施壓抗議，引發中日外交風波，凸顯台海情勢與日本安全保障政策之間日益緊密的連結。2025年12月，美國宣布對台史上最大規模軍售案（約110億美元），但實際執行進度因川普政府與北京互動而多次延宕；同月，中國解放軍發動代號正義行動2025的大規模軍演，環台演習，規模為歷來最大。2026年2月，川普與習近平通話，習近平就對台軍售案要求川普保持謹慎。2026年5月13至15日，川習於北京舉行高峰會，會後中方公布之會談紀要強調台灣問題是中美關係中最重要的問題，若處理不當兩國將發生衝突甚至對抗，使整個關係陷入嚴重危機；美方公布的會談紀要則完全未提及台灣，川普政府官員也強調美國對台政策並未改變。然而，川普本人於高峰會期間接受福斯新聞專訪時表示，他不希望看到（台灣總統）賴清德走向獨立，並稱我們不是要為此跨越9500英里去打一場戰爭，此番言論在台灣內部引發高度關注與憂慮。同一時期，賴清德總統於2025年11月提出400億美元的特別國防預算（涵蓋至2033年），但朝野立法院審議進度延宕。",
    knowledge:["川普政府對台軍售案的延宕與川習會期間的謹慎處理，展現美中關係戰略模糊政策在川普2.0時期面臨的新壓力測試——軍售延宕可能被解讀為對北京讓步，但美方官方立場仍堅持政策未變","中日外交風波顯示，台海情勢已不只是美中台三邊問題，日本基於自身安全保障法制（存亡危機事態認定）也逐漸被牽動捲入，是東亞區域安全連動性升高的具體案例","川習會中方會談紀要與美方會談紀要對台灣議題著墨程度的巨大落差（中方強調、美方隻字未提），本身就是雙方各自對外宣傳策略差異的有趣觀察素材","川普在專訪中對台灣獨立的公開表態，雖非正式政策轉變，但已對長期戰略模糊政策的可信度與台灣內部信心構成一定衝擊，可與既有GLOSSARY詞條{{戰略模糊}}、{{延伸嚇阻}}相互呼應分析"],
    theory:[{label:"戰略模糊vs戰略清晰",text:"最貼近考古題方向：川普對台灣獨立的公開發言，某種程度上打破了傳統戰略模糊政策刻意迴避明確表態的慣例，這種偏離常規的公開表態究竟是政策轉向的訊號、抑或僅是個人化外交風格下的即興發言，是分析當前美國對台政策走向的核心爭議點，可直接套用GLOSSARY詞條{{戰略模糊}}的理論框架深入申論。"},{label:"權力平衡理論／楔形策略",text:"角度：可套用[[theory|wedge-strategy|楔形策略]]理論分析——中國透過對美貿易談判施壓、要求美方在對台軍售案上保持謹慎，某種程度上是利用經貿槓桿在美台關係中打入楔子，試圖以經濟利益交換換取美方在安全承諾上的讓步空間。"},{label:"外交史方法論",text:"角度：適合做美中雙方對同一場高峰會的官方敘事落差分析——中方會談紀要與美方會談紀要對台灣議題著墨程度的巨大差異，展現外交公報用詞與對外宣傳策略如何反映雙方各自的政治考量，可與既有三公報認知vs承認的精確用詞分析相互呼應。"}]},
  {id:"iran-war-2026",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2025–2026",title:"美伊戰爭",spec:"core",
    narrative:"美伊長期對立源自1979年伊朗革命（詳見[[modern|iranian-revolution-1979|伊朗革命]]事件卡）——同年11月，伊朗學生佔領美國駐德黑蘭大使館，挾持52名美國人質長達444天，重創卡特政府威信並直接影響隔年美國大選由雷根勝選，是美伊關係決裂的起點事件。2015年《伊朗核協議》（JCPOA）簽署後一度緩和，但協議其後破局，美國重啟制裁，伊朗持續擴大濃縮鈾與飛彈計畫，美以雙方安全疑慮升高。2025年6月，以色列與伊朗爆發12天戰爭，美軍後期加入空襲伊朗核設施，當月底達成停火，但已埋下更大規模衝突的引信。2025年底伊朗爆發大規模反政府抗議，當局血腥鎮壓平民，美伊關係急遽惡化，2026年1月伊朗官員揚言已準備開戰，美國隨即在區內部署自2003年伊拉克戰爭以來最大規模軍事力量。2026年2月27日，川普下令對伊朗展開最終軍事行動；2月28日，美以聯手空襲德黑蘭等地，伊朗最高領袖哈梅內伊在攻擊中喪命，是這場戰爭最具震撼性的單一事件——伊朗實行政教合一的神權共和體制，最高領袖掌握軍隊、司法、媒體最高決策權，其身亡使伊朗一度陷入制度性權力真空，3月8日由其子穆傑塔巴繼任，但據傳其本人已在開戰初期空襲中身受重傷，決策體系陷入教士集團與革命衛隊將領互相拉扯的不透明狀態。3月2日起，美軍展開代號史詩怒火的大規模跨軍種聯合軍事行動，動員數千官兵、數百架先進戰機及兩個航母打擊群，24小時內打擊逾千個目標，持續轟炸伊朗石油出口樞紐哈爾克島、納坦茲鈾濃縮設施等關鍵目標。伊朗革命衛隊展開報復，攻擊波斯灣周邊設有美軍基地的國家，葉門青年運動（胡塞）首度向以色列發射彈道飛彈，伊朗更封鎖全球最重要能源運輸咽喉——荷莫茲海峽，造成國際油價劇烈波動、衝擊全球經濟。3月下旬起，美方透過巴基斯坦居中斡旋提出多輪停火方案，期間多次延後空襲期限，4月一度停火，但談判反覆破裂，5月初伊朗提出終戰方案，5月5日美方宣布史詩怒火行動結束。6月19日，巴基斯坦斡旋下美伊於日內瓦簽署停火備忘錄，重開荷莫茲海峽換取60天核談判，國際油價應聲下跌。然而這份停火協議並未持久——隨著經荷莫茲海峽船隻再度遇襲，川普於7月宣布停火協議終止，美軍對伊朗展開新一輪打擊，戰事延續至今（2026年8月）尚未真正落幕，川普近期更揚言對任何與伊朗往來的國家祭出極大經濟後果。",
    knowledge:["本次戰爭傷亡數字各方統計差異極大且持續變動：伊朗官方統計逾3,400人死亡、逾3萬人受傷；美方統計逾400名美軍人員受傷、14人陣亡，另有3架F-15E戰機遭擊落，這些數字應理解為戰爭進行中各方各自的統計說法，而非蓋棺論定的最終數字","伊朗最高領袖哈梅內伊身亡是近代史上少見的大國直接透過軍事手段除去他國最高精神與政治領袖的案例，可與既有國際法政權更迭相關討論相互呼應","荷莫茲海峽封鎖直接衝擊全球油價與能源供應，是海上咽喉點（choke point）地緣戰略價值的當代教材，可與既有蘇伊士運河、博斯普魯斯海峽等咽喉點案例做跨時代比較","停火協議簽署後又於數月內破裂，是可信承諾與協議執行力薄弱的當代案例，可與既有明斯克協議、柏林會議波士尼亞代管等歷史案例相互呼應"],
    theory:[{label:"現實主義／政權更迭",text:"最貼近考古題方向：以色列將這場戰爭視為解決伊朗威脅數十年宿怨的天賜良機，直接以軍事手段追求政權更迭與最高領袖除去，是研究先制打擊、政權更迭當代實踐的最鮮活案例，可與既有理論卡權力平衡、抗衡扈從等現實主義工具相互呼應。"},{label:"地緣政治／國際政治經濟學",text:"角度：荷莫茲海峽封鎖直接衝擊全球油價與能源安全，是石油地緣政治、海上咽喉點戰略價值的教科書等級案例，全球約五分之一石油運輸須經此海峽，其封鎖對國際經濟秩序的衝擊足以比擬近東問題時期博斯普魯斯海峽的戰略地位。"},{label:"外交史方法論",text:"角度：可做層次分析——個人層次（川普、以色列總理納坦雅胡的決策風格與政治動機）、國家層次（伊朗神權共和體制在最高領袖身亡後的權力結構動盪）、系統層次（美以聯手行動對中東地緣格局、全球能源市場的結構性衝擊）。"}]},
  {id:"venezuela-cuba-2026",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2025–2026",title:"川普政府西半球政策：委內瑞拉軍事行動與古巴制裁",spec:"core",
    narrative:"川普政府自2025年9月起指控委內瑞拉馬杜洛政權涉入毒品恐怖主義，多次攻擊疑似販毒船隻（代號南矛行動）；同年8月起在加勒比海集結重兵。2026年1月3日，美軍發動代號絕對決心行動的突襲，攻擊委內瑞拉境內軍事設施，並直接逮捕總統馬杜洛及其妻子西莉亞．佛羅雷斯，押送至美國布魯克林聯邦監獄，依毒品走私、持有槍械等罪名受審——這是自1989年美軍出兵巴拿馬逮捕諾瑞加以來，美國在拉丁美洲規模最大的軍事行動。川普在記者會上表示美國將代為運營委內瑞拉直至完成政權過渡，並指派國務卿盧比歐團隊主導，稱委國石油產業已失敗、將由美國企業進駐修復。馬杜洛審判日期歷經多次延後，最終定於2027年6月，其律師團表示將以跨境逮捕合法性及國家元首豁免權作為抗辯理由。與此同時，川普政府自2025年6月30日簽署《國家安全總統備忘錄》，重啟對古巴強硬制裁，切斷古巴軍方（尤其國防企業集團GAESA）金融管道；2026年1月，簽署行政令對向古巴供油的國家課徵懲罰性關稅，配合馬杜洛被捕後委內瑞拉對古供油中斷，意圖徹底瓦解古巴能源供應鏈；同年5月1日進一步擴大制裁至古巴政府、軍隊、情報系統相關人士，古巴稱此為對其人民的集體懲罰。白宮論述特別強調古巴是中共在西半球的特洛伊木馬，長期代管中共情報監聽設施。根據媒體報導，川普政府對古巴策略路線傾向經濟扼殺而非軍事入侵，目標是製造內部分裂、為談判創造空間，但已導致古巴人民陷入嚴重物資短缺與停電危機。",
    knowledge:["美軍跨境逮捕他國元首帶回本土受審，在國際法上爭議極大，明顯牴觸不干涉他國內政原則，也牽動國家元首豁免權的國際法辯論","川普政府對委內瑞拉的軍事行動與對古巴的經濟制裁，合起來可視為21世紀版的門羅主義復刻——手段從19世紀的外交宣示，轉變為軍事斬首行動與經濟封鎖，但核心邏輯高度一致：不容忍外部（尤其中共）勢力介入西半球，可直接與既有[[west|monroe-doctrine|門羅主義]]事件卡相互呼應對照","白宮將古巴定位為中共在西半球的情報前哨，展現美中戰略競爭已延伸至傳統上被視為美國後院的拉丁美洲區域，是美中對抗全球化、在地理上不斷擴大戰場的具體案例"],
    theory:[{label:"現實主義／政權更迭",text:"最貼近考古題方向：直接對照[[west|monroe-doctrine|門羅主義]]理論卡——21世紀的委內瑞拉軍事行動與古巴制裁，本質上是門羅主義西半球排他性勢力範圍邏輯的當代復刻，只是手段從外交宣示升級為直接軍事介入與經濟扼殺。"},{label:"國際公法",text:"角度：跨境逮捕他國元首牽涉主權豁免、不干涉內政等國際法核心原則的爭議，是評估當代強權如何在國內法（美國聯邦法院起訴）與國際法（他國主權）之間製造模糊地帶、擴張域外管轄權的具體案例。"},{label:"依賴理論／IPE",text:"角度：美國宣稱將由本國企業進駐修復委內瑞拉石油基礎設施，展現經濟利益與地緣政治行動高度交織，符合依賴理論對核心國家如何透過政治軍事手段確保邊陲資源供應的分析框架。"}]},
  {id:"india-pakistan-2025",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2025",title:"2025年印巴危機",spec:"light",
    narrative:"2025年4月22日，印度管轄喀什米爾帕哈爾岡地區發生恐怖攻擊事件，造成26名遊客死亡，印度將矛頭指向巴基斯坦支持的武裝組織。印巴雙方沿實際控制線爆發零星交火後，5月7日印度發動代號「辛多爾行動」的飛彈打擊，攻擊巴基斯坦境內及巴屬喀什米爾的目標，巴基斯坦隨即以代號「班尼揚馬索斯行動」展開反擊，是繼1999年喀吉爾衝突後，兩個擁核國家間最激烈的一次軍事對峙。雙方於5月10日達成停火，但印巴各自對美國斡旋是否為關鍵因素說法不一。停火至今大致維持，但雙方缺乏正式官方溝通管道，學界普遍形容當前狀態為不戰不和的流動性不穩定。",
    causal:"這是印巴自1947年分治以來多次戰爭（1947–48、1965、1971、1999喀吉爾）的最新一次危機，核武陰影下雙方仍選擇進行有限度的常規軍事對抗，可與既有{{延伸嚇阻}}、[[theory|security-dilemma|安全困境]]理論相互呼應，是研究核武嚇阻穩定性與危機管理在南亞情境下具體實踐的當代案例。"},
  {id:"china-saudi-iran-mediation",region:"modern",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"2023",title:"中國斡旋沙烏地阿拉伯與伊朗恢復外交關係",spec:"light",
    narrative:"沙烏地阿拉伯與伊朗因宗教（遜尼派與什葉派）、地緣政治（葉門內戰等區域代理衝突）長期對立，已於2016年因沙國處決什葉派教士尼姆爾、伊朗抗議民眾攻擊沙國駐德黑蘭大使館而斷絕外交關係。2023年3月6日至10日，在中共中央外事工作辦公室主任王毅居中主持下，沙伊兩國高階官員在北京進行為期四天的秘密會談，於3月10日發表聯合聲明，宣布恢復外交關係、於兩個月內互設大使館，並重啟先前簽署的安全合作協定與經貿合作協定。同年4月，兩國外長在北京會面，正式啟動關係恢復的具體執行步驟。這是中國首次在傳統上由美國主導斡旋的中東地緣政治議題中，扮演核心調停角色，被廣泛視為中國外交影響力延伸至政治與安全領域、而不僅限於經貿投資的重要指標性事件。",
    causal:"此次斡旋可與中國透過一帶一路、AIIB等經濟工具在全球擴大影響力的作法對照，詳見[[china|xi-era-diplomacy|習近平時代外交起點：十八大、一帶一路與大國外交]]事件卡，顯示中國正嘗試將經濟影響力進一步轉化為政治與安全事務上的斡旋能力；也可與美國在中東地區傳統的主導角色相互對照，作為評估國際體系是否正走向多極化的當代案例。"},
];
