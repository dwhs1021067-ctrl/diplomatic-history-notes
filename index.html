<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3EAD3">
<title>近代外交史卷宗</title>
<style>
:root{
  --paper:#F3EAD3;
  --card:#FBF5E6;
  --line:#E0D3AC;
  --ink:#241F17;
  --slate:#5B6B7C;
  --vermillion:#B23A2E;
  --gold:#A9862F;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.6;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:24px 16px 40px}
.header{text-align:center;margin-bottom:18px}
.header h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:1px;margin:0}
.header p{font-size:12px;color:var(--slate);margin:4px 0 0}

.filters{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.filters button{
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:13px;font-weight:500;color:var(--ink);
}
.filters button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.header-row{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:18px}
.menu-btn{
  position:absolute;left:0;top:2px;width:36px;height:36px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:16px;color:var(--ink);
}
.search-btn{
  position:absolute;right:0;top:2px;width:36px;height:36px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--ink);
}
.search-panel{
  position:fixed;inset:0;background:var(--paper);z-index:70;display:none;
  flex-direction:column;padding:16px 16px 0;
}
.search-panel.on{display:flex}
.search-input-row{display:flex;gap:8px;margin-bottom:14px}
.search-input-row input{
  flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:15px;color:var(--ink);font-family:inherit;
}
.search-input-row button{
  padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:14px;color:var(--slate);
}
.search-results{flex:1;overflow-y:auto;padding-bottom:20px}
.search-result-item{
  padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;
}
.search-result-item .sr-type{
  font-size:10.5px;color:var(--gold);font-weight:500;margin-bottom:2px;
}
.search-result-item .sr-title{font-size:15px;font-weight:500;color:var(--ink)}
.search-result-item .sr-snippet{font-size:12.5px;color:var(--slate);margin-top:3px;line-height:1.5}
.search-empty{color:var(--slate);font-size:13px;text-align:center;padding:40px 20px}

.quiz-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;
}
.quiz-toggle button{
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:12.5px;color:var(--slate);
}
.quiz-toggle button.active{background:var(--vermillion);color:var(--paper);border-color:var(--vermillion)}
.reveal-btn{
  width:100%;padding:14px;border-radius:8px;border:1.5px dashed var(--gold);
  background:rgba(169,134,47,0.06);color:var(--gold);font-size:14px;font-weight:500;margin-top:10px;
}
.jumplink{color:var(--vermillion);border-bottom:1.5px dotted var(--vermillion);cursor:pointer;font-weight:500}

.sidebar-overlay{
  position:fixed;inset:0;background:rgba(36,31,23,0.4);display:none;z-index:60;
}
.sidebar-overlay.on{display:block}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:84%;max-width:340px;background:var(--paper);
  box-shadow:4px 0 20px rgba(36,31,23,0.25);overflow-y:auto;padding:18px 14px 40px;
  transform:translateX(-100%);transition:transform 0.22s ease;
}
.sidebar-overlay.on .sidebar{transform:translateX(0)}
.sidebar-title{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:14px;padding:0 4px}
.acc-item{margin-bottom:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.acc-head{
  width:100%;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:500;color:var(--ink);
}
.acc-head .arrow{transition:transform 0.15s;color:var(--slate);font-size:12px}
.acc-head.open .arrow{transform:rotate(90deg)}
.acc-body{display:none;padding:2px 0 6px}
.acc-body.open{display:block}
.acc-row{
  display:flex;gap:8px;align-items:baseline;padding:7px 14px;font-size:13px;
  border-top:1px solid var(--line);
}
.acc-row .yr{color:var(--slate);font-size:11.5px;min-width:64px;flex-shrink:0}
.acc-row .ttl{cursor:pointer;color:var(--ink)}
.acc-row .ttl:active{color:var(--vermillion)}
.acc-row.light .dotmark{color:var(--slate)}
.acc-row .dotmark{margin-right:2px;font-size:10px}
.cmp-row{padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.cmp-row .yr{color:var(--gold);font-weight:500;font-size:11.5px;margin-bottom:3px}
.cmp-row .pair{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.cmp-row .pair span{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;color:var(--ink)}
.cmp-row .note{color:var(--slate);line-height:1.5}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:20px 22px 22px;position:relative;
  box-shadow:0 1px 0 var(--line),0 6px 16px rgba(36,31,23,0.08);
}
.period-tag{
  position:absolute;top:-10px;left:18px;background:var(--ink);color:var(--paper);
  font-size:11px;padding:3px 10px;border-radius:2px;letter-spacing:0.5px;
}
.stamp{
  position:absolute;top:10px;right:16px;width:58px;height:58px;border-radius:50%;
  border:2px solid var(--vermillion);display:flex;align-items:center;justify-content:center;
  transform:rotate(-9deg);color:var(--vermillion);font-family:var(--serif);
  font-size:13px;font-weight:700;line-height:1.1;text-align:center;
}
.tag-light{
  position:absolute;top:14px;right:16px;padding:4px 10px;border:1.5px dashed var(--slate);
  color:var(--slate);font-size:11px;transform:rotate(5deg);font-weight:500;
}
.meta{margin-top:22px;margin-bottom:14px}
.year{font-size:13px;color:var(--slate);margin-bottom:2px}
.title{font-family:var(--serif);font-size:24px;font-weight:700}

.tabs{display:flex;gap:4px;margin-bottom:14px}
.tabs button{
  flex:1;padding:7px 4px;font-size:12.5px;border-bottom:2px solid transparent;
  color:var(--slate);font-weight:400;
}
.tabs button.active{border-bottom-color:var(--vermillion);color:var(--ink);font-weight:500}

.content{font-size:14.5px;line-height:1.85}
.content ul{margin:0;padding-left:18px}
.content li{margin-bottom:8px}
.term{color:var(--gold);border-bottom:1.5px dotted var(--gold);cursor:pointer;font-weight:500}
.theory-block{margin-bottom:12px}
.theory-label{font-family:var(--serif);color:var(--vermillion);font-weight:700;margin-right:4px}
.light-block{margin-bottom:14px}
.light-label{font-size:12px;color:var(--slate);font-weight:500;margin-bottom:4px}

.nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.nav button{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:14px;
}
.nav button:disabled{color:#C9BFA0;cursor:default}
.nav .counter{font-size:12.5px;color:var(--slate)}

.overlay{
  position:fixed;inset:0;background:rgba(36,31,23,0.35);display:none;
  align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.on{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:480px;border-top-left-radius:12px;
  border-top-right-radius:12px;padding:18px 22px 26px;border-top:3px solid var(--gold);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head .term-title{font-family:var(--serif);font-size:17px;font-weight:700}
.sheet-head button{font-size:18px;color:var(--slate)}
.sheet-body{font-size:14px;line-height:1.7;color:#3A3222}
</style>
</head>
<body>
<div id="app"></div>

<div class="search-panel" id="search-panel">
  <div class="search-input-row">
    <input type="text" id="search-input" placeholder="搜尋事件、理論、關鍵字…" autocomplete="off">
    <button id="search-close">取消</button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="term-title" id="term-title"></div>
      <button id="close-sheet">×</button>
    </div>
    <div class="sheet-body" id="term-body"></div>
  </div>
</div>

<script>
var GLOSSARY = {
  "治外法權": "指外國人在他國領土內，不受當地法律管轄，而依其本國法律受本國（通常是領事）審判的特權。",
  "最惠國待遇": "條約一方承諾給予另一方的優惠待遇，不得低於其給予任何第三國的待遇；若為片面最惠國待遇，則只有一方享有此保障，不對等。",
  "兩強標準": "19世紀英國海軍政策，要求英國海軍實力須維持在同時超過世界第二、第三強海軍國家總和的水準，以確保絕對制海權。",
  "光榮孤立": "19世紀英國長期奉行不與歐陸強權締結永久同盟的外交策略，依靠海上優勢與均勢外交自保，直到20世紀初因應德國崛起才改弦更張。",
  "修昔底德陷阱": "指崛起強權挑戰既有霸權地位時，雙方因結構性猜忌與安全焦慮而走向戰爭的傾向，典出古希臘史家修昔底德對雅典崛起引發斯巴達恐懼、導致伯羅奔尼撒戰爭的描述。常與金德柏格陷阱相提並論比較——本陷阱關注霸權更替引發戰爭的風險，金德柏格陷阱則關注霸權缺位導致國際公共財不足的風險，兩者皆涉及霸權興衰但關注面向不同，考古題常考這個對比。",
  "再保條約": "1887年俾斯麥與俄國私下簽訂的秘密條約，承諾德俄互不與第三國聯合對付對方，目的在防止俄國倒向法國，卻與德奧同盟的對俄防禦義務互相矛盾。",
  "邊緣策略": "冷戰時期由美國國務卿杜勒斯提出的核武嚇阻操作手法，主張在危機對峙中刻意將緊張情勢逐步升高、逼近戰爭邊緣，藉此展現己方承受風險的決心，迫使對手在最後關頭讓步，是一種高風險的心理博弈策略。1962年古巴飛彈危機是邊緣策略最經典的實踐案例——美蘇雙方一路升級對峙至核戰邊緣，最終在最後關頭達成秘密協議化解危機。",
  "扈從": "國際關係理論中，弱國選擇依附、追隨強權而非與之對抗的策略，目的是換取安全保障或利益分享，但也可能因此喪失自主性。",
  "安全困境": "指一國為求自保而增強軍備或勢力範圍，卻使他國感到威脅而跟進反應，雙方陷入擴張螺旋上升、最終誰都不更安全的困境。",
  "半主權國家": "國際法上主權遭部分侵蝕、但形式上仍保有國家地位的狀態，例如喪失關稅自主、司法自主或軍事駐紮權等部分主權要素，卻未完全淪為殖民地。",
  "資本輸出": "列寧帝國主義論核心概念，指資本主義發展到壟斷階段後，資本家將過剩資本輸往海外投資設廠、承包礦權鐵路等，而非僅輸出商品，是帝國主義擴張的經濟動力。",
  "文明標準": "19世紀西方國際法用以區分是否被視為平等主權國家的資格判准，依政治制度、法律體系是否符合西方標準決定，常被用作合理化不平等條約與治外法權的依據。",
  "保民義舉": "1874年《中日北京專約》用以描述日本出兵台灣行動的措辭，清廷原意僅為賠款了事，卻被日本引申為間接承認其對琉球擁有宗主權的法理依據，是外交辭令模糊性遭利用的經典案例。",
  "離岸平衡者": "現實主義理論中，指海權強國不直接以陸軍長期介入大陸事務，而是利用地理與海權優勢，靠外交手段、財政資助等方式扶植其他陸權國家相互制衡，自身保持較低直接介入成本的策略角色，英國在近代歐陸多次扮演此角色。",
  "近東問題": "19世紀歐洲外交用語，指鄂圖曼帝國（土耳其）國力衰弱後，其龐大領土（尤其巴爾幹半島、黑海海峽）成為列強競逐勢力範圍的焦點，涉及俄國南下擴張野心、英法維持地中海與印度航線利益、以及巴爾幹諸民族獨立運動等多重矛盾，是19世紀歐洲外交的核心議題之一，也是第一次世界大戰爆發的遠因。",
  "大賽局": "19世紀英俄兩國圍繞中亞地區（阿富汗、波斯、中亞汗國）展開的地緣政治角力與情報諜報競逐，英國憂心俄國勢力南下威脅其在印度的核心殖民利益，俄國則持續向中亞擴張版圖，雙方長期維持緊張但未直接兵戎相見的對峙態勢，直到1907年《英俄協約》劃定波斯、阿富汗、西藏勢力範圍才告一段落。與近東問題同屬19世紀英俄矛盾的兩大戰場，但近東問題聚焦巴爾幹半島與黑海海峽，大賽局則聚焦中亞內陸，地理範圍與具體爭議點不同，不宜混淆。",
  "鐵血政策": "俾斯麥用以描述其統一德意志戰略路線的著名說法，主張唯有透過軍事實力（鐵）與戰爭（血），而非國會演說與多數決議，才能真正解決當代重大問題、完成德意志統一大業，是俾斯麥現實政治風格的代名詞。",
  "歐洲協商": "1815年維也納會議後由英俄普奧（後納入法國）五強建立的多邊外交機制，透過定期召開會議協調處理重大國際爭端，取代各國各自為政的做法，是近代史上最早接近集體安全雛形的國際合作嘗試。",
  "委任統治": "一戰後國際聯盟創設的殖民地託管制度，名義上由戰勝國代表國際聯盟監督管理戰敗國原殖民地、協助當地邁向自治，實質上仍延續殖民統治邏輯，是理解兩戰間期國際法進步表象、實質延續特性的重要案例。",
  "姑息政策": "指1930年代英法對德、義、日等修正主義強權的擴張行為採取退讓妥協的外交策略，幻想以滿足其部分領土或政治要求來換取和平，最著名案例為1938年慕尼黑會議對希特勒兼併捷克蘇台德區的讓步，結果非但未能阻止戰爭，反而助長侵略野心。",
  "囂張特權": "法國財政部長季斯卡（後為法國總統）於1960年代用以批評美元作為國際準備貨幣所享有的特殊優勢的用語，指美國得以用本國貨幣直接融通對外貿易逆差與債務，不像其他國家須以外匯儲備支付進口與償債，形同免費享有全球其他國家提供的鑄幣特權。",
  "亞羅號事件": "1856年英國商船亞羅號在廣州遭清朝官員登船搜查、扣押船員，並扯下船上懸掛的英國國旗，英國以此為藉口出兵，是第二次鴉片戰爭的導火線之一。",
  "馬神甫事件": "法國傳教士馬賴神父違法進入廣西內地傳教，遭當地官員處死，法國以此為藉口聯合英國出兵，是第二次鴉片戰爭的另一導火線。",
  "馬尾海戰": "1884年中法越南戰爭期間，法國艦隊突襲福建馬尾軍港，福建水師（自強運動海防建設成果之一）幾乎全軍覆沒，暴露清廷海防建設重硬體購置、輕整體戰略協調的脆弱性。",
  "埃姆斯電報事件": "1870年普魯士國王威廉一世與法國大使在埃姆斯的會談內容，經俾斯麥刻意刪改、改寫得更具挑釁意味後公開發布，藉此激怒法國輿論與政府，是俾斯麥操作輿論、誘使法國主動對普宣戰的著名外交操作案例。",
  "色當戰役": "1870年普法戰爭中的關鍵戰役，法軍在色當遭普軍圍殲，法皇拿破崙三世本人被俘投降，直接導致法蘭西第二帝國瓦解、改建第三共和。",
  "巴巴羅薩行動": "1941年納粹德國入侵蘇聯的軍事行動代號，是希特勒撕毀德蘇互不侵犯條約、開闢東線戰場的行動，也是二戰規模急遽擴大的關鍵轉折。",
  "耆英": "清朝宗室官員，鴉片戰爭後負責代表清廷簽訂《南京條約》《虎門條約》《中美望廈條約》《中法黃埔條約》四項條約，是當時與西方國家談判的最高官員，被部分學者稱為中國史上第一位外交部長。",
  "紐倫堡大審": "1945至1946年同盟國在德國紐倫堡對納粹戰犯進行的國際軍事法庭審判，是近代國際法首次系統性追究國家領導人戰爭罪責與危害人類罪的重要先例，對後續國際刑事法的發展影響深遠。",
  "關東都督府": "日俄戰爭後，日本於1906年在遼東半島設立的殖民統治機關，設於旅順，統轄關東州（旅順大連租借地）及南滿鐵路沿線事務，兼具行政與軍事職能，是日本經營中國東北的核心據點，關東軍即由此發展而來。",
  "台灣民主國": "1895年馬關條約割台消息傳出後，台灣官紳為求自保、避免被日本視為清廷直接抵抗，短暫成立的政權，推舉巡撫唐景崧為總統，但唐景崧與大批官員在日軍登陸後迅即逃亡，實際抵抗轉由丘逢甲、劉永福等人領導的地方義勇軍持續，最終不敵日軍優勢兵力，台灣全島於1895年底淪為日本殖民地，直至1945年二戰結束才光復。",
  "王寵惠": "中華民國第一位派任至常設國際法院（Permanent Court of International Justice）擔任法官的外交家與法學家，對我國近代國際法發展貢獻卓著，是近代中國參與國際司法體系的重要指標人物。",
  "金德柏格陷阱": "指當既有霸權國家能力衰退、卻無新興強權願意或有能力承接提供國際公共財（如維持自由貿易秩序、最後貸款人角色）的責任時，國際體系將出現公共財供給真空，導致經濟秩序混亂甚至危機，常與修昔底德陷阱相提並論——修昔底德陷阱關注霸權更替引發戰爭的風險，金德柏德陷阱則關注霸權缺位導致國際公共財不足的風險，兩者關注面向不同，常考對比題。",
  "全球治理": "指並非由單一「世界政府」主導，而是由國家、國際組織、區域組織、非政府組織、跨國企業等多元行為者共同參與，針對跨國界問題（如氣候變遷、公共衛生、金融穩定等）尋求解決方案的治理模式，核心目標是追求「善治」與人類永續發展，強調不等於建立全球政府。",
  "去風險化": "近年美歐對中國經濟政策的新論述，主張降低對單一國家（尤其中國）供應鏈的過度依賴風險、強化關鍵產業自主生產能力、多元發展貿易夥伴，但不以單純降低生產成本為優先考量，與更激進的「脫鉤」（decoupling，完全切斷經濟往來）在程度與定位上有所區別，是近年美中經貿關係分析的常用框架。",
  "AUKUS": "2021年由澳洲、英國、美國三國組成的印太安全夥伴關係，目的之一是協助澳洲取得核子動力潛艦技術，成立時澳洲總理為莫里森（非後來的艾班尼斯），被北京批評為冷戰思維的延續。",
  "QUAD": "四方安全對話，由美國、日本、印度、澳洲四國組成的印太安全合作機制，2007年由日本首相安倍晉三發起，一般被認為具有圍堵中國崛起的戰略意涵，不包含南韓。",
  "五眼聯盟": "由美國、英國、加拿大、澳洲、紐西蘭五個英語系國家組成的情報共享聯盟，源於冷戰時期的通訊情報合作協議，是西方陣營最核心的情報合作機制之一，不包含南非等國。",
  "CPTPP": "跨太平洋夥伴全面進步協定，由跨太平洋夥伴協定（TPP）在美國退出後演變而來的區域貿易協定，涵蓋智慧財產權保護等高標準規範，主要推動者為日本，美國並非成員國。",
  "RCEP": "區域全面經濟夥伴協定，由東協十國加中國、日本、韓國、澳洲、紐西蘭共同組成的全球最大自由貿易協定，印度曾參與談判但最終退出，並未加入。",
  "印太經濟架構": "IPEF，美國主導、不涉及傳統關稅減讓的印太區域經濟合作框架，聚焦供應鏈韌性、乾淨能源、反貪腐等議題，越南、澳洲等國同時也是CPTPP成員，展現部分國家同時參與多個經濟合作機制的現象。",
  "上海合作組織": "由中國、俄羅斯及中亞多國組成的區域安全與經濟合作組織，秘書處設於北京，工作語言為漢語與俄語（非英語），印度、巴基斯坦、白俄羅斯等國陸續加入為正式成員，蒙古僅為觀察員國。",
  "金磚國家": "BRICS，最初指巴西、俄羅斯、印度、中國、南非五個新興經濟體組成的合作機制，近年持續擴大納入更多新興市場國家，部分成員國（如巴西）同時也是二十國集團（G20）成員，展現新興經濟體在全球治理中角色的提升。",
  "GCTF": "全球合作暨訓練架構，台灣與美國於2015年簽署備忘錄成立的國際合作平台，主要宗旨是拓展台灣的國際參與空間，已針對公共衛生、執法合作、婦女賦權、資訊安全、人道援助等議題舉辦國際研習營，日本、澳洲、加拿大等國陸續成為正式夥伴國。"
};

var EVENTS = [
  {id:"opium-war",region:"china",period:"①朝貢體系瓦解期 1839–1860",year:"1839–1842",title:"鴉片戰爭",spec:"core",
    narrative:"中英貿易逆差、林則徐虎門銷煙，英國艦隊北上，清廷戰敗，1842年簽訂《南京條約》，割香港島、開五口通商、廢公行、協定關稅。隔年《虎門條約》確立{{治外法權}}、片面{{最惠國待遇}}。",
    knowledge:["《南京條約》：割香港島、開五口通商、廢公行、協定關稅、賠款2100萬銀元","《虎門條約》確立{{治外法權}}、片面{{最惠國待遇}}，是不平等條約體系核心機制","南京條約未明文鴉片貿易合法化，也未規定公使駐京，成為第二次鴉片戰爭導火線之一","負責簽訂《南京條約》《虎門條約》《望廈條約》《黃埔條約》四約的清朝談判代表{{耆英}}，被部分學者稱為中國史上第一位外交部長"],
    theory:[{label:"建構主義",text:"視角最貼近考古題方向：清朝朝貢體系認知與英國西發里亞主權體系互不相容，是兩套世界觀相撞。"},{label:"現實主義",text:"角度可談英國海權硬實力代差。"},{label:"依賴理論／IPE",text:"角度：協定關稅標誌中國被編入資本主義世界體系邊陲。"},{label:"國際公法",text:"角度：{{治外法權}}為{{文明標準}}下治外法權的典型適用。"}]},
  {id:"taiping",region:"china",period:"①朝貢體系瓦解期 1839–1860",year:"1851–1864",title:"太平天國",spec:"light",
    narrative:"洪秀全創拜上帝會，1851年金田起義建號太平天國，1853年定都天京。清廷依靠曾國藩湘軍、李鴻章淮軍及常勝軍長期圍剿，1864年天京陷落，太平天國覆滅。",
    causal:"與第二次鴉片戰爭同時期發生，是清廷內憂外患夾擊的典型案例。湘軍淮軍崛起為後續自強運動提供人才與武力基礎。"},
  {id:"arrow-war",region:"china",period:"①朝貢體系瓦解期 1839–1860",year:"1856–1860",title:"第二次鴉片戰爭",spec:"core",
    narrative:"列強不滿修約受阻，藉{{亞羅號事件}}（英）、{{馬神甫事件}}（法）出兵；1858簽《天津條約》，換約引發衝突再起，1860英法聯軍攻入北京、火燒圓明園，簽《北京條約》。同一期間，俄國雖未直接參戰，卻以調停者身分居中斡旋，趁機分別於1858年（《璦琿條約》）、1860年（對俄《北京條約》）取得外東北大片領土，成為此役實質獲利最大者。",
    knowledge:["增開多口通商（含長江沿岸、天津）、公使駐京、鴉片貿易合法化、允許內地遊歷傳教、割九龍半島予英","俄國取得外東北領土面積達百萬平方公里以上，是近代中國一次性喪失領土最多的個案——常被忽略但常考","傳教士內地自由傳教權成為後續教案頻傳、義和團遠因","《璦琿條約》（1858）的清方簽約代表是黑龍江將軍奕山，並非李鴻章——112年三等第16題曾以李鴻章作為錯誤選項的陷阱"],
    theory:[{label:"現實主義",text:"為最貼近考古題方向：俄國不戰而獲最大利益，是搭便車與離岸平衡的經典操作。俄國之所以在此時特別積極介入中國事務、不動一兵一卒取得外東北巨大領土，與其同時期在[[west|crimean-war|克里米亞戰爭]]中戰敗、被迫接受黑海中立化、西向擴張路線受阻直接相關——俄國西邊碰壁，遂將擴張能量轉向東邊此時正陷於英法聯軍夾擊、無暇他顧的中國，是西堵東進策略轉向的經典案例。"},{label:"自由主義（制度面）",text:"角度：公使駐京、增開口岸可視為列強推動外交常態化制度框架，惟屬強制性輸出而非自願建制。"},{label:"依賴理論／IPE",text:"角度：鴉片貿易合法化＋內地傳教權，代表滲透從口岸擴張至內地。"},{label:"外交史方法論",text:"角度：亞羅號、馬神甫事件屬能動性層次的偶發藉口，修約需求的結構性壓力才是戰爭真正動因。"}]},
  {id:"xinjiang-recovery",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1864–1881",title:"新疆回變與收復、伊犁交涉",spec:"core",
    narrative:"1864年新疆爆發回變，中亞浩罕國將領阿古柏趁機東來，建立政教合一的哲德沙爾汗國，並獲得英國、鄂圖曼帝國承認，新疆面臨脫離中國版圖的危機。清廷內部曾爆發「海防與塞防之爭」，李鴻章主張放棄新疆專注海防，左宗棠則力主西征收復，最終獲清廷採納。1875年左宗棠奉命督辦新疆軍務，採取「緩進急戰、先北後南」戰略，1877年大破阿古柏勢力，阿古柏兵敗身亡，新疆大部收復。然而伊犁地區在回變期間已遭俄國以「代為保管」名義出兵佔領，清廷派崇厚赴俄談判，崇厚簽訂的《里瓦幾亞條約》大幅喪失伊犁周邊領土及通商特權，引發朝野嘩然，清廷拒絕批准並將崇厚治罪。清廷改派曾紀澤（曾國藩之子）赴聖彼得堡重新談判，1881年簽訂《伊犁條約》（改訂條約），雖仍割讓部分領土，但成功爭回伊犁主要城區及較有利的通商條件，是近代中國少數透過外交談判「爭回」部分權益的案例。1884年，清廷於新疆正式建省，加強中央對邊疆的直接管轄。",
    knowledge:["「海防塞防之爭」是清末國防戰略辯論的經典案例：李鴻章代表海防優先觀點，左宗棠代表塞防（陸權）優先觀點，最終清廷採取「海塞並重」的折衷政策","左宗棠西征收復新疆，是晚清少見的軍事成功案例，展現地方督撫在中央財政困窘下仍能自籌軍餉、完成邊疆平亂的能力","崇厚簽訂的《里瓦幾亞條約》喪權過鉅，清廷拒絕批准並改派曾紀澤重新談判，是近代中國外交史上罕見的「拒籤重談」案例","曾紀澤透過外交談判爭回伊犁主要城區，是近代不平等條約體系下少數透過談判成功挽回權益的個案，常考「曾紀澤修約」的具體成果","1884年新疆建省，反映清廷對邊疆治理從羈縻統治轉向直接行政管轄的轉型"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：海防塞防之爭本質是資源有限下的戰略優先順序辯論，左宗棠西征的成功也展現「地緣鄰接的陸權威脅不能單純用海權思維忽視」。"},{label:"國際公法",text:"角度：崇厚條約與伊犁條約的落差，展現「條約需經批准生效」的國際法原則如何在近代中國外交實踐中被運用以爭取談判空間，是近代國際法「條約締結程序」的實例教材。"},{label:"外交史方法論",text:"角度：曾紀澤的成功談判展現個人外交能力（能動性層次）在既有國力弱勢（結構層次）下仍能發揮一定作用的案例，不宜將近代中國外交史簡化為「純粹被動挨打」的敘事。"},{label:"地緣政治",text:"角度：新疆問題本質是俄國南下擴張與英國防範俄國威脅印度（大博弈，The Great Game）兩大帝國勢力在中亞交會的縮影，可與後續日俄戰爭的地緣政治邏輯相互呼應。"}]},
  {id:"burlingame-mission",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1867–1875",title:"蒲安臣使團與早期近代外交建制",spec:"light",
    narrative:"1861年英法聯軍後，清廷設立總理各國事務衙門，是中國第一個專責處理對外事務的中央機構，象徵近代外交建制的起步。1867年，恭親王奕訢上奏推薦卸任的美國駐華公使蒲安臣，由其擔任中國首任全權使節（辦理中外交涉事務大臣），代表中國出使美、英、法、普、俄等國，是中國首次近代外交活動，蒲安臣在美期間代表清廷簽訂《蒲安臣條約》，確立中美互不干涉內政、對等交往的原則。1875年，因馬嘉理事件（英國探勘雲南的翻譯官馬嘉理在滇緬邊境遇害），清廷派郭嵩燾親赴英國道歉，郭嵩燾隨後出任中國首任駐英公使，其出使日記《使西紀程》是第一部系統介紹英國憲政制度的中文著作，但因書中對西方文明的正面描述觸怒保守士大夫，遭清廷下令禁毀，郭嵩燾本人也因此備受抨擊、鬱鬱而終，反映當時朝野對西方認識的巨大落差。",
    causal:"這段時期是中國近代外交建制從無到有的起步階段，與同一時期自強運動的器物層次改革相呼應，展現清廷嘗試學習西方外交遊戲規則的努力，但郭嵩燾遭禁毀著作、抑鬱而終的遭遇，也預示了後續戊戌變法等更深層制度改革所將面臨的巨大保守阻力，可視為戊戌變法事件的更早期伏筆。"}
,
  {id:"ryukyu",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1871–1879",title:"牡丹社事件與琉球問題",spec:"core",
    narrative:"1871年琉球宮古島漁民漂流至台灣南部，遭當地原住民殺害54人。日本以琉球為己藩屬為由向清廷交涉，清廷以「生番化外之地」回應。日本藉此於1874年出兵台灣南部，清廷透過英國調停，與日本簽訂《北京專約》，承認日本此次出兵為{{保民義舉}}，並付款換取日軍撤兵。此協議被日本解讀為清廷間接承認其對琉球的宗主權。1879年，日本正式廢琉球藩、改設沖繩縣，完全併吞琉球王國。",
    knowledge:["{{保民義舉}}字眼是關鍵外交陷阱——清廷原意只是賠款了事，卻被日本引申為承認宗主權轉移的法理依據","牡丹社事件是台灣近代化的直接催化劑：沈葆楨來台加強海防、推動開山撫番，並促成1885年台灣建省","琉球原為明清朝貢國，同時向日本薩摩藩納貢形成兩屬格局，1879年後兩屬體制終結","是甲午戰爭前20年中日在台灣、琉球、朝鮮的第一場正面角力"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：日本利用清廷化外之地的模糊表態，精準操作國際法語言完成實質宗主權轉移。"},{label:"建構主義",text:"角度：琉球兩屬體制是朝貢體系彈性主權觀的產物，西方一國一主權體系傳入後此模糊狀態不可持續。"},{label:"國際公法",text:"角度：{{保民義舉}}承認可視為國際法上的默示承認，是研究外交辭令法律效力的經典教材。"},{label:"地緣政治",text:"角度：台灣、琉球、朝鮮構成日本大陸政策向外擴張的第一島鏈起點。"}]},
  {id:"sino-french-war",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1884–1885",title:"中法越南戰爭",spec:"core",
    narrative:"越南長期為清朝傳統屬國，法國自19世紀中葉起逐步蠶食越南，同治年間已實際控制越南南部（交趾支那）及中部。1883年法國進一步壓迫越南簽訂《順化條約》，將越南納為保護國，直接挑戰清朝對越南的宗主權，中法關係急遽惡化。清廷內部對是否出兵援越意見分歧，最終決定出兵支援黑旗軍（劉永福率領的華人武裝力量）及清軍協同抵抗法軍。1884年，法國艦隊突襲福建馬尾軍港，重創新建的福建水師（{{馬尾海戰}}）；同年法軍進犯台灣，砲擊基隆並封鎖台灣海岸，時任台灣防務大臣劉銘傳指揮清軍在滬尾（淡水）擊退法軍登陸企圖，成功保住台灣本島未失守。1885年，清軍在廣西提督馮子材率領下於鎮南關大敗法軍（鎮南關大捷），法軍被迫撤退，是清廷難得的軍事勝利。然而，清廷在軍事佔優的情況下卻選擇議和（李鴻章主導），與法國簽訂《中法新約》（天津條約），承認法國對越南的保護權，越南自此脫離中國傳統朝貢體系，成為法屬印度支那的一部分。",
    knowledge:["同治年間法國已控制越南中南部，是理解中法戰爭爆發背景的重要時序基礎——常考的年代定位題","{{馬尾海戰}}（1884）中，福建水師（自強運動海防成果之一）幾乎全軍覆沒，暴露自強運動海防建設的脆弱性","劉銘傳負責台灣防務、成功擊退法軍滬尾登陸，是台灣建省（1885）前的重要軍事貢獻，與牡丹社事件後沈葆楨的台灣近代化建設一脈相承","鎮南關大捷（馮子材，1885）是清廷對外戰爭中少數的軍事勝利，卻仍在「不敗而和」的情況下簽訂喪權條約，是理解晚清外交決策「軍事勝利不必然轉化為談判籌碼」的經典弔詭案例","《中法新約》承認法國保護越南，越南脫離中國朝貢體系，是繼琉球（1879）之後，清朝朝貢體系再失一藩的重要指標"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：鎮南關大捷後清廷仍主動求和，展現決策者（李鴻章）個人的保守求穩心態（能動性層次）如何凌駕於戰場實際優勢（結構層次）之上，是分析「軍事勝利與外交談判籌碼未必成正比」的經典案例。"},{label:"現實主義",text:"角度：法國藉鄂圖曼式的「蠶食」策略逐步併吞越南，展現弱小屬國在強權環伺下難以維持傳統宗主保護關係的無力，也呼應了同期新帝國主義列強瓜分殖民地的整體時代背景。"},{label:"建構主義",text:"角度：清廷對越南的宗主權建立在朝貢體系的階序認知之上，而法國的保護國主張則是西方主權讓渡條約的邏輯，兩者對「宗主權」性質的認知落差，是朝貢體系與條約體系交界處的又一具體案例，可與牡丹社事件、琉球問題的分析框架相互呼應。"},{label:"比較政府與政治",text:"角度：福建水師在馬尾海戰的潰敗，可與北洋水師十年後在甲午戰爭的覆滅相互比較，兩者都暴露自強運動「重硬體購置、輕整體戰略協調與後勤訓練」的制度性缺陷。"}]}
,
  {id:"sino-japanese",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1894–1895",title:"甲午戰爭",spec:"core",
    narrative:"朝鮮長期是清朝傳統屬國，1882年壬午兵變、1884年甲申政變已顯示日本勢力積極介入朝鮮內政。1894年朝鮮爆發東學黨起義，農民軍攻陷全州，朝鮮國王請求清廷依屬國體制出兵助剿。清廷依1885年《天津條約》知會日本後出兵，日本卻援引同一條約的共同出兵權，藉口保護僑民同時大舉派兵入朝，並在停戰後拒絕撤兵，反而強佔朝鮮王宮、扶植親日政權。1894豐島海戰、平壤之戰、黃海海戰，1895威海衛之戰北洋艦隊全滅，簽《馬關條約》。條約簽訂後，俄法德三國以干涉還遼為由聯合施壓，迫使日本歸還遼東半島，日本則獲清廷追加贖遼費3000萬兩補償；此舉直接誘發1897–98年列強競相劃分在華勢力範圍的熱潮。",
    knowledge:["1885年《天津條約》規定中日雙方出兵朝鮮須互相知會（共同出兵權）——日本正是利用此條款取得出兵朝鮮的法理依據","《馬關條約》：承認朝鮮獨立、割遼東半島/台灣/澎湖、賠款2億兩、開沙市重慶蘇州杭州、允許日本在華設廠（象徵{{資本輸出}}時代開始）","三國干涉還遼（1895）是甲午戰後到八國聯軍間關鍵過渡環節，直接連結1897–98瓜分勢力範圍熱潮","割台消息傳出後，台灣官紳為求自保、避免被日本視為清廷直接抵抗，於1895年5月宣布成立「{{台灣民主國}}」，推舉巡撫唐景崧為總統，然而唐景崧與大批官員在日軍登陸後迅即逃亡，抵抗實際由丘逢甲、劉永福等人領導的地方義勇軍持續至同年10月，最終不敵日軍優勢兵力而告終，台灣全島淪為日本殖民地直至1945年"],
    theory:[{label:"現實主義",text:"為最貼近考古題方向，尤其三國干涉還遼：日本挑戰東亞傳統中心構成權力轉移，三國干涉還遼為權力平衡教科書案例。"},{label:"民族主義",text:"角度：日本以戰勝完成國族建構驗收，中國戰敗則刺激知識菁英從天朝意識轉向民族危機意識。"},{label:"依賴理論／IPE",text:"角度：允許日本設廠象徵列強對華侵略由商品輸出轉向{{資本輸出}}，可嫁接列寧帝國主義論。"},{label:"比較政府與政治",text:"角度：可比較日本明治維新中央集權式現代化 vs 清朝洋務運動局部現代化的成果檢驗。"},{label:"外交史方法論",text:"角度：東學黨起義屬能動性層次的偶發導火線，清日對朝鮮宗主權的結構性競逐才是戰爭根本動因。"}]},
  {id:"sino-russian-secret",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1896",title:"中俄密約",spec:"core",
    narrative:"甲午戰敗後，清廷面臨日本崛起威脅，加上三國干涉還遼讓清廷誤判俄國為可靠盟友。1896年沙皇尼古拉二世加冕，李鴻章赴俄祝賀，俄國財政大臣維特趁機密商，雙方簽訂《中俄禦敵互相援助條約》。條約表面是軍事同盟，實際核心是換取俄國修築中東鐵路連接西伯利亞鐵路，俄國可在戰時使用中國口岸，鐵路沿線享有實質管轄權。",
    knowledge:["密約名為共同防日，實為李鴻章聯俄制日戰略下的產物，也暴露此策略過度信任單一強權、反而引狼入室的致命弱點","中東鐵路成為俄國深入東北的合法管道，鐵路沿線護路駐軍權成為後續佔領東北的法理依據","直接鋪路1897–98年瓜分危機，也是日俄戰爭（1904–05）根本遠因"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：這是聯合次強制衡新興強權的{{扈從}}策略操作，卻是教科書等級的失敗案例——最終引狼入室。"},{label:"外交史方法論",text:"角度：適合做決策層次分析——李鴻章個人判斷、清廷體系層次的戰略困境、國際體系層次的權力真空。"},{label:"依賴理論／IPE",text:"角度：中東鐵路是近代中國第一個由外國全權掌控、深入內陸腹地的大型基礎建設特許權。"}]},
  {id:"jiaozhou",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1897–1898",title:"膠州灣事件／瓜分危機",spec:"core",
    narrative:"1897年山東發生巨野教案（又稱曹州教案），德國藉口出兵強佔膠州灣，隔年強迫清廷簽訂《中德膠澳租界條約》，租借膠州灣99年並取得山東鐵路修築權及礦權。德國此舉引發連鎖效應：俄國強租旅順大連、英國強租威海衛及九龍新界、法國強租廣州灣。短短兩年內中國沿海精華地帶被劃分為列強勢力範圍，史稱瓜分危機。",
    knowledge:["租借地與割讓不同：租借地名義上主權仍屬中國，但實際上是列強獨佔的勢力範圍","四強租借地及期限：德國膠州灣（99年）、俄國旅大（25年）、英國威海衛+九龍新界（99年）、法國廣州灣（99年）","瓜分勢力範圍大致劃分：法國主要在西南（雲南、廣西、廣東西南部）、英國主要在長江流域、德國主要在山東與黃河流域、俄國主要在長城以北與東北——常考的省份配對題","瓜分危機是美國門戶開放政策（1899）真正的近因，比義和團事件更早，但門戶開放照會僅獲列強模糊、原則性回應，並未獲得所有國家明確一致同意"],
    theory:[{label:"現實主義",text:"最貼近：列強瓜分是純粹的勢力範圍競逐，體現無政府狀態下的{{安全困境}}——德國一動，俄英法立即跟進。"},{label:"國際公法",text:"角度：租借地法律性質模糊，適合深入談主權與治理權分離概念。"},{label:"依賴理論／IPE",text:"角度：勢力範圍瓜分將中國經濟版圖依附於不同列強資本，是基礎建設邊陲化。"},{label:"自由主義／國際制度",text:"角度：美國門戶開放政策正是對這波瓜分危機的直接回應。"}]},
  {id:"hundred-days",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1898",title:"戊戌變法",spec:"light",
    narrative:"甲午戰敗刺激，康有為梁啟超公車上書。1898年光緒帝頒布變法詔書（百日維新），推動政治教育軍事改革。慈禧發動戊戌政變，光緒被幽禁，變法失敗，僅103天。",
    causal:"直接由甲午戰敗刺激而起。變法失敗間接強化保守排外勢力主導地位，為兩年後義和團事件埋下政治伏筆。"},
  {id:"boxer",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1900–1901",title:"八國聯軍",spec:"core",
    narrative:"列強劃分勢力範圍引發民間反抗，義和團扶清滅洋興起，慈禧一度利用義和團向列強宣戰；1900義和團攻擊教堂與使館區，八國聯軍攻入北京，慈禧光緒西逃，1901簽《辛丑條約》。美國同時期另外提出門戶開放政策，主張維持中國領土行政完整，與其他列強持續劃分勢力範圍的做法形成路線分歧。",
    knowledge:["《辛丑條約》未割地但性質最嚴重：賠款4.5億兩、使館區劃界駐兵、拆大沽炮台准列強駐軍京津沿線、禁止科舉考試地區停考五年","門戶開放政策代表列強策略出現保全中國以共同宰制與持續劃分勢力範圍兩條路線的分歧"],
    theory:[{label:"自由主義／國際制度",text:"角度為最貼近考古題方向：美國門戶開放主張機會均等，代表列強對華策略出現路線分歧。"},{label:"現實主義",text:"角度：辛丑條約使館駐兵、拆炮台，本質為確保對清廷軍事嚇阻與武力投射管道常態化。"},{label:"民族主義",text:"角度（反向案例）：義和團為排外民間民族主義，被慈禧工具化對抗列強，卻缺乏現代國家組織能力而慘敗。"},{label:"國際公法",text:"角度：辛丑條約未割地但透過賠款駐軍達成實質主權侵蝕，適合連結{{半主權國家}}概念。"},{label:"依賴理論／IPE",text:"角度：庚子賠款規模為條約體系對中國財政的終極壓榨，屬邊陲化的財政面終點案例。"}]},
  {id:"russo-japanese",region:"china",period:"③清末新政與辛亥革命轉型期 1901–1912",year:"1904–1905",title:"日俄戰爭",spec:"core",
    narrative:"甲午戰爭後俄國藉三國干涉還遼取得在華影響力，義和團事件期間俄國藉口保護中東鐵路出兵佔領東北全境，事後拒絕撤軍。1902年英日同盟簽訂，日本於1904年不宣而戰突襲旅順俄艦，爆發日俄戰爭。戰爭主要在中國東北領土上進行，日本海軍其後全殲俄國波羅的海艦隊，雙方於美國調停下簽訂《朴茨茅斯條約》，日本取得旅順大連租借權、南滿鐵路及庫頁島南半部。",
    knowledge:["戰爭在中國領土進行，交戰雙方均非中國，清廷宣布局外中立，凸顯清末主權淪喪的極致","《朴茨茅斯條約》由美國總統老羅斯福出面調停，老羅斯福因此獲得1906年諾貝爾和平獎","日俄戰爭確立日本在滿洲南部及朝鮮半島的優勢地位，直接鋪路1910年日本正式併吞朝鮮"],
    theory:[{label:"現實主義",text:"最貼近：典型的權力平衡與同盟政治操作——英國透過英日同盟扶植日本制衡俄國，戰爭結果直接促成英俄從對立走向合作。"},{label:"建構主義／民族主義",text:"角度：日本戰勝震撼全球，是非白人國家首次擊敗歐洲列強的象徵性事件，顛覆當時普遍的{{文明標準}}種族階序認知。"},{label:"國際公法",text:"角度：清廷局外中立宣告極具諷刺性——自己領土上被兩個外國交戰，自己卻無實質主權可介入。"},{label:"外交史方法論",text:"角度：適合做層次分析——體系層次、國家層次、個人層次。"}]},
  {id:"xinhai",region:"china",period:"③清末新政與辛亥革命轉型期 1901–1912",year:"1911",title:"辛亥革命",spec:"light",
    narrative:"清廷推行清末新政但步調緩慢，皇族內閣引發立憲派失望；各地保路運動引發社會動盪；1911年武昌起義爆發，各省紛紛獨立響應。1912年1月孫中山就任臨時大總統，2月宣統帝退位，清朝覆滅。",
    causal:"直接銜接戊戌變法失敗後保守派掌權的脈絡，可視為制度層次改革失敗這條主線的最終爆發。清朝瓦解直接觸發列強在邊疆地區的連鎖反應，這條線索留待民初外交時期再展開。"},
  {id:"mongolia-tibet-1911",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1911–1914",title:"民初邊疆問題：外蒙獨立與西姆拉條約",spec:"core",
    narrative:"辛亥革命爆發、清朝統治瓦解之際，外蒙古在俄國支持下於1911年宣布獨立，推舉哲布尊丹巴呼圖克圖為大汗，建立大蒙古國。1913年中俄簽訂協議，俄國承認外蒙古為中國宗主權下的自治領土，中國承認外蒙古自治，形成一種模糊的過渡狀態。西藏方面，英國自19世紀末即積極介入，1904年英軍入侵拉薩，迫使西藏簽訂《英藏條約》；1906年《中英續訂藏印條約》中，英國承認清朝對西藏的宗主權。清朝瓦解後，英國藉機於1913–14年召集中、英、藏三方於印度西姆拉召開會議，英國代表麥克馬洪提議劃定西藏與印度之間的邊界線（麥克馬洪線），並主張將西藏劃分為內藏、外藏，大幅削弱中國對西藏的實質主權。中國代表雖於會議上簽字，但北京政府事後拒絕正式批准《西姆拉條約》，故此條約及麥克馬洪線在中國歷屆政府立場上始終不被承認。",
    knowledge:["外蒙古問題與西藏問題是同一時期由不同列強（俄國、英國）分別操作的邊疆危機，共同特徵是都利用中國政權更迭的空窗期介入","《西姆拉條約》北京政府簽字但拒絕批准，是近代中國外交史上另一個以程序性抵抗保留法理立場的案例，可與曾紀澤修約案例做對照比較","麥克馬洪線至今仍是中印邊界爭議的歷史根源"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：俄、英分別在外蒙、西藏複製利用中央政權真空期擴張勢力範圍的操作模式，與同時期日本在滿蒙的擴張邏輯相互呼應。"},{label:"國際公法",text:"角度：簽字但未批准凸顯近代國際法中條約生效程序如何被弱國用作保留法理立場的最後防線。"},{label:"外交史方法論",text:"角度：適合做中央政權更迭的空窗期如何被外部強權利用的結構性分析，可與辛亥革命事件的與主線因果連結相互呼應。"}]},
  {id:"21-demands",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1915",title:"二十一條要求",spec:"core",
    narrative:"一戰爆發後，日本藉英日同盟對德宣戰，出兵佔領德國在山東的租借地膠州灣及青島，取代德國成為山東的實質控制者。1915年1月，日本駐華公使向袁世凱政府提出二十一條要求，分為五號：第一號要求承認日本繼承德國在山東的一切權益；第二號要求延長旅順大連及南滿、安奉鐵路租期至99年，並給予日本在南滿、東蒙的優越經濟地位；第三號涉及漢冶萍公司中日合辦；第四號要求中國沿海港灣島嶼不得租借或割讓給他國；第五號要求中國政府聘用日本人為政治財政軍事顧問，中日合辦警政與兵工廠等，近乎將中國內政置於日本監督之下。經多輪談判與國內外輿論壓力，日本最終以最後通牒方式，迫使袁世凱政府接受除第五號部分內容外的大部分要求，於同年5月簽訂《中日民四條約》，5月9日被中國民間訂為國恥紀念日。",
    knowledge:["二十一條共五號，其中第五號因侵略性質最露骨、引發列強關切，最終被迫擱置或緩議，並非全部條款都被接受","袁世凱換文承認日本繼承德國在山東權利，成為日後1919年巴黎和會上日本主張取得山東權益的重要憑據，直接連結巴黎和會、五四運動事件","二十一條交涉是最後通牒式外交脅迫的典型案例，展現一戰期間列強無暇東顧之際，日本如何趁虛而入擴大在華權益","日本此時已在東北遼陽設立{{關東都督府}}作為政治軍事統治機關，並在袁世凱死後幕後扶植奉系軍閥張作霖（而非段祺瑞）控制東北，是理解1930年代九一八事變前日本在東北長期經營的背景"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：一戰期間歐洲列強深陷戰爭泥沼、無暇兼顧亞洲事務，形成日本在東亞的權力真空與擴張機會。"},{label:"依賴理論／IPE",text:"角度：漢冶萍公司中日合辦的要求，是日本資本輸出、掌控中國核心重工業命脈的具體企圖。"},{label:"外交史方法論",text:"角度：第五號因列強介入而受挫，展現國際輿論與列強利益平衡有時能對單一強權的擴張野心產生一定制約效果。"}]},
  {id:"paris-peace-china",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1919",title:"巴黎和會與五四運動：中國視角",spec:"core",
    narrative:"一戰結束後，中國以戰勝國身分派代表團出席巴黎和會，提出廢除列強在華勢力範圍、取消二十一條、歸還山東權益等訴求。然而和會列強基於大國補償原則的實際權力邏輯，仍決議將德國在山東的權益轉交日本，而非歸還中國。消息傳回北京，1919年5月4日，北京學生發起示威遊行，提出外爭主權、內除國賊口號，要求懲辦簽訂二十一條的親日官員，運動迅速擴及全國各大城市，商人罷市、工人罷工聲援，史稱五四運動。在強大民意壓力下，中國代表團最終拒絕在對德和約上簽字，是巴黎和會參與國中唯一拒籤者。",
    knowledge:["中國是巴黎和會的戰勝國之一，卻仍未能爭回山東權益，直接凸顯弱國無外交——即使身處戰勝方陣營，國力才是決定談判結果的關鍵","五四運動不僅是外交事件，更是中國近代思想史、社會史的重大轉折點，催生新文化運動後期的政治轉向","中國拒籤對德和約，是巴黎和會近30個參與國中唯一的拒籤案例，可與西姆拉條約簽字但拒絕批准的模式相互呼應比較"],
    theory:[{label:"民族主義",text:"最貼近考古題方向：五四運動展現巴黎和會的外交挫敗如何直接轉化為國內政治動員能量，可與甲午戰敗催生戊戌變法的模式做跨時代比較。"},{label:"現實主義",text:"角度：中國雖為戰勝國卻未能爭回權益，印證國際談判結果取決於實力對比而非道德正義的現實主義核心命題。"},{label:"外交史方法論",text:"角度：適合連結分析國內政治動員如何反過來影響外交決策，是研究外交政策與國內政治互動關係的重要案例。"}]},
  {id:"soviet-beijing",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1920s",title:"蘇聯對北京政府的統戰工作",spec:"core",
    narrative:"1917年俄國十月革命後，新成立的蘇維埃政權亟需打破西方列強的外交孤立與經濟封鎖，積極尋求與中國建立關係。1919年，蘇聯發表加拉罕宣言，宣布放棄沙俄時代在中國取得的各項特權，此舉在當時廣受中國知識界與民間好感。蘇聯同時透過共產國際，一方面協助中國共產黨於1921年成立，另一方面也與孫中山領導的中國國民黨接觸，1923年孫中山與蘇聯代表越飛發表孫文越飛宣言，確立聯俄容共、扶助工農政策，蘇聯派遣顧問協助國民黨改組、建立黃埔軍校培養軍事幹部，為北伐奠定基礎。然而蘇聯對華政策的實際執行，仍保有相當程度的自身戰略利益考量（尤其對外蒙古、中東鐵路的持續掌控），並未完全兌現加拉罕宣言的理想化承諾。",
    knowledge:["加拉罕宣言宣布放棄沙俄特權是重要的宣傳攻勢，實際執行時蘇聯仍保留對外蒙古、中東鐵路的控制，理想與實踐存在落差","聯俄容共政策直接促成國民黨改組、黃埔軍校建立，是北伐得以順利推進的重要外部助力，也埋下日後國共分裂的伏筆","蘇聯對中國的統戰邏輯呼應列寧從莫斯科到巴黎的捷徑是經過北京和加爾各答的世界革命策略思維","聯俄容共、革命外交是南方（廣州）政府的外交路線，與同時期北方政府負責的西藏、外蒙、參戰問題、巴黎和會、收回租界關稅自主、華盛頓會議等事務分屬不同陣營——民初中國同時存在兩條外交路線"],
    theory:[{label:"建構主義",text:"最貼近考古題方向：加拉罕宣言的意識形態訴求成功建構蘇聯作為中國的朋友而非傳統帝國主義列強的正面形象，即使實際政策執行未必完全兌現承諾。"},{label:"現實主義",text:"角度：蘇聯對外蒙古、中東鐵路的持續掌控，顯示即使意識形態上標榜反帝，國家利益的地緣政治考量仍是實際政策的最終依歸。"},{label:"依賴理論／IPE",text:"角度：蘇聯提供軍事顧問與資源協助國民黨建軍，某種程度上是另一種形式的外部強權介入中國內政。"}]},
  {id:"washington-conference",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1921–1922",title:"華盛頓會議與九國公約",spec:"core",
    narrative:"一戰後，美國有感於凡爾賽和約未獲美國國會批准、且日本在山東的權益爭議懸而未決，加上英日同盟續約問題牽動美國在太平洋的戰略利益，遂於1921年11月主導召開華盛頓會議，邀集九國與會。會議達成三項重要協議：四國公約（終止英日同盟，改由美英法日四國共同協商太平洋地區事務）；五國海軍公約（限制五國主力艦噸位比例，美英各5、日本3、法義各1.75，是近代史上首次成功的國際軍備管制條約）；九國公約，各國共同承諾尊重中國之主權、獨立及領土與行政完整，確立對華門戶開放、機會均等原則。會外協商中，日本在美英調停壓力下，同意將山東主權交還中國（但保留部分經濟利權）。",
    knowledge:["出席華盛頓會議的中國代表為北京政府（北洋政府），民初南北分治期間，收回租界、關稅自主、參與國際會議等對外事務主要由北方政府負責，南方（廣州）政府則專注聯俄容共、革命外交路線——常考的南北政府外交分工配對題","華盛頓會議終止了英日同盟，某種程度上削弱了日本在東亞的外交靠山","九國公約將美國門戶開放政策的原則正式多邊條約化，使其從單方面的政策宣示轉變為具有國際法拘束力的多國承諾","山東問題在華盛頓會議上部分解決，但這是列強調停施壓的結果，而非中國自身談判實力的展現"],
    theory:[{label:"自由主義／國際制度",text:"最貼近考古題方向：華盛頓會議體系透過多邊條約建立戰後太平洋地區的規則性秩序，是繼歐洲凡爾賽體系之後亞太地區版本的規則取代權力嘗試。"},{label:"現實主義",text:"角度：美國主導終止英日同盟、限制日本海軍噸位比例，本質仍是美國藉多邊機制制衡日本在太平洋擴張的權力平衡操作。"},{label:"外交史方法論",text:"角度：山東問題的部分解決是英美對日施壓的結果，適合做弱國透過列強之間的利益矛盾間接爭取有利結果的策略分析。"}]},
  {id:"anti-treaty-movement",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1924–1928",title:"國民革命與廢除不平等條約運動",spec:"core",
    narrative:"孫中山於1924年在廣州召開中國國民黨第一次全國代表大會，發表宣言明確號召廢除不平等條約，將此列為國民革命的核心外交目標之一。1925年5月30日，上海發生日本紗廠槍殺華工事件，引發學生示威遊行聲援，上海公共租界英籍巡捕悍然開槍鎮壓，造成多人死傷，史稱五卅慘案，事件迅速引爆全國性反帝愛國運動高潮。同年，廣州國民政府發動省港大罷工，動員廣州、香港兩地工人聯合罷工，持續長達16個月之久，對香港經濟造成嚴重衝擊。1926年國民革命軍展開北伐，1927年攻克長江中下游後，順勢從英國手中收回漢口、九江英租界，是近代中國首度以實際行動成功收回外國租界的案例。",
    knowledge:["五卅慘案是1925年5月30日，不是五三慘案，日期與名稱常被混淆出題","省港大罷工展現群眾運動作為外交施壓工具的操作模式，與傳統外交談判形成鮮明對比","收回漢口九江英租界（1927）是北伐軍事行動與廢約外交訴求直接結合的具體成果"],
    theory:[{label:"民族主義",text:"最貼近考古題方向：國民革命時期的反帝民族主義動員，將五四運動以來累積的群眾民族主義能量進一步組織化、政治化，成為國民黨北伐動員的重要意識形態資源。"},{label:"現實主義",text:"角度：收回漢口九江英租界證明，當中國自身軍事實力有所提升時，列強讓步的意願與幅度也隨之提高。"},{label:"依賴理論／IPE",text:"角度：省港大罷工透過經濟抵制直接衝擊香港對外貿易與經濟運作，是南方國家依賴理論框架下弱者的武器的早期實踐案例。"}]},
  {id:"mukden-incident",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1931–1932",title:"九一八事變與滿洲國",spec:"core",
    narrative:"日本關東軍長期覬覦中國東北豐富資源與戰略地位，1931年9月18日夜，關東軍軍官在瀋陽近郊柳條湖自行炸毀南滿鐵路一小段路軌，卻反誣稱是中國軍隊所為，以此為藉口迅速出兵攻佔瀋陽，並在數月內席捲東北三省全境，史稱九一八事變。此次行動事前未經東京中央政府正式授權，是關東軍少壯派軍官擅自發動的既成事實。中國政府採取不抵抗政策，一方面寄望國際聯盟主持公道，一方面忙於安內攘外優先剿共，東北迅速淪陷。1932年，日本扶植清朝末代皇帝溥儀成立傀儡政權滿洲國。國際聯盟應中國要求派遣李頓調查團實地調查，1932年提出報告，認定日本行動非屬正當自衛，建議東北由國際共管，但缺乏強制執行力。日本對此不滿，於1933年宣布退出國際聯盟。",
    knowledge:["九一八事變是未經中央政府授權、由地方駐軍擅自發動的既成事實外交案例，與稍後七七事變的爆發模式有相似之處","李頓調查團報告雖認定日本行動不當，但國聯僅能提出建議、缺乏強制制裁機制，直接印證國聯的結構性缺陷","日本退出國聯（1933）是修正主義強權公然挑戰集體安全體系、且毫無後果的重要先例，也鼓舞了日後德義的類似行動"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：九一八事變充分展現當國際集體安全機制缺乏強制執行力時，修正主義強權可以肆無忌憚地以武力片面改變現狀，與國聯在衣索比亞危機的失敗屬同一模式。"},{label:"外交史方法論",text:"角度：適合做地方軍事單位擅自行動、中央政府被迫追認的能動性層次分析。"},{label:"國際公法",text:"角度：滿洲國形式獨立、實質魁儡的政權型態，是研究國家承認要件的重要反面案例。"},{label:"建構主義",text:"角度：日本退出國聯後，其後續外交論述逐漸建構大東亞共榮圈等意識形態，將侵略擴張包裝為正當性敘事。"}]},
  {id:"marco-polo-bridge",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1937",title:"七七事變與全面抗戰爆發",spec:"core",
    narrative:"九一八事變後，日本持續在華北蠶食擴張，中日關係日趨緊張。1937年7月7日夜，日軍在北平近郊盧溝橋附近進行軍事演習，藉口一名士兵失蹤，要求進入宛平縣城搜查遭拒，隨即砲擊縣城，中國駐軍奮起抵抗，史稱七七事變。事變爆發後，日本國內強硬派主導決策，迅速擴大兵力增援華北，同年8月上海爆發八一三事變，戰火從華北延燒至華東，中日雙方均未正式宣戰，但實質上已進入全面戰爭狀態。國際社會反應相對消極：國聯雖通過決議譴責日本，但缺乏具體制裁能力；英國一度協助打通滇緬公路作為對華後勤補給管道；美國起初維持中立，直到1941年珍珠港事變後才正式對日宣戰、全面援華。",
    knowledge:["七七事變與九一八事變同樣是基層軍事摩擦迅速升級為全面戰爭的模式，但事變後雙方未經正式宣戰即進入全面戰爭狀態，是未宣而戰的重要案例","國際反應相對消極，各國基於自身利益考量未能採取有效集體制裁行動，直到珍珠港事變後美國參戰戰局才根本改觀","中日戰爭與第二次世界大戰時序上有重疊但非完全重合——中日戰爭1937年即全面爆發，早於1939年歐洲二戰爆發"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：國際社會對七七事變的消極反應，展現當侵略行為未直接威脅到自身核心利益時其他國家傾向姑息旁觀，與西洋史姑息政策對納粹德國擴張的因應模式高度相似。"},{label:"外交史方法論",text:"角度：適合比較七七事變與九一八事變的異同，顯示日本此時已從地方軍部擅自行動逐漸轉為中央決策階層主導的全面侵略。"},{label:"國際公法",text:"角度：中日雙方直到多年後才正式互相宣戰，未宣而戰的狀態如何影響雙方在國際法上的權利義務，是研究戰爭狀態認定的重要案例。"}]},
  {id:"wartime-cooperation",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1941–1945",title:"抗戰期間中美英合作",spec:"core",
    narrative:"珍珠港事變後，美國正式對日宣戰，中國對日抗戰自此併入同盟國陣營對抗軸心國的世界大戰框架，中美英三國合作關係大幅深化。美國透過租借法案大量軍援中國，並派遣史迪威將軍出任中國戰區參謀長；由於日軍佔領緬甸、切斷滇緬公路，中美隨即開闢駝峰航線，飛越喜馬拉雅山脈以空運方式維持對華軍援物資運補。外交層面，美英於1943年正式宣布撤銷在華治外法權及其他不平等條約特權。同年11月，美國總統羅斯福、英國首相邱吉爾邀請國民政府主席蔣中正於埃及召開開羅會議，發表《開羅宣言》，明訂日本戰敗後應將台灣、澎湖歸還中華民國。1944年，中華民國與美英蘇等國共同磋商籌組戰後國際組織方案，為聯合國成立奠定基礎，中華民國並於1945年正式成為聯合國創始會員國及安全理事會常任理事國之一。",
    knowledge:["1943年中美、中英簽訂新約，正式撤銷治外法權等不平等條約特權，是近代中國自鴉片戰爭以來歷經百年才逐步達成的廢約目標最終形式性完成的重要指標","《開羅宣言》雖非正式條約，卻在戰後被視為具有國際法效力的重要文件，是台灣主權歸屬爭議中中華民國政府主張的重要國際法依據之一","中華民國成為聯合國創始會員國及安理會常任理事國，是二戰期間中國對日抗戰貢獻獲得國際承認的具體成果","駝峰航線的高損失率，展現戰時盟國對華支援的實際困難與代價","1945年10月25日，中華民國政府依《開羅宣言》及日本降書，於台北公會堂舉行受降典禮，正式恢復對台灣、澎湖行使主權，史稱台灣光復；此舉的國際法效力後續與1951年舊金山和約（日本僅宣布放棄台澎主權、未明訂歸屬對象）之間的關係，是台灣國際地位爭議中常被提出討論的環節"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：中國對日抗戰的持久消耗，牽制了大量日本陸軍兵力，客觀上減輕了美英在太平洋戰場的壓力，這種戰略價值決定盟友待遇的邏輯，正是中國得以躋身聯合國創始五強之列的根本原因。"},{label:"外交史方法論",text:"角度：適合做戰爭如何加速外交地位躍升的分析，中國從甲午戰敗以來持續積弱的國際地位，在短短數年內實現結構性翻轉。"},{label:"國際公法",text:"角度：1943年廢除治外法權的新約，標誌著近代國際法文明標準歧視性框架對中國的正式終結。"},{label:"依賴理論／IPE",text:"角度：租借法案的軍援本質上仍是一種依賴性的外部支持，也預示了戰後中國持續仰賴美國軍事與經濟支持的格局。"}]},
  {id:"civil-war-mediation",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1945–1949",title:"國共內戰與美國調停",spec:"core",
    narrative:"二戰結束後，中國國民黨與共產黨對於戰後政治權力分配的矛盾迅速浮上檯面。美國基於避免中國陷入內戰、期望建立一個穩定親美的統一中國之戰略考量，派遣馬歇爾將軍以特使身分來華，主持國共兩黨談判，促成1945年蔣中正、毛澤東於重慶進行的重慶會談，雙方簽署《雙十協定》，表面上同意和平建國，但實際上雙方軍事對峙並未停止。馬歇爾其後繼續斡旋，一度促成短暫停火，然而國共雙方均未真正遵守停戰協議，馬歇爾調停最終於1946年底失敗。國共內戰全面爆發，戰局於1948年後急轉直下，中華民國政府於1949年撤退至台灣。同年8月，美國國務院發表《中國白皮書》，將中國局勢的惡化歸咎於國民政府自身的腐敗無能，而非美國援助不力。",
    knowledge:["馬歇爾使華調停是美國在二戰後首次大規模介入中國內政的外交嘗試，其失敗原因常考：國共雙方均缺乏真誠停戰意願、美國本身對兩黨施壓力道有限","《雙十協定》雖名為協定，但實際執行成效極其有限，常考協定簽署與實際履行落差的觀念題","《中國白皮書》（1949）是美國對華政策轉向的重要指標性文件，也預示了韓戰爆發前美國一度考慮放棄協防台灣的政策傾向"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美國調停國共內戰的核心動機是地緣戰略考量，而非單純的人道或理想主義關懷，調停失敗後美國對國民政府支持力道的動搖也是基於現實評估。"},{label:"外交史方法論",text:"角度：馬歇爾調停的失敗案例顯示，當衝突雙方都認為透過軍事手段獲勝的機率高於透過談判妥協時，外部調停者即使付出大量外交資源，成效仍極為有限。"},{label:"依賴理論／IPE",text:"角度：國民政府對美援的高度依賴，以及美援政策的搖擺不定，直接影響了國共內戰的戰局走向。"},{label:"建構主義",text:"角度：中國白皮書將內戰失利完全歸咎於國民政府腐敗無能的敘事建構，深刻影響了此後數十年美國國內對華政策辯論的基本框架。"}]},
  {id:"meiji",region:"eastasia",period:"日本近代化起點",year:"1868起",title:"明治維新",spec:"core",
    narrative:"1853年黑船事件打破日本鎖國，倒幕運動興起，1868年明治天皇親政。新政府推動廢藩置縣、殖產興業、富國強兵、文明開化等現代化改革，1871–73年岩倉使節團出訪歐美。",
    knowledge:["廢藩置縣（1871）徹底終結幕藩體制，建立中央集權國家","1889年《大日本帝國憲法》確立君主立憲體制，是亞洲第一部近代成文憲法"],
    theory:[{label:"現實主義",text:"最貼近：明治維新是外部壓力下快速完成國家能力建構的案例，中央集權改革與清朝自強運動地方分權模式形成對比。"},{label:"建構主義",text:"角度：文明開化是主動採納西方{{文明標準}}以求平等承認的策略性選擇。"}]},
  {id:"american-revolution",region:"west",period:"①西發里亞體系期 1648–1815",year:"1775–1783",title:"美國獨立戰爭與法國介入",spec:"core",
    narrative:"英屬北美十三殖民地因無代表不納稅等爭議與英國關係惡化，1775年爆發武裝衝突，隔年發表《獨立宣言》。法國基於七年戰爭（1756–63）敗於英國、失去北美殖民地的舊恨，視此為報復良機，於1778年正式承認美國為主權獨立國家並締結同盟條約，派遣軍隊與海軍艦隊協助美軍作戰（法國海軍在約克鎮圍城戰中封鎖海路，是英軍投降的關鍵）。西班牙、荷蘭稍後也相繼加入對英作戰。1783年《巴黎條約》簽訂，英國承認美國獨立。然而法國為此戰爭付出鉅額軍費，國庫幾近枯竭，卻未能從中獲得實質領土或貿易利益回報，反而加劇了法國國內財政危機與階級矛盾，成為六年後（1789年）法國大革命爆發的重要遠因之一。",
    knowledge:["法國是第一個正式承認美國為主權國家的國家（1778）——常考的精確年代與國家配對題","法國介入純粹是地緣政治報復算計（削弱英國），而非意識形態認同共和價值，法國本身當時仍是君主專制國家","法國參戰軍費是壓垮法國財政的最後一根稻草，直接連結到法國大革命（1789）的爆發，可與後續拿破崙戰爭事件串成完整因果鏈","這場戰爭也是近代國際法承認理論的早期實踐案例——一國透過外交承認賦予新生政權國際法主體地位"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：法國介入美國獨立戰爭純粹是傳統權力平衡邏輯下削弱對手（英國）的策略操作，與美國追求的自由民主理念毫無關係。"},{label:"依賴理論／IPE",text:"角度：戰爭費用掏空法國國庫，直接證明軍事介入的財政成本如何反噬介入國自身，可與拿破崙戰爭事件的因果鏈起點相互連結。"},{label:"國際公法",text:"角度：法國的正式承認賦予美國國際法主體地位，是研究近代國家承認制度起源的重要案例。"},{label:"外交史方法論",text:"角度：適合做短期軍事勝利與長期戰略代價不成比例的分析——法國雖助美國獨立成功，卻也親手點燃了六年後顛覆自己王朝的革命火種，是外交決策意外後果的經典教材。"}]},
  {id:"french-revolution",region:"west",period:"①西發里亞體系期 1648–1815",year:"1789–1799",title:"法國大革命",spec:"light",
    narrative:"法國因參與美國獨立戰爭掏空國庫、財政瀕臨破產，加上舊制度下三級社會結構的長期矛盾，路易十六被迫於1789年召開三級會議尋求增稅，第三等級代表另組國民議會、發表網球場宣言，隨即發生巴士底獄事件，大革命爆發。國民議會發布《人權和公民權宣言》，揭示主權在民、自由平等等原則，並於1791年推動君主立憲改革。然而國內激進派與歐洲君主國的敵意持續升高，1792年4月主戰的吉倫特派主導的國民公會率先對奧地利宣戰，普魯士隨即加入奧地利一方，第一次反法同盟戰爭爆發；同年法國廢除君主制、成立第一共和。1793年路易十六被處決，震撼歐洲各君主國，法國陷入雅各賓派主導的恐怖統治，同時頒布全國總動員令，建立起近代史上第一支基於全民徵召的大規模國民軍。1794年熱月政變推翻羅伯斯比爾，恐怖統治結束，改由督政府執政，政局持續動盪，直到1799年拿破崙發動霧月政變掌權，大革命的動盪期正式告終。",
    causal:"法國大革命的意識形態衝擊（主權在民、處決國王）與國民公會主動對奧宣戰的決定，是七次反法同盟戰爭爆發的直接起點，也是[[west|napoleonic-wars|拿破崙戰爭與反法同盟]]事件卡開頭「歐洲君主國深恐革命思想蔓延」的具體歷史依據；全國總動員令建立的國民兵源動員模式，也是拿破崙此後得以發動連續大規模戰爭的軍事基礎。革命輸出的主權在民思想與戰後[[west|vienna-congress|維也納會議與歐洲協商體系]]極力恢復的王朝正統原則直接對立，構成19世紀歐洲外交史「舊秩序 vs 新思潮」對抗的意識形態起點。"},
  {id:"napoleonic-wars",region:"west",period:"①西發里亞體系期 1648–1815",year:"1792–1815",title:"拿破崙戰爭與反法同盟",spec:"core",
    narrative:"法國大革命後，歐洲君主國深恐革命思想蔓延，組成第一次反法同盟干涉法國內政，反遭法軍擊退。拿破崙於1799年霧月政變掌權，1804年稱帝建立法蘭西第一帝國，展開一系列對外征服。英國始終是拿破崙最頑強的對手，先後主導組織了七次反法同盟，糾集普魯士、奧地利、俄羅斯等歐陸強權，運用其海上優勢與財政補貼維持同盟運作。1805年特拉法加海戰，英國海軍徹底摧毀法西聯合艦隊，確立英國制海權。為癱瘓英國經濟命脈，拿破崙自1806年起推行大陸體系（大陸封鎖政策），但英國憑藉海上優勢與殖民地市場化解衝擊，反倒是歐陸國家經濟受創。俄國於1810年退出大陸體系，拿破崙遂於1812年率軍入侵俄國，卻在焦土戰略與嚴冬下慘敗。1813年萊比錫戰役聯軍大敗拿破崙，1814年拿破崙退位，同年召開維也納會議重建歐洲秩序；1815年拿破崙建立百日王朝，最終在滑鐵盧戰役被徹底擊敗，拿破崙戰爭正式落幕。",
    knowledge:["英國對抗拿破崙的核心戰略是以錢養同盟——靠優勢海權維持本土安全，同時財政津貼收買普奧俄等陸權強國持續對法作戰，是{{離岸平衡者}}的經典操作","特拉法加海戰（1805）確立英國19世紀海權霸主地位，直接關聯後續兩強標準海軍政策","大陸體系反而重創歐陸經濟，是拿破崙帝國由盛轉衰的關鍵政策失誤","拿破崙入侵俄國失敗（1812）是帝國崩潰轉捩點，常與後續希特勒入侵蘇聯做跨時代比較","1815年維也納會議在拿破崙戰爭尚未完全落幕前即已召開，是維也納體系起點的關鍵背景"],
    theory:[{label:"現實主義（權力平衡理論）",text:"最貼近考古題方向：七次反法同盟是古典權力平衡理論的教科書案例——單一強權實力膨脹到足以支配歐陸，其餘國家便組成抗衡聯盟制衡，英國作為{{離岸平衡者}}的角色貫穿全程。"},{label:"外交史方法論",text:"角度：適合做層次分析——意識形態擴散、拿破崙個人野心、歐陸君主對政權存續的恐懼，三者交織導致戰爭反覆爆發。"},{label:"依賴理論／IPE",text:"角度：大陸體系本質是最早的大規模經濟制裁嘗試，證明對海權國家實施陸權式封鎖效果有限，反而傷及己方盟友經濟。"},{label:"建構主義",text:"角度：法國大革命輸出的主權在民、民族國家思想衝擊歐洲舊有王朝正統性認知，維也納會議後戰勝國極力壓制此思潮、恢復正統王朝。"}]},
  {id:"vienna-congress",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1814–1815",title:"維也納會議與歐洲協商體系",spec:"core",
    narrative:"拿破崙戰爭結束後，戰勝的英、俄、普、奧四強（加上戰敗的法國由塔列朗代表列席）於1814年9月至1815年6月在維也納召開會議，重建拿破崙戰爭摧毀的歐洲秩序。會議由奧地利首相梅特涅主導，確立三大指導原則：正統原則（恢復戰前正統王朝統治，如法國波旁王朝復辟）、補償原則（戰勝國依貢獻程度分配領土補償）、以及權力平衡原則（刻意扶植中等強國作為緩衝、避免任一強權獨大）。會後，五強建立歐洲協商機制——透過定期召開多邊會議協調處理重大國際爭端，是近代史上第一個接近集體安全雛形的國際合作嘗試，維持了歐洲大國間長達近40年的相對和平。然而此體系本質上是保守王朝聯合鎮壓自由主義與民族主義思潮的工具，1830年比利時獨立、1848年歐洲各地爆發革命浪潮，已顯示體系內部矛盾，直到克里米亞戰爭徹底打破列強協同一致的默契。",
    knowledge:["維也納會議三大原則：正統原則、補償原則、權力平衡原則，是常考的申論核心概念","{{歐洲協商}}是考古題明確考過的專有名詞，指維也納會議後建立的多邊協調機制，不要與後來的國際聯盟或歐洲整合混淆","梅特涅是維也納會議的靈魂人物，其保守主義外交哲學主導了此後近30年的歐洲秩序","1830年比利時獨立、1848年革命浪潮，是歐洲協商體系內部矛盾外顯的早期警訊","1830年比利時獨立的直接觸發點是同年稍早爆發的法國七月革命——巴黎民眾推翻極端保守的復辟波旁王室（查理十世），改由較溫和的奧爾良王室路易腓力繼位，這股革命餘波隨即擴散至荷蘭統治下的比利時，引爆當地脫離獨立的行動，是歐洲協商體系保守王朝聯合鎮壓自由主義根基開始鬆動的第一個具體案例"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：歐洲協商是近代史上第一個依賴多邊協商機制維持國際和平的實驗性嘗試，可作為20世紀國際聯盟、聯合國等集體安全機制的思想先驅。"},{label:"現實主義",text:"角度：三大原則本質上仍是傳統權力平衡邏輯的延伸，並非真正基於道德或法律原則。"},{label:"建構主義",text:"角度：體系正當性建立在王朝正統這一共享觀念之上，一旦民族主義興起動搖此觀念，體系便難以維繫。"},{label:"外交史方法論",text:"角度：適合比較維也納體系（多邊協商）與後續俾斯麥同盟體系（精算型同盟網絡）在操作邏輯上的差異。"}]},
  {id:"greek-independence",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1821–1832",title:"希臘獨立戰爭",spec:"light",
    narrative:"希臘長期受鄂圖曼帝國統治，1821年希臘民族主義者發動起義，尋求脫離鄂圖曼獨立。起義初期遭鄂圖曼及其藩屬埃及聯軍鎮壓，但希臘獨立訴求在歐洲知識界與浪漫主義思潮中激起廣泛同情（英國詩人拜倫親赴希臘參戰並病逝當地，成為象徵性事件）。1827年，英、法、俄三國基於各自地緣政治考量（英國關切地中海航線、俄國藉東正教同胞情誼南下、法國尋求在地中海的影響力），罕見地聯合組成艦隊，於納瓦里諾海戰擊潰鄂圖曼—埃及聯合艦隊，扭轉戰局。1830年，列強簽署《倫敦議定書》正式承認希臘獨立，1832年希臘正式建國，並依歐洲協商慣例由列強擇定巴伐利亞王子奧圖出任希臘國王。",
    causal:"是[[west|vienna-congress|維也納會議與歐洲協商體系]]卡片中歐洲協商機制少數成功協調多邊軍事干預的案例，可與稍後[[west|crimean-war|克里米亞戰爭]]卡片中協商徹底破局的失敗案例做正反對照，共同構成近東問題從維也納體系邊緣議題演變為壓垮歐洲協商核心矛盾的完整敘事線。"},
  {id:"monroe-doctrine",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1823",title:"門羅主義",spec:"light",
    narrative:"拿破崙戰爭結束後，西班牙、葡萄牙在拉丁美洲的殖民地紛紛掀起獨立浪潮，維也納體系下的保守強權（尤其神聖同盟核心的俄、普、奧）一度醞釀協助西班牙鎮壓美洲獨立運動、恢復殖民統治。美國總統門羅於1823年向國會發表國情咨文，宣示美洲大陸不再是歐洲列強殖民擴張的對象，任何歐洲勢力介入美洲事務將被視為對美國的敵對行為；同時美國也承諾不干涉歐洲列強既有殖民地事務及歐洲內政，形成美洲事務美洲解決、歐洲事務歐洲解決的雙向不介入原則。這份宣言在當時美國國力尚弱、缺乏實質軍事後盾的情況下，主要仰賴英國海軍基於自身商業利益（希望拉美新興市場對英國開放貿易）默許支持才得以生效。",
    causal:"門羅主義是美國孤立主義外交傳統的思想起點，直接呼應[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]理論卡中棄守／退出戰略的孤立主義傳統——一戰後美國拒絕加入國際聯盟的決定，正是這條孤立主義思想脈絡近百年後的延續。門羅主義也填補了[[west|american-revolution|美國獨立戰爭與法國介入]]（1783）到門戶開放政策（1899）之間美國外交史的長期空白，標誌美國從被動的新生國家轉為主動劃定自身勢力範圍的區域性強權。"},
  {id:"frankfurt-parliament",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1848–1849",title:"德意志革命與法蘭克福議會",spec:"light",
    narrative:"1848年，受法國二月革命（推翻路易腓力、建立第二共和）影響，革命浪潮迅速蔓延至德意志邦聯各邦。同年5月，來自各邦的自由派代表齊聚法蘭克福聖保羅教堂召開國民議會（史稱法蘭克福議會），嘗試以由下而上、議會協商的方式完成德意志統一與立憲改革，並於1849年正式向普魯士國王腓特烈．威廉四世提出德意志皇帝的頭銜。然而普王以不願撿拾陰溝裡的皇冠為由拒絕接受，議會本身缺乏軍隊、財政與強制執行力，各邦君主也拒絕配合，最終遭普魯士軍隊武力驅散，自由派由下而上的統一嘗試徹底失敗。",
    causal:"這場失敗的自由派統一嘗試，與後續[[west|german-unification|德意志統一戰爭]]卡片中俾斯麥由上而下、透過鐵血政策（戰爭而非議會辯論）完成統一形成鮮明對比，是申論題比較不同民族統一路徑的重要素材，也可與既有[[west|italian-unification|義大利統一運動]]卡片中加富爾（由上而下外交操作）與加里波底（由下而上動員）的雙軌對比相互呼應，構成完整的19世紀民族統一路徑類型學。同時也是[[west|vienna-congress|維也納會議與歐洲協商體系]]卡片中提到1848年歐洲各地爆發革命浪潮的德意志邦聯具體體現。"},
  {id:"crimean-war",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1853–1856",title:"克里米亞戰爭",spec:"core",
    narrative:"戰爭源於{{近東問題}}——鄂圖曼帝國國力持續衰弱，其境內龐大領土（尤其巴爾幹半島、黑海海峽）成為列強眼中的權力真空。導火線是法俄圍繞聖地保護權的爭執，俄國沙皇尼古拉一世藉口保護鄂圖曼境內東正教徒權益，於1853年出兵佔領摩爾多瓦、瓦拉幾亞，鄂圖曼隨即對俄宣戰，爆發俄土戰爭。英法唯恐俄國藉此突破黑海、進逼地中海與英國通往印度的航線利益，遂於1854年正式對俄宣戰，加入鄂圖曼一方作戰，薩丁尼亞王國稍後也加入，意圖藉此提升國際地位、爭取列強支持義大利統一。戰事主要在克里米亞半島的塞凡堡展開長期圍城戰，雙方傷亡慘重，俄國最終戰敗求和。1856年參戰各國於巴黎召開和會，簽訂《巴黎和約》，確立黑海中立化——俄國不得在黑海保有海軍艦隊或沿岸軍事設施，同時承認鄂圖曼帝國領土完整、准其加入歐洲協商體系。",
    knowledge:["克里米亞戰爭又稱僧侶之間的戰爭，因導火線源於天主教與東正教僧侶對聖地管理權的爭執","主要參戰國為英、法、俄、鄂圖曼帝國及薩丁尼亞王國五方，薩丁尼亞加入是外交操作，為義大利統一鋪路","《巴黎和約》最關鍵內容是黑海中立化，而非割地","戰後法國與奧地利並未建立緊密軍事同盟，奧地利在戰爭中態度曖昧、未實際出兵援俄，反而讓法奧關係疏離","巴黎和約規範交戰期間中立國貨物應受保護、不得沒收充公，是海上國際法的重要先例","克里米亞戰爭並非近東問題首次引發列強介入——1830年代埃及總督穆罕默德．阿里兩度率軍挑戰鄂圖曼宗主權（土埃戰爭），列強（尤其英俄）多次介入調停，1841年《倫敦海峽公約》確立博斯普魯斯、達達尼爾海峽平時禁止外國軍艦通行的原則，是近東問題長期發酵的前哨戰，也是黑海中立化概念的先聲"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：這是列強聯手抗衡單一崛起強權的權力平衡經典案例——俄國藉鄂圖曼衰弱意圖南下擴張，英法唯恐俄國打破區域權力平衡，遂結盟介入。"},{label:"地緣政治",text:"角度：{{近東問題}}本質是鄂圖曼帝國衰弱留下的權力真空引發列強競逐，這條線索一路延伸到後續巴爾幹危機、第一次世界大戰爆發背景。"},{label:"國際公法",text:"角度：《巴黎和約》對中立國貨物的保護規範及黑海中立化條款，是近代國際法規範戰爭行為、限制特定海域軍事化的重要先例。"},{label:"外交史方法論",text:"角度：可比較克里米亞戰爭的舊式均勢外交聯合抗衡，與後續俾斯麥同盟體系的精算型同盟網絡在操作邏輯上的差異。"}]},
  {id:"italian-unification",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1859–1870",title:"義大利統一運動",spec:"core",
    narrative:"義大利半島長期分裂為多個邦國，並部分受奧地利宗主。薩丁尼亞王國首相加富爾推動統一大業，深知薩丁尼亞國力不足以獨力對抗奧地利，遂於1858年與法國拿破崙三世秘密會談（普隆比耶密約），換取法國軍事支持對抗奧地利，代價是割讓尼斯、薩伏依予法國。1859年薩丁尼亞挑起與奧地利的戰爭（薩奧戰爭），法軍助陣擊敗奧軍，薩丁尼亞取得倫巴底，但拿破崙三世因擔心普魯士介入及國內壓力，中途與奧地利單獨媾和，未完全實現原先密約承諾。同年，中義大利多個公國透過公民投票併入薩丁尼亞。1860年，民族主義志士加里波底率領紅衫軍自西西里島登陸，席捲兩西西里王國，最終將征服的南義領土獻給薩丁尼亞國王維克多．伊曼紐二世。1861年義大利王國正式建國，但威尼西亞（仍屬奧地利）與羅馬（教皇國，受法國保護）尚未統一。1866年義大利藉普奧戰爭之機與普魯士結盟對抗奧地利，戰後取得威尼西亞。1870年普法戰爭爆發，法軍撤離羅馬防務，義大利趁機佔領羅馬，完成統一大業，定羅馬為首都。",
    knowledge:["加富爾與拿破崙三世的普隆比耶密約（1858）是義大利統一運動關鍵的外交操作——藉助外部強權之力對抗奧地利，以割讓尼斯、薩伏依為代價","拿破崙三世在薩奧戰爭中途撤手，顯示大國介入他國統一進程往往有其自身利益盤算，不會無條件支持到底","加里波底的紅衫軍南征是由下而上民族主義動員的代表，與加富爾由上而下的外交操作路線形成對比","義大利統一最終兩個關鍵拼圖（威尼西亞、羅馬）都是借力其他強權戰爭之機取得，而非義大利自身軍事實力主導","薩奧戰爭（1859）是義大利統一關鍵戰爭，注意與德國統一的普奧戰爭（1866）、普法戰爭（1870）區分，常考混淆題"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：薩丁尼亞藉助法國外部力量對抗奧地利，是小國借助大國權力槓桿完成統一目標的策略操作。"},{label:"民族主義",text:"角度：義大利統一是19世紀民族主義浪潮代表案例，加里波底紅衫軍體現由下而上的動員，與同時期德國由上而下透過王朝戰爭完成統一的路徑形成鮮明對比，正是申論題義大利與德國統一路徑異同的核心比較點。"},{label:"外交史方法論",text:"角度：適合做層次分析——加富爾的外交操作、拿破崙三世的策略性介入與抽手、義大利各邦民族主義情緒，三者交織完成統一。"},{label:"建構主義",text:"角度：義大利統一過程中義大利民族認同的建構本身仍在進行中，統一在政治疆界上完成，但民族認同的實質整合是更長期的過程。"}]},
  {id:"german-unification",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1864–1871",title:"德意志統一戰爭",spec:"core",
    narrative:"普魯士首相俾斯麥（1862年就任）主張透過鐵血政策完成德意志統一，先前普魯士主導的關稅同盟已在經濟上整合德意志各邦，為政治統一鋪路。1864年，普魯士聯合奧地利共同對丹麥作戰（普丹戰爭），爭奪什列斯威、霍爾斯坦兩公國，丹麥戰敗，兩公國由普奧共管。俾斯麥刻意操作兩公國管理爭端，於1866年挑起普奧戰爭，普魯士憑藉優越的軍事組織與鐵路動員能力速戰速決，七週內擊敗奧地利，戰後俾斯麥對奧地利採取寬大政策，避免奧地利心生報復阻撓後續統一大業，奧地利被排除出德意志邦聯，普魯士主導成立北德意志邦聯。法國拿破崙三世對普魯士崛起深感不安，1866年普奧戰爭後，拿破崙三世試圖購買盧森堡以彌補未獲補償的失落，普魯士民族主義輿論強烈反對，法普一度瀕臨開戰邊緣，最終1867年《倫敦條約》宣布盧森堡永久中立化解危機，這場危機顯示法普關係早在埃姆斯電報事件三年前就已瀕臨破裂。雙方圍繞西班牙王位繼承問題爆發外交爭端，俾斯麥藉{{埃姆斯電報事件}}刻意激怒法國，法國於1870年對普宣戰，爆發普法戰爭。普軍迅速擊潰法軍，拿破崙三世於{{色當戰役}}被俘投降，法蘭西第二帝國瓦解；普軍圍攻巴黎，1871年戰爭結束，《法蘭克福條約》法國割讓阿爾薩斯、洛林予德國並賠款。同年普魯士國王威廉一世在凡爾賽宮鏡廳加冕為德意志帝國皇帝，德國統一大業完成。",
    knowledge:["{{鐵血政策}}意指以軍事實力與現實政治手段（而非自由派議會辯論）達成統一目標，是俾斯麥外交風格的代名詞","關稅同盟（Zollverein）常考：目的並非對抗英法經濟威脅，而是整合德意志經濟、連結領土、創造居民共同記憶、強化內聚力","普丹戰爭（1864）是普魯士聯合奧地利對丹麥作戰，不是排除奧地利——常見錯誤選項陷阱","普奧戰爭後俾斯麥對奧地利採寬大政策，是為減少日後阻撓與復仇心理，展現見好就收的外交智慧","{{埃姆斯電報事件}}是俾斯麥刻意操作輿論、激化法德衝突的經典案例","阿爾薩斯、洛林的割讓是後續法德世仇與第一次世界大戰法德矛盾的直接根源，可與集團對立與一戰結構性起源事件相互連結","俄國在普奧戰爭（1866）與普法戰爭（1870）中選擇中立，是兩條因果線疊加的結果——一是[[west|crimean-war|克里米亞戰爭]]後奧地利的背叛讓俄奧關係疏遠；二是1863年波蘭一月起義期間，普魯士主動與俄國簽訂《阿爾文斯雷本協定》協助封鎖邊境圍堵波蘭叛軍，換取俄國對普魯士的信任與好感"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：俾斯麥的鐵血政策是純粹權力政治的展現，三場戰爭（普丹、普奧、普法）依序精算執行，是有限戰爭達成有限目標的策略典範。"},{label:"外交史方法論",text:"角度：{{埃姆斯電報事件}}展示個人的訊息操作如何直接觸發國家層次的戰爭決策。"},{label:"比較政府與政治",text:"角度：德國統一是由上而下透過王朝戰爭主導完成，與義大利統一外交操作加民族主義動員雙軌並行形成鮮明對比，是申論題核心比較點。"},{label:"依賴理論／IPE",text:"角度：關稅同盟顯示經濟整合可作為政治統一的前導基礎，這條經濟先行、政治隨後的路徑與後續20世紀歐洲整合邏輯遙相呼應。"},{label:"自由主義／功能主義",text:"角度：關稅同盟的整合邏輯可套用[[theory|functionalism|功能主義／新功能主義]]理論框架理解——經濟領域的低階技術性整合（統一關稅、貿易政策）外溢至更高階的政治整合（德意志帝國建立），與20世紀歐洲煤鋼共同體外溢至歐盟政治整合是同一套邏輯跨世紀的兩次實踐，儘管俾斯麥主導的統一過程本身仍以現實主義鐵血政策為主軸，關稅同盟作為前置的經濟整合基礎，仍可視為功能主義路徑的早期歷史先例。"}]},
  {id:"bismarck",region:"west",period:"③俾斯麥同盟體系期 1871–1890",year:"1871–1890",title:"俾斯麥同盟體系",spec:"core",
    narrative:"普法戰爭結束、德意志帝國統一後，俾斯麥外交核心目標轉為維持現狀、孤立法國。建構三皇同盟（1873，1881年重訂）、德奧同盟（1879）、三國同盟（1882，納入義大利）等複雜同盟網絡，1887年更與俄國簽訂{{再保條約}}。1888年威廉二世繼位，1890年俾斯麥下台，新皇拒絕續簽{{再保條約}}，體系隨即瓦解。",
    knowledge:["俾斯麥同盟體系三大支柱的確切年份：德奧同盟（1879）、三皇同盟重訂（1881）、三國同盟（1882）——常考的年份配對題","德奧同盟義務（共同防俄）與{{再保條約}}（對俄中立承諾）彼此矛盾，僅靠俾斯麥本人精算平衡","俾斯麥外交目標是維持現狀而非擴張，與威廉二世世界政策形成對比"],
    theory:[{label:"現實主義",text:"最貼近：俾斯麥體系是精算型權力平衡極致案例。"},{label:"外交史方法論",text:"角度：體系高度依賴個人能動性，威廉二世上台後迅速瓦解證明此依賴的脆弱性。"}]},
  {id:"berlin-conference",region:"west",period:"③俾斯麥同盟體系期 1871–1890",year:"1884–1885",title:"柏林會議與新帝國主義瓜分非洲",spec:"core",
    narrative:"1870年代起，第二次工業革命帶動歐洲列強對原料與市場的渴求急遽升高，加上蘇伊士運河（1869年開通）大幅縮短歐亞航程、提升非洲戰略地位，列強競相以「探險」「傳教」為名深入非洲內陸，爭奪殖民地的行動日益白熱化，史稱「新帝國主義」。比利時國王利奧波德二世對剛果盆地的私人殖民野心，以及英法在西非、中非的利益衝突，使歐洲列強面臨瓜分非洲失控引發衝突的風險。1884年11月至1885年2月，德國首相俾斯麥在柏林召集英、法、德、比、葡等十餘國召開會議（柏林西非會議），會議確立「有效佔領原則」——列強欲主張某片非洲土地的主權，須證明已建立實質行政管理與軍事駐防，而非僅憑探險隊插旗宣示，此舉大幅加速了列強對非洲內陸的實質佔領競賽。會議承認比利時國王利奧波德二世對剛果自由邦的統治，並確立剛果河、尼日河流域的自由航行與貿易原則。柏林會議後短短二十年間，非洲大陸除衣索比亞、賴比瑞亞外幾乎全數淪為歐洲列強殖民地，史稱「非洲的爭奪戰」（Scramble for Africa）。",
    knowledge:["柏林會議（1884–85）處理的是瓜分非洲的議題，不要與更早的1878年柏林會議（處理巴爾幹俄土戰爭後續問題）混淆——常考的柏林會議年代與議題配對題","「有效佔領原則」是柏林會議最重要的制度性遺產，將殖民擴張從口頭宣示轉為要求實質行政與軍事控制，大幅加速了非洲被瓜分的速度","整場會議完全沒有非洲當地統治者或代表參與，是「他人決定他人命運」的殖民主義本質的赤裸展現","蘇伊士運河（1869開通）的戰略價值是英國積極介入埃及、控制運河區的直接動機，也是「新帝國主義」擴張邏輯（保護戰略航線）的具體案例","法國因鄂圖曼土耳其國力衰弱而佔領其北非屬地突尼西亞，是舊帝國（鄂圖曼）衰落造成列強擴張真空的典型案例"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：柏林會議是列強為避免因非洲瓜分競爭擦槍走火、引發歐洲大戰而建立的規則協調機制，本質仍是強權主導的權力劃分，只是將potentially衝突的零和競爭「制度化」，降低意外擦槍走火的風險。"},{label:"依賴理論／IPE",text:"角度：非洲爭奪戰是資本主義列強尋求原料產地與商品市場的赤裸展現，符合列寧帝國主義論核心論點，可與甲午戰爭日本設廠、集團對立殖民地爭奪等主線相互呼應，構成全球性的邊陲化案例對照。"},{label:"國際公法",text:"角度：有效佔領原則某種程度上是近代國際法對「主權取得」設下的形式要件，但完全排除當地人民同意，是研究殖民主義時期國際法「合法性建構」侷限性的重要案例。"},{label:"建構主義",text:"角度：德皇威廉二世認為國家適用社會達爾文主義優勝劣敗、適者生存的論點，將帝國主義擴張建構為國家生存競爭的必然邏輯，這種意識形態敘事為赤裸裸的資源掠奪提供了道德正當性的包裝。"}]},
  {id:"bloc-rivalry",region:"west",period:"④集團對立期 1890–1914",year:"1890–1914",title:"集團對立與一戰結構性起源",spec:"core",
    narrative:"1890年俾斯麥下台後，威廉二世推動世界政策，追求德國成為世界殖民強權，自1898年起大力擴建公海艦隊，直接挑戰英國{{兩強標準}}海軍優勢，觸發英德軍備競賽。第二次工業革命後起的德國、義大利等國工業實力迅速追上傳統強權，卻因殖民地瓜分已近尾聲，僅能分得零星殖民地，這正是政治經濟發展不平衡矛盾的具體體現。法國藉機擺脫孤立：1894年法俄同盟成立；英國因{{光榮孤立}}政策難以為繼，1904年簽署英法協約；隨後1907年英俄協約，三國協約正式對抗三國同盟。三大矛盾各自透過具體危機層層堆疊：英德矛盾以海軍軍備競賽為核心；法德矛盾體現在1905年第一次摩洛哥危機與1911年第二次摩洛哥危機；俄奧矛盾根源於巴爾幹半島泛斯拉夫主義與泛日耳曼主義對立，具體衝突包括1908年波士尼亞危機、1912–13年兩次巴爾幹戰爭。這些危機最終在1914年塞拉耶佛事件引爆第一次世界大戰。",
    knowledge:["政治經濟發展不平衡是列寧帝國主義論核心論點，後起工業強權因殖民地已被瓜分而心生不滿","法俄同盟（1894）打破意識形態相近才結盟的直覺，是純粹現實利益結盟","英法協約、英俄協約本質是劃分殖民地利益範圍，不含自動參戰條款，與同盟法律性質不同","法碩達危機（1898）是英法在蘇丹爭奪殖民地引發的外交衝突，法國最終讓步撤軍，反而促成日後英法協約的形成基礎","德雷福事件（1894–1906，法國猶太裔軍官遭誣陷叛國案）重創法國保守派與王室復辟勢力，鞏固法國共和體制","兩次摩洛哥危機（1905丹吉爾、1911阿加迪爾）都以德國砲艦外交介入告終，但每次反而讓英法關係更緊密","巴爾幹被稱為歐洲火藥庫：1908波士尼亞危機、1912–13兩次巴爾幹戰爭層層堆疊，最終1914塞拉耶佛事件引爆一戰"],
    theory:[{label:"現實主義（尤其{{修昔底德陷阱}}）",text:"最貼近：崛起強權尋求與實力不相稱的政治地位，觸發既有霸權抗衡反應。"},{label:"建構主義／民族主義",text:"角度：巴爾幹半島泛斯拉夫主義與泛日耳曼主義，是民族主義意識形態被大國工具化、用以擴張地緣政治影響力的案例。"},{label:"依賴理論／IPE",text:"角度：政治經濟發展不平衡呼應列寧帝國主義論核心命題。"},{label:"外交史方法論",text:"角度：適合做完整層次分析——系統層次的多極均勢瓦解、國家層次的德國世界政策、個人層次的威廉二世風格。"}]},
  {id:"wwi-course",region:"west",period:"④集團對立期 1890–1914",year:"1914–1918",title:"第一次世界大戰的爆發與經過",spec:"core",
    narrative:"1914年6月28日，奧匈帝國皇儲斐迪南大公夫婦於塞拉耶佛遇刺，奧匈藉此對塞爾維亞提出最後通牒，7月28日對塞宣戰。俄國基於泛斯拉夫主義展開軍事動員；德國依同盟義務對俄宣戰，並依施里芬計畫於8月對法宣戰，取道比利時入侵法國；英國因德國違反比利時中立承諾對德宣戰。短短一個月內，主要強權依循同盟義務連鎖捲入戰爭。戰爭初期德國速勝計畫受阻（馬恩河戰役），陷入西線壕溝戰的長期消耗僵局。1917年，美國因德國無限制潛艇戰及齊瑪曼電報事件宣布參戰；同年俄國爆發十月革命，與德國單獨媾和退出戰爭。1918年同盟國相繼崩潰，德皇退位，11月11日簽署停戰協定，大戰結束。",
    knowledge:["施里芬計畫核心邏輯是先西後東、速戰速決，但計畫失敗導致德國正陷入其最擔心的兩線戰爭","英國參戰的直接觸發點是德國入侵比利時，而非單純同盟義務——英國並無正式軍事同盟條款，參戰保有相當自主性","美國參戰兩大導火線：無限制潛艇戰、齊瑪曼電報事件","俄國退出戰爭讓德國得以西調兵力，一度延長戰爭，但美國參戰的資源優勢最終壓倒同盟國"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：一戰爆發完美示範同盟連鎖效應——各國因既有同盟義務被迫捲入原本無關的區域衝突，顯示僵化同盟體系反而可能升高戰爭風險。"},{label:"外交史方法論",text:"角度：適合完整層次分析——系統層次的僵化同盟結構、國家層次的施里芬計畫戰略焦慮、個人層次的斐迪南遇刺偶發性。"},{label:"建構主義",text:"角度：塞爾維亞民族主義、泛斯拉夫主義等意識形態動員是推動衝突升級的重要因素。"},{label:"依賴理論／IPE",text:"角度：美國參戰後大量軍需輸出協約國，加速美國從債務國轉為債權國的角色轉變。"}]},
  {id:"paris-peace",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1919",title:"巴黎和會與凡爾賽體系",spec:"core",
    narrative:"一戰結束後，協約國於1919年1月在巴黎召開和會，由美國總統威爾遜、英國首相勞合喬治、法國總理克里蒙梭三巨頭主導。威爾遜提出十四點原則，主張民族自決、公開外交、建立國際聯盟，但法國堅持對德施以嚴厲懲罰性條款，雙方理念衝突。1919年6月簽訂《凡爾賽條約》：德國須負戰爭罪責並支付鉅額賠款、陸軍限制10萬人以下、萊茵蘭非軍事化、割讓阿爾薩斯洛林、喪失所有海外殖民地（改由戰勝國委任統治）。條約同時創設國際聯盟，但美國參議院未批准條約、未加入國聯，是最大先天缺陷。東亞方面，日本繼承德國在山東權益，中國雖為戰勝國卻未能爭回山東，消息傳回激起五四運動，中國代表團拒絕簽字。",
    knowledge:["十四點原則是威爾遜理想主義外交代表作，核心含公開外交、航行自由、民族自決、建立國際聯盟","美國國會未批准凡爾賽條約、未加入國際聯盟，是這個體系最大的先天缺陷","山東問題是巴黎和會對中國最大的傷害，直接導致五四運動，與膠州灣事件、瓜分危機主線相互連結","{{委任統治}}是戰勝國瓜分戰敗國殖民地的新包裝形式，實質仍是變相殖民","法國堅持嚴厲懲罰德國，埋下納粹崛起的遠因"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：國際聯盟代表首次系統性嘗試以多邊制度取代權力平衡維持和平，但美國未加入的缺陷印證制度若缺乏強權支持、實效大打折扣。"},{label:"現實主義",text:"角度：法國堅持懲罰性條款是傳統權力平衡思維下削弱對手的策略操作，與威爾遜理想主義形成張力。"},{label:"國際公法",text:"角度：{{委任統治}}制度是國際法首次將殖民地治理國際化的嘗試，為二戰後託管制度埋下先例。"},{label:"民族主義",text:"角度：巴黎和會激起中國五四運動及殖民地世界對民族自決理念的期待與失望，催化了全球殖民地民族主義運動。"}]},
  {id:"interwar-collapse",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1919–1939",title:"兩次大戰間期的和平嘗試與崩潰",spec:"core",
    narrative:"1925年歐洲強權簽訂《羅加諾公約》，德國自願承認與法比之間的西部邊界不可侵犯，隨後於1926年加入國際聯盟，重返國際社會核心。1928年美法主導簽訂《非戰公約》，多國宣示放棄以戰爭解決爭端，但無實質約束力。然而國際聯盟結構性缺陷始終未解：美國未加入、全體一致決效率低落、無常設武力執行決議。1929年華爾街股市崩盤引發全球經濟大蕭條，連帶重創德國經濟，為極端民族主義提供溫床，希特勒於1933年掌權。日本早於1931年發動九一八事變，國聯雖裁定其侵略屬實卻無力制裁，日本乾脆退出國聯（1933）。1935年義大利入侵衣索比亞，國聯同樣制裁無效。1936年希特勒進兵萊茵蘭非軍事區，英法姑息未加阻止；1938年英法在慕尼黑會議對希特勒兼併捷克蘇台德區採取姑息政策。1939年德國入侵波蘭，英法對德宣戰，二戰爆發，20年和平嘗試徹底失敗。",
    knowledge:["《羅加諾公約》最大贏家是德國——藉此重返國際社會、加入國聯，卻未實質放棄對東部領土的修正主張","《非戰公約》（1928）雖具重要象徵意義，但完全缺乏執行機制","國際聯盟結構性缺陷：全體一致決、無常設武力、美國未加入，三者疊加導致完全無力制裁侵略","{{姑息政策}}是常考關鍵詞，指英法對修正主義國家擴張採取退讓妥協，結果適得其反","經濟大蕭條（1929）是連結一戰後秩序崩潰與二戰爆發的關鍵結構性因素"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：國際聯盟集體安全機制的失敗，印證缺乏強制力的國際制度終將淪為紙老虎——當修正主義強權決心以武力改變現狀，道德譴責與經濟制裁完全無法產生嚇阻效果。"},{label:"依賴理論／IPE",text:"角度：經濟大蕭條的全球連鎖效應，顯示國際政治經濟結構性因素如何直接催化極端政治勢力崛起。"},{label:"外交史方法論",text:"角度：{{姑息政策}}適合做個人與國家層次分析——英法對一戰慘烈傷亡記憶猶新的心理狀態，與自身國力相對衰落的結構性侷限交織。"},{label:"建構主義",text:"角度：凡爾賽條約強加的戰爭罪責條款深刻傷害德國民族自尊，為納粹復仇雪恥的民族主義敘事提供了肥沃土壤。"}]},
  {id:"nazi-expansion",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1933–1941",title:"納粹德國擴張與第二次世界大戰前期",spec:"core",
    narrative:"1933年希特勒憑藉經濟大蕭條催化的民怨與民族主義訴求合法掌權，隨即撕毀凡爾賽條約軍力限制，秘密重整軍備、恢復徵兵制。1936年進兵萊茵蘭非軍事區，英法姑息未加阻止；同年德義簽訂軸心協定，隔年日本加入形成三國軸心雛形。1938年德國兼併奧地利（德奧合併），同年英法在慕尼黑會議對希特勒兼併捷克蘇台德區的要求採取姑息政策，幻想以退讓換取和平。1939年3月，德國進一步佔領捷克斯洛伐克全境，徹底暴露姑息政策的失敗；同年8月，德國與蘇聯簽訂《德蘇互不侵犯條約》，雙方秘密協議瓜分波蘭與東歐勢力範圍，解除了德國東西兩線同時作戰的疑慮。1939年9月1日，德國入侵波蘭，英法對德宣戰，第二次世界大戰正式爆發。1940年，德國以閃電戰迅速擊敗丹麥、挪威、荷蘭、比利時，並繞過法國馬奇諾防線攻陷法國，法國投降，僅剩英國在邱吉爾領導下孤軍奮戰、頑強抵抗德國空軍的不列顛戰役轟炸。1941年6月，希特勒撕毀德蘇互不侵犯條約，發動{{巴巴羅薩行動}}入侵蘇聯，戰事自此進入更大規模的擴張階段。",
    knowledge:["希特勒的擴張採取「切香腸」戰術——每次僅推進一小步（萊茵蘭、奧地利、蘇台德區），試探英法反應底線，待確認對方持續姑息後才進行下一步更大膽的擴張","《德蘇互不侵犯條約》（1939）是意識形態極端對立的納粹德國與蘇聯基於各自現實利益考量而締結的合作，是現實主義「敵人的敵人未必是朋友，但共同利益可以暫時凌駕意識形態」的經典案例","法國馬奇諾防線的失敗，展現靜態防禦工事在機械化閃電戰面前的過時侷限，是軍事戰略思想演進的重要教材","不列顛戰役是英國首次成功抵禦德國空中攻勢的關鍵戰役，也是希特勒放棄跨海入侵英國計畫的轉捩點"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：希特勒的漸進式擴張精準利用了英法姑息政策的心理弱點，每一步都在測試對手的抵抗意志底線，是「切香腸戰術」與「試探性擴張」的教科書案例。"},{label:"外交史方法論",text:"角度：適合比較希特勒的擴張策略與俾斯麥鐵血政策的差異——俾斯麥精算「有限戰爭達成有限目標」後即收手，希特勒則缺乏這種節制、擴張野心不斷升級，最終導致失控。"},{label:"建構主義",text:"角度：納粹意識形態中的生存空間論、種族優越論，將侵略擴張建構為德意志民族生存所必需的道德正當性敘事，是意識形態如何形塑國家對外行為的極端案例。"},{label:"依賴理論／IPE",text:"角度：德蘇互不侵犯條約背後也包含經濟合作條款（德國以工業品換取蘇聯原料），顯示意識形態對立的兩國仍可能因經濟互補性而在短期內達成戰略合作。"}]},
  {id:"wwii-course",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1941–1945",title:"第二次世界大戰的擴大與結束",spec:"core",
    narrative:"納粹德國於1941年6月發動{{巴巴羅薩行動}}入侵蘇聯，撕毀先前的德蘇互不侵犯條約，東線戰事全面展開，蘇聯雖初期節節敗退，但憑藉戰略縱深與嚴冬拖垮德軍攻勢（莫斯科保衛戰）。同年12月，日本偷襲珍珠港，美國正式參戰，太平洋戰爭全面爆發，美國同時對德義宣戰，歐洲、太平洋兩大戰場合流為真正的世界大戰。1942–43年是戰爭轉捩點：史達林格勒戰役蘇軍重創德軍主力、中途島海戰美軍重挫日本海軍優勢，同盟國自此轉守為攻。1943年11月，美英中三國領袖於埃及召開開羅會議，發表《開羅宣言》，明訂戰後日本應歸還台灣、澎湖予中華民國，並同意戰後朝鮮獨立。1944年6月盟軍於諾曼第登陸，開闢歐洲第二戰場；同年蘇聯亦自東線大舉反攻。1945年4月希特勒自殺，德國於5月無條件投降，歐戰結束。同年7月，美英中三國發表《波茨坦宣言》，要求日本無條件投降，遭拒後，美國於8月對廣島、長崎投下原子彈，蘇聯同時對日宣戰，日本於8月15日宣布投降，9月2日簽署降書，第二次世界大戰正式結束。",
    knowledge:["《開羅宣言》（1943）明訂台灣、澎湖歸還中華民國，是我國主張對台灣主權的重要國際法依據之一，也是常考的關鍵條約性文件","《波茨坦宣言》（1945）是對日本要求無條件投降的文件，發布時希特勒已死、德國已投降，不要與處理德國問題的文件搞混——這是考古題明確考過的陷阱","史達林格勒戰役與中途島海戰分別是歐洲、太平洋戰場的關鍵轉捩點，常考戰爭轉折點比較題","原子彈使用是人類史上首次、也是唯一一次在實戰中使用核武器，直接催生戰後核武嚇阻理論與軍備管制議題","戰後同盟國於德國組成{{紐倫堡大審}}，追究納粹戰犯的戰爭罪責與危害人類罪，是近代國際法首次系統性追究國家領導人罪責的重要先例"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：同盟國基於共同威脅暫時擱置意識形態差異結盟，是敵人的敵人是朋友的極致案例，也預示戰後共同威脅消失後同盟必然瓦解、走向冷戰對抗。"},{label:"外交史方法論",text:"角度：適合層次分析——個人層次（高峰會外交）、國家層次（美國龐大工業產能）、系統層次（兩大陣營結盟對抗軸心國）。"},{label:"國際公法",text:"角度：《開羅宣言》雖非正式條約，卻在戰後被視為具有國際法效力的重要文件，是研究政治宣言法律效力的經典案例。"},{label:"依賴理論／IPE",text:"角度：美國透過租借法案大量軍援盟國，本土未受戰火波及、工業產能全速擴張，奠定戰後美國成為全球經濟霸權的物質基礎。"}]},
  {id:"bretton-woods",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1944",title:"布雷頓森林體系與戰後國際經濟秩序",spec:"core",
    narrative:"有鑑於兩次大戰間期各國競相採取保護主義、貨幣競貶，導致國際貿易萎縮、加深經濟大蕭條的慘痛教訓，1944年7月，44個同盟國代表於美國新罕布夏州布雷頓森林召開會議，由美國主導設計戰後國際貨幣與金融秩序。會議確立布雷頓森林體系：美元與黃金掛鉤，其他國家貨幣則與美元掛鉤形成固定匯率制度，美元成為事實上的國際準備貨幣。同時創設兩大國際經濟組織：國際貨幣基金（IMF），負責監督匯率穩定、提供國際收支危機國家短期融通；國際復興開發銀行（即世界銀行前身），負責提供戰後重建與開發中國家長期貸款。這套體系奠定了戰後西方陣營經濟合作的制度基礎，直到1971年美國尼克森總統宣布美元與黃金脫鉤為止，運作近30年。",
    knowledge:["IMF核心任務是確保國際支付體系穩定（而非直接消除貧窮或推動永續發展，那是世界銀行與聯合國其他機構的任務）——常考的功能區分題","布雷頓森林體系是自由主義國際政治經濟學國際制度促進合作理論的具體實踐案例，直接呼應戰間期經濟大蕭條保護主義的慘痛教訓","美元與黃金掛鉤、各國貨幣與美元掛鉤的雙層固定匯率設計，確立美元作為國際準備貨幣的核心地位，是美國戰後經濟霸權的制度基礎","1971年尼克森宣布美元金本位脫鉤（尼克森震撼），布雷頓森林固定匯率體系正式終結，但IMF、世界銀行兩大機構持續運作至今"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：布雷頓森林體系具體實踐新自由制度主義核心主張——透過國際制度設計協助國家因應經濟危機、減少各國以自利方式轉嫁自我損失的誘因，可與戰間期經濟大蕭條的教訓直接對照。若套用[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]框架，這是美國選擇制度化約束／制度戰略的成熟實踐，與一戰後美國棄守國際聯盟的退出戰略形成鮮明對比。"},{label:"依賴理論／IPE",text:"角度：美元作為國際準備貨幣的核心地位，某種程度上讓美國得以用本國貨幣融通全球貿易與債務，享有{{囂張特權}}，是理解戰後美元霸權與國際金融結構性不對等的重要起點。"},{label:"現實主義",text:"角度：儘管以國際合作包裝，布雷頓森林體系的設計主導權掌握在美國手中，美元中心地位本質上仍是美國在戰後權力真空期鞏固自身經濟霸權的策略性安排。"}]},
  {id:"yalta-potsdam",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1945",title:"雅爾達會議與戰後歐洲秩序安排",spec:"core",
    narrative:"1945年2月，德國敗象已定，美國羅斯福、英國邱吉爾、蘇聯史達林於克里米亞半島雅爾達召開會議，商討戰後歐洲秩序與對日作戰安排。會議決定：德國戰敗後由美英法蘇四國分區佔領、柏林市同樣劃分四區共管；波蘭東部領土劃歸蘇聯，波蘭則向西擴張、以德國東部領土補償；蘇聯承諾在歐戰結束後三個月內對日宣戰，換取庫頁島南部、千島群島及在中國東北（大連、旅順、中東鐵路）的特殊權益（此項安排事先未徵詢中華民國同意，埋下戰後中蘇交涉的爭議）；同時確立戰後成立聯合國的基本框架，安理會五常任理事國享有否決權設計。會議中，史達林同意波蘭戰後應舉行自由選舉，但戰後蘇聯實際扶植親蘇共產政權，並未履行承諾，成為冷戰爆發的重要導火線之一。同年7月，美英蘇三國於柏林近郊波茨坦召開會議，進一步確認戰後德國去納粹化、去軍事化、民主化原則，並劃定波蘭西界。",
    knowledge:["雅爾達會議中蘇聯對日參戰換取的東北特殊權益，事先未徵詢中華民國同意，是戰後中蘇交涉、乃至外蒙古獨立公投的直接源頭","波蘭自由選舉承諾未履行，是雅爾達體系最大的道德爭議，也是冷戰史觀中西方對蘇聯過度信任、事後才發現被騙敘事的關鍵起點","聯合國安理會五常任理事國否決權設計，即源自雅爾達會議的基本框架，常與國際聯盟全體一致決設計做對比申論","波茨坦會議（1945年7月，處理歐洲德國問題）與波茨坦宣言（1945年7月，要求日本投降的最後通牒）是兩份不同文件，時間相近但處理對象不同，常考混淆題"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：雅爾達會議本質是三強依實際軍事佔領態勢劃分戰後勢力範圍的權力政治操作，波蘭自由選舉承諾之所以未履行，正因為協議本身缺乏強制執行機制。"},{label:"外交史方法論",text:"角度：適合比較雅爾達體系（強權劃分勢力範圍）與稍早布雷頓森林體系（制度化多邊合作）兩種戰後秩序建構邏輯的差異——政治安全領域傾向現實主義權力劃分，經濟領域則傾向自由制度主義的多邊合作。若套用[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]框架，雅爾達會議屬於支配與棄守的混合體，缺乏制度戰略所需要的自我克制與拘束，這正是波蘭自由選舉承諾未獲履行的結構性原因。"},{label:"建構主義",text:"角度：西方對蘇聯在雅爾達的承諾抱持信任、事後才驚覺遭到背棄，反映了戰時同盟建立的共同敵人認同一旦消失，雙方對彼此意圖的認知便迅速走向猜忌與敵對。"}]},
  {id:"cold-war-origins",region:"west",period:"⑥冷戰兩極體系期 1945–1991",year:"1945–1949",title:"冷戰起源：鐵幕演說、杜魯門主義與圍堵政策",spec:"core",
    narrative:"二戰結束後，蘇聯在東歐扶植一系列親蘇共產政權，西方國家對蘇聯意圖日益警惕。1946年3月，英國前首相邱吉爾（此時已下野）應邀在美國密蘇里州富爾頓的威斯敏斯特學院發表演說（杜魯門總統在場引介，但演說者是邱吉爾本人，非杜魯門），提出鐵幕一詞，形容自波羅的海斯德汀到亞德里亞海的里雅斯特已降下一道鐵幕，蘇聯正對東歐國家進行嚴密控制，是冷戰對抗意識形態化的重要象徵性起點。1947年，希臘、土耳其面臨共產勢力威脅，英國因自身財政困窘宣布無力繼續援助，填補此一權力真空，美國總統杜魯門於國會發表演說，宣示美國將援助任何遭受共產主義威脅的自由國家，史稱杜魯門主義，正式確立美國圍堵政策（由外交官喬治．肯楠提出理論基礎）作為冷戰時期美國對蘇戰略主軸。同年，美國進一步推出馬歇爾計畫，以鉅額經濟援助協助西歐國家戰後重建。蘇聯則以共產情報局整合東歐共產黨陣營作為回應，東西方陣營壁壘日益分明。1948–49年，蘇聯封鎖西柏林對外陸路交通，美英發動大規模空運突破封鎖，蘇聯最終讓步解除封鎖，同年西方國家成立北大西洋公約組織，冷戰兩極對抗格局正式確立。",
    knowledge:["鐵幕一詞是邱吉爾（非杜魯門）於1946年在美國發表演說時提出，常考的人物誤植陷阱題","杜魯門主義的直接背景是英國因財政困窘退出東地中海（希臘、土耳其）援助責任，美國藉此填補權力真空","{{圍堵政策}}由喬治．肯楠提出理論基礎，核心是圍堵而非推翻共產勢力，透過長期消耗迫使蘇聯體制自我瓦解","馬歇爾計畫是杜魯門主義的具體經濟實踐，顯示冷戰對抗不只是軍事議題，經濟援助同樣是重要的地緣政治工具","柏林封鎖與空運是冷戰第一次重大危機考驗，雙方都刻意避免直接軍事衝突"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：{{圍堵政策}}的核心邏輯是傳統權力平衡思維在冷戰情境下的延伸，直接對比戰間期對納粹德國姑息政策失敗的教訓。"},{label:"建構主義",text:"角度：鐵幕一詞本身就是一種話語建構，將原本模糊的地緣政治分歧，轉化為清晰的意識形態陣營對立敘事，深刻形塑了往後近半世紀的國際關係認知框架。"},{label:"依賴理論／IPE",text:"角度：馬歇爾計畫展現經濟援助作為地緣政治工具的操作邏輯，援助西歐不僅是人道考量，更是鞏固資本主義陣營經濟穩定、防止共產主義藉經濟蕭條坐大的策略性投資。"},{label:"外交史方法論",text:"角度：杜魯門主義與圍堵政策某種程度上是美國決策者記取一戰後姑息政策教訓、決心及早果斷因應威脅的心理與制度學習過程，可做跨時代的政策學習比較。"}]},
  {id:"japan-korea-annexation",region:"eastasia",period:"日本近代化起點",year:"1910",title:"日韓合併",spec:"core",
    narrative:"日俄戰爭確立日本在朝鮮半島的優勢地位後，日本逐步透過《乙巳條約》（1905，取得朝鮮外交權）、《丁未條約》（1907，取得朝鮮內政監督權）蠶食朝鮮主權，並解散朝鮮軍隊。1909年，朝鮮民族志士安重根於哈爾濱刺殺主導對朝政策的日本元老伊藤博文，反而給予日本國內強硬派併吞朝鮮的藉口。1910年8月，日本強迫朝鮮簽訂《日韓合併條約》，正式將朝鮮納入版圖，改設朝鮮總督府統治，朝鮮王朝滅亡，直到1945年二戰結束後才恢復獨立。",
    knowledge:["日韓合併是日俄戰爭後果的延續，是先取得外交監督權、再取得內政監督權、最終正式併吞的三階段蠶食模式的完成","朝鮮總督府採取高壓殖民統治，推行同化政策，禁止朝鮮語教育","與同時期日本對台灣的殖民統治、對中國東北的擴張形成日本帝國版圖擴張的完整拼圖"],
    theory:[{label:"現實主義",text:"最貼近：日韓合併是日本地緣政治擴張邏輯（第一島鏈、大陸政策）的具體實現，朝鮮半島作為連接日本與滿洲大陸的戰略跳板，其重要性在日俄戰爭後已無可替代。"},{label:"民族主義",text:"角度：安重根刺殺伊藤博文是朝鮮民族主義武裝抵抗的象徵性事件，但個人恐怖主義行動未能阻止、反而加速了併吞進程。"},{label:"比較政府與政治",text:"角度：可比較日本對朝鮮（總督府直接統治）與對台灣（同樣總督府體制）殖民模式的異同。"}]},
  {id:"taisho-shidehara",region:"eastasia",period:"日本近代化起點",year:"1920s",title:"大正民主與協調外交（幣原外交）",spec:"core",
    narrative:"明治天皇逝世後進入大正時期，日本國內政黨政治與自由主義思潮一度興盛，史稱大正民主。外交路線上，外相幣原喜重郎主張協調外交，強調與英美等列強協調合作、避免片面武力擴張，並對中國採取相對溫和的不干涉內政政策。日本並簽署《九國公約》（1922年華盛頓會議），承諾尊重中國主權完整。然而，1929年全球經濟大蕭條重創日本經濟，國內軍部勢力與右翼民族主義迅速崛起，強烈批判協調外交軟弱，主張以武力解決日本的資源與市場需求，協調外交路線逐漸失勢，最終在1931年九一八事變後被徹底拋棄，日本轉向軍部主導的對外侵略路線。",
    knowledge:["大正民主與協調外交是理解日本並非從明治維新起就注定走向軍國主義侵略的重要糾正——1920年代曾有過相對溫和、與國際協調的路線選項","幣原外交的失敗展現經濟危機如何催化激進民族主義、顛覆既有溫和路線的一般性模式，可與同時期德國威瑪共和的崩潰相互比較","軍部勢力崛起、文人政府對軍隊失去控制，是理解九一八事變未經東京中央政府正式授權、由關東軍擅自發動這一特殊模式的關鍵背景"],
    theory:[{label:"外交史方法論",text:"最貼近：協調外交路線的興衰，展現國內政治結構（文人政府vs軍部）如何直接決定對外政策的溫和或激進走向，是內政決定外交的經典案例。"},{label:"依賴理論／IPE",text:"角度：經濟大蕭條的全球連鎖效應同樣重創日本經濟，為軍部激進路線提供社會土壤，可與同期德國納粹崛起的邏輯相互呼應。"},{label:"建構主義",text:"角度：1920年代溫和的協調外交與1930年代激進的大陸擴張路線，展現同一個國家的對外行為認同可以在短短十年內因國內政治結構劇變而徹底翻轉。"}]},
  {id:"taiwan-strait-crises",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1950–1960",title:"台海危機與台美共同防禦",spec:"core",
    narrative:"國共內戰後，中華民國政府1949年遷台，美國初期採取觀望態度，一度考慮放棄協防台灣。1950年6月韓戰爆發，美國評估台灣海峽若落入中共控制將威脅西太平洋防線，杜魯門總統隨即宣布台海中立化政策，派遣第七艦隊巡弋台灣海峽，防止中共渡海攻台、也防止國府反攻大陸，雙重圍堵。1954年9月，中共砲擊金門，爆發第一次台海危機，同年12月，中美簽訂《中美共同防禦條約》，確立美國協防台灣的條約義務。1958年8月，中共再度砲擊金門（八二三砲戰），爆發第二次台海危機，美國海軍協助國軍運補金門，危機隨後降溫。1960年6月，美國總統艾森豪訪問台灣，是首位在任內訪台的美國總統，進一步鞏固中美邦誼。",
    knowledge:["台海中立化政策宣布於韓戰爆發後（1950），不是1949年政府遷台當下——常考時序陷阱","中美共同防禦條約簽訂於第一次台海危機之後（1954年底），早於第二次台海危機（1958）——這個先後順序常被出成陷阱題","艾森豪1960年訪台是美國總統首次在任內訪問台灣，深化了條約關係之外的象徵性邦誼"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美國協防台灣的決策核心是圍堵共產主義擴張的地緣戰略考量，是冷戰圍堵政策在亞洲的具體實踐，而非單純道義承諾。"},{label:"外交史方法論",text:"角度：美國對台政策從1949年後期觀望考慮放棄，到韓戰後180度轉向積極協防，展現外部結構性事件如何直接扭轉一國對特定盟友的戰略評估。"}]},
  {id:"san-francisco-treaty",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1951–1952",title:"舊金山和約與中日和約",spec:"core",
    narrative:"二戰結束後，同盟國與日本的正式和平條約遲遲未能簽訂，主要因中國代表權問題懸而未決，加上冷戰對抗態勢逐漸成形。1951年9月，美國主導在舊金山召開對日和會，49個同盟國與日本簽訂《舊金山和約》，日本正式結束佔領狀態、恢復主權，並宣布放棄對台灣、澎湖的一切權利、名義與要求，但和約並未明訂台澎主權歸屬何方，成為日後台灣國際地位爭議的重要法理根源。由於中國代表權爭議，中華民國與中華人民共和國均未受邀參加舊金山和會。隔年（1952年），日本轉而與中華民國單獨簽訂《中日和約》（台北和約），確認雙方戰爭狀態結束。",
    knowledge:["舊金山和約只講日本放棄台澎主張，未明訂歸屬對象，這個法律空白正是後續台灣地位未定論爭議的條約文本根源","中日和約（1952）是中華民國在未受邀參與舊金山和會的情況下，另闢管道確立與日本正式和平關係的替代方案","兩份條約常被放在一起比較考處理台灣問題的異同"],
    theory:[{label:"國際公法",text:"最貼近：舊金山和約放棄但不明訂歸屬的文字設計，是研究條約文本模糊性如何延伸出長期政治法律爭議的經典案例。"},{label:"現實主義",text:"角度：中國代表權爭議直接反映冷戰兩大陣營對峙下，國際條約簽署本身也成為承認與否的政治工具。"}]},
  {id:"cold-war-crises",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1948–1962",title:"冷戰前期四大衝突",spec:"core",
    narrative:"冷戰初期美蘇雖未直接兵戎相見，但透過一系列代理危機與直接對峙持續測試彼此底線。1950年6月，北韓在蘇聯與中共支持下越過38度線入侵南韓，美國主導聯合國部隊介入，中共其後派遣志願軍參戰，戰事膠著至1953年停戰協定，朝鮮半島分裂狀態延續至今。1956年，埃及將蘇伊士運河收歸國有，英法夥同以色列出兵介入，美蘇罕見一致反對此軍事行動，英法被迫撤軍，象徵英法傳統殖民強權地位的終結、美蘇兩極格局的確立。1962年，蘇聯在古巴部署可攻擊美國本土的核子飛彈，美國甘迺迪政府實施海上封鎖，雙方一度瀕臨核戰邊緣，最終蘇聯撤除飛彈、美國則秘密承諾撤除土耳其飛彈並保證不入侵古巴，化解危機，是冷戰史上最接近核戰爆發的時刻。",
    knowledge:["這四場危機的正確時序常考排序題：柏林封鎖（1948–49）→韓戰（1950–53）→蘇伊士運河危機（1956）→古巴飛彈危機（1962）","蘇伊士運河危機中美蘇立場一致（皆反對英法出兵），是冷戰中罕見超越陣營對立的案例，也標誌英法傳統殖民強權從此讓位於美蘇兩極格局","古巴飛彈危機的化解方式（蘇聯撤飛彈、美國秘密撤土耳其飛彈）展現危機管理中私下換利益、公開保留顏面的外交操作模式"],
    theory:[{label:"現實主義",text:"最貼近：四場危機都圍繞著美蘇兩強在各自勢力範圍邊界的探測與反制，古巴飛彈危機尤其是核子嚇阻與危機管理理論的經典教材。"},{label:"外交史方法論",text:"角度：古巴飛彈危機的化解過程（公開與私下協議並存），是研究雙軌談判與保留顏面式外交操作手法的重要案例。"}]},
  {id:"us-china-normalization",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1970s–1980s",title:"美中關係正常化與台美關係轉折",spec:"core",
    narrative:"1960年代中蘇關係持續惡化，加上美國深陷越戰泥沼，美國開始重新評估與中共關係的可能性。1972年，美國總統尼克森訪問中國大陸，雙方發表《上海公報》，美國表示認知台灣海峽兩岸中國人均認為只有一個中國、台灣是中國一部分的立場，是美中關係正常化的第一步。1978年底，美國宣布將於隔年與中華民國斷交、與中華人民共和國建交，1979年1月發表《建交公報》，美國正式承認中華人民共和國政府為中國唯一合法政府，同時認知台灣屬於中國的立場，並與中華民國斷絕正式外交關係。為因應斷交後如何維繫與台灣的實質關係，美國國會迅速通過《臺灣關係法》（1979），以國內法形式規範美台間非官方但持續的關係。1982年，因美國對台軍售問題持續存在爭議，雙方簽署《八一七公報》，美國表示將逐步減少對台軍售，但同一時期美國政府也私下向中華民國提出六項保證，強調不會設定對台軍售的終止期限、不會事先徵詢北京意見。",
    knowledge:["三份聯合公報（上海公報1972、建交公報1979、八一七公報1982）加上台灣關係法（1979）與六項保證（1982），合稱美國一中政策的五大支柱文件——考古題常考哪個文件不屬於一中政策依據","三份公報用詞都是認知（acknowledge）兩岸中國人的立場，而非美國自己承認（recognize）台灣屬於中國，這個用詞差異是常考的精確法律語言題","六項保證與八一七公報同年（1982）但立場相對，前者是美方對台的口頭政治承諾，後者是美中之間的正式聯合公報，兩者法律位階不同"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美中關係正常化的根本動機是聯中制蘇的地緣戰略考量，而非意識形態趨同。"},{label:"外交史方法論",text:"角度：台灣關係法作為美國國內法而非國際條約，展現美國在斷交後透過法律工具創新維繫實質關係的操作模式。"},{label:"國際公法",text:"角度：三公報認知而非承認的用詞設計，保留了美國在台灣地位問題上的策略性模糊空間。"}]},
  {id:"vietnam-war",region:"modern",period:"⑥兩岸分治外交期 1949–1979",year:"1955–1975",title:"越戰與越戰越南化政策",spec:"core",
    narrative:"二戰後越南分裂為南北兩部分，北越在蘇聯與中共支持下推動共產統一，美國基於圍堵政策的骨牌理論（擔心一國赤化將引發鄰近國家連鎖倒向共產陣營），自1950年代起逐步介入南越內戰，1965年後大規模派遣地面部隊直接參戰。然而戰爭陷入長期消耗，美軍傷亡持續攀升，國內反戰運動高漲。1969年就任的尼克森總統推動越戰越南化政策，逐步將地面作戰責任移交南越政府軍隊、同步撤出美軍地面部隊，象徵美國明確表達不再積極以地面部隊涉入亞洲地區戰事的立場轉變。美軍於1973年完全撤出，1975年北越攻陷西貢，南越政府瓦解，越南實現共產統一。",
    knowledge:["越戰越南化是尼克森政府提出的政策，用以逐步將作戰責任轉交南越政府，減少美軍直接介入——常考的政策提出者配對題","越戰失敗深刻影響美國此後數十年的外交決策心理（越戰症候群），成為理解後續美國對海外軍事介入更加謹慎的重要背景","越戰是骨牌理論在實踐中失敗的重要案例，直接影響美國此後對圍堵政策操作方式的反思"],
    theory:[{label:"現實主義",text:"最貼近：越戰是圍堵政策骨牌理論的具體實踐，但實踐結果顯示地緣政治理論的機械式套用可能忽略在地民族主義等其他變數。"},{label:"外交史方法論",text:"角度：越戰症候群展現重大外交挫敗如何深刻形塑此後數十年的政策決策心理，可與一戰後歐洲的姑息政策心理做跨案例比較。"}]},
  {id:"european-integration",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1950–2009",title:"歐洲整合史",spec:"core",
    narrative:"二戰後歐洲滿目瘡痍，法國外長舒曼於1950年提出舒曼計畫，主張將法德兩國的煤礦與鋼鐵生產置於共同管理機構之下，透過經濟利益的深度綁定，讓法德再度兵戎相見在實務上變得不可行。此構想由莫內、舒曼、義大利總理卡斯佩里等人共同推動，被稱為歐洲整合之父。1952年，法、德、義、荷、比、盧六國成立歐洲煤鋼共同體，是歐洲整合最早成功的機構性嘗試，採取由下而上的功能主義路徑，從低階技術性經濟合作領域逐步外溢至更高階的政治合作領域。此後歐洲整合持續深化：1957年羅馬條約成立歐洲經濟共同體；1993年馬斯垂克條約生效，正式成立歐洲聯盟，確立三大支柱架構；2009年里斯本條約生效，設立歐盟高峰會主席與外交安全政策高級代表等職位，強化歐盟整體對外代表性。目前歐盟擁有27個成員國、4億人口，官方語言多達24種。",
    knowledge:["歐洲整合三位公認的整合之父：莫內、舒曼、卡斯佩里——常考人物配對題","歐洲整合採取由下而上的功能主義路徑，而非由上而下先政治後經濟——常見的錯誤陷阱選項方向","歐洲煤鋼共同體（1952）是最早成功的整合機構，也是後續歐洲經濟共同體、歐盟的制度起點","馬斯垂克條約（1993）三大支柱架構、里斯本條約（2009）強化歐盟對外代表性的職位設計，是歐盟機構演變的關鍵節點"],
    theory:[{label:"自由主義／國際制度",text:"最貼近考古題方向：歐洲整合是功能主義與新功能主義理論最重要的實踐案例，驗證國際制度能夠深化國家間合作、甚至逐步侵蝕傳統主權疆界。"},{label:"建構主義",text:"角度：歐洲整合過程也伴隨著歐洲認同的逐步建構，是觀察超國家認同如何在制度合作基礎上逐漸形成的案例。"},{label:"現實主義",text:"角度：部分學者仍以現實主義角度解讀歐洲整合，認為其本質仍是法德兩大強權透過制度化合作管理彼此權力關係、避免重蹈兩次大戰覆轍的權力政治安排。"}]},
  {id:"cold-war-end",region:"modern",period:"⑦臺美關係新階段期 1979–迄今",year:"1985–1991",title:"冷戰結束與蘇聯解體",spec:"core",
    narrative:"1985年戈巴契夫就任蘇聯領導人後，推動開放政策與重建政策，嘗試對蘇聯僵化的政治經濟體制進行改革，卻意外加速了體制本身的鬆動與東歐衛星國的離心力。蘇聯因長期軍備競賽與入侵阿富汗戰爭（1979–89）的龐大軍費支出，經濟已瀕臨崩潰邊緣，難以再支撐對東歐集團的控制力道。1989年，東歐各國共產政權相繼垮台，同年11月柏林圍牆倒塌，成為冷戰結束最具象徵性的畫面。1990年，東西德在國際各方協商下完成統一。1991年，波羅的海三國率先宣布脫離蘇聯獨立，成為蘇聯解體的第一槍，同年底，蘇聯正式解體，長達近半世紀的冷戰兩極對抗格局宣告終結。",
    knowledge:["戈巴契夫是積極推動改革（開放與重建政策），而非拒絕改革——常考的因果方向陷阱題","蘇聯因軍備競賽與阿富汗戰爭幾近經濟崩潰，是促成戈巴契夫改革與蘇聯解體的重要結構性背景","波羅的海三國宣布獨立（1991）被視為冷戰結束、蘇聯解體的重要先聲，早於蘇聯正式解體","東西德統一（1990）也是加速冷戰結束進程的重要指標性事件"],
    theory:[{label:"現實主義",text:"最貼近：蘇聯經濟實力的相對衰退是解釋其最終無法維持超級強權地位、被迫從東歐撤出控制力的物質性因素。"},{label:"建構主義",text:"角度：戈巴契夫改革所釋放的思想自由化氛圍，動搖了東歐各國對共產意識形態正當性的認同基礎，觀念層次與物質層次的變化交織，共同促成冷戰終結。"},{label:"外交史方法論",text:"角度：適合做漸進式改革意外引發體制崩潰的分析——戈巴契夫原意是挽救蘇聯體制，最終卻加速了體制的瓦解。"}]},
];
