var THEORY_CARDS = [
  {id:"game-theory-prisoners-dilemma",title:"賽局理論／囚徒困境",definition:"賽局理論分析多個理性行為者在互動決策情境下的策略選擇，囚徒困境是其中最經典的模型——兩個行為者若能互相信任合作，雙方都能獲得次佳但穩定的結果；但由於缺乏可信的合作保證機制，雙方基於理性自利計算，往往各自選擇背叛，導致雙方最終都陷入比合作更差的結果。這個邏輯正是解釋安全困境、軍備競賽等現實主義核心命題「明知合作對雙方都好，卻難以達成」的方法論基礎。",applications:[{context:"安全困境的方法論基礎",note:"即使雙方都清楚裁軍對彼此有利，但因缺乏互信與可信承諾機制，仍傾向繼續擴軍以防對方背叛，可與[[theory|security-dilemma|安全困境]]理論卡相互呼應"}],note:"是跨範式的中層分析工具，而非特定範式本身——現實主義、自由主義學者皆可運用賽局理論的邏輯架構分析國家合作與衝突行為，差異在於對「能否建立可信合作機制擺脫困境」抱持樂觀或悲觀態度"},
  {id:"security-dilemma",title:"安全困境",definition:"指一國為求自保而增強軍備或擴大勢力範圍，卻使他國感到威脅而採取反制措施，雙方陷入螺旋式擴張、彼此都不曾更安全的困境。源於國際體系的無政府狀態下，一國無法確知他國是否具有侵略意圖，只能以最壞情況設想並預作防範。",scholars:"赫茲（John Herz）最早提出概念，後由 Jervis 等學者進一步發展",applications:[{context:"俄羅斯入侵烏克蘭（2022）",note:"112年申論題直接考此角度：北約東擴被俄羅斯視為安全威脅，烏克蘭尋求加入北約又被俄羅斯視為進一步威脅，雙方陷入安全困境螺旋"},{context:"列強瓜分中國（1897–98膠州灣事件）",note:"德國強佔膠州灣後，俄英法立即跟進強租港灣，深怕自己在瓜分競賽中落後，是近代史上的安全困境案例"}]},
  {id:"balance-of-power",title:"權力平衡理論",definition:"主張當某一強權實力膨脹到可能支配整個體系時，其他國家會透過內部抗衡（增強自身軍備）或外部抗衡（結盟）來恢復力量平衡，避免任一強權獨大、確保體系穩定。是古典現實主義與結構現實主義的核心命題之一。",scholars:"摩根索（Hans Morgenthau）、沃爾茲（Kenneth Waltz）；沃爾特（Stephen Walt）提出修正版威脅平衡理論",applications:[{context:"烏克蘭應對俄國干預（2022年前）",note:"113年申論題直接考：烏克蘭如何運用內部平衡與外部平衡因應俄國威脅"},{context:"七次反法同盟對抗拿破崙（1792–1815）",note:"英國作為離岸平衡者結合歐陸各國制衡法國獨大，是權力平衡理論的歷史經典案例，詳見[[west|napoleonic-wars|拿破崙戰爭與反法同盟]]事件卡"},{context:"美國抗衡中國崛起",note:"111年申論題考拜登政府採取的內部與外部抗衡措施"}],note:"與權力轉移理論的關鍵差異——本理論認為權力均衡帶來穩定和平；權力轉移理論則認為權力均衡（尤其新興強權即將追平既有強權時）才是最危險的階段，兩者對權力分布均等是否有利和平的判斷方向相反，考古題常考這個對比陷阱"},
  {id:"balance-of-threat",title:"威脅平衡理論",definition:"由沃爾特（Stephen Walt）提出，修正傳統權力平衡理論僅以總體實力大小判斷抗衡對象的侷限，主張國家真正抗衡的對象是威脅程度最高、而非單純實力最強的國家。威脅程度需綜合考量四項因素：總體實力、地理鄰近性、攻擊性軍事能力、以及對方展現的侵略意圖。此理論能解釋許多權力平衡理論無法完滿說明的現象——例如國家有時不抗衡最強大的鄰近強權，卻抗衡實力較弱但意圖明顯具侵略性的國家。",scholars:"沃爾特（Stephen Walt）",applications:[{context:"俄國於克里米亞戰爭後轉向遠東擴張",note:"俄國將擴張焦點轉向對其威脅感知較低的中國東北，而非持續正面對抗歐洲列強，詳見[[west|crimean-war|克里米亞戰爭]]事件卡"},{context:"當代國家評估中國崛起的威脅程度",note:"不僅看總體實力，也需納入地緣鄰近性與意圖展現，是分析當代抗衡行為的實用延伸工具"}],note:"與權力平衡理論的差異——傳統權力平衡理論的抗衡對象判斷標準是誰最強，威脅平衡理論則主張應判斷誰最具威脅，兩者在解釋抗衡對象選擇時可能得出不同結論，是常考的理論比較延伸方向"},
  {id:"power-transition",title:"權力轉移理論",definition:"由歐根斯基（A.F.K. Organski）提出，主張國際體系本質上是階層化（而非單純無政府）的，體系頂端存在一個主導強權，戰爭最可能發生在新興挑戰者的實力即將追平主導強權（權力轉移／均等化）、且該挑戰者對現狀不滿（修正主義傾向）的階段——關鍵不在權力是否平衡，而在挑戰者是否滿意現狀。",scholars:"歐根斯基（A.F.K. Organski）",applications:[{context:"以色列與哈瑪斯衝突（2023年後）",note:"114年申論題考：運用權力轉移理論分析衝突並提出解決方案"},{context:"美中權力轉移辯論",note:"修昔底德陷阱概念（艾利森）常與權力轉移理論相互引用，探討崛起強權與既有霸權之間的結構性衝突風險"}],note:"注意與權力平衡理論方向相反——本理論主張權力越接近均等、越危險，而非越平衡越和平"},
  {id:"classical-realism",title:"古典現實主義",definition:"主張國際政治衝突的根源在於人性中先天存在的權力慾望，國家作為人類集體行動的載體，自然表現出對權力的追求。摩根索提出「以權力界定的利益」作為理解國際政治的核心概念，強調政治家的治國之術、外交審慎等主觀能動性，即使處於無政府體系，仍可透過高超的權力平衡操作緩解衝突，因此兼具描述性與規範性色彩。",scholars:"摩根索（Hans Morgenthau）；思想淵源可溯及修昔底德、馬基維利、霍布斯",applications:[{context:"俾斯麥的聯盟體系操作",note:"透過複雜聯盟體系（三皇同盟等）操作歐洲權力平衡，是治國之術駕馭權力政治的典範案例"},{context:"112年四等第22題",note:"考摩根索認為權力平衡是國家追求利益下的必然結果，與沃爾茲「各自獨立維持」的結構性詮釋形成對比"}],note:"與新現實主義（結構現實主義）的關鍵差異——本理論將衝突根源歸因於人性（單位層次），新現實主義則歸因於無政府體系結構本身（體系層次），兩者方法論起點完全不同，是112年考古題常考的對比陷阱，詳見[[theory|neorealism|新現實主義（結構現實主義）]]卡片"},
  {id:"neorealism",title:"新現實主義（結構現實主義）",definition:"沃爾茲於《國際政治理論》中主張，國家行為的決定因素並非人性，而是國際體系的結構——體系處於無政府狀態、各國功能相似、國家間唯一差異在於能力分布，這使得理性國家在自助體系下即使不具侵略性人性，也會為求生存追求安全與權力。沃爾茲強調應以體系層次而非單位層次（國內政治、領導人心理）解釋國家行為的整體模式，是結構現實主義、後續攻勢/守勢現實主義的共同理論起點。",scholars:"沃爾茲（Kenneth Waltz）",applications:[{context:"109年四等第3題",note:"考沃爾茲分析單極體系不穩定的原因，特別排除「理念遭質疑」這種觀念層次論點，凸顯結構現實主義純物質性分析的特色"},{context:"112年三等第10題",note:"考結構現實主義三個基本假設（無政府狀態、國家相似性、能力分布決定體系性質）"}],note:"與古典現實主義的差異見[[theory|classical-realism|古典現實主義]]卡片；本理論是攻勢現實主義、守勢現實主義、新古典現實主義等後續子分支的共同理論基礎，詳見攻勢／守勢／結構／新古典現實主義卡片"},
  {id:"realism-variants",title:"攻勢／守勢／結構／新古典現實主義",definition:"此四流派皆建立在沃爾茲新現實主義（結構現實主義）的體系層次分析框架之上，是對「國家該追求多少權力」這個問題的進一步分化，詳見[[theory|neorealism|新現實主義（結構現實主義）]]卡片。現實主義內部依對國家該追求多少權力及國家意圖是否可知的不同假設，分化出多個流派——攻勢現實主義主張國家應持續追求權力極大化，安全是有限資源、他國增長必是自身損失；守勢現實主義主張國家只需追求足夠的安全，過度擴張反而招致反制；結構現實主義強調體系結構（無政府狀態、國家能力分布）決定國際關係的形式；新古典現實主義則額外納入國家內部因素（決策者認知、國內政治）解釋對外政策的具體選擇，並區分國家對現狀的滿足或修正主義傾向。",scholars:"米爾斯海默（攻勢）、沃爾茲（結構）、新古典現實主義代表學者包括Randall Schweller等",applications:[{context:"108年申論題",note:"直接要求列出攻勢現實主義與守勢現實主義代表學者，並比較兩者對權力的看法"},{context:"112年選擇題",note:"考結構現實主義三個基本假設，並考國家追求相對利益而非絕對利益"}]},
  {id:"neoliberal-institutionalism",title:"新自由制度主義",definition:"主張國際體系雖仍處於無政府狀態，但透過國際制度（國際組織、條約、建制）的建立，可以降低交易成本、增加資訊透明度、提高背信成本，進而促進國家間合作，緩和純粹權力政治的衝突傾向。與現實主義最大差異在於是否相信制度能夠實質改變國家行為。",scholars:"基歐漢（Robert Keohane）",applications:[{context:"109年申論題",note:"考戰爭約制因素及川普政府外交戰略對這些因素的挑戰"},{context:"布雷頓森林體系（1944）",note:"是新自由制度主義的歷史實踐案例，詳見[[west|bretton-woods|布雷頓森林體系]]事件卡"},{context:"114年四等第22題",note:"這場辯論被稱為新自由主義與新現實主義大辯論（Neo-Neo Debate），考「國際政治為零和遊戲、合作困難」是現實主義而非新自由主義主張——新自由主義的核心正是強調複合互賴下合作可能性與國際建制的規範能力"}]},
  {id:"complex-interdependence",title:"複雜互賴理論",definition:"由基歐漢與奈伊提出，主張當代國際關係已從單純的國家中心、軍事安全優先模式，演變為多元行為者、多重溝通管道並存、軍事力量重要性相對下降的複雜互賴狀態，不同議題領域（經濟、環境、安全等）呈現不同的互賴模式與權力分布，不能一概而論。複合互賴進一步可拆解為兩個分析維度——敏感互賴指一國政策變動對他國造成成本或影響的速度與程度（變動多快就會波及對方）；脆弱互賴則指即使調整政策後，仍然難以擺脫、付出高昂代價才能脫離這種互賴關係的程度（調整後還是很難脫身）。兩者常被誤認為同一件事，但敏感互賴談的是反應速度，脆弱互賴談的是脫身難度，是常考的精確區辨。",scholars:"基歐漢（Robert Keohane）、奈伊（Joseph Nye）",applications:[{context:"112年選擇題",note:"考複雜互賴理論的核心內容，特別考軍事力量重要性下降而非不可取代這個常見誤解"}]},
  {id:"dependency-world-system",title:"依賴理論／世界體系理論",definition:"源自馬克思主義的國際政治經濟學傳統，主張全球資本主義體系結構性地劃分為核心（已開發工業國）與邊陲（開發中原料出口國）兩大陣營，核心國家透過不平等的國際貿易與金融分工持續榨取邊陲資源與剩餘價值，邊陲國家因此長期陷入低度發展、依賴核心國家的結構性困境，難以單靠自身努力翻身。世界體系理論進一步在核心與邊陲之間加入半邊陲概念，說明部分國家可能透過特定歷史機遇從邊陲晉升半邊陲，但整體資本主義世界體系的核心—邊陲剝削結構本身難以撼動。",scholars:"華勒斯坦（世界體系理論）；普雷維什、法蘭克（依賴理論早期奠基者）",applications:[{context:"近代中國被迫編入條約體系",note:"淪為原料供應與商品傾銷市場，是依賴理論解釋近代中國經濟邊陲化的經典案例"},{context:"當代開發中國家全球供應鏈困境",note:"長期居於低附加價值代工位置，難以突破核心國家掌握的技術與資本優勢，是依賴理論在當代的延伸應用"}],note:"與現實主義、自由主義最大差異在於分析單元不是國家間的權力或制度互動，而是全球資本主義體系本身的結構性剝削關係，是理解國際政治經濟學（IPE）議題時不可或缺的第三種視角"},
  {id:"english-school",title:"英國學派／國際社會理論",definition:"介於現實主義與自由主義之間的第三條路徑，主張國際體系不只是現實主義所說的純粹無政府權力鬥爭場域，國家間長期互動已形成一個具有共同規則、慣例、制度的國際社會，主權國家儘管沒有更高權威可以強制執行規範，卻仍普遍遵守外交豁免權、條約信守、戰爭法等共同規範，形成一種介於無政府狀態與世界政府之間的中間狀態。",scholars:"布爾（Hedley Bull）、懷特（Martin Wight）",applications:[{context:"維也納會議與歐洲協商體系",note:"基於共同外交慣例運作的多邊協調機制，是國際社會如何在無政府狀態下仍能維持共同規範運作的歷史案例，詳見[[west|vienna-congress|維也納會議與歐洲協商體系]]事件卡"}],note:"可與集體安全理論、自由國際秩序做對照比較——英國學派強調的是國家間自發形成的共同規範與慣例，而非正式制度化的國際組織設計，是解釋前現代外交史（尚無正式國際組織前）如何仍存在秩序與規範的重要理論工具"},
  {id:"wedge-strategy",title:"楔形策略",definition:"指一國企圖分化、削弱對手陣營內部團結的策略——透過提供經濟誘因、安全保障或其他利益，拉攏對手陣營中原本立場搖擺或利益考量不同的成員，使其與陣營核心產生疏離，達到不戰而弱化對方聯盟的效果。",applications:[{context:"中國深化與太平洋島國關係",note:"111年申論題直接考：以楔形策略視角分析中國此舉的戰略意義，並評估機會與挑戰"}]},
  {id:"asean-centrality",title:"東協中心性／東協模式",definition:"東協中心性指東協在東亞區域整合與安全架構中，堅持扮演核心主導角色、不願被域外大國邊緣化或取代其協調地位的原則；東協模式則指東協內部及對外交往時的獨特風格——強調非正式化協商（而非制度化正式談判）、主權平等、共識決、不干涉內政、不訴諸武力。",applications:[{context:"112年申論題",note:"考東協中心性定義及當代東協安全經濟戰略的調整"},{context:"109年選擇題",note:"考東協模式的具體內容，特別考非制度化而非制度化是其核心特色"}]},
  {id:"allison-models",title:"Allison三種決策模型",definition:"葛蘭姆．艾里森在《決策的本質》一書中，針對古巴飛彈危機的決策過程，提出三種分析外交決策的模型：理性行為者模型（視國家為單一理性行為者，依成本效益計算做出最適決策）、組織過程模型（決策反映政府各部門既有的標準作業程序與組織慣性）、官僚政治模型（決策是政府內部各部門、各官員基於自身利益折衝談判的結果）。",scholars:"葛蘭姆．艾里森（Graham Allison）",applications:[{context:"107年申論題",note:"直接考三種決策模型的要義"},{context:"109年選擇題",note:"考反映所屬組織特性對應組織過程模型"},{context:"111年四等第17題",note:"考何者並非艾里森的決策模式，正解為抗衡扈從模式——此為權力平衡理論的概念，被拿來當作陷阱選項，注意不要與三大決策模型混淆"},{context:"109年三等第8題",note:"官方公告本題組織過程模式與官僚政治模式皆給分接受，顯示反映所屬組織特性這類題幹，兩模式界線有時並不涇渭分明"}],note:"除三大模型外，林布隆提出的漸進式決策模式（incrementalism）也是重要的決策理論補充——主張決策者受限於資訊不足、時間壓力與政治現實，往往不是從零開始理性規劃最適方案，而是在既有政策基礎上進行小幅漸進調整（俗稱摸著石頭過河），這與理性行為者模型的全盤理性計算假設形成鮮明對比"},
  {id:"balancing-bandwagoning-hedging",title:"抗衡／扈從／避險策略",definition:"描述國家面對外部強權壓力時的三種主要回應策略——抗衡指聯合他國或增強自身實力以對抗威脅來源；扈從指選擇依附、追隨強權以換取安全保障或利益分享，但可能因此喪失自主性；避險則是介於兩者之間，同時與強權保持一定合作、又不完全倒向任一方，通常發生在國際局勢不明朗、避險國缺乏足夠實力單獨抗衡時。",applications:[{context:"107年申論題",note:"直接考避險策略的定義及其較可能實現的情境"},{context:"中俄密約（1896）",note:"李鴻章的聯俄制日戰略是扈從策略操作失敗的歷史案例，詳見[[china|sino-russian-secret|中俄密約]]事件卡"}]},
  {id:"internal-external-balancing",title:"內部抗衡與外部抗衡",definition:"屬於結構現實主義下對抗衡策略的進一步區分——內部抗衡指國家透過強化自身軍事、經濟實力來對抗威脅；外部抗衡指透過與他國結盟、建立聯盟體系來共同對抗威脅來源。",applications:[{context:"美國抗衡中國崛起",note:"111年申論題考拜登政府採取的內部抗衡與外部抗衡措施"},{context:"烏克蘭應對俄國干預",note:"113年申論題考烏克蘭在俄烏戰爭爆發前如何運用內部與外部平衡因應俄國威脅"}]},
  {id:"hegemonic-stability",title:"霸權穩定論",definition:"主張國際體系的穩定有賴於一個具備壓倒性實力的霸權國家存在——霸權需具備建構國際體系規則與機制的能力、執行這些規則的強烈意志、以及推動體系內主要國家互利互惠的承諾，才能維持體系穩定；霸權衰落或缺席時，體系容易陷入混亂。",applications:[{context:"112年選擇題",note:"考霸權穩定論定義霸權的必要條件——具建構機制能力、執行意志、推動互利承諾，但不包括發動戰爭的主動權"}],note:"可與馬賽克式／複合世界秩序對照理解——後者正是對本理論單一霸權前提的當代反思，主張後美國霸權時代秩序仍可能透過多元行為者互動維持"},
  {id:"postwar-order-strategies",title:"大戰後秩序重建三種選擇",definition:"伊肯伯里（G. John Ikenberry）在《大戰勝利之後》中提出，主導國在大戰勝利後面臨三種戰略選項，分別對應長期影響美國外交的三種傳統：①支配／權力戰略（現實主義傳統）——不受約束地運用權力控制戰敗國與弱國，建立階層化秩序；②棄守／退出戰略（孤立主義傳統）——主導國拒絕承擔建構新秩序的責任，退回孤立主義，把秩序維持成本留給他國；③制度化約束／制度戰略（自由主義傳統）——主導國主動自我克制，將自身綁入具拘束力的國際制度框架，以可信承諾換取他國對新秩序的長期同意。",scholars:"伊肯伯里（G. John Ikenberry）",applications:[{context:"1919年美國對國際聯盟的態度",note:"威爾遜設計藍圖卻遭國會拒絕批准凡爾賽條約、拒絕加入國聯，是棄守／退出戰略的典型案例，直接導致國際聯盟先天缺陷、集體安全機制失靈，與108年三等申論第4題直接相關"},{context:"1945年後美國主導的[[west|bretton-woods|布雷頓森林體系]]與聯合國",note:"與一戰後的棄守形成鮮明對比，是制度化約束／制度戰略的成熟實踐"},{context:"冷戰後美國歷屆政府的政策擺盪",note:"柯林頓政府擴大北約、推動WTO與APEC屬於制度戰略；川普政府退出巴黎協定、TPP、質疑北約盟友安全承諾，則展現退出戰略的復辟傾向"}],note:"與霸權穩定論的差異——霸權穩定論強調霸權主動供給公共財維持秩序，本框架的制度戰略則更強調主導國自我克制、受制度拘束的一面；可與[[west|yalta-potsdam|雅爾達會議與戰後歐洲秩序安排]]、[[west|bretton-woods|布雷頓森林體系]]兩張事件卡對照，兩者恰好分別示範政治安全領域傾向支配/退出、經濟領域傾向制度戰略的戰後秩序建構落差"},
  {id:"functionalism",title:"功能主義／新功能主義",definition:"功能主義主張國際合作應從低階、技術性、非爭議性的功能領域（如經濟、貿易、基礎建設）開始，透過實質合作累積互信與共同利益，逐步外溢（spill-over）至更高階、更具政治敏感性的領域，最終促成政治整合，是一種由下而上的整合路徑，而非由上而下先政治後經濟。米特蘭尼原始功能主義主張，某一技術性領域的合作一旦展開，會自然衍生出對相鄰領域合作的需求，稱為分支機制（ramification）。哈斯的新功能主義進一步將外溢概念精確拆解為三種類型：功能性外溢指某一經濟部門的整合，因產業間高度關聯性，自然產生對相鄰部門也進行整合的技術性需求；政治性外溢指國內受惠於整合的利益團體與政治菁英，因獲益而逐漸將政治效忠與期待轉移至超國家層級機構，進而主動推動更深層次的整合；栽培性外溢則指超國家機構（如歐盟執行委員會）本身並非被動等待整合自然發生，而是主動運用其職權與影響力，有意識地培植、鼓吹會員國將合作範疇進一步擴大。兩者最關鍵差異在於對外溢概念的界定方式不同。",scholars:"米特蘭尼（David Mitrany，功能主義創始者）；哈斯（Ernst Haas，新功能主義代表學者）",applications:[{context:"109年四等第23題、112年四等第23題",note:"皆考功能主義由下而上的整合路徑，及外溢概念是功能主義與新功能主義的關鍵差異"},{context:"1834年德意志關稅同盟",note:"由普魯士主導整合德意志各邦關稅與貿易政策，是經濟領域低階合作外溢至1871年德意志帝國政治統一的19世紀先例，可套用功能性外溢說明（整合帶動運輸、貨幣政策等相鄰需求），詳見[[west|german-unification|德意志統一戰爭]]事件卡"},{context:"1952年歐洲煤鋼共同體",note:"法德煤鋼生產共同管理外溢至後續歐盟政治整合，是20世紀最重要的實踐案例，可套用栽培性外溢說明（歐盟執委會主動推動整合範疇擴大至農業、貨幣等領域），詳見[[modern|european-integration|歐洲整合史]]事件卡"}],note:"關稅同盟與歐洲煤鋼共同體相隔一個世紀，卻是同一套經濟外溢至政治邏輯的兩次歷史實踐，申論題若要求舉例說明功能主義，可同時援引兩案例做跨世紀對比，展現理論掌握深度"},
  {id:"liberal-intergovernmentalism",title:"自由政府間主義",definition:"由莫拉夫奇克提出，是歐洲整合理論中與功能主義／新功能主義相對立的解釋途徑，主張區域整合的動力並非社會團體間自發性的外溢過程，而是各會員國政府基於自身國內經濟利益團體的偏好，透過理性計算與政府間協商談判所達成的結果，整合的深度與方向取決於主要會員國政府間的討價還價，而非超國家機構或社會利益團體的自主推動。",scholars:"莫拉夫奇克（Andrew Moravcsik）",applications:[{context:"歐洲整合史的另一種解釋途徑",note:"可與[[theory|functionalism|功能主義／新功能主義]]理論卡對照分析既有[[modern|european-integration|歐洲整合史]]事件卡——功能主義強調由下而上的社會外溢，自由政府間主義則強調會員國政府間的理性利益談判，是理解同一段歐洲整合歷程的兩種截然不同理論視角"}],note:"與功能主義的關鍵差異在於分析單元不同——功能主義聚焦社會團體與超國家機構的角色，自由政府間主義則將國家政府本身視為整合過程中最關鍵的理性行為者，本質上更貼近現實主義／新自由制度主義對國家中心地位的預設"},
  {id:"norm-lifecycle",title:"規範生命週期",definition:"由芬尼莫爾與辛金克提出，主張國際規範的形成與擴散遵循一套可辨識的生命週期模式：第一階段是規範浮現，由規範倡議者（如特定國家、國際組織、非政府組織）積極倡議並說服其他行為者接受某項新規範；第二階段是規範擴散，當接受該規範的國家數量累積達到某個臨界點後，規範會透過社會化壓力、模仿效應等機制迅速擴散至更多國家；第三階段是規範內化，該規範已被廣泛接受為理所當然的行為準則，不再需要持續說服或施壓即能自動遵循。",scholars:"芬尼莫爾（Martha Finnemore）、辛金克（Kathryn Sikkink）",applications:[{context:"國家保護責任（R2P）的形成過程",note:"可套用分析R2P概念從2001年ICISS倡議、到2005年聯合國高峰會通過三大支柱、逐步成為國際社會普遍接受規範的完整生命週期，詳見[[theory|new-interventionism-r2p|新干預主義／國家保護責任]]理論卡"}],note:"是建構主義陣營下說明規範動態演變過程的重要理論，可與[[theory|wendt-cultures|溫特建構主義三種文化]]相互呼應，共同強化建構主義範式的理論深度"},
  {id:"securitization-theory",title:"安全化理論",definition:"由哥本哈根學派（布贊、維夫）提出，主張安全威脅並非客觀存在的既定事實，而是透過政治菁英成功的言說行為（speech act），將某個原本屬於一般政治議題的事務，重新建構為攸關國家或社會生存的存在性威脅，藉此正當化採取超越常規民主程序的非常規應對手段。安全化的成功與否，取決於閱聽群眾是否接受這套威脅建構的敘事框架，而非單純取決於威脅本身的客觀嚴重程度。",scholars:"布贊（Barry Buzan）、維夫（Ole Wæver）",applications:[{context:"非傳統安全議題的建構過程",note:"可為既有GLOSSARY詞條{{非傳統安全}}提供理論解釋機制——說明公共衛生疫情、氣候變遷、資訊操弄等議題為何、以及如何被政治菁英成功建構為安全議題，而非單純客觀存在的安全威脅"}],note:"與傳統現實主義將安全威脅視為客觀物質性因素（軍事實力、地緣位置）的立場形成鮮明對比，是建構主義陣營下分析安全政治的重要方法論工具"},
  {id:"two-level-games",title:"雙層賽局",definition:"由普特南提出，主張國際談判者實際上同時在兩個棋盤上進行博弈——第一層是與外國談判對手協商的國際棋盤，第二層則是需要說服國內選民、國會或利益團體批准協議的國內棋盤。談判者必須尋找一個同時能被兩個棋盤接受的協議方案（雙方勝利集合的交集），若國內批准門檻過高（勝利集合過窄），談判者甚至可以策略性地以國內政治壓力為由，向國際談判對手爭取更有利的條件。",scholars:"普特南（Robert Putnam）",applications:[{context:"國際談判與國內批准程序的交互作用",note:"適合套用分析任何需要國內立法機關批准的國際協議談判過程，如貿易協定、軍控條約、停火協議等，說明談判者如何同時兼顧國際對手期待與國內政治現實的雙重壓力"}],note:"是分析國際談判動態極實用的中層分析工具，可與Allison決策模型、層次分析法等既有分析工具相互搭配運用，共同構成外交決策研究的完整方法論箱"},
  {id:"weaponized-interdependence",title:"武器化相互依賴",definition:"由法瑞爾與紐曼提出，修正傳統複合互賴理論對全球化互賴關係較為樂觀的預設，主張掌握關鍵網絡節點（如國際金融清算系統、關鍵技術供應鏈、通訊基礎設施）中心地位的國家，能夠將這種結構性的網絡優勢轉化為地緣政治脅迫工具，透過切斷、監控或操控他國對該網絡的存取權限，對特定目標國家或企業施加強制性經濟或政治壓力，展現全球化互賴關係本身也可能被systematically武器化、成為大國競逐的權力槓桿，而非單純只帶來合作與共同利益。",scholars:"法瑞爾（Henry Farrell）、紐曼（Abraham Newman）",applications:[{context:"對俄羅斯的SWIFT金融制裁",note:"西方國家將俄羅斯銀行剔除出SWIFT國際金融清算系統，是武器化相互依賴的具體實踐，可與既有[[modern|russia-ukraine-war|俄羅斯入侵烏克蘭／俄烏戰爭]]事件卡相互呼應"},{context:"美中科技戰的晶片出口管制",note:"美國利用其在半導體設計與製造設備上的關鍵節點地位，對中國實施晶片出口管制，是武器化相互依賴在美中戰略競爭中的具體展現，可與既有[[modern|us-china-trade-war|美中貿易戰]]事件卡、GLOSSARY詞條{{去風險化}}、{{友岸外包}}、{{非紅供應鏈}}相互呼應"}],note:"與既有[[theory|complex-interdependence|複雜互賴理論]]形成理論對話——複雜互賴理論較樂觀地看待全球化互賴帶來的合作誘因與軍事力量重要性下降，武器化相互依賴則揭示互賴網絡本身的不對稱結構性優勢，如何被有意識地轉化為新型態的地緣政治權力工具"},
  {id:"strategic-triangle",title:"戰略三角理論",definition:"由迪特默（Lowell Dittmer）提出，用以分析三個國家之間關係組合的理論框架，依三邊友好與敵對關係的不同組合，區分出三種類型：三邊家族型（三方彼此友好）；羅曼蒂克型（其中一方扮演樞紐角色，同時與另外兩方保持友好，但另外兩方彼此關係緊張或敵對）；結婚型（其中兩方結盟友好，共同對抗或排除第三方，該第三方陷入孤雛處境）。每個行為者都傾向爭取讓自己在三角關係中扮演更有利的角色（樞紐優於朋友、朋友優於孤雛），因此三角關係並非靜態，會隨各方策略調整而動態轉換類型。",scholars:"迪特默（Lowell Dittmer）",applications:[{context:"美中台三邊關係",note:"是台灣學界分析當前兩岸與美中台關係最常用的框架之一，可分析不同時期台灣在美中之間扮演樞紐、朋友或孤雛角色的轉變"},{context:"冷戰時期美蘇中戰略三角",note:"迪特默理論最初的歷史應用案例，分析冷戰時期美中蘇三方關係的動態組合"},{context:"當代延伸應用",note:"美中歐盟、美中印度等三邊關係組合，都可套用此框架分析"}],note:"與抗衡／扈從／避險策略的差異——後者描述單一國家面對強權壓力時的個別策略選擇，戰略三角理論則是同時分析三方互動關係的整體結構性框架，兩者可以搭配使用"},
  {id:"levels-of-analysis",title:"層次分析法",definition:"由沃爾茲於《人、國家與戰爭》中提出的國際關係方法論框架，主張分析戰爭與衝突根源時，應區分三個不同層次：個人層次（聚焦領導者個人特質、心理、決策風格）、國家層次（聚焦一國內部政治結構、意識形態、決策過程）、系統層次（聚焦國際體系整體結構，如無政府狀態、權力分布、同盟結構等超越個別國家的宏觀因素）。三層次並非互斥，完整的外交史分析往往需要同時兼顧三個層次的交互作用。",scholars:"沃爾茲（Kenneth Waltz）",applications:[{context:"110年三等第5題",note:"直接考中國挑戰美國強權地位屬於系統層次分析"}],note:"是外交史方法論角度分析的核心方法論基礎，本App許多事件卡外交史方法論欄位運用個人／國家／系統層次分析架構，皆源自本理論"},
  {id:"soft-smart-power",title:"軟實力／巧實力",definition:"硬實力指透過軍事武力、經濟制裁等強制性手段迫使他國改變行為的能力，軟實力由奈伊提出，指透過吸引力（而非強制力）獲取他國認同、合作的能力，來源包括文化、價值觀、外交政策的正當性等；巧實力則是硬實力與軟實力的整合運用，透過同時操作兩者達成國家目標。",scholars:"奈伊（Joseph Nye，軟實力）；羅塞爾（Suzanne Nossel，巧權力）",applications:[{context:"111年選擇題",note:"考軟實力概念提出者為奈伊"},{context:"114年四等選擇題",note:"考軟實力最精確定義為非脅迫性的吸引力，且並非規範性排除負面用途的概念"}]},
  {id:"wendt-cultures",title:"溫特建構主義三種文化",definition:"溫特在《國際政治的社會理論》中，主張無政府狀態本身沒有固定性質，而是由國家間長期互動形塑出的社會建構結果，依國家間主要互動模式的不同，區分出三種文化：霍布斯文化（敵對零和，視彼此為敵人）、洛克文化（競爭但承認彼此生存權，視彼此為對手）、康德文化（合作友善，視彼此為朋友）。",scholars:"溫特（Alexander Wendt）",applications:[{context:"112年選擇題",note:"考俄烏戰爭較能反映霍布斯文化（敵對、零和的無政府體系文化）"},{context:"冷戰時期美蘇關係",note:"意識形態尖銳對立、代理人戰爭不斷，但雙方始終沒有跨越直接全面開戰、消滅對方主權的紅線，是洛克文化競爭但承認彼此生存權的典型展現"},{context:"當代歐盟成員國關係",note:"法德等曾兵戎相見的世仇國家，透過深度制度整合形成集體認同，如今互視為安全共同體一份子，戰爭在成員國之間已變得幾乎不可思議，是康德文化透過集體認同建立安全共同體的典範案例"}]},
  {id:"positivism-ontology-epistemology",title:"實證主義／非實證主義／本體論／知識論",definition:"本體論探討國際政治的實際構成要素是什麼（例如國家是否為唯一重要行為者、無政府狀態是否為客觀既存的結構）；知識論則探討我們如何獲取並驗證關於國際政治的知識。依知識論立場的不同，國際關係理論可概分為兩大陣營——實證主義主張國際政治現象可透過類似自然科學的方法客觀觀察、檢證因果假設，現實主義、自由主義等主流理論多屬此傳統；非實證主義（反思主義）則質疑純粹客觀中立的知識是否可能，主張觀察者本身的價值與詮釋框架，會與被觀察的社會現實產生相互建構關係，建構主義、批判理論、女性主義等理論多屬此傳統。這組方法論分歧被稱為國際關係理論的大辯論之一，是理解五大範式為何在方法論根基上存在本質差異（而不只是主張內容不同）的關鍵框架。",applications:[{context:"連結溫特建構主義三種文化",note:"文化是社會建構而非客觀既存結構，正是非實證主義知識論立場的具體體現，與現實主義將無政府狀態視為客觀既存前提的實證主義立場形成方法論上的根本對比，詳見[[theory|wendt-cultures|溫特建構主義三種文化]]理論卡"}],note:"這不是第六個範式，而是理解現實主義／自由主義（實證主義陣營）與建構主義（非實證主義陣營）之間方法論分野的後設架構，屬於跨範式方法論工具，避免與五大範式本身混淆"},
  {id:"clash-of-civilizations",title:"文明衝突論",definition:"由杭廷頓提出，主張冷戰結束、意識形態對抗消失後，未來國際衝突的根本斷層線將不再是國家間的意識形態或經濟利益之爭，而是不同文明（如西方文明、伊斯蘭文明、儒家／中華文明、東正教文明等）之間因價值觀、宗教信仰、歷史認同差異而產生的衝突，文明將取代民族國家成為理解國際衝突的最核心分析單元。",scholars:"杭廷頓（Samuel Huntington）",applications:[{context:"114年四等第2題",note:"考911事件後，杭廷頓原先備受批評的文明衝突論被重新評價為具有洞見，反映當時西方社會將蓋達組織發動的恐怖攻擊，部分理解為伊斯蘭文明與西方文明衝突的具體展現"}],note:"文明衝突論常被批評為過度簡化文明內部的多元性（例如將整個伊斯蘭世界視為鐵板一塊），也帶有本質主義色彩之嫌，與建構主義強調認同本身具有流動性、可被重新建構的立場形成對比，是評估文明衝突論時常見的批判角度"},
  {id:"prospect-theory",title:"預期效用理論／展望理論",definition:"預期效用理論主張理性決策者會計算各選項可能結果的機率與價值，選擇預期效用最大化的選項，是傳統理性選擇理論與多數主流國際關係理論預設的行為者假設基礎。展望理論由康納曼與特沃斯基提出，修正預期效用理論的過度理性假設，主張決策者評估結果時依據一個參考點（通常是現狀）判斷獲利或損失，且會出現損失規避的心理不對稱——面對損失時傾向冒險（賭一把避免損失成真），面對獲利時卻傾向規避風險（見好就收），這種心理機制能解釋許多看似不理性的外交決策模式。",scholars:"預期效用理論為古典理性選擇理論傳統；展望理論由康納曼（Daniel Kahneman）與特沃斯基（Amos Tversky）提出",applications:[{context:"俄羅斯入侵烏克蘭的風險決策",note:"可用於解釋國家為避免既有領土、地位或勢力範圍喪失（處於損失域），往往願意承受遠高於追求同等份量新增利益（處於獲利域）時所能接受的風險與代價，例如俄羅斯為避免北約東擴威脅其既有安全緩衝地帶（視為損失），選擇發動風險極高的全面入侵烏克蘭"}],note:"與Allison三種決策模型的理性行為者模型形成方法論對話——理性行為者模型假設國家依成本效益理性計算，展望理論則指出這種計算本身受到參考點與損失規避心理的系統性扭曲，是對純粹理性假設的重要心理學修正，詳見[[theory|allison-models|Allison三種決策模型]]理論卡"},
  {id:"new-interventionism-r2p",title:"新干預主義／國家保護責任（R2P）",definition:"新干預主義主張冷戰後國際社會面對他國內部發生的大規模人道危機（種族滅絕、戰爭罪行、危害人類罪等），應突破傳統國家主權絕對不可侵犯的原則，採取包括軍事手段在內的集體介入行動保護平民，是對傳統國際法不干涉內政原則的重大修正。這股思潮於2005年聯合國高峰會後正式制度化為國家保護責任（R2P），確立三大支柱：國家自身保護國民的責任、國際社會協助他國履行此責任、當國家明顯無法或不願保護國民時國際社會採取集體行動的責任。",scholars:"概念於2001年由加拿大主導的干預與國家主權國際委員會（ICISS）提出，並非聯合國安理會直接提出",applications:[{context:"112年四等第12題",note:"考R2P概念的提出機構、背景與三大支柱內容，特別留意提出機構是ICISS而非聯合國安理會這個常見陷阱；因涉及武力使用合法性爭議，聯合國並未對介入條件嚴格定義，而是採個案處理方式"}],note:"與傳統西發里亞主權絕對原則、不干涉內政原則形成直接張力，是評估當代國際法主權概念是否正在鬆動的重要辯論素材。也可與強制外交做對照——強制外交運用威脅或有限度武力施壓迫使對手改變已在進行的行動，目的是「改變對手行為」；新干預主義武力介入的目的則是「保護平民」，兩者的正當性依據與國際法定位有本質差異"},
  {id:"multiplex-order",title:"馬賽克式／複合世界秩序",definition:"由阿查亞（Amitav Acharya）提出，主張後美國霸權時代的國際秩序既非單一霸權主導，也非傳統定義下的多極體系，而是像多廳影城（multiplex）般，眾多具影響力的行為者（大小國家、區域組織、企業、社會運動、非國家行為者）同時並存、各自在不同議題領域展開互動，形成複雜交織、無單一敘事主軸的碎片化／馬賽克式秩序。與傳統西洋棋盤式單一大國博弈的想像不同，複合秩序強調沒有任何單一或少數國家能夠獨自主導全球規則的制定與執行，需要G-Plus式的共享領導模式。",scholars:"阿查亞（Amitav Acharya）",applications:[{context:"全球南方（Global South）聲量崛起",note:"金磚國家（BRICS）擴大、東協等區域組織在無單一霸權主導下發揮更大自主性，都是複合秩序的具體體現"},{context:"美國自由主義霸權秩序式微",note:"阿查亞主張自由主義秩序從未真正是全球性秩序，而是特定西方陣營的規則體系，後美國時代呈現去中心化（decentered）特徵"}],note:"可與霸權穩定論對照理解——本概念正是對霸權穩定論假設（需要單一霸權才能維持秩序）的反思與挑戰，主張即使沒有明確霸權，複合秩序仍可能透過多元行為者互動維持相對穩定，是理解後霸權時代國際秩序如何運作的重要當代理論工具"},
  {id:"democratic-peace",title:"民主和平論",definition:"主張民主國家彼此之間極少（甚至幾乎不曾）發生戰爭，因為民主制度內部的權力制衡、民意監督與決策透明度，使領導者較難輕易發動對外戰爭；共享的自由主義價值觀也降低民主國家之間彼此視對方為威脅的傾向。",scholars:"思想源頭可追溯至康德（Immanuel Kant）《永久和平論》中的共和政體理念",applications:[{context:"110年四等選擇題",note:"直接考民主和平論的思想奠基者為康德，而非洛克、馬基維利或俾斯麥"}]},
  {id:"collective-security",title:"集體安全理論",definition:"主張透過建立涵蓋盡可能多國家的國際組織，當任一成員國遭受侵略時，其餘成員國共同以壓倒性的集體權力優勢對抗侵略者，形成嚇阻效果，藉此維護國際和平，是國際聯盟、聯合國等國際組織設計的核心理念基礎。",applications:[{context:"109年三等選擇題",note:"考集體安全理論的核心假設是以權力優勢對抗侵略者，而非權力平衡帶來和平（那是現實主義主張）"},{context:"110年四等選擇題",note:"考聯合國首次成功以集體安全名義出兵制止侵略的案例是韓戰，詳見[[modern|korean-war|韓戰與聯合國集體安全]]事件卡"}],note:"與權力平衡理論的差異——集體安全依賴的是盡可能廣泛的集體成員共同對抗任何侵略者，不預設固定敵我陣營；權力平衡則是特定國家針對特定威脅來源組成抗衡聯盟，兩者的組織邏輯不同，考古題常考這個對比"},
  {id:"human-security",title:"人類安全",definition:"跳脫傳統以國家為安全指涉對象的思維，主張安全的核心應是個人，涵蓋免於軍事威脅、免於疾病、確保基本人權、確保個人經濟生存條件等多重面向，強調安全問題不應只從軍事角度理解。",applications:[{context:"109年三等選擇題",note:"考人類安全概念涵蓋的面向，本題官方公告因選項爭議一律給分，顯示人類安全定義本身仍有學術討論空間"}]},
  {id:"military-industrial-complex",title:"軍工複合體",definition:"指一國軍隊、政府官員與軍事工業公司之間，因政治經濟利益而形成的結構性共生關係——軍事工業公司遊說政府增加國防採購及軍事預算，政府官員與軍方則因產業利益與政治考量傾向支持擴大軍備，可能導致不必要的軍備競賽與武器擴散。",scholars:"艾森豪總統於卸任演說中首度警告美國公民注意軍工複合體的不利影響（不是甘迺迪）",applications:[{context:"110年四等選擇題",note:"考軍工複合體核心成員不包括一般市民利益團體"},{context:"114年四等選擇題",note:"考首先警告軍工複合體危害的是艾森豪而非甘迺迪，是常見人物誤植陷阱題"}]},
  {id:"liberal-international-order",title:"自由國際秩序",definition:"指西方（尤其美國）學者用以描述二戰結束後、以經濟互賴、國際組織與民主政體為基礎所建立的世界秩序，強調規則導向、開放性與多邊主義。但此秩序是否真具全球普遍性備受質疑，許多非西方國家對其接受程度有限；現實主義學者米爾斯海默更直接主張，符合美國自身利益的其實是現實主義式的權力秩序，而非自由國際秩序。",scholars:"批評者：米爾斯海默（John Mearsheimer）",applications:[{context:"111年三等選擇題",note:"考自由國際秩序並非真正具有全球普遍性，這是常見的過度樂觀陷阱敘述"},{context:"109年申論題",note:"考自由國際秩序的基礎及其面臨的挑戰，並評述川普政府外交作為對其的影響"}],note:"可與馬賽克式／複合世界秩序對照理解——後者某種程度上正是對自由國際秩序全球普遍性假設的當代反思"},
  {id:"globalization-debate",title:"全球化論述：超全球主義者vs懷疑論者",definition:"對全球化是否真正改變世界秩序，學界存在兩派對立觀點——超全球主義者傾向相信民族國家終將被超國家組織（如歐盟）取代、國界的重要性持續下降；懷疑論者則質疑全球化程度被誇大，主張民族國家不會真正衰退，當前經濟整合程度也未必真的超越過去（例如一戰前的全球化程度）。",applications:[{context:"111年三等選擇題",note:"考當前世界主要經濟體整合程度其實已較一戰前更高，是常考的事實查核題"},{context:"110年四等選擇題",note:"考全球化的獲益分配並不均等，全球普遍獲益的說法過於樂觀"}]},
  {id:"sharp-power",title:"銳實力",definition:"指威權國家利用民主社會的開放性，透過散播假訊息、政治宣傳、滲透媒體與學術機構等非強制、隱蔽性手段，侵蝕民主社會對自身機制的信任、限制言論自由並扭曲公共意見，藉此擴大自身政治影響力，鎖定對象通常是政治菁英、媒體工作者、學者與其他意見領袖。",applications:[{context:"114年三等選擇題",note:"考銳實力並不涉及武力攻擊侵略等強制手段，其核心特徵正是非強制性、隱蔽性的滲透操作，這是常見的定義混淆陷阱"}],note:"可與軟實力／巧實力對照理解——軟實力訴諸正面吸引力，銳實力則利用開放社會的漏洞進行隱蔽操縱，兩者手段性質不同"},
  {id:"mercantilism-vs-liberalism",title:"重商主義vs自由主義（國際政治經濟學兩大典範）",definition:"重商主義主張國家在世界經濟中應追求財富極大化與國家安全，將經濟視為國家權力工具，與其他國家的經濟關係本質上是零和競爭；自由主義（IPE）則主張自由貿易能為所有參與國帶來互利，國家應扮演市場秩序管理者角色而非直接介入資源分配，透過公平開放的市場競爭達成共同繁榮。",applications:[{context:"114年申論題",note:"考從分析單元、國際經濟關係本質、對貿易的看法及國家與市場關係等四個面向，比較重商主義與自由主義的差異，並說明近年重返重商主義的辯論"},{context:"113年三等選擇題",note:"考重商主義主張在世界經濟中國家應追求財富極大化與國家安全，而非自由貿易是強化經濟安全的最好方法"}]},
  {id:"relative-absolute-gains",title:"相對利益vs絕對利益",definition:"描述國家評估國際合作成果時的兩種不同標準——絕對利益指只要自身獲益就願意合作，不在乎他國獲益多寡；相對利益則指國家會比較自己與他國的獲益差距，即使雙方都獲益，若對方獲益明顯較多，仍可能因擔憂權力差距擴大而拒絕合作。現實主義者常以國家在意相對利益批評新自由制度主義過度樂觀地假設國家只在意絕對利益。",applications:[{context:"110年申論題",note:"考從相對利益與絕對利益觀點，評析中國參與南海各方行為宣言協商過程中的國家利益認知轉變"},{context:"114年四等選擇題",note:"考現實主義對新自由制度論的典型批評之一，正是新自由制度論忽略相對利益問題"}]},
  {id:"gray-zone-conflict",title:"灰色地帶衝突",definition:"指介於和平與正式戰爭之間的模糊地帶策略——行為者透過非傳統、模糊歸因、低於引發全面軍事對抗門檻的手段（如網路攻擊、資訊戰、海上民兵騷擾、經濟脅迫、法律戰等），逐步改變現狀或施加壓力，卻刻意避免升級為足以觸發對方正式軍事反應或國際集體介入的公開武裝衝突，是近年分析中國對台、對南海周邊國家行為模式時極常使用的分析框架。",applications:[{context:"當代台海與南海情勢分析",note:"中國對台灣的認知作戰、對周邊海域的海警船隻騷擾、經濟脅迫等行為，常被學者與媒體以灰色地帶衝突框架分析，是近年高度熱門的當代國際關係分析工具，雖非傳統考古題常客，但因高度貼近時事，建議留意"}]}
];

var ORGANIZATIONS = [
  {id:"un",title:"聯合國（UN）",definition:"1945年6月26日於舊金山簽署《聯合國憲章》、同年10月24日正式生效成立，取代二戰前失敗的國際聯盟，是當前全球最重要、會員國涵蓋最廣的普遍性國際組織，宗旨為維護國際和平與安全、促進國際合作、保障基本人權。下設大會（全體會員國，一國一票）、安全理事會（10個非常任＋5個常任理事國，常任理事國享否決權）、經濟暨社會理事會、國際法院、秘書處等主要機關。",scholars:"1945年成立，51個創始會員國；現有193個會員國；總部設於美國紐約",applications:[{context:"108年三等選擇題",note:"考聯合國相關基本知識，是題庫出現頻率最高的國際組織，多次以會員國、機關職權、憲章內容等角度命題"},{context:"112年三等申論第3題",note:"直接考聯合國安理會對特定國際危機的處理機制與侷限"}],note:"與其前身國際聯盟的核心差異——聯合國安理會設有常任理事國否決權設計，國際聯盟則採全體一致決，否決權設計雖犧牲效率但避免任一常任理事國被迫接受不利於己的決議而退出，詳見[[west|un-founding|聯合國成立過程]]事件卡"},
  {id:"league-of-nations",title:"國際聯盟",definition:"一戰後依據《凡爾賽條約》成立，是史上第一個以維護世界和平為宗旨的普遍性國際組織，總部設於瑞士日內瓦，核心機制為集體安全——會員國承諾將對任一會員國的侵略視為對全體的侵略。然而美國國會拒絕批准凡爾賽條約、始終未加入，加上採行全體一致決、無常設武力執行決議，導致國聯在因應日本侵略中國東北（1931）、義大利入侵衣索比亞（1935）等重大危機時形同虛設，二戰爆發後名存實亡，1946年正式解散，職能由聯合國接替。",scholars:"1920年成立，1946年解散；鼎盛時期58個會員國；總部設於瑞士日內瓦",applications:[{context:"108年三等申論第4題",note:"直接考國際聯盟體現的外交思維反映一戰前數百年國際關係運作方式的根本性轉變，及其運作方式失敗的原因"}],note:"與聯合國的差異詳見[[west|un-founding|聯合國成立過程]]事件卡note欄位，也可與{{四警察}}構想對照理解安理會否決權設計的思想淵源"},
  {id:"nato",title:"北大西洋公約組織（NATO）",definition:"1949年由美國、加拿大及多個西歐國家共同簽署《北大西洋公約》成立，是冷戰時期圍堵蘇聯擴張的核心集體防禦軍事同盟，公約第五條規定對任一會員國的武力攻擊視為對全體會員國的攻擊，共同防禦義務是其最核心的法律效果。冷戰結束後，北約並未解散，反而持續東擴吸納中東歐前華沙公約成員國，近年因應俄羅斯入侵烏克蘭，芬蘭、瑞典也相繼放棄長期中立政策申請加入。",scholars:"1949年成立，12個創始會員國；現有32個會員國（2024年瑞典加入為最新成員）；總部設於比利時布魯塞爾",applications:[{context:"109年四等第5題等多次選擇題",note:"是題庫中出現頻率第二高的國際組織，常考北約東擴歷程、與華沙公約組織的對應關係"}],note:"與華沙公約組織互為冷戰時期兩大對立軍事同盟集團，可與既有[[west|cold-war-origins|冷戰起源：鐵幕演說、杜魯門主義與圍堵政策]]事件卡相互呼應"},
  {id:"warsaw-pact",title:"華沙公約組織",definition:"1955年由蘇聯主導、聯合波蘭、捷克斯洛伐克、匈牙利、保加利亞、羅馬尼亞、東德（阿爾巴尼亞1968年退出）共同簽署《友好合作互助條約》成立，直接回應同年西德加入北約一事，是蘇聯陣營對抗北約的集體防禦軍事同盟，也是冷戰兩極對抗格局東方陣營的具體軍事化身。組織實質上由蘇聯主導決策，也曾用以鎮壓成員國內部異議（如1956年匈牙利、1968年捷克布拉格之春）。1991年隨蘇聯瓦解同步解散。",scholars:"1955年成立，1991年解散；8個會員國（含蘇聯）；總部設於蘇聯莫斯科",applications:[{context:"110年四等第14題、111年三等第7題、114年四等第4題",note:"多次考華沙公約組織的成立背景、成員國、與北約的對應關係"}],note:"與北約互為冷戰對立的兩大軍事同盟，兩者解散時間點不同——北約至今仍運作並持續東擴，華沙公約組織則隨蘇聯解體同步走入歷史，是常考的存續狀態對比"},
  {id:"seato",title:"東南亞公約組織（SEATO）",definition:"1954年由美國主導，聯合英國、法國、澳洲、紐西蘭、菲律賓、泰國、巴基斯坦共同簽署《東南亞集體防禦條約》成立，宗旨為圍堵共產勢力在東南亞的擴張（尤其防範中南半島赤化骨牌效應），總部設於泰國曼谷。然而組織內部各國利益分歧嚴重、缺乏常設聯合軍隊，被普遍認為運作成效不彰，1977年因多數成員喪失興趣而解散。",scholars:"1954年成立，1977年解散；8個會員國；總部設於泰國曼谷",applications:[{context:"112年三等第19題",note:"考東南亞公約組織的成立背景與成員國組成"}],note:"與北約同屬美國主導的圍堵政策集體防禦體系在不同區域的實踐，但SEATO缺乏北約的常設指揮架構與強制防禦義務，運作成效與存續力遠不如北約，是常考的區域圍堵組織比較案例"},
  {id:"eu",title:"歐洲聯盟（EU）",definition:"由1950年代歐洲煤鋼共同體、歐洲經濟共同體逐步整合而來，1993年《馬斯垂克條約》生效後正式定名為歐洲聯盟，是全球整合程度最深的區域性國際組織，會員國讓渡部分主權至超國家機構，主要機關包括歐洲理事會（元首高峰會）、歐盟理事會（部長理事會）、歐洲議會（唯一直選機構）、歐盟執行委員會、歐洲法院。詳細整合歷程與2024年歐洲議會選舉發展，詳見[[modern|european-integration|歐洲整合史]]事件卡。",scholars:"1993年正式定名（整合歷程可溯至1950年代）；現有27個會員國（2020年英國脫歐後）；總部設於比利時布魯塞爾",applications:[{context:"113年三等申論第1題",note:"直接考歐盟現有機構名稱功能，並分析2024年6月歐洲議會選舉結果及對歐洲整合的影響"},{context:"108年三等第9題等多次選擇題",note:"是題庫中出現頻率第三高的國際組織"}],note:"是功能主義／新功能主義理論最重要的實踐案例，詳見[[theory|functionalism|功能主義／新功能主義]]理論卡"},
  {id:"imf",title:"國際貨幣基金（IMF）",definition:"1944年布雷頓森林會議決議成立，核心任務是監督國際匯率穩定、提供國際收支危機國家短期融通貸款（附帶財政與貨幣政策改革條件），與世界銀行同為布雷頓森林體系兩大支柱機構，但職能分工不同——IMF專注短期匯率與收支穩定，世界銀行專注長期開發融資，兩者常被誤認為同一機構職能，是常考的功能區分題。詳見[[west|bretton-woods|布雷頓森林體系與戰後國際經濟秩序]]事件卡。",scholars:"1944年成立（1945年12月正式運作）；現有190個會員國；總部設於美國華盛頓特區",applications:[{context:"108年三等第6題、108年四等第23題等多次選擇題",note:"常考IMF與世界銀行的職能區分——IMF核心任務是確保國際支付體系穩定，而非直接消除貧窮或推動永續發展"}]},
  {id:"world-bank",title:"世界銀行",definition:"1944年布雷頓森林會議決議成立（正式名稱為國際復興開發銀行），核心任務是提供戰後重建與開發中國家長期開發融資貸款，與國際貨幣基金同為布雷頓森林體系兩大支柱機構，但著重長期開發援助而非短期匯率穩定。",scholars:"1944年成立；現有189個會員國；總部設於美國華盛頓特區",applications:[{context:"108年四等第14題、111年四等第2、16題",note:"常與IMF搭配命題，測試兩機構職能區分的精確理解"}],note:"與國際貨幣基金的差異：世界銀行專注長期開發融資，IMF專注短期收支穩定與匯率監督，兩者常被誤認為同一機構職能"},
  {id:"wto",title:"世界貿易組織（WTO）",definition:"1995年正式成立，前身為1947年成立的《關稅暨貿易總協定》（GATT），是規範全球多邊貿易規則、處理成員國貿易爭端的主要國際組織，核心原則包括最惠國待遇、國民待遇、貿易自由化等。近年因多邊回合談判（杜哈回合）進展停滯，加上美中貿易戰後各國轉向雙邊、複邊貿易協定，WTO在全球貿易治理中的核心地位受到一定程度挑戰。",scholars:"1995年成立（前身GATT為1947年）；現有166個會員國；總部設於瑞士日內瓦",applications:[{context:"110年四等第7、17題、114年四等第19題",note:"考WTO與GATT的沿革關係，及其與區域貿易協定（如CPTPP、RCEP）的互動"}],note:"可與既有[[modern|us-china-trade-war|美中貿易戰]]事件卡相互呼應——中國曾就美方301關稅措施向WTO爭端解決機制提出申訴"},
  {id:"asean",title:"東南亞國家協會（ASEAN）",definition:"1967年由印尼、馬來西亞、菲律賓、新加坡、泰國五國簽署《曼谷宣言》成立，宗旨為促進東南亞區域政治經濟合作與穩定，其獨特的東協模式（非正式化協商、共識決、不干涉內政）與東協中心性原則（詳見既有理論卡）是理解當代東亞區域整合的關鍵框架。近期東帝汶已於2025年10月正式成為第11個會員國。",scholars:"1967年8月8日成立，5個創始會員國；現有11個會員國（2025年東帝汶為最新成員）；總部設於印尼雅加達",applications:[{context:"112年三等申論第2題",note:"考東協中心性定義及當代東協安全經濟戰略的調整"},{context:"109年四等第12、19題",note:"考東協模式的具體內容特色"}],note:"組織本身與其分析框架詳見[[theory|asean-centrality|東協中心性／東協模式]]理論卡"},
  {id:"g7",title:"七大工業國集團（G7）",definition:"由美、英、法、德、義、日、加七個主要已開發工業國組成的非正式高峰會對話機制，並無正式憲章或常設秘書處，每年輪流由會員國主辦高峰會，就全球經濟、金融、安全等議題進行政策協調。俄羅斯曾於1998年納入形成G8，但因2014年併吞克里米亞遭排除，回復為G7。",scholars:"1975年成立（法德美英日義六國，1976年加拿大加入成七國）；7個成員國，無常設總部",applications:[{context:"108年四等第24題、112年四等第18題",note:"考G7組成國家與運作性質，特別留意俄羅斯曾納入又被排除的沿革"}],note:"與G20的差異——G7僅涵蓋傳統已開發工業大國，G20則納入中國、印度、巴西等新興經濟體，反映不同時期全球經濟權力分布的認知框架"},
  {id:"g20",title:"二十國集團（G20）",definition:"由19個主要經濟體加上歐盟組成的非正式高峰會對話機制，成立於1999年（原為財長層級會議），2008年全球金融危機後升格為元首高峰會層級，成員涵蓋已開發與新興經濟體，總體GDP占全球約85%，是當代全球經濟治理最重要的非正式協調平台之一。",scholars:"1999年成立（2008年升格為元首峰會）；20個成員（19國+歐盟），無常設總部",applications:[{context:"108年四等第24題、113年三等第4題",note:"考G20成員組成與G7的差異，特別留意G20納入新興經濟體的擴大代表性"}],note:"與G7的差異在於代表性——G20納入中國、印度、巴西、南非等新興經濟體，被視為更能反映21世紀全球經濟權力分布現實的治理平台"},
  {id:"opec",title:"石油輸出國組織（OPEC）",definition:"1960年由伊朗、伊拉克、科威特、沙烏地阿拉伯、委內瑞拉五個主要產油國成立，宗旨為協調成員國石油生產政策與價格，維護產油國共同利益。1973年第四次以阿戰爭期間，OPEC阿拉伯成員國曾對支持以色列的西方國家實施石油禁運，引發第一次石油危機，是石油作為地緣政治武器的經典歷史案例。",scholars:"1960年成立，5個創始會員國；現有12個會員國；總部設於奧地利維也納",applications:[{context:"110年四等第7題",note:"與新帝國主義列強對石油等戰略資源的爭奪相互呼應，考OPEC的性質與成立背景"}],note:"1973年石油禁運事件是理解石油地緣政治工具化的關鍵歷史案例，可與既有中東地緣政治相關內容相互呼應"},
  {id:"icc",title:"國際刑事法院（ICC）",definition:"依據2002年生效的《羅馬規約》成立，是史上第一個具有常設性質、專門追訴個人（而非國家）種族滅絕罪、危害人類罪、戰爭罪、侵略罪的國際司法機構，總部設於荷蘭海牙。值得注意的是，美國、中國、俄羅斯、印度等多個主要大國並未加入羅馬規約，此一缺陷常被批評削弱了國際刑事法院的普遍管轄效力與正當性。",scholars:"2002年成立（羅馬規約1998年簽署、2002年生效）；現有約125個締約國；總部設於荷蘭海牙",applications:[{context:"112年四等第14題",note:"考國際刑事法院的性質與美中俄等大國未加入的現況"}],note:"與紐倫堡大審的差異——紐倫堡大審是二戰後針對特定戰敗國戰犯設立的臨時性特別法庭，國際刑事法院則是具普遍管轄企圖的常設性國際司法機構，兩者性質不同，可與既有GLOSSARY詞條{{紐倫堡大審}}對照理解國際刑事追訴機制的演進"},
  {id:"amnesty-international",title:"國際特赦組織",definition:"1961年由英國律師貝納森發起成立的國際非政府人權組織，致力於調查、揭露並倡議終止全球侵犯人權行為，包括政治犯處境、酷刑、死刑存廢等議題，透過發布年度人權報告、發起連署聲援行動向各國政府施壓，1977年獲頒諾貝爾和平獎。",scholars:"1961年成立；非政府組織（NGO），會員遍布150餘國；總部設於英國倫敦",applications:[{context:"112年四等第16題",note:"考國際特赦組織的性質與宗旨，屬於非政府組織範疇的重要考點"}],note:"是理解非政府組織（NGO）作為當代國際關係非國家行為者的重要案例，可與國際刑事法院等政府間國際司法機制對照，前者是倡議監督型NGO，後者是具強制管轄權的政府間司法機構"},
  {id:"arab-league",title:"阿拉伯國家聯盟",definition:"1945年由埃及、伊拉克、外約旦、黎巴嫩、沙烏地阿拉伯、敘利亞、葉門七個阿拉伯國家成立，宗旨為促進阿拉伯國家間政治、經濟、文化合作，並協調對以色列的共同立場。組織內部因各國政治體制、對外結盟立場歧異，長期存在協調困難，敘利亞內戰、埃及與以色列和解等議題都曾造成會員資格爭議或凍結。",scholars:"1945年成立，7個創始會員國；現有22個會員國（含巴勒斯坦）；總部設於埃及開羅",applications:[{context:"112年四等第18題",note:"考阿拉伯國家聯盟的性質與宗旨"}],note:"可與既有[[modern|israel-hamas-conflict|以色列與哈瑪斯衝突]]事件卡背景脈絡相互呼應，理解阿拉伯世界對以色列問題的集體立場機制"},
  {id:"oecd",title:"經濟合作暨發展組織（OECD）",definition:"1961年由西歐已開發國家及美加等國成立，前身為協助執行馬歇爾計畫的歐洲經濟合作組織（OEEC），宗旨為促進成員國經濟成長、提升生活水準、協調總體經濟與貿易政策，並定期發布重要經濟統計與政策評估報告，常被視為已開發國家俱樂部的代表性組織。",scholars:"1961年成立（前身OEEC為1948年協助執行馬歇爾計畫而設）；現有38個會員國；總部設於法國巴黎",applications:[{context:"114年四等第21題",note:"考OECD的成立沿革與性質定位"}],note:"前身OEEC是協助執行馬歇爾計畫的機構，可與既有[[west|cold-war-origins|冷戰起源：鐵幕演說、杜魯門主義與圍堵政策]]事件卡中馬歇爾計畫的內容相互呼應"},
  {id:"aukus",title:"AUKUS（澳英美聯盟）",definition:"2021年由澳洲、英國、美國三國共同宣布成立的安全夥伴關係，核心內容是美英協助澳洲取得核動力潛艦技術（澳洲本身並非擁核國家），並在人工智慧、量子科技、網路安全等先進技術領域展開更深度合作，被廣泛視為因應中國在印太區域軍事崛起的具體戰略回應。",scholars:"2021年9月成立；3個成員國（澳洲、英國、美國）；無常設總部（非正式安全夥伴關係架構）",applications:[{context:"當代印太戰略／美中戰略競爭",note:"是{{印太戰略}}架構下具體落實的個別安全合作機制之一，常與QUAD並列比較"},{context:"111年外交特考三等第10題",note:"考AUKUS於2021年9月宣布時，三國領袖分別是美國拜登、英國強生、澳洲總理莫里森（Scott Morrison），並非後來於2022年5月才就任的艾班尼斯（Anthony Albanese），是常見的人物與時序錯置陷阱"}],note:"與QUAD的差異——AUKUS聚焦核動力潛艦與先進軍事科技合作的三邊安全同盟，QUAD則是更廣泛涵蓋安全、經濟、防疫等議題的四方非正式對話機制，兩者性質與涵蓋範疇不同，不宜混淆"},
  {id:"quad",title:"QUAD（四方安全對話）",definition:"由美國、日本、印度、澳洲四國組成的非正式安全對話機制，最早於2007年倡議、因中國抗議一度中斷，2017年在川普政府時期重啟，近年升格為元首層級峰會，合作範疇涵蓋海洋安全、防疫、基礎建設、新興科技等議題，普遍被視為美國印太戰略架構下制衡中國影響力的重要多邊機制之一，但四國刻意避免將其定位為正式軍事同盟。",scholars:"2007年首次倡議、2017年重啟；4個成員國（美日印澳）；無常設總部（非正式對話機制）",applications:[{context:"當代印太戰略架構",note:"是{{印太戰略}}下的具體落實機制之一，題庫多次以印太戰略相關題目間接涉及"},{context:"110年外交特考四等第25題／112年外交特考四等第19題",note:"考QUAD四個成員國為美國、日本、澳洲、印度，並不包含南韓，也不包含紐西蘭——兩者都是常見的成員國誤植陷阱"}],note:"與AUKUS的差異詳見AUKUS組織卡note欄位；QUAD四國刻意維持非正式對話機制定位，避免被解讀為正式軍事同盟以降低對中國的直接刺激"},
  {id:"five-eyes",title:"五眼聯盟",definition:"由美國、英國、加拿大、澳洲、紐西蘭五個英語系國家組成的情報共享聯盟，源自二戰期間英美的訊號情報合作協議，戰後逐步擴展納入加澳紐三國，是全球歷史最悠久、整合程度最深的情報合作機制之一，涵蓋訊號情報（SIGINT）等高度敏感的情報資源共享。",scholars:"源起1943年英美情報合作協議，二戰後擴展為五國；5個成員國（美英加澳紐）；無公開常設總部",applications:[{context:"當代情報合作與國安議題",note:"常作為國際情報合作機制的代表性案例被提及"}],note:"與其他多邊安全機制不同，五眼聯盟核心是情報共享而非軍事防禦承諾或經貿合作，是理解國家間深度信任情報合作機制的獨特案例"},
  {id:"cptpp",title:"CPTPP（跨太平洋夥伴全面進步協定）",definition:"前身為美國主導談判的《跨太平洋夥伴協定》（TPP），川普政府於2017年宣布退出後，由日本主導剩餘11國完成談判，2018年簽署更名為CPTPP並生效，是當前亞太地區規格最高、涵蓋議題最廣泛（涉及國營企業、勞工、環境等高標準規範）的多邊自由貿易協定，台灣、中國、英國等經濟體皆已正式申請加入——中國於2021年9月16日、我國於2021年9月22日相繼提出申請，英國則已於2023年正式加入為第12個成員國。",scholars:"前身TPP談判始於2005年，2018年CPTPP正式生效；11個創始成員國（英國2023年加入為第12國）；無常設總部",applications:[{context:"109年三等第10題、110年三等第9題、110年四等第19題等多次選擇題",note:"是題庫中考古題出現頻率極高的區域貿易協定，常考TPP與CPTPP的沿革關係、美國退出的背景"}],note:"與RCEP的差異——CPTPP規範標準較高（涵蓋國營企業、勞工、環境等非傳統貿易議題），RCEP則相對聚焦傳統關稅減讓且規範彈性較大，兩者代表亞太區域經濟整合的兩種不同路徑與標準高低"},
  {id:"rcep",title:"RCEP（區域全面經濟夥伴協定）",definition:"由東協十國發起，並邀集中國、日本、韓國、澳洲、紐西蘭共同談判，2020年簽署、2022年生效，是全球涵蓋人口與經濟規模最大的自由貿易協定，以東協為整合核心、中國實質上是最大經濟體參與者，相較CPTPP而言規範標準較為寬鬆、彈性較大，更著重傳統關稅減讓與貿易便捷化。",scholars:"2020年11月簽署，2022年1月生效；15個成員國（東協十國+中日韓紐澳）；無常設總部",applications:[{context:"當代亞太區域經濟整合格局",note:"常與CPTPP對照比較，是分析中國在亞太經濟整合中角色與影響力的重要當代案例"},{context:"109年外交特考四等第19題",note:"考RCEP成員組成完全以主權國家為主，並不接受國際組織作為締約成員參與；印度已於2019年11月宣布退出RCEP談判、最終並未加入"}],note:"與CPTPP的差異詳見CPTPP組織卡note欄位；值得留意台灣並未受邀參與RCEP談判，是台灣對外經貿關係常被提及的現實侷限"},
  {id:"ipef",title:"印太經濟架構（IPEF）",definition:"2022年由美國拜登政府發起成立，聯合日、韓、印、澳、紐及多個東協國家共同參與，性質上並非傳統自由貿易協定（不涉及關稅減讓談判），而是聚焦供應鏈韌性、乾淨能源、反貪腐、公平經濟等四大支柱的政策協調架構，被視為美國因應自身未能加入CPTPP的替代性印太經濟參與方案。",scholars:"2022年5月啟動；14個參與國；無常設總部",applications:[{context:"當代美國印太經濟戰略",note:"常作為美國因應中國在區域經貿整合（RCEP、CPTPP申請）影響力上升的政策回應案例"}],note:"與CPTPP、RCEP最大差異——IPEF不涉及市場開放與關稅減讓的傳統貿易協定內容，性質上更接近政策協調架構而非嚴格意義的自由貿易協定，這個區辨是常見的精確定義考點"},
  {id:"sco",title:"上海合作組織",definition:"2001年由中國、俄羅斯、哈薩克、吉爾吉斯、塔吉克、烏茲別克六國成立（前身為1996年上海五國會晤機制），宗旨為促進成員國在安全（尤其打擊恐怖主義、分裂主義、極端主義三股勢力）、經濟、文化等領域合作，近年持續擴大納入印度、巴基斯坦、伊朗、白俄羅斯等國，被視為中俄主導、制衡西方聯盟體系影響力的歐亞大陸重要多邊機制；秘書處設於中國北京。",scholars:"2001年成立（前身1996年上海五國機制）；現有10個正式會員國（含印度、巴基斯坦、伊朗）；總部設於中國北京",applications:[{context:"當代歐亞大陸地緣政治格局",note:"常作為中俄主導非西方陣營多邊機制的代表性案例被提及"},{context:"110年外交特考四等第16題／111年三等第22題",note:"考上合組織秘書處設於中國北京（而非上海、青島或烏魯木齊）"},{context:"113年外交特考三等第3題",note:"考蒙古並非上合組織正式會員國，僅為觀察員國——與同樣是中亞內陸國、且已是正式會員的哈薩克、烏茲別克等國常被放在一起測試混淆"}],note:"與金磚國家常被相提並論，兩者皆被視為中俄等非西方大國主導、尋求在既有西方主導國際體系外建立替代性合作平台的具體實踐，但上合組織更聚焦區域安全，金磚國家則更聚焦全球經濟治理話語權"},
  {id:"brics",title:"金磚國家（BRICS）",definition:"2009年由巴西、俄羅斯、印度、中國四個新興經濟體發起首次峰會（南非2010年加入形成BRICS），近年進一步擴大納入埃及、衣索比亞、伊朗、阿聯、沙烏地阿拉伯等國，宗旨為提升新興經濟體在全球經濟治理中的話語權，並設立新開發銀行作為替代世界銀行的融資機制，被視為對現有以西方為主導的全球經濟治理體系的具體挑戰與替代方案倡議。",scholars:"2009年首次峰會，2010年南非加入定名BRICS；持續擴大，2024年起納入多個新成員；無常設總部（輪值主席國制）",applications:[{context:"當代全球南方聲量崛起",note:"114年四等考題曾以全球南方、金磚組織作為重要合作平台的相關敘述進行測驗"}],note:"可與既有[[theory|multiplex-order|馬賽克式／複合世界秩序]]理論卡相互呼應——金磚國家擴大、新興經濟體多邊機制興起，正是複合世界秩序去中心化特徵的具體體現"},
  {id:"gctf",title:"GCTF（全球合作暨訓練架構）",definition:"2015年由台灣與美國共同發起成立的多邊能力建構訓練平台，日本、澳洲、加拿大、瑞典等國陸續加入合作夥伴行列，透過舉辦國際研習營，就公共衛生、婦女賦權、能源、救災等全球性議題提供跨國訓練課程，是台灣近年因應正式邦交受限、透過非傳統多邊功能性合作參與國際事務的重要實踐案例。",scholars:"2015年由台美共同發起；多國陸續加入合作夥伴（日本、澳洲、加拿大、瑞典等）；輪流於台灣及夥伴國舉辦研習營，無固定總部",applications:[{context:"台灣當代對外參與模式",note:"是台灣突破正式外交承認侷限、透過實質功能性合作參與國際事務的具體案例，常作為台灣非傳統外交模式的代表性例證"}],note:"與台灣其他有限承認國家外交模式不同，GCTF展現的是不涉及正式邦交承認、純粹以功能性議題合作為基礎的參與模式，可視為功能主義理論在當代台灣對外關係實踐上的具體案例"},
  {id:"icao",title:"國際民航組織（ICAO）",definition:"1944年依據《芝加哥公約》成立，1947年成為聯合國專門機構，負責制定國際民航安全、飛航規則與技術標準，總部設於加拿大蒙特婁。中華民國原為創始會員國之一，1971年退出聯合國後喪失會籍，此後長期無法參與ICAO會議與資訊交流，儘管台北飛航情報區實際管理全球最繁忙航線之一，仍長期面臨資訊取得的實務困難。2013年，在美國等國支持下，我國首次以理事會主席貴賓身分獲邀出席ICAO大會，但此後因兩岸關係變化，2016年起未再獲邀，迄今仍未能穩定參與。",scholars:"1944年成立（1947年成為聯合國專門機構）；193個締約國；總部設於加拿大蒙特婁",applications:[{context:"108年三等第4題",note:"考我國曾以貴賓身分出席ICAO大會（2013年），與世界衛生大會、國際再生能源組織並列我國有限度參與的國際組織案例，但從未參與國際刑警組織"}],note:"與世界衛生組織（WHA/WHO）的台灣參與模式類似——兩者皆非正式會籍，僅曾以特殊身分短暫受邀出席大會，且皆因兩岸關係變化而時斷時續，是台灣國際參與模式受政治因素直接牽動的典型案例"},
  {id:"african-union",title:"非洲聯盟",definition:"2002年由非洲統一組織（OAU，1963年成立）改組而來，宗旨為促進非洲大陸整體政治經濟整合、維護區域和平安全、加速非洲大陸自由貿易區建設，總部設於衣索比亞阿迪斯阿貝巴，是非洲大陸規模最大、涵蓋國家最廣的區域性國際組織。",scholars:"2002年成立（前身OAU為1963年成立）；現有55個會員國（幾乎涵蓋整個非洲大陸）；總部設於衣索比亞阿迪斯阿貝巴",applications:[{context:"當代非洲區域整合概況",note:"雖非傳統考古題常客，但作為非洲大陸最重要的區域性國際組織，具備基礎認知價值"}]},
  {id:"oas",title:"美洲國家組織（OAS）",definition:"1948年成立，是西半球歷史最悠久的區域性國際組織，宗旨為促進美洲國家間政治合作、維護區域和平、推動民主與人權，總部設於美國華盛頓特區。近年因應委內瑞拉政局動盪、古巴等左翼政權的區域角色問題，美洲國家組織在區域民主治理議題上持續扮演爭議性角色。",scholars:"1948年成立；現有35個會員國（古巴會籍長期受爭議）；總部設於美國華盛頓特區",applications:[{context:"當代美洲區域政局",note:"可與既有[[modern|venezuela-cuba-2026|川普政府西半球政策：委內瑞拉軍事行動與古巴制裁]]事件卡背景脈絡相互呼應，理解美洲國家組織在區域政局動盪中的角色侷限"}],note:"與既有門羅主義事件卡的西半球排他性勢力範圍邏輯有歷史淵源上的呼應，可視為20世紀將門羅主義制度化、多邊化的具體實踐"},
  {id:"cis",title:"獨立國家國協（CIS）",definition:"1991年蘇聯解體之際，由俄羅斯、烏克蘭、白俄羅斯等前蘇聯加盟共和國共同成立，宗旨為維持前蘇聯加盟共和國間一定程度的政治經濟協調關係，性質較鬆散、缺乏強制約束力。烏克蘭自2014年克里米亞遭併吞後即減少參與，2018年正式宣布退出，是理解後蘇聯空間地緣政治持續分裂的重要觀察指標。",scholars:"1991年12月成立；現存約9個會員國（烏克蘭已於2018年正式退出）；秘書處設於白俄羅斯明斯克",applications:[{context:"後蘇聯空間地緣政治",note:"可與既有[[modern|russia-ukraine-war|俄羅斯入侵烏克蘭／俄烏戰爭]]事件卡背景脈絡相互呼應，烏克蘭退出獨立國家國協是俄烏關係惡化的重要先期指標"}]},
  {id:"upu",title:"萬國郵政聯盟",definition:"1874年成立，是現存歷史最悠久的國際組織之一（早於聯合國體系），宗旨為建立全球統一的郵政資費與遞送規則，確保國際郵件得以在會員國間自由流通遞送，1948年成為聯合國專門機構之一。",scholars:"1874年成立（1948年成為聯合國專門機構）；現有192個會員國；總部設於瑞士伯恩",applications:[{context:"111年四等第18題",note:"考萬國郵政聯盟的性質與歷史地位，是現存歷史最悠久的國際組織之一"}],note:"是理解19世紀「國際主義」技術性、功能性國際合作先驅的重要案例，早於聯合國體系近70年成立，可作為功能主義理論歷史先例的延伸案例"},
  {id:"interpol",title:"國際刑警組織（INTERPOL）",definition:"1923年成立，是全球最大的國際警政合作組織，協助會員國警政機關跨國分享犯罪情報、協尋通緝要犯（如發布紅色通報），本身並無跨國執法或逮捕權力，僅扮演資訊交流與協調平台角色，實際執法仍須依賴各會員國警政機關依其國內法自行執行。",scholars:"1923年成立；195個會員國；秘書處設於法國里昂",applications:[{context:"108年三等第4題",note:"考我國退出聯合國後，於世界衛生大會、國際民航組織、國際再生能源組織皆曾以某種身分參與，但國際刑警組織我國從未曾以任何身分參與過，是108年三等第4題直接命中的對比案例"}],note:"與既有[[org|icao|國際民航組織（ICAO）]]、世界衛生組織的台灣有限度參與模式不同，我國與國際刑警組織完全沒有任何形式的參與管道，是評估台灣國際參與侷限程度差異的重要對照案例"},
  {id:"unfccc",title:"聯合國氣候變化綱要公約（UNFCCC）",definition:"聯合國大會於1990年決議設立政府間氣候變化綱要公約談判委員會（INC），授權起草氣候變化公約條文，1992年正式通過《聯合國氣候變化綱要公約》，是全球因應氣候變遷最主要的國際法律框架。締約國每年召開締約國大會（COP，Conference of the Parties）協商具體因應措施，1997年通過的《京都議定書》首次為已開發國家設定具法律拘束力的減碳目標，2015年通過的《巴黎協定》則進一步要求所有締約國（不分已開發或開發中）提出自訂減碳貢獻目標，是氣候治理的重要里程碑。",scholars:"1990年INC設立、1992年UNFCCC通過；198個締約國；秘書處設於德國波昂",applications:[{context:"112年四等第13、17題",note:"兩題皆考UNFCCC沿革細節，包括1990年INC設立、1992年通過公約、COP會議運作機制、巴黎協定地位等，需留意COP確切屆數對應年份與主辦地點常是精確辨析考點"}],note:"是理解當代非傳統安全議題（氣候變遷）如何透過國際建制進行多邊治理的重要案例，可與GLOSSARY詞條{{非傳統安全}}相互呼應"},
  {id:"who",title:"世界衛生組織（WHO）",definition:"1948年成立，是聯合國專門機構之一，宗旨為促進全球公共衛生合作、協調國際傳染病防治、制定衛生政策標準與技術指引。最高權力機構為每年召開的世界衛生大會（WHA），由全體會員國代表出席協商決議。台灣因1971年退出聯合國喪失會籍，此後長期無法以會員國身分參與WHO事務，僅曾於2009至2016年間，在兩岸關係相對緩和時期，以觀察員身分獲邀出席WHA，2017年起因兩岸關係轉變，未再獲邀。",scholars:"1948年成立；194個會員國；總部設於瑞士日內瓦",applications:[{context:"COVID-19全球疫情期間台灣參與爭議",note:"台灣因應疫情的具體成果（Taiwan can help）成為近年爭取重返WHA的重要論述基礎，詳見[[modern|covid-pandemic|COVID-19全球疫情]]事件卡"}],note:"與既有[[org|icao|國際民航組織（ICAO）]]的台灣參與模式高度相似——兩者皆非正式會籍，僅曾以特殊身分短暫受邀出席大會，且皆因兩岸關係變化而時斷時續，是台灣國際參與模式受政治因素直接牽動的典型案例"},
  {id:"icj",title:"國際法院（ICJ）",definition:"1945年依據聯合國憲章成立，是聯合國六大主要機關之一，也是最主要的國際司法機構，負責依國際法裁決會員國之間的法律爭端（如領土、海洋劃界爭議），並應聯合國大會或安理會請求提供諮詢意見。ICJ僅受理國家之間的爭端案件，且須經爭端當事國同意始能行使管轄權，不同於國際刑事法院專門追訴危害人類罪、戰爭罪等個人刑事責任。",scholars:"1945年成立；193個聯合國會員國皆為當然締約方；總部設於荷蘭海牙",applications:[{context:"與國際刑事法院（ICC）的性質區辨",note:"是常考的機構性質對照題——ICJ處理國家間爭端，ICC起訴個人刑事罪責，兩者雖同設於海牙卻是完全不同性質的機構，詳見[[org|icc|國際刑事法院（ICC）]]組織卡"}],note:"其前身為國際聯盟時期設立的常設國際法院（Permanent Court of International Justice），可與既有GLOSSARY詞條{{王寵惠}}相互呼應——王寵惠正是中華民國第一位派任至常設國際法院擔任法官的外交家與法學家"},
  {id:"usmca",title:"美墨加協定（USMCA）",definition:"由川普政府主導談判，於2020年7月正式生效，取代1994年生效的《北美自由貿易協定》（NAFTA），是美國、墨西哥、加拿大三國間的自由貿易協定，相較NAFTA新增更嚴格的原產地規則（尤其汽車產業零組件在地化比例要求）、更完整的勞工權益與環境保護條款，並納入每六年檢討一次的落日條款，確保協定內容能隨時因應情勢變化調整。",scholars:"2020年7月生效（前身NAFTA為1994年生效）；3個成員國（美、墨、加）；無常設總部",applications:[{context:"109年四等第18題、114年四等第7題",note:"皆以USMCA作為背景法源或政策脈絡提及，測試對其性質與美國貿易政策工具的掌握"}],note:"與既有CPTPP、RCEP等區域貿易協定相比，USMCA更強調在地化生產比例要求，反映川普政府經濟民族主義路線對傳統自由貿易協定設計邏輯的修正"},
  {id:"aiib",title:"亞洲基礎設施投資銀行（AIIB）",definition:"2016年由中國主導成立，宗旨為提供亞太地區基礎建設融資，是中國近年推動「一帶一路」倡議的重要金融支柱之一，也被廣泛視為挑戰以美國為首、世界銀行與亞洲開發銀行長期主導亞太開發融資話語權的具體實踐。儘管由中國主導設立，仍有包括英國、德國、澳洲等多個西方已開發國家加入為會員，展現各國在美中戰略競爭下、於實質經濟利益考量與地緣政治立場之間的權衡。",scholars:"2016年開業運作；現有超過100個會員國；總部設於中國北京",applications:[{context:"中國經濟崛起與國際金融話語權",note:"可與既有[[modern|china-wto-2001|中國加入WTO與和平崛起]]事件卡敘事脈絡相互呼應，展現中國從國際經濟體系的參與者，逐步發展為另立新機制、爭取規則制定話語權的積極行為者"},{context:"113年外交領事人員特考（代號2101）第28題",note:"考一帶一路（AIIB的配套倡議）是由習近平於2013年提出，並非胡錦濤——胡錦濤是習近平的前一任總書記，常考人物與政策的錯誤配對，詳見[[china|xi-era-diplomacy|習近平時代外交起點：十八大、一帶一路與大國外交]]事件卡"}],note:"與既有世界銀行組織卡形成對照——AIIB被部分觀察者視為中國版世界銀行，但AIIB治理結構與貸款條件相對更具彈性，不若世界銀行貸款附帶嚴格的治理改革條件"},
];

var POLICY_STATEMENTS = [
  {id:"one-china-policy-principle",title:"一個中國政策 vs 一個中國原則",definition:"「一個中國政策」是美國自1970年代三份聯合公報以來採取的立場，美方僅表示認知（acknowledge）海峽兩岸中國人均認為只有一個中國，刻意不對台灣主權歸屬表態，藉此保留戰略模糊空間，同時維持與台灣的實質關係；「一個中國原則」則是中共官方立場，明確主張世界上只有一個中國，中華人民共和國政府是代表中國的唯一合法政府，台灣是中國的一部分，不容許任何模糊解釋空間。兩者字面相近卻本質不同，是兩岸關係考科最核心的精確用詞辨析概念之一。",scholars:"美國：1972年上海公報首度使用「認知」用詞確立；中共：長期一貫官方立場，1979年告台灣同胞書起持續強化",applications:[{context:"歷年考題大量出現",note:"美方「一個中國政策」與中共「一個中國原則」的精確區辨，是兩岸關係考科每年幾乎必考的核心概念，常以此設計選項陷阱"}],note:"可與既有GLOSSARY詞條{{戰略模糊}}相互呼應——美方刻意模糊的一個中國政策，正是戰略模糊整體對台政策的用詞基礎"},
  {id:"taiwan-relations-act-six-assurances",title:"臺灣關係法與六項保證",definition:"美國與中華民國斷交後，為規範斷交後美台間非官方但持續的實質關係，美國國會迅速立法，由卡特總統於1979年4月10日簽署，並溯及自1979年1月1日起生效的《臺灣關係法》（Taiwan Relations Act, TRA）。該法以美國國內法形式規定：美國將提供台灣「防禦性武器」，並維持美國本身抵禦足以危及台灣人民安全之武力行動的能力；任何以非和平方式決定台灣前途的努力，均為對西太平洋和平及安全的威脅，美國將表達嚴重關切；該法也是美國在台協會（AIT）設立與運作的法律依據。1982年，美國因對台軍售問題與中共簽署《八一七公報》，同意將逐步減少對台軍售；為安撫台灣，雷根政府同時私下向我方提出六項保證，包括：未同意設定對台軍售終止日期、不會就對台軍售議題事先與北京徵詢、不會在台北與北京之間擔任調解人、不會修改《臺灣關係法》、未改變關於台灣主權的立場（即不承認中國對台灣的主權主張）、不會施壓台灣與中共進行談判。六項保證起初僅以口頭方式秘密傳達，直到2016年5月美國眾議院才通過共同決議案，將其正式公開化、書面化。",scholars:"1979年臺灣關係法由卡特簽署（非雷根）；1982年六項保證與八一七公報同年提出；2016年眾議院決議公開六項保證",applications:[{context:"112年外交領事人員特考（代號2101）第24題",note:"考臺灣關係法1979年生效、是美國在台協會設立法源、規定提供防禦性武器等敘述是否正確；該法由卡特總統簽署成為法律，並非雷根總統"},{context:"112年外交領事人員特考（代號2101）第21題／113年第25題",note:"考六項保證是針對1982年《八一七公報》而提出，而非其他公報；114年第17題則考臺灣關係法是美國對台軍售最重要的法源依據"},{context:"110年外交領事人員特考（代號2101）第30題／111年第28題",note:"考六項保證的具體內容不包含「協助台灣與中國大陸談判」「協助台灣加入國際組織」「保證台灣民主體制穩定運作」等，正確內容須逐項精確記憶"}],note:"臺灣關係法（1979）＋美中三份聯合公報（上海公報1972、建交公報1979、八一七公報1982）＋六項保證（1982）共同構成美國對台政策「一中政策」的完整法理架構，五者缺一不可，詳見[[crossstrait|us-china-normalization|美中關係正常化與台美關係轉折]]事件卡與詞條{{戰略模糊}}"},
  {id:"four-noes-one-without",title:"陳水扁「四不一沒有」",definition:"陳水扁總統於2000年5月20日就職演說中提出，承諾在中共無意對台動武的前提下，任內：不會宣布獨立、不會更改國號、不會推動兩國論入憲、不會推動改變現狀的統獨公投，以及沒有廢除國統會或國統綱領的問題，是陳水扁執政初期試圖對北京釋出善意、緩解兩岸緊張的政策宣示。",scholars:"陳水扁，2000年5月20日就職演說提出",applications:[{context:"與後續蔡英文、賴清德政策主張比較",note:"可與[[policy|tsai-four-principles|蔡英文四個必須／四個堅持]]政策論述卡並列比較，觀察歷任總統對兩岸關係表述策略的演變軌跡"}],note:"陳水扁2006年宣布終止國統會運作，某種程度上已偏離四不一沒有中沒有廢除國統會問題的原始承諾，是評估政策宣示與後續實踐落差的案例"},
  {id:"tsai-four-principles",title:"蔡英文「四個必須」與「四個堅持」",definition:"蔡英文總統於2019年「2020新年談話」提出「四個必須」：必須正視中華民國存在的事實、必須尊重兩岸人民對自由民主的堅持、必須以和平對等方式處理雙方歧異、必須是政府或政府授權的公權力機關坐下來談。2021年，蔡英文進一步提出「四個堅持」：永遠堅持自由民主的憲政體制、堅持中華民國與中華人民共和國互不隸屬、堅持中華民國台灣的前途須遵循全體台灣人民的意志、堅持台灣主權獨立。兩組宣示雖字數相近、間隔僅兩年，內容側重點與具體主張並不相同，前者強調對話前提條件，後者更聚焦主權定位表態。",scholars:"蔡英文，2019年（四個必須）、2021年（四個堅持）",applications:[{context:"109年外交領事人員特考（代號2101）第29、30題",note:"直接考四個必須的具體內容，需精確記憶四項條列內容，避免與四個堅持混淆"},{context:"113年外交領事人員特考（代號2101）第30題",note:"考賴清德總統2024年就職演說承接蔡英文2021年提出的四個堅持，而非四個必須，是常考的年份與內容精確辨析陷阱"},{context:"112年外交領事人員特考（代號2101）第25題",note:"考蔡英文總統2016年提出的兩岸「既有政治基礎」包含：1992年兩岸兩會會談的歷史事實與求同存異的共同認知、兩岸過去二十多年來協商與交流互動的成果、中華民國現行憲政體制、台灣民主原則及普遍民意，但不包含「穩定的美中臺三邊關係」"}],note:"與[[policy|four-noes-one-without|陳水扁四不一沒有]]相比，蔡英文兩組宣示的立場明顯更為堅定、不再訴諸消極不作為式的承諾，反映兩岸關係二十年來台灣內部主流民意氛圍的轉變"},
  {id:"prc-taiwan-policy-evolution",title:"中共對台政策文件沿革",definition:"中共對台政策文件歷經數十年演進，依時序條列如下：1963年，周恩來提出「一綱四目」，是中共對台和平統一構想最早的雛形，早於告台灣同胞書——「一綱」指台灣必須統一於中國；「四目」則是統一後除外交須統一於中央外，人事安排、軍政大權悉委於蔣介石本人；台灣軍政費用不足之數由中央撥付；台灣社會改革可以從緩，須待條件成熟並徵得蔣介石同意；雙方互約不派人破壞對方團結。1979年，中國全國人大常委會發表《告台灣同胞書》，正式放棄使用「解放台灣」等武力訴求字眼，改採和平統一路線，並呼籲兩岸儘早實現通郵、通航、通商（三通）以及學術、文化、體育、科技交流（四流）。1981年，葉劍英提出對台九點方案（葉九條），主張國共兩黨對等談判、統一後台灣可保有高度自治權與軍隊。1983年6月，鄧小平接見美國西東大學教授楊力宇時提出六點具體意見（俗稱「鄧六條」），是一國兩制對台構想最早、最詳細的政策宣示之一（此一年份與內容為一般教材補充引用，把握度略低於其餘經考古題確認的條目，應試仍以下述1984年具體化定義為主要依據）；1984年，鄧小平進一步將「一國兩制」構想具體化，明確定義為中華人民共和國內實行社會主義制度、香港與台灣則實行資本主義制度並存。1995年，江澤民發表對台政策綱領（江八點）。1998年6月，美國總統柯林頓訪問上海時公開提出對台「新三不」：不支持台灣獨立、不支持一中一台或兩個中國、不支持台灣加入以國家資格為條件的國際組織，是美方罕見公開向北京表態的敏感發言。2005年3月14日，中國制定《反分裂國家法》，明訂若台獨分裂勢力以任何名義、任何方式造成台灣從中國分裂出去的事實、如果發生將導致台灣從中國分裂出去的重大事變、或和平統一的可能性完全喪失（俗稱「三個如果」），得採取非和平方式及其他必要措施（但條文中並不包含「台灣舉行統一公投」作為觸發條件）。該法第7條另列舉海峽兩岸可協商的事項，包括正式結束兩岸敵對狀態、發展兩岸關係的規劃、台灣地區在國際上與其地位相適應的活動空間、台灣當局的政治地位等，但條文中並未包含「決定中華人民共和國憲法在臺灣地區的具體適用方式」——這是常考的條文內容精確辨析陷阱。2008年，胡錦濤提出對台政策綱領（胡六點）。2018年，中共發布《關於促進兩岸經濟文化交流合作的若干措施》，即俗稱「惠台31條」，放寬台商台胞在大陸投資經商、就學、就業等同等待遇措施。2019年，習近平在《告台灣同胞書》發表40週年紀念會上提出對台五項主張（習五條），明確定義九二共識為「兩岸同屬一個中國，共同努力謀求國家統一」，並提出探索「一國兩制台灣方案」，同時重申不承諾放棄使用武力，但並未提及接受「一中各表」版本的九二共識。同年起，中共進一步倡議「新四通」構想，2023年起在金門實踐與福建沿海通水、通電、通氣、通橋。2022年，國台辦發布第三份對台政策白皮書《台灣問題與新時代中國統一事業》。",scholars:"一綱四目(1963周恩來)→告台灣同胞書(1979)→葉九條(1981葉劍英)→鄧六條(1983，把握度略低)→一國兩制具體化(1984鄧小平)→江八點(1995江澤民)→柯林頓新三不(1998美方)→反分裂國家法(2005，三個如果)→胡六點(2008胡錦濤)→惠台31條(2018)→習五條(2019習近平)→新四通(2019/2023)→對台政策白皮書第三份(2022)",applications:[{context:"113年司法人員/調查人員特考（代號3401）第21題、110年外交領事人員特考（代號2101）第23題",note:"考告台灣同胞書的時序定位，注意不要與1987年開放探親等事件混淆"},{context:"114年外交領事人員特考（代號2101）第19題",note:"考葉九條是由葉劍英提出，而非鄧小平、陳雲或王兆國"},{context:"110年司法人員/調查人員特考（代號3401）第29題、113年外交領事人員特考（代號2101）第21題",note:"考一國兩制具體化由鄧小平於1984年首次提出（而非江澤民），且明確為社會主義制度與資本主義制度並存的定義"},{context:"110年外交領事人員特考（代號2101）第27題",note:"考反分裂國家法非和平手段的觸發條件範疇，不包含台灣舉行統一公投，條文中「三個如果」的精確措辭是常考重點"},{context:"112年外交領事人員特考（代號2101）第26題",note:"考惠台31條是習近平任內對台政策之一，與對臺26條措施屬不同批次、不同年份"},{context:"113年外交領事人員特考（代號2101）第21題",note:"考習五條的具體內容，特別留意「接受一中各表的九二共識」並非習五條內容，是常見陷阱選項——習五條定義的九二共識版本是兩岸同屬一個中國，不包含一中各表"},{context:"114年外交領事人員特考（代號2101）第23題",note:"考習近平告台灣同胞書40週年紀念會談話內容，其中提到金馬與福建沿海通水通電通氣通橋的新四通構想"},{context:"115年司法人員特考cs-mc-183／cs-mc-216",note:"考反分裂國家法第7條可協商事項的精確內容（不包含中華人民共和國憲法在台灣的適用方式），以及該法整體立法目的（維護國家主權領土完整、和平統一後台灣可實行不同於大陸的制度）"}],note:"這條文件沿革展現中共對台政策從武力解放到和平統一、從原則性訴求到具體制度設計的長期演進軌跡（一綱四目→告台灣同胞書的轉變尤其展現從有條件保留軍政大權、到全面放棄武力訴求的路線鬆動），可搭配「兩岸立場對照時間軸」（側欄📊按鈕）查看中華民國歷任總統對應立場的隔空回應"},
  {id:"lee-tenghui-economic-policy",title:"李登輝執政時期兩岸經貿與國際參與政策",definition:"李登輝總統執政期間（1988–2000），因應兩岸經貿往來日益熱絡、憂心台商過度依賴大陸市場，陸續推出一系列配套政策：解除外匯管制，鬆綁台幣兌換限制，為兩岸經貿實質往來鋪路；訂定《大陸投資技術合作管理辦法》，規範台商赴陸投資的審核機制；推動南向政策，鼓勵台商將投資布局轉向東南亞，分散對單一市場的依賴風險；1996年提出戒急用忍政策，對赴陸投資設定金額上限、限制高科技與大型基礎建設項目赴陸投資，是李登輝執政後期對兩岸經貿轉趨保守審慎的具體體現。",scholars:"李登輝，1988–2000年執政期間陸續推出",applications:[{context:"109年外交領事人員特考（代號2101）第24題",note:"直接命中確認「提出戒急用忍政策」是李登輝總統任內的主張與作為，需與其他選項（如成立國統會、修憲兩岸特殊關係定位）精確區辨"}],note:"與既有[[policy|chen-shuibian-economic-policy|陳水扁執政時期兩岸經貿政策演變]]政策卡相互對照，可觀察歷任總統面對兩岸經貿過熱疑慮時，政策路線鬆緊搖擺的長期軌跡"},
  {id:"chen-shuibian-economic-policy",title:"陳水扁執政時期兩岸經貿政策演變",definition:"陳水扁總統執政期間（2000–2008），兩岸經貿政策歷經三階段調整：執政初期一度考慮採行「強本西進」路線（強化本土產業根基、同時逐步西進大陸市場），但因黨內外意見分歧，並未正式定案採行。2001年，正式以「積極開放、有效管理」政策取代李登輝時期的戒急用忍，鬆綁對陸投資限制、擴大開放項目。2006年，因兩岸經貿往來再度過熱、企業過度依賴大陸市場的疑慮升高，政策轉向調整為「積極管理、有效開放」（注意與2001年政策僅四字順序調換，卻代表鬆緊方向的逆轉），對特定產業與大型投資案重新收緊審查。",scholars:"陳水扁，2000年（強本西進，未正式採行）→2001年（積極開放有效管理）→2006年（積極管理有效開放）",applications:[{context:"與李登輝、馬英九政策路線比較",note:"「積極開放有效管理」與「積極管理有效開放」兩詞順序調換所代表的政策鬆緊反轉，是常見的精確用詞陷阱題，可與[[policy|lee-tenghui-economic-policy|李登輝執政時期兩岸經貿與國際參與政策]]政策卡的戒急用忍對照理解"}],note:"陳水扁執政時期兩岸經貿政策的反覆調整，展現同一位總統任內、因應情勢變化而持續搖擺的政策路線，不宜將其簡化為單一立場"},
  {id:"xiaosantong",title:"小三通",definition:"2001年，陳水扁政府開放金門、馬祖與中國大陸福建沿海（廈門、福州）之間試辦直接通航、通商、通郵，史稱小三通，是兩岸自1949年隔絕以來，首次在特定離島區域實現有限度的直接往來，早於2008年後全面開放的兩岸大三通直航。",scholars:"陳水扁，2001年開放試辦",applications:[{context:"113年外交領事人員特考（代號2101）第20題",note:"直接命中確認「開放兩岸小三通」不屬於李登輝總統任內政策，而是陳水扁2001年推動的政策，是常見的執政者歸屬混淆陷阱"}],note:"小三通侷限於金馬離島與福建沿海之間，與2008年後開放的兩岸全面直航（大三通）在範圍與性質上不同，不宜混淆"},
  {id:"su-chi-consensus-term",title:"蘇起與「九二共識」名詞創造",definition:"1992年，海基會與海協會在香港會談中，雙方就「一個中國」原則的表述方式未能達成正式書面協議，僅透過口頭聲明方式各自表達立場，形成一種模糊的默契（一般理解為「一個中國，各自表述」）。2000年，時任陸委會主委蘇起首次提出「九二共識」一詞，用以概括1992年香港會談的這段模糊共識，此後「九二共識」逐漸成為兩岸官方與學界討論兩岸政治基礎時的慣用簡稱。",scholars:"蘇起，2000年提出「九二共識」用語",applications:[{context:"與中共官方九二共識定義的比較",note:"值得留意的是，「九二共識」一詞雖由台灣方面（蘇起）於2000年創造，但中共對此詞的定義（如既有[[policy|prc-taiwan-policy-evolution|中共對台政策文件沿革]]政策卡中習五條的定義）與台灣主流理解的「一中各表」版本已有明顯落差"}],note:"九二共識一詞本身是2000年後才出現的追溯性稱呼，1992年香港會談當下並未使用此詞，是常考的名詞創造時間點陷阱"},
  {id:"cssta-and-goods-trade",title:"服貿與貨貿協議",definition:"2013年6月，兩岸簽署《海峽兩岸服務貿易協議》（服貿協議），開放雙方服務業市場准入，然而協議內容與審查程序引發台灣社會對可能衝擊中小企業、言論與資訊控制等疑慮，2014年3月立法院審查程序爭議，觸發大批學生與公民團體佔領立法院議場，史稱太陽花學運，服貿協議審查因此陷入僵局、未能完成後續立法程序。原訂於服貿協議後接續談判的《海峽兩岸貨品貿易協議》（貨貿協議），也因太陽花學運後的政治氛圍轉變而遲遲未能完成簽署。",scholars:"服貿協議：2013年6月簽署；貨貿協議：未完成簽署",applications:[{context:"與既有ECFA協議的關係",note:"服貿、貨貿協議本應是2010年《海峽兩岸經濟合作架構協議》（ECFA，詳見既有[[crossstrait|cross-strait-negotiation-history|兩岸兩會協商史]]事件卡）後續早期收穫清單的延伸協商項目，太陽花學運後兩岸經貿協商實質陷入停滯，直接影響此後兩岸關係走向"}],note:"太陽花學運是台灣公民社會對兩岸經貿協議審查透明度與實質衝擊疑慮的集體展現，也是評估台灣內部對兩岸經貿整合態度轉折的重要指標事件"},
  {id:"hk-macau-relations-act",title:"香港澳門關係條例",definition:"1997年，配合香港即將回歸中國，立法院制定《香港澳門關係條例》，作為規範我國與香港、澳門在回歸後經貿、文化及其他往來關係的專門法律，性質上有別於處理兩岸關係的《臺灣地區與大陸地區人民關係條例》，反映我國對港澳採取「有別於大陸、但也有別於外國」的第三種定位。條例中「香港居民」的定義，是指具有香港永久居留資格、且未持有英國國民（海外）護照或香港護照以外旅行證照者。行政院得在香港或澳門設立或指定機構、或委託民間團體處理相關事務。港澳居民申請在台灣地區居留或定居，其辦法由**內政部**（而非陸委會）擬訂，報請行政院核定後發布。2019年香港爆發反送中運動、2020年中共通過港版國安法後，行政院依據該條例第18條啟動「香港人道援助關懷行動專案」，協助有意來台的香港民眾；同時政府評估修改條例第18條以因應情勢變化，但未停止適用整部條例或取消對港特殊待遇。",scholars:"1997年制定，主管機關為陸委會，但港澳居民居留定居辦法由內政部擬訂",applications:[{context:"112年外交領事人員特考（代號2101）第29題",note:"考港澳居民定義（未持有英國國民（海外）護照或香港護照以外旅行證照）是否正確，以及居留定居辦法由內政部（而非陸委會）擬訂"},{context:"109年外交領事人員特考（代號2101）第30題／110年第20題",note:"考反送中運動後我方因應方案為修改條例第18條、推出人道援助關懷行動專案，而非停止適用整部條例或提供政治庇護"},{context:"112年外交領事人員特考（代號2101）第28題",note:"考陸委會業務職掌包含港澳政策的統合規劃、審議及協調，但不包含金門、馬祖政策——金馬事務屬一般大陸政策範疇，非港澳事務"}],note:"港澳回歸後一國兩制的具體實踐，詳見[[china|hongkong-macau-handover|香港與澳門回歸：中英聯合聲明、中葡聯合聲明與一國兩制]]事件卡；2019年後港版國安法對一國兩制承諾的衝擊，詳見[[modern|hong-kong-2019|香港反送中運動與港版國安法]]事件卡"},
  {id:"lai-four-pillars",title:"賴清德「和平四大支柱」",definition:"賴清德總統就任後，因應中共對台複合式施壓（軍演、滲透、統戰等），提出「和平四大支柱行動方案」，具體內容為：強化國防與不對稱戰力，建立台灣的嚇阻力量；強化經濟安全與供應鏈的韌性；深化與國際社會和理念相近民主國家的合作關係；以及對等尊嚴的兩岸交流。",scholars:"賴清德，就任總統後提出",applications:[{context:"113年外交領事人員特考（代號2101）第23題",note:"直接命中考「談判兩岸軍事互信機制與和平協議」並不屬於和平四大支柱的內容，是常見的陷阱選項——四大支柱聚焦國防自主、經濟韌性、國際合作、對等交流，並不包含與中共談判軍事互信機制或和平協議"}],note:"和平四大支柱是賴清德政府因應中共施壓的整體戰略框架，需精確記憶四項具體內容，避免將其他兩岸政策主張（如軍事互信機制談判）誤植為其中一項"},
  {id:"dpp-taiwan-stance-evolution",title:"民進黨台灣前途主張演變",definition:"民進黨對台灣前途的主張，歷經兩個階段的重要轉折：1991年10月，民進黨第五屆全國黨代表大會通過黨綱，明文列入「建立主權獨立自主的台灣共和國」等台獨主張條文，是民進黨建黨初期最鮮明的台獨立場宣示，通稱「台獨黨綱」。1999年5月，民進黨全代會通過《台灣前途決議文》，主張台灣已經是一個主權獨立的國家，依目前憲法稱為中華民國，台灣的獨立現狀不必經由宣布台灣獨立才成立，任何有關獨立現狀的更動，必須經由台灣全體住民以公民投票的方式決定，是民進黨從台獨黨綱的鮮明主張，轉向相對溫和務實立場的重要轉折。",scholars:"台獨黨綱(1991年民進黨第五屆全代會)→台灣前途決議文(1999年5月全代會)",applications:[{context:"與中共對台政策文件沿革的平行對照",note:"可與既有[[policy|prc-taiwan-policy-evolution|中共對台政策文件沿革]]政策卡並列比較——中共對台政策從武力解放走向和平統一（漸趨溫和），民進黨則從鮮明台獨黨綱走向相對溫和務實的台灣前途決議文，兩岸雙方各自的立場軟化過程恰好可以放在同一時間軸上對照討論"}],note:"台獨黨綱與台灣前途決議文雖僅相隔8年，但立場表述方式已有明顯差異，前者是鮮明的建國主張，後者則是務實承認既有現狀、強調程序正當性（全民公投）的立場，應試時需精確區辨兩份文件各自的表述重點"},
];

var PRC_INSTITUTIONS = [
  {id:"crossstrait-decision-system",title:"我國兩岸關係決策體系",definition:"我國兩岸事務決策體系以總統為最高決策者，透過國家安全會議研擬大政方針，行政院統籌執行，大陸委員會（陸委會）為統籌處理大陸事務的主管機關，海基會則以民間受託機構身分處理事務性協商與人民往來服務。台灣地區人民具特定身分者（如政務人員、直轄市長、縣市長等）進入大陸地區應經申請，並經內政部會同國家安全局、法務部及大陸委員會組成之審查會審查許可。《反滲透法》規定法定滲透來源涵蓋境外敵對勢力之政府及所屬組織、政黨及其他政治性組織、以及其實質控制之各類組織、機構、團體，但不包含境外敵對勢力之一般企業或非政府、非營利組織。因應中共「一國兩制台灣方案」的威脅，政府陸續完成「國安五法」修正，已確認涵蓋《國家機密保護法》《臺灣地區與大陸地區人民關係條例》《刑法》（增訂境外敵對勢力相關條文）等，並非涵蓋《憲法》本身。",scholars:"總統→國家安全會議→行政院→大陸委員會（主管機關）→海基會（受託民間機構）",applications:[{context:"110年外交領事人員特考（代號2101）第18、26題",note:"考特定身分人員進入大陸地區的審查會組成（內政部＋國家安全局＋法務部＋陸委會），及大陸地區人民違規活動處理程序"},{context:"109年外交領事人員特考（代號2101）第17題",note:"直接命中確認《國家機密保護法》《臺灣地區與大陸地區人民關係條例》《刑法》皆屬於國安五法範疇，但《憲法》不屬於，是常見的精確法律名稱陷阱"},{context:"111年警察人員特考（代號2351）第26、27題",note:"考反滲透法第3條法定滲透來源範疇（不含一般企業或非政府組織），及國安五法修法內容"},{context:"115年警察人員特考（代號5501）第23、28題",note:"考各項兩岸政策主管機關對應（如兩岸宗教交流主管機關為內政部），及兩岸人民關係條例第9條之3特定身分人員限制的例外情形"}],note:"與既有[[org|icao|國際民航組織]]等國際組織卡性質不同，此為我國國內處理大陸事務的行政決策鏈，而非國際組織"},
  {id:"mac-institutional-history",title:"陸委會組織沿革：從大陸工作會報到組織法",definition:"1988年，行政院成立「行政院大陸工作會報」，是陸委會的前身編制，性質為跨部會協調任務編組。1990年，立法院通過《行政院大陸委員會組織條例》，正式將陸委會提升為常設專責機關，統籌處理有關大陸事務。其後陸委會組織法制歷經修訂調整，逐步強化其作為兩岸事務主管機關的法律地位。",scholars:"1988年行政院大陸工作會報（前身）→1990年《行政院大陸委員會組織條例》（正式成立）",applications:[{context:"113年外交領事人員特考（代號2101）第25題",note:"考大陸委員會為《臺灣地區與大陸地區人民關係條例》之主管機關，統籌處理有關大陸事務"}],note:"陸委會的建制沿革，展現我國因應兩岸關係從軍事對峙走向交流開放，逐步建立常設專責機關處理大陸事務的制度化過程"},
  {id:"arats",title:"海峽兩岸關係協會（海協會）",definition:"全名海峽兩岸關係協會，於1991年12月成立，早於1993年辜汪會談，是中共處理兩岸事務的對口單位，對口台灣海基會。海協會雖名義上為民間團體，實質上受中共黨政機關指導與實質控制，並非真正獨立自主的民間組織。其上級機關為中共中央台灣工作辦公室（中央台辦），而非國台辦本身作為獨立上級機關（因國台辦與中央台辦本為同一機構兩塊招牌，詳見[[institution|taiwan-affairs-system|中央對台工作領導小組與國台辦／中央台辦體系]]）。歷任會長依序為汪道涵、陳雲林、張志軍（卸任前為國台辦主任）、陳德銘（曾任，會長人選近年仍持續更迭，應試時留意題目年份、以題目公告答案為準，不宜逕自假設何人為現任）。",scholars:"1991年12月成立；歷任會長：汪道涵→陳雲林→張志軍→陳德銘（依序曾任）；上級機關為中央台辦",applications:[{context:"113年外交領事人員特考（代號2101）第29題",note:"考海協會全名、性質（非真正獨立民間機構，實受中共黨政機關控制）、現任會長等細節，特別留意「為一民間機構，不受中共黨政機關所控制」是錯誤敘述"},{context:"114年外交領事人員特考（代號2101）第27題",note:"考海協會上級機關為中央台灣工作辦公室，且海協會成立於1991年、早於1992年兩岸兩會會談與1993年辜汪會談，而非在辜汪會談後才成立，是常考的時序陷阱；該題官方答案顯示「現今會長為陳德銘」的敘述已不準確，會長人選會隨時間更迭，應試時務必留意題目年份與最新公告資訊"}],note:"與台灣海基會的差異——海基會依《臺灣地區與大陸地區人民關係條例》第4條規範運作、董事長由主管機關遴聘，海協會則直接受中共黨政機關指導，兩者名義上皆稱民間團體，但實際受政府控制程度不同"},
  {id:"sef",title:"財團法人海峽交流基金會（海基會）",definition:"1990年11月，政府與部分民間人士共同捐助成立財團法人海峽交流基金會（海基會），1991年3月正式開始運作，推選辜振甫為首任董事長。海基會是我國目前唯一依據《臺灣地區與大陸地區人民關係條例》第4條而成立與運作的機構，接受政府委託與授權，代表政府與中國大陸就涉及公權力事項進行聯繫與協商，性質上是財團法人（而非社團法人），其董事長由主管機關即陸委會於政府特定職務人員中遴聘。海基會的成立正是為了在兩岸官方沒有直接接觸的情況下，由政府授權的民間中介機構代為處理兩岸交流衍生的事務性問題，其對口單位是中國大陸1991年12月成立的海峽兩岸關係協會（海協會）。1993年辜振甫與海協會會長汪道涵在新加坡舉行辜汪會談，是兩岸兩會協商機制正式確立的關鍵起點。歷任董事長依序為辜振甫（1990–2005）、張俊雄、洪奇昌、江丙坤（2008–2012，任內恢復兩岸兩會制度化協商）、林中森、田弘茂、張小月、李大維、鄭文燦、吳豊山、蘇嘉全（現任，2026年1月就任），會長人選會隨政局更迭，應試時應以題目公告年份與答案為準，不宜逕自假設何人為現任。",scholars:"1990年11月成立、1991年3月運作；首任董事長辜振甫；現行主管機關為大陸委員會",applications:[{context:"111年外交領事人員特考（代號2101）第29題",note:"考海基會性質為受政府委託之財團法人，並非「政府全資捐助的社團法人」，決算並非逕送審計部審計；2008年邀請訪台的海協會負責人是江丙坤任內的陳雲林，而非汪道涵（汪道涵已於2005年底過世）"},{context:"110年外交領事人員特考（代號2101）第21、25題",note:"考李登輝總統主政期間成立海基會（而非提出兩國論、開放陸客觀光），以及海基會現任董事長辨識——答案會隨考試年份不同而變動"},{context:"112年外交領事人員特考（代號2101）第27題",note:"考1990年《金門協議》簽署代表為中華民國紅十字會，海基會此時尚未成立"}],note:"與對岸海協會的差異——海基會依《臺灣地區與大陸地區人民關係條例》第4條規範運作、董事長由主管機關遴聘，海協會則直接受中共黨政機關（中央台辦）指導，兩者名義上皆稱民間團體，但實際受政府控制與監督的密度不同，詳見[[institution|arats|海峽兩岸關係協會（海協會）]]卡"},
  {id:"ccp-leadership-hierarchy",title:"中共黨政軍最高領導體制",definition:"中共最高領導人通常同時身兼三項最高職務：中國共產黨中央委員會總書記（黨的最高領導人）、中華人民共和國國家主席（國家元首）、中共中央軍事委員會主席（軍隊最高統帥），形成黨政軍一體的權力結構。中國共產黨全國代表大會每五年舉行一次，由中央委員會召集；中央委員會全體會議由中央政治局召集，每年至少舉行一次；黨的中央軍事委員會組成人員由中央政治局決定，實行主席負責制。2018年，中國全國人民代表大會通過修憲，廢除國家主席連續任期不得超過兩屆的限制，為習近平長期執政掃除憲法障礙。中共幹部依位階由高至低概分為：正國級（如政治局常委）、副國級（如全國人大常委會委員長、國家副主席、全國政協主席、最高人民法院院長等）、正部級（如省委書記、部長）等序列，政治局常務委員會現有七席，是中共最高權力常設決策機關。",scholars:"總書記＋國家主席＋中央軍委主席三位一體；2018年修憲廢除國家主席任期限制",applications:[{context:"109年外交領事人員特考（代號2101）第29題",note:"考中國共產黨中央組織運作規則，特別留意中央軍事委員會組成人員由中央政治局決定、實行主席負責制"},{context:"110年司法人員/調查人員特考（代號3401）第28題",note:"考中共十九大中央政治局常務委員會七人名單（習近平、李克強、栗戰書、汪洋、王滬寧、趙樂際、韓正），及國家副主席是否兼任其他職務的精確辨析"},{context:"111年警察人員特考（代號2351）第21題",note:"考何者不屬於副國級幹部（上海市委書記不屬於副國級，屬於正部級或更高的地方大員但非中央副國級序列）"},{context:"115年警察人員特考（代號5501）第24、25題",note:"考若習近平2027年連任總書記與國家主席將是第三任期（因2018年修憲已無任期限制）；及中共領導人身兼職務判斷（國務院總理不在總書記／國家主席／軍委主席／對台工作領導小組組長之列）"}],note:"2018年修憲廢除國家主席任期限制，是理解習近平得以長期執政的關鍵制度基礎，也是近年考古題高頻測試的時事重點"},
  {id:"taiwan-affairs-system",title:"中央對台工作領導小組與國台辦／中央台辦體系",definition:"中共為統籌對台政策，設有「中共中央對台工作領導小組」，由中共中央總書記、國家主席、中央軍委主席（現皆由習近平一人兼任）擔任組長，是黨內最高層級的對台政策協調機制，性質上並非單純事務性協調小組，而是具有高度政治決策權的黨中央機構。實際執行層面，「國務院台灣事務辦公室」（國台辦）與「中共中央台灣工作辦公室」（中央台辦）實為同一機構兩塊招牌、一套人馬，屬中共中央直屬機構序列，而非國務院一般行政機關，這與「中華人民共和國中央軍事委員會」（國家軍委）與「中國共產黨中央軍事委員會」（黨中央軍委）同樣是兩塊招牌一套人馬的現象如出一轍，都反映中共「以黨領政」的權力運作邏輯。海峽兩岸關係協會（海協會）並非對台最高決策機關，僅為執行層級的對口協商窗口。",scholars:"中央對台工作領導小組組長：習近平（總書記／國家主席／軍委主席三位一體兼任）；國台辦＝中央台辦（一機構兩招牌）",applications:[{context:"111年警察人員特考（代號2351）第22題",note:"考中央對台工作領導小組組長由習近平擔任，並測試2022年時任副組長人選（正確答案為全國政協主席汪洋，而非國務院總理李克強、人大委員長栗戰書、國家副主席王岐山）"},{context:"114年外交領事人員特考（代號2101）第28題",note:"考歷任國台辦主任名單，測試何者未曾擔任過此職務"},{context:"115年司法人員/調查人員特考（代號3401）第28題",note:"直接命中兩塊招牌一套人馬概念——確認國台辦與中央台辦為一機構兩塊牌子、屬中共中央直屬機構序列，而非海協會為對台最高決策機關、亦非中央對台工作領導小組組長由國務院總理擔任、亦非統戰部不參與涉臺事務"},{context:"115年警察人員特考（代號5501）第25題",note:"考中共領導人身兼職務判斷，中央對台工作領導小組組長是習近平身兼職務之一"}],note:"與既有[[institution|arats|海峽兩岸關係協會（海協會）]]的層級關係——海協會是執行層級的對口協商窗口，中央對台工作領導小組才是黨內最高層級的決策協調機制，國台辦／中央台辦則是介於兩者之間的執行機構，三者層級不應混淆"},
  {id:"cppcc-and-liaison-dept",title:"中國人民政治協商會議與中共中央對外聯絡部",definition:"中國人民政治協商會議（政協）是中共主導的統一戰線組織，並非國家權力機關，其全國委員會主席在中共權力序列中屬副國級幹部，成員涵蓋各民主黨派、無黨派人士、社會團體代表，象徵性展現多黨合作與政治協商制度，但實際政治決策權有限。中共中央對外聯絡部（中聯部）則是負責政黨外交的黨務機構，專司中國共產黨與世界各國政黨（尤其執政黨）之間的交流聯繫，性質與外交部負責的國家對國家正式外交關係不同，是中共黨際外交的專責窗口。",scholars:"政協：統一戰線組織，主席屬副國級；中聯部：政黨外交機構",applications:[{context:"110年外交領事人員特考（代號2101）第24題",note:"考中共對台政策內涵相關敘述，涉及統一戰線組織性質的辨析"}],note:"政協與中聯部性質不同但常被放在一起考——政協是對內統戰協商機制，中聯部是對外政黨外交機構，不宜混淆兩者職能"},
  {id:"united-front-dept",title:"中共中央統一戰線工作部（統戰部）",definition:"中共中央統一戰線工作部（統戰部）是中國共產黨負責統籌統一戰線工作的黨務機構，由習近平／黨中央直接領導，而非隸屬國務院體系之下——這是常見的誤植陷阱，需特別留意其黨務機構屬性。統戰部的統戰對象範疇隨時代持續擴大，2006年中共發布《關於鞏固和壯大新世紀新階段統一戰線的意見》，明確將私營企業與外資企業的管理技術人員也納入統戰工作對象。統戰部確實積極參與涉台事務，並非如部分誤解所稱不參與涉台工作，其對台工作與國台辦、中央對台工作領導小組體系相互配合、共同構成中共對台政策的執行網絡。",scholars:"由習近平／中共中央直接領導，非國務院體系",applications:[{context:"110年外交領事人員特考（代號2101）第24題",note:"直接命中考統一戰線相關敘述，確認「國務院內設有統戰部，由習近平直接領導」的說法是錯誤的——統戰部並非國務院內設機構，而是黨中央直屬機構，但確實由習近平直接領導"},{context:"115年司法人員/調查人員特考（代號3401）第28題",note:"確認統戰部確實參與涉台事務，並非如部分選項所誤稱的不參與涉台工作"}],note:"與既有[[institution|cppcc-and-liaison-dept|中國人民政治協商會議與中共中央對外聯絡部]]的差異——政協是統一戰線組織本身（象徵性協商機構），統戰部則是統籌、指揮統一戰線工作的黨務機構，兩者性質不同但常被放在一起測試混淆程度；也可與既有[[institution|taiwan-affairs-system|中央對台工作領導小組與國台辦／中央台辦體系]]體制架構卡相互呼應，共同構成中共對台工作的執行網絡"},
];

function parseYears(yearStr){
  var nums = (yearStr || '').match(/\d{4}/g) || [];
  var start = nums.length ? parseInt(nums[0], 10) : null;
  var hasNow = /迄今|至今/.test(yearStr || '');
  var end = hasNow ? 2026 : (nums.length > 1 ? parseInt(nums[nums.length - 1], 10) : start);
  return [start, end];
}

function esc(s){ return s.replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

function parseInline(text){
  var out = esc(text).replace(/\{\{(.*?)\}\}/g, function(m, term){
    return '<span class="term" data-term="' + term + '">' + term + '</span>';
  });
  out = out.replace(/\[\[([a-z]+)\|([a-z0-9-]+)\|(.*?)\]\]/g, function(m, region, id, label){
    return '<span class="jumplink" data-jump="' + region + '|' + id + '">' + label + '</span>';
  });
  return out;
}

function filteredEvents(){
  if (state.region === "theory") return THEORY_CARDS;
  if (state.region === "org") return ORGANIZATIONS;
  if (state.region === "policy") return POLICY_STATEMENTS;
  if (state.region === "institution") return PRC_INSTITUTIONS;
  if (state.region === "timeline") return [];
  if (state.region === "crossstrait-timeline") return [];
  if (state.region === "all"){
    return EVENTS.slice().sort(function(a, b){
      var ra = parseYears(a.year), rb = parseYears(b.year);
      return (ra[0] === null ? 9999 : ra[0]) - (rb[0] === null ? 9999 : rb[0]);
    });
  }
  return EVENTS.filter(function(e){ return e.region === state.region; });
}

function renderTimelineView(){
  var tab = TIMELINE_TABS[state.timelineTabIdx];
  var html = '';
  html += '<div class="tl-tabs">';
  TIMELINE_TABS.forEach(function(t, i){
    html += '<button class="' + (i === state.timelineTabIdx ? 'active' : '') + '" data-tltab="' + i + '">' + t.label + '</button>';
  });
  html += '</div>';

  function collect(region){
    return EVENTS.filter(function(e){ return e.region === region; })
      .map(function(e){ return { e:e, r:parseYears(e.year) }; })
      .filter(function(x){ return x.r[0] !== null && x.r[1] >= tab.start && x.r[0] <= tab.end; })
      .sort(function(a,b){ return a.r[0] - b.r[0]; });
  }
  var west = collect('west');
  var china = collect('china');

  var pxPerYear = 30;
  var span = Math.max(1, tab.end - tab.start);
  var laneWidthPx = 175;
  var yearLabelH = 13, lineH = 14.5, padV = 10, minH = 30;
  var MIN_COL_PX = 42;

  function yOf(y){ return (Math.max(tab.start, Math.min(tab.end, y)) - tab.start) * pxPerYear; }

  function estimateHeight(title, numCols){
    var colWidth = laneWidthPx / numCols;
    var charsPerLine = Math.max(3, Math.floor(colWidth / 13));
    var lines = Math.max(1, Math.ceil(title.length / charsPerLine));
    return yearLabelH + lines * lineH + padV;
  }

  function layout(list){
    var numCols = 1;
    var finalItems = null;
    for (var pass = 0; pass < 6; pass++){
      var items = list.map(function(x){
        var y1 = yOf(x.r[0]);
        var naturalH = (x.r[1] - x.r[0]) * pxPerYear;
        var textH = estimateHeight(x.e.title, numCols);
        var h = Math.max(naturalH, textH, minH);
        return { x:x, y1:y1, y2:y1 + h, h:h };
      });
      items.sort(function(a,b){ return a.y1 - b.y1; });
      var colEnds = [];
      items.forEach(function(it){
        var placed = false;
        for (var i = 0; i < colEnds.length; i++){
          if (colEnds[i] <= it.y1 + 0.5){
            colEnds[i] = it.y2;
            it.col = i;
            placed = true;
            break;
          }
        }
        if (!placed){
          colEnds.push(it.y2);
          it.col = colEnds.length - 1;
        }
      });
      var neededCols = colEnds.length;
      if (neededCols <= numCols || pass === 5){
        finalItems = items;
        numCols = Math.max(numCols, neededCols);
        break;
      }
      numCols = neededCols;
    }
    return { items:finalItems, numCols:numCols };
  }

  var westL = layout(west);
  var chinaL = layout(china);
  var westMaxY = 0, chinaMaxY = 0;
  westL.items.forEach(function(it){ westMaxY = Math.max(westMaxY, it.y2); });
  chinaL.items.forEach(function(it){ chinaMaxY = Math.max(chinaMaxY, it.y2); });
  var totalH = Math.max(westMaxY, chinaMaxY, span * pxPerYear) + 14;

  function barsHtml(layoutResult, side){
    var h = '';
    var n = layoutResult.numCols;
    layoutResult.items.forEach(function(it){
      var wPct = 100 / n;
      var leftPct = it.col * wPct;
      h += '<div class="tl-bar2 ' + it.x.e.spec + ' ' + side + '" style="top:' + it.y1.toFixed(1) + 'px;height:' + it.h.toFixed(1) + 'px;left:' + leftPct.toFixed(2) + '%;width:calc(' + wPct.toFixed(2) + '% - 3px)" data-jump="' + side + '|' + it.x.e.id + '">';
      h += '<div class="tl-bar2-yr">' + esc(it.x.e.year) + '</div><div class="tl-bar2-ttl">' + esc(it.x.e.title) + '</div>';
      h += '</div>';
    });
    if (!layoutResult.items.length) return '<div class="tl-note">此區間尚無收錄事件</div>';
    var minW = layoutResult.numCols * MIN_COL_PX;
    return '<div class="tl-vcol-inner" style="min-width:' + minW + 'px">' + h + '</div>';
  }

  html += '<div class="tl-legend"><span><i class="tl-dot west"></i>西洋史</span><span><i class="tl-dot china"></i>中國史</span><span class="tl-legend-note">深色＝核心考點</span></div>';

  html += '<div class="tl-vwrap" style="height:' + totalH.toFixed(0) + 'px">';
  html += '<div class="tl-vcol">' + barsHtml(westL, 'west') + '</div>';
  html += '<div class="tl-vaxis">';
  var step = Math.max(2, Math.round(span / 10));
  for (var yy = tab.start; yy <= tab.end; yy += step){
    html += '<span style="top:' + yOf(yy).toFixed(1) + 'px">' + yy + '</span>';
  }
  html += '</div>';
  html += '<div class="tl-vcol">' + barsHtml(chinaL, 'china') + '</div>';
  html += '</div>';

  var westIds = {}; west.forEach(function(x){ westIds[x.e.id] = true; });
  var chinaIds = {}; china.forEach(function(x){ chinaIds[x.e.id] = true; });
  var links = COMPARISON.filter(function(c){ return westIds[c.westId] && chinaIds[c.zhId]; });
  if (links.length){
    html += '<div class="tl-links-note"><div class="tl-links-title">因果／平行對照</div>';
    links.forEach(function(c){
      html += '<div class="tl-link-item">' + esc(c.zhLabel) + ' × ' + esc(c.westLabel) + '（' + esc(c.noteYear) + '）<div class="tl-link-desc">' + esc(c.note) + '</div></div>';
    });
    html += '</div>';
  }
  return html;
}

function renderCrossstraitTimelineView(){

  var maxYear = 2026;

  function collectSide(side){
    return CROSSSTRAIT_STANCES.filter(function(c){ return c[side + 'Label']; })
      .map(function(c){ var r = parseYears(c.noteYear); return { c:c, r:[r[0], r[0]] }; })

        return { x:x, y1:y1, y2:y1 + h, h:h };

  if (CROSSSTRAIT_STANCES.length){
    html += '<div class="tl-links-note"><div class="tl-links-title">立場對照說明</div>';
    CROSSSTRAIT_STANCES.forEach(function(c){
      html += '<div class="tl-link-item">' + esc(c.prcLabel || '') + ' ↔ ' + esc(c.rocLabel || '') + '（' + esc(c.noteYear) + '）<div class="tl-link-desc">' + esc(c.note) + '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="tl-note" style="text-align:center;padding:24px 0">尚未收錄兩岸立場對照內容</div>';
  }
  return html;
}

function accordionCompare(){
  var key = 'compare';
  var open = state.openAccordion === key;
  var h = '<div class="acc-item">';
  h += '<button class="acc-head' + (open ? ' open' : '') + '" data-acc="' + key + '"><span>中西年代對照表</span><span class="arrow">›</span></button>';
  h += '<div class="acc-body' + (open ? ' open' : '') + '">';
  COMPARISON.forEach(function(c){
    h += '<div class="cmp-row">';
    h += '<div class="yr">' + esc(c.noteYear) + '</div>';
    h += '<div class="pair"><span data-jump="china|' + c.zhId + '">' + esc(c.zhLabel) + '</span><span style="color:var(--slate)">×</span><span data-jump="west|' + c.westId + '">' + esc(c.westLabel) + '</span></div>';
    h += '<div class="note">' + esc(c.note) + '</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function accordionCrossstraitStancesLink(){
  var open = state.region === 'crossstrait-timeline';
  var h = '<button class="sidebar-timeline-btn' + (open ? ' active' : '') + '" data-goto-crossstrait-timeline="1">📊 兩岸立場對照時間軸</button>';
  return h;
}

function renderSidebar(){
  var h = '<div class="sidebar-overlay' + (state.sidebarOpen ? ' on' : '') + '" id="sidebar-overlay">';
  h += '<div class="sidebar">';
  h += '<div class="sidebar-title">近代史卷宗 目錄</div>';
  h += '<input type="text" class="sidebar-filter-input" id="sidebar-filter-input" placeholder="搜尋目錄關鍵字…" value="' + esc(state.sidebarFilter) + '">';
  h += '<button class="sidebar-timeline-btn' + (state.region === 'timeline' ? ' active' : '') + '" data-goto-timeline="1">📊 中西時間軸對照</button>';
  h += accordionSection('china', '近代中國外交史', 'china');
  h += accordionSection('eastasia', '近代東亞外交史', 'eastasia');
  h += accordionSection('west', '近代西洋外交史', 'west');
  h += accordionSection('crossstrait', '兩岸關係：事件', 'crossstrait');
  h += accordionPolicy();
  h += accordionInstitution();
  h += accordionSection('modern-events', '現代國際關係史', 'modern');
  h += accordionTheory();
  h += accordionOrg();
  h += accordionCompare();
  h += accordionCrossstraitStancesLink();
  h += '</div></div>';
  return h;
}

var touchStartX = 0, touchStartY = 0;

function goPrev(){
  if (state.index > 0){ state.index--; state.tab = 'narrative'; state.revealed = false; render(); }
}
function goNext(){
  var list = filteredEvents();
  if (state.index < list.length - 1){ state.index++; state.tab = 'narrative'; state.revealed = false; render(); }
}

function snippetAround(text, query){
  var idx = text.indexOf(query);
  if (idx < 0) return text.slice(0, 60) + '…';
  var start = Math.max(0, idx - 15);
  var end = Math.min(text.length, idx + query.length + 30);
  return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
}

function renderSearchResults(query){
  var box = document.getElementById('search-results');
  query = (query || '').trim();
  if (!query){
    box.innerHTML = '<div class="search-empty">輸入關鍵字搜尋51個歷史事件、25張理論卡</div>';
    return;
  }
  var results = [];
  EVENTS.forEach(function(e){
    var hay = e.title + ' ' + e.narrative + ' ' + (e.knowledge ? e.knowledge.join(' ') : '') + ' ' + (e.causal || '');
    if (hay.indexOf(query) >= 0){
      var typeLabel = {china:'中國史',west:'西洋史',eastasia:'東亞史',modern:'現代國際關係'}[e.region] || e.region;
      results.push({type:typeLabel, title:e.title + '（' + e.year + '）', snippet:snippetAround(hay, query), region:e.region, id:e.id});
    }
  });
  THEORY_CARDS.forEach(function(t){
    var hay = t.title + ' ' + t.definition + ' ' + (t.scholars || '');
    if (hay.indexOf(query) >= 0){
      results.push({type:'理論架構', title:t.title, snippet:snippetAround(hay, query), region:'theory', id:t.id});
    }
  });
  Object.keys(GLOSSARY).forEach(function(term){
    if (term.indexOf(query) >= 0 || GLOSSARY[term].indexOf(query) >= 0){
      results.push({type:'關鍵字', title:term, snippet:snippetAround(GLOSSARY[term], query), region:null, id:null, term:term});
    }
  });

  if (!results.length){
    box.innerHTML = '<div class="search-empty">沒有找到符合「' + esc(query) + '」的內容</div>';
    return;
  }
  var h = '';
  results.forEach(function(r){
    h += '<div class="search-result-item" data-sr-region="' + (r.region || '') + '" data-sr-id="' + (r.id || '') + '" data-sr-term="' + (r.term || '') + '">';
    h += '<div class="sr-type">' + esc(r.type) + '</div>';
    h += '<div class="sr-title">' + esc(r.title) + '</div>';
    h += '<div class="sr-snippet">' + esc(r.snippet) + '</div>';
    h += '</div>';
  });
  box.innerHTML = h;
  document.querySelectorAll('.search-result-item').forEach(function(el){
    el.onclick = function(){
      document.getElementById('search-panel').classList.remove('on');
      if (el.dataset.srTerm){
        openGlossary(el.dataset.srTerm);
      } else {
        jumpToEvent(el.dataset.srRegion, el.dataset.srId);
      }
    };
  });
}

function jumpToEvent(region, id){
  state.region = region;
  var list = filteredEvents();
  var idx = list.findIndex(function(e){ return e.id === id; });
  state.index = idx >= 0 ? idx : 0;
  state.tab = 'narrative';
  state.sidebarOpen = false;
  state.sidebarFilter = '';
  state.revealed = false;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function bindEvents(){
  document.querySelectorAll('[data-region]').forEach(function(b){
    b.onclick = function(){ state.region = b.dataset.region; state.index = 0; state.tab = 'narrative'; state.revealed = false; render(); };
  });
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ state.tab = b.dataset.tab; render(); };
  });
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  if (prev) prev.onclick = goPrev;
  if (next) next.onclick = goNext;

  var card = document.querySelector('.card');
  if (card){
    card.addEventListener('touchstart', function(e){
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive:true});
    card.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].screenX - touchStartX;
      var dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.6){
        if (dx < 0) { goNext(); } else { goPrev(); }
      }
    }, {passive:true});
  }
  document.querySelectorAll('.term').forEach(function(t){
    t.onclick = function(){ openGlossary(t.dataset.term); };
  });
  var menuBtn = document.getElementById('menu-btn');
  if (menuBtn) menuBtn.onclick = function(){ state.sidebarOpen = true; render(); };
  var sbOverlay = document.getElementById('sidebar-overlay');
  if (sbOverlay) sbOverlay.onclick = function(e){ if (e.target.id === 'sidebar-overlay'){ state.sidebarOpen = false; render(); } };
  document.querySelectorAll('[data-acc]').forEach(function(b){
    b.onclick = function(){
      state.openAccordion = (state.openAccordion === b.dataset.acc) ? null : b.dataset.acc;
      render();
    };
  });
  var tlBtn = document.querySelector('[data-goto-timeline]');
  if (tlBtn) tlBtn.onclick = function(){
    state.region = 'timeline';
    state.sidebarOpen = false;
    render();
  };
  var csTlBtn = document.querySelector('[data-goto-crossstrait-timeline]');
  if (csTlBtn) csTlBtn.onclick = function(){
    state.region = 'crossstrait-timeline';
    state.sidebarOpen = false;
    render();
  };
  var filterInput = document.getElementById('sidebar-filter-input');
  if (filterInput) filterInput.oninput = function(){
    state.sidebarFilter = filterInput.value;
    var caret = filterInput.selectionStart;
    render();
    var restored = document.getElementById('sidebar-filter-input');
    if (restored){ restored.focus(); restored.setSelectionRange(caret, caret); }
  };
  document.querySelectorAll('[data-tltab]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      state.timelineTabIdx = parseInt(b.dataset.tltab, 10);
      render();
    };
  });
  document.querySelectorAll('[data-jump]').forEach(function(el){
    el.onclick = function(){
      var parts = el.dataset.jump.split('|');
      jumpToEvent(parts[0], parts[1]);
    };
  });
  var quizBtn = document.getElementById('quiz-btn');
  if (quizBtn) quizBtn.onclick = function(){ state.quizMode = !state.quizMode; state.revealed = false; render(); };
  var revealBtn = document.getElementById('reveal-btn');
  if (revealBtn) revealBtn.onclick = function(){ state.revealed = true; render(); };
  var searchBtn = document.getElementById('search-btn');
  if (searchBtn) searchBtn.onclick = function(){
    document.getElementById('search-panel').classList.add('on');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '<div class="search-empty">輸入關鍵字搜尋' + EVENTS.length + '個歷史事件、' + THEORY_CARDS.length + '張理論卡、' + ORGANIZATIONS.length + '個國際組織</div>';
    setTimeout(function(){ document.getElementById('search-input').focus(); }, 50);
  };
  var searchClose = document.getElementById('search-close');
  if (searchClose) searchClose.onclick = function(){
    document.getElementById('search-panel').classList.remove('on');
  };
  var searchInput = document.getElementById('search-input');
  if (searchInput) searchInput.oninput = function(){ renderSearchResults(this.value); };

}

function openGlossary(term){
  document.getElementById('term-title').textContent = term;
  document.getElementById('term-body').innerHTML = esc(GLOSSARY[term] || '（尚未收錄此詞條解釋）');
  document.getElementById('overlay').classList.add('on');
}

function openTheory(id){
  var t = THEORY_CARDS.find(function(x){ return x.id === id; }) || ORGANIZATIONS.find(function(x){ return x.id === id; }) || POLICY_STATEMENTS.find(function(x){ return x.id === id; }) || PRC_INSTITUTIONS.find(function(x){ return x.id === id; });
  if (!t) return;
  document.getElementById('term-title').textContent = t.title;
  var h = '<div style="margin-bottom:10px">' + esc(t.definition) + '</div>';
  if (t.scholars){
    h += '<div style="font-size:12px;color:var(--slate);margin-bottom:10px"><strong style="color:var(--ink)">代表學者：</strong>' + esc(t.scholars) + '</div>';
  }
  if (t.applications && t.applications.length){
    h += '<div style="font-size:12px;color:var(--slate);font-weight:500;margin-bottom:4px">應用實例</div>';
    t.applications.forEach(function(a){
      h += '<div style="margin-bottom:6px;padding-left:10px;border-left:2px solid var(--gold)">';
      h += '<div style="font-weight:500;font-size:13px">' + esc(a.context) + '</div>';
      h += '<div style="font-size:12.5px;color:#3A3222">' + esc(a.note) + '</div>';
      h += '</div>';
    });
  }
  if (t.note){
    h += '<div style="margin-top:10px;padding:8px 10px;background:rgba(178,58,46,0.08);border-radius:6px;font-size:12.5px;color:var(--vermillion)">' + esc(t.note) + '</div>';
  }
  document.getElementById('term-body').innerHTML = h;
  document.getElementById('overlay').classList.add('on');
}
document.getElementById('overlay').onclick = function(e){
  if (e.target.id === 'overlay') document.getElementById('overlay').classList.remove('on');
};
document.getElementById('close-sheet').onclick = function(){
  document.getElementById('overlay').classList.remove('on');
};

render();
</script>
</body>
</html>
