<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3EAD3">
<title>近代外交史卷宗</title>
<style>
:root{
  --paper:#F3EAD3;
  --card:#FBF5E6;
  --line:#E0D3AC;
  --ink:#241F17;
  --slate:#5B6B7C;
  --vermillion:#B23A2E;
  --gold:#A9862F;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.6;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:24px 16px 40px}
.header{text-align:center;margin-bottom:18px}
.header h1{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:1px;margin:0}
.header p{font-size:12px;color:var(--slate);margin:4px 0 0}

.filters{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.filters button{
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:13px;font-weight:500;color:var(--ink);
}
.filters button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.header-row{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:18px}
.menu-btn{
  position:absolute;left:0;top:2px;width:36px;height:36px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:16px;color:var(--ink);
}
.search-btn{
  position:absolute;right:0;top:2px;width:36px;height:36px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--ink);
}
.search-panel{
  position:fixed;inset:0;background:var(--paper);z-index:70;display:none;
  flex-direction:column;padding:16px 16px 0;
}
.search-panel.on{display:flex}
.search-input-row{display:flex;gap:8px;margin-bottom:14px}
.search-input-row input{
  flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:15px;color:var(--ink);font-family:inherit;
}
.search-input-row button{
  padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:14px;color:var(--slate);
}
.search-results{flex:1;overflow-y:auto;padding-bottom:20px}
.search-result-item{
  padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;
}
.search-result-item .sr-type{
  font-size:10.5px;color:var(--gold);font-weight:500;margin-bottom:2px;
}
.search-result-item .sr-title{font-size:15px;font-weight:500;color:var(--ink)}
.search-result-item .sr-snippet{font-size:12.5px;color:var(--slate);margin-top:3px;line-height:1.5}
.search-empty{color:var(--slate);font-size:13px;text-align:center;padding:40px 20px}

.quiz-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;
}
.quiz-toggle button{
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:12.5px;color:var(--slate);
}
.quiz-toggle button.active{background:var(--vermillion);color:var(--paper);border-color:var(--vermillion)}
.reveal-btn{
  width:100%;padding:14px;border-radius:8px;border:1.5px dashed var(--gold);
  background:rgba(169,134,47,0.06);color:var(--gold);font-size:14px;font-weight:500;margin-top:10px;
}
.jumplink{color:var(--vermillion);border-bottom:1.5px dotted var(--vermillion);cursor:pointer;font-weight:500}

.sidebar-overlay{
  position:fixed;inset:0;background:rgba(36,31,23,0.4);display:none;z-index:60;
}
.sidebar-overlay.on{display:block}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:84%;max-width:340px;background:var(--paper);
  box-shadow:4px 0 20px rgba(36,31,23,0.25);overflow-y:auto;padding:18px 14px 40px;
  transform:translateX(-100%);transition:transform 0.22s ease;
}
.sidebar-overlay.on .sidebar{transform:translateX(0)}
.sidebar-title{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:14px;padding:0 4px}
.sidebar-filter-input{display:block;width:100%;box-sizing:border-box;padding:9px 12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--slate);background:var(--paper);font-size:13.5px;color:var(--ink);font-family:inherit}
.acc-empty{padding:6px 10px;font-size:12px;color:var(--slate);font-style:italic}
.sidebar-timeline-btn{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--slate);background:transparent;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.sidebar-timeline-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acc-item{margin-bottom:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.acc-head{
  width:100%;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:500;color:var(--ink);
}
.acc-head .arrow{transition:transform 0.15s;color:var(--slate);font-size:12px}
.acc-head.open .arrow{transform:rotate(90deg)}
.acc-body{display:none;padding:2px 0 6px}
.acc-body.open{display:block}
.acc-row{
  display:flex;gap:8px;align-items:baseline;padding:7px 14px;font-size:13px;
  border-top:1px solid var(--line);
}
.acc-row .yr{color:var(--slate);font-size:11.5px;min-width:64px;flex-shrink:0}
.acc-row .ttl{cursor:pointer;color:var(--ink)}
.acc-row .ttl:active{color:var(--vermillion)}
.acc-row.light .dotmark{color:var(--slate)}
.acc-row .dotmark{margin-right:2px;font-size:10px}
.cmp-row{padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px}
.cmp-row .yr{color:var(--gold);font-weight:500;font-size:11.5px;margin-bottom:3px}
.cmp-row .pair{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.cmp-row .pair span{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;color:var(--ink)}
.tl-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.tl-tabs button{padding:7px 11px;border:1px solid var(--slate);border-radius:8px;background:transparent;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.tl-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl-legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--slate);margin-bottom:10px}
.tl-legend .tl-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tl-legend .tl-dot.west{background:var(--vermillion)}
.tl-legend .tl-dot.china{background:var(--gold)}
.tl-legend-note{margin-left:auto;font-size:10.5px}
.tl-vwrap{position:relative;display:flex}
.tl-vcol{position:relative;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.tl-vcol-inner{position:relative;height:100%}
.tl-vaxis{position:relative;width:38px;flex-shrink:0}
.tl-vaxis span{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-size:9.5px;color:var(--slate);background:var(--paper);padding:1px 3px;border-radius:3px;white-space:nowrap}
.tl-bar2{position:absolute;box-sizing:border-box;border-radius:7px;padding:4px 6px;cursor:pointer;overflow:hidden;border:1px solid rgba(0,0,0,0.12);display:flex;flex-direction:column;justify-content:center}
.tl-bar2.core.west{background:rgba(178,58,46,0.28)}
.tl-bar2.light.west{background:rgba(178,58,46,0.13)}
.tl-bar2.core.china{background:rgba(169,134,47,0.34)}
.tl-bar2.light.china{background:rgba(169,134,47,0.16)}
.tl-bar2-yr{font-size:9px;color:var(--slate);font-weight:600;line-height:1.15;margin-bottom:1px}
.tl-bar2-ttl{font-size:11px;color:var(--ink);font-weight:500;line-height:1.25;word-break:break-word}
.tl-note{font-size:11.5px;color:var(--slate);margin-top:6px;line-height:1.5}
.tl-links-note{margin-top:18px;padding:12px 13px;background:rgba(169,134,47,0.10);border-radius:10px}
.tl-links-title{font-size:11.5px;font-weight:600;color:var(--gold);margin-bottom:8px}
.tl-link-item{font-size:12.5px;color:var(--ink);font-weight:500;margin-bottom:8px}
.tl-link-item:last-child{margin-bottom:0}
.tl-link-desc{font-size:11.5px;color:var(--slate);font-weight:400;margin-top:2px;line-height:1.5}
.cmp-row .note{color:var(--slate);line-height:1.5}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:20px 22px 22px;position:relative;
  box-shadow:0 1px 0 var(--line),0 6px 16px rgba(36,31,23,0.08);
}
.period-tag{
  position:absolute;top:-10px;left:18px;background:var(--ink);color:var(--paper);
  font-size:11px;padding:3px 10px;border-radius:2px;letter-spacing:0.5px;
}
.stamp{
  position:absolute;top:10px;right:16px;width:58px;height:58px;border-radius:50%;
  border:2px solid var(--vermillion);display:flex;align-items:center;justify-content:center;
  transform:rotate(-9deg);color:var(--vermillion);font-family:var(--serif);
  font-size:13px;font-weight:700;line-height:1.1;text-align:center;
}
.tag-light{
  position:absolute;top:14px;right:16px;padding:4px 10px;border:1.5px dashed var(--slate);
  color:var(--slate);font-size:11px;transform:rotate(5deg);font-weight:500;
}
.meta{margin-top:22px;margin-bottom:14px}
.year{font-size:13px;color:var(--slate);margin-bottom:2px}
.title{font-family:var(--serif);font-size:24px;font-weight:700}

.tabs{display:flex;gap:4px;margin-bottom:14px}
.tabs button{
  flex:1;padding:7px 4px;font-size:12.5px;border-bottom:2px solid transparent;
  color:var(--slate);font-weight:400;
}
.tabs button.active{border-bottom-color:var(--vermillion);color:var(--ink);font-weight:500}

.content{font-size:14.5px;line-height:1.85}
.content ul{margin:0;padding-left:18px}
.content li{margin-bottom:8px}
.term{color:var(--gold);border-bottom:1.5px dotted var(--gold);cursor:pointer;font-weight:500}
.theory-block{margin-bottom:12px}
.theory-label{font-family:var(--serif);color:var(--vermillion);font-weight:700;margin-right:4px}
.light-block{margin-bottom:14px}
.light-label{font-size:12px;color:var(--slate);font-weight:500;margin-bottom:4px}

.nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.nav button{
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:14px;
}
.nav button:disabled{color:#C9BFA0;cursor:default}
.nav .counter{font-size:12.5px;color:var(--slate)}

.overlay{
  position:fixed;inset:0;background:rgba(36,31,23,0.35);display:none;
  align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.on{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:480px;border-top-left-radius:12px;
  border-top-right-radius:12px;padding:18px 22px 26px;border-top:3px solid var(--gold);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head .term-title{font-family:var(--serif);font-size:17px;font-weight:700}
.sheet-head button{font-size:18px;color:var(--slate)}
.sheet-body{font-size:14px;line-height:1.7;color:#3A3222}
</style>
</head>
<body>
<div id="app"></div>

<div class="search-panel" id="search-panel">
  <div class="search-input-row">
    <input type="text" id="search-input" placeholder="搜尋事件、理論、關鍵字…" autocomplete="off">
    <button id="search-close">取消</button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="term-title" id="term-title"></div>
      <button id="close-sheet">×</button>
    </div>
    <div class="sheet-body" id="term-body"></div>
  </div>
</div>

<script>
var GLOSSARY = {
  "治外法權": "指外國人在他國領土內，不受當地法律管轄，而依其本國法律受本國（通常是領事）審判的特權。",
  "最惠國待遇": "條約一方承諾給予另一方的優惠待遇，不得低於其給予任何第三國的待遇；若為片面最惠國待遇，則只有一方享有此保障，不對等。",
  "兩強標準": "19世紀英國海軍政策，要求英國海軍實力須維持在同時超過世界第二、第三強海軍國家總和的水準，以確保絕對制海權。",
  "光榮孤立": "19世紀英國長期奉行不與歐陸強權締結永久同盟的外交策略，依靠海上優勢與均勢外交自保，直到20世紀初因應德國崛起才改弦更張。",
  "修昔底德陷阱": "指崛起強權挑戰既有霸權地位時，雙方因結構性猜忌與安全焦慮而走向戰爭的傾向，典出古希臘史家修昔底德對雅典崛起引發斯巴達恐懼、導致伯羅奔尼撒戰爭的描述。常與金德柏格陷阱相提並論比較——本陷阱關注霸權更替引發戰爭的風險，金德柏格陷阱則關注霸權缺位導致國際公共財不足的風險，兩者皆涉及霸權興衰但關注面向不同，考古題常考這個對比。",
  "再保條約": "1887年俾斯麥與俄國私下簽訂的秘密條約，承諾德俄互不與第三國聯合對付對方，目的在防止俄國倒向法國，卻與德奧同盟的對俄防禦義務互相矛盾。",
  "戰略模糊": "美國自1979年與中華民國斷交、制定《台灣關係法》以來，對於是否會在台海發生軍事衝突時派兵協防台灣，長期採取刻意不明確表態的政策立場——既不承諾必然出兵，也不完全排除介入可能，藉此同時嚇阻中國大陸片面武力犯台、以及嚇阻台灣片面宣布獨立，避免任一方誤判形勢輕舉妄動。近年隨著中國軍力提升、多位美國官員多次公開表態將協防台灣，學界與政界持續辯論美國是否應轉向戰略清晰（明確承諾協防），以強化嚇阻效果，但轉向清晰化也可能被解讀為片面升高對中對抗姿態，兩種立場各有支持者。",
  "延伸嚇阻": "核武嚇阻理論的延伸應用，指擁核強權不僅嚇阻針對自身的直接攻擊，也承諾將嚇阻能力延伸至保護盟友或夥伴國家，使潛在敵對國不敢對該盟友發動攻擊，例如美國透過核保護傘承諾協防北約歐洲盟國、日本、南韓。延伸嚇阻的可信度高度仰賴承諾方的決心展現，若盟友或對手懷疑承諾方是否真的會為保護他國而承受核戰風險，嚇阻效果便會打折扣，這也是台灣戰略模糊政策爭議背後的深層理論邏輯。",
  "阿拉斯加購地案": "1867年美國國務卿西華德主導，以720萬美元向俄羅斯帝國購得阿拉斯加，是19世紀初葉以來美俄關係發展的重要起點——俄羅斯考量阿拉斯加距離本土遙遠、防衛困難，且擔心日後可能被英國奪取，遂決定出售予當時尚非直接地緣競爭對手的美國，是美俄關係史上少見的合作性交易案例，可作為論述19世紀初至今美俄關係演變分期的起始標誌。",
  "英國脫歐": "英國於2016年6月舉行公投，以52%對48%的些微差距通過脫離歐洲聯盟，主要訴求包括收回移民管制主權、擺脫歐盟法規束縛、減少對歐盟預算分攤等，2020年1月31日英國正式脫離歐盟，同年底過渡期結束，英國與歐盟另簽署貿易合作協定規範後續經貿關係。脫歐是歐洲整合史上首次有會員國正式退出的先例，衝擊歐盟長期以來整合不斷深化、擴大的既定敘事，也直接影響英國自身的政治版圖（蘇格蘭獨立公投聲浪再起）與對外貿易關係重整。",
  "印太戰略": "美國自歐巴馬政府「亞太再平衡」政策演變而來、川普政府正式定名的整體區域戰略概念，主張將傳統亞太概念擴展至涵蓋印度洋，強調自由開放的印太地區，核心目標是深化與日本、澳洲、印度、東協等區域夥伴的安全與經濟合作，制衡中國在此區域日益增長的影響力。印太戰略是一個涵蓋性的整體戰略架構，QUAD（四方安全對話）、AUKUS（澳英美聯盟）等則是在此戰略架構下具體落實的個別安全合作機制，不宜混淆整體戰略概念與其下轄的個別機制。考點陷阱（109年三等第7題）：美國國防部2019年6月發布的《印太戰略報告》安全面向並不包含「建立共同防衛安全體系」，該報告著重維持既有海空秩序、協助盟友能力提升、和平解決爭端，而非建立正式的集體防衛機制。",
  "存亡危機事態": "日本2015年新安保法制下設立的法律概念，指若他國遭受武力攻擊、其結果將對日本存立構成威脅、對國民權利造成根本性危害的情況，一旦認定構成存亡危機事態，日本自衛隊即可行使集體自衛權、協助支援遭攻擊的他國。2025年9月，日本首相高市早苗在國會答詢中表示，若中國對台灣動用武力可能構成存亡危機事態，此番言論引發中國強烈抗議與外交施壓，凸顯台海情勢與日本安全保障政策之間日益緊密的連結，也是近年「台灣有事即日本有事」政策論述的具體法律化實踐案例。",
  "公共外交": "國家為爭取外國「民眾」（而非外國政府）的理解、信任與支持，透過文化交流、國際廣播、留學生交換、資訊發布等直接溝通手段，達成對外政策目標的外交操作方式，是軟實力資源具體轉化為實際影響力的操作工具。常與軟實力本身混淆——軟實力是抽象的吸引力資源，公共外交則是運用這些資源的具體手段，兩者是資源與操作工具的關係，而非同義詞。",
  "非傳統安全": "相對於傳統安全（軍事衝突、地緣政治對抗、國家間戰爭）而言，指涵蓋公共衛生疫情、糧食安全、氣候變遷、資訊操弄與假訊息、跨國犯罪、能源安全等跨國界、非軍事性質的安全威脅。111年四等第21題曾直接測試COVID-19疫情、糧食危機、假訊息屬於非傳統安全，北約擴張、烏克蘭衝突則屬傳統安全的分類判斷。",
  "友岸外包": "美國財政部長葉倫提出的供應鏈重組策略，主張將關鍵產業供應鏈遷移至政治理念相近、關係友好的盟邦或夥伴國家，而非單純考量生產成本最低的市場，藉此降低對地緣政治對手（尤其中國）的供應鏈依賴風險。是去風險化政策的具體操作手段之一，兩者常被相提並論——去風險化是整體政策論述框架，友岸外包則是實現該框架的具體供應鏈布局策略。",
  "非紅供應鏈": "台灣科技與半導體產業界常用語，指刻意排除中國大陸廠商或含中國技術成分產品的供應鏈體系，通常是為因應美國對中國科技出口管制、或客戶要求供應鏈去中國化的市場壓力而形成，是去風險化、友岸外包等總體政策論述在台灣產業實務層面的具體展現。",
  "台灣地位未定論／已定論": "圍繞1951年《舊金山和約》衍生的一組對立法律論述。未定論主張：條約中日本僅宣布放棄對台灣、澎湖的一切權利、名義與要求，但條約文本並未明訂放棄後應歸屬何國，這個法律文本上的空白，是台灣國際法地位懸而未決論者的核心依據，並援引《開羅宣言》《波茨坦宣言》僅屬政治性宣言、不具正式割讓領土的條約效力等論點強化立場。已定論則主張台灣地位已經確定，但依論者立場不同又可分兩種版本——一種主張依《開羅宣言》《波茨坦宣言》明確聲明台灣應歸還中華民國，加上戰後中華民國政府實際統治台灣已逾七十年構成有效統治，台灣地位已確定屬於中華民國；另一種版本則主張台灣應歸屬中華人民共和國，援引聯合國大會第2758號決議與多數國家的一個中國政策立場。這組爭議的核心在於《舊金山和約》條約解釋方法論的分歧——未定論嚴格拘泥條約文義，已定論則援引條約以外的政治宣言、歷史事實、後續國際實踐等依據補充論證，是研究條約解釋方法論（文義解釋vs目的性解釋）的實用案例。",
  "集體安全": "一種國際和平維護機制的設計理念，主張所有會員國承諾將對任一會員國的侵略視為對全體的侵略，共同採取集體制裁或軍事反制，藉此嚇阻潛在侵略者，是國際聯盟與聯合國共同的核心理念基礎。但集體安全機制的有效性高度仰賴會員國真正履行集體反制的意願，國際聯盟時期日本入侵中國東北（1931）、義大利入侵衣索比亞（1935）、蘇聯入侵芬蘭的冬季戰爭（1939）都是集體安全機制形同虛設的失敗案例，顯示光靠嚇阻承諾不足，仍須輔以裁軍與軍備管制等配套機制。",
  "四警察": "美國總統小羅斯福於二戰期間提出的戰後秩序構想，主張由美、英、蘇、中四大國共同擔任維護世界和平的警察角色，共同承擔戰後國際安全的主要責任。這個構想後來直接演變成聯合國安理會常任理事國制度的雛形——安理會五個常任理事國（美英法蘇中）享有否決權的設計，正是四警察構想的具體制度化實踐，可與雅爾達會議確立的安理會否決權框架相互呼應。",
  "邊緣策略": "冷戰時期由美國國務卿杜勒斯提出的核武嚇阻操作手法，主張在危機對峙中刻意將緊張情勢逐步升高、逼近戰爭邊緣，藉此展現己方承受風險的決心，迫使對手在最後關頭讓步，是一種高風險的心理博弈策略。1962年古巴飛彈危機是邊緣策略最經典的實踐案例——美蘇雙方一路升級對峙至核戰邊緣，最終在最後關頭達成秘密協議化解危機。杜勒斯1956年公開闡述此一策略時，所舉實例正是韓戰停戰談判、印度支那問題與台海危機；1950年代兩次台海危機期間，美方都曾暗示不排除動用核武以嚇阻中共。",
  "扈從": "國際關係理論中，弱國選擇依附、追隨強權而非與之對抗的策略，目的是換取安全保障或利益分享，但也可能因此喪失自主性。",
  "安全困境": "指一國為求自保而增強軍備或勢力範圍，卻使他國感到威脅而跟進反應，雙方陷入擴張螺旋上升、最終誰都不更安全的困境。",
  "半主權國家": "國際法上主權遭部分侵蝕、但形式上仍保有國家地位的狀態，例如喪失關稅自主、司法自主或軍事駐紮權等部分主權要素，卻未完全淪為殖民地。",
  "朝貢體系": "東亞傳統國際秩序模式，以中國皇帝為天下共主，周邊政權（朝鮮、越南、琉球等）透過定期朝貢、接受冊封，換取中國承認其統治正當性與邊境安全保障，形成一種階層化（而非平等主權）的國家間關係體系，與西方西發里亞體系下主權國家一律平等的原則根本不同——108年四等第21題明確考過「朝貢體系是層級體系」這個定義特徵，不要誤植為經貿整合或平等聯盟關係。",
  "條約體系": "19世紀中葉以降，西方列強透過不平等條約（如南京條約、天津條約）強加於中國的國際關係模式，以治外法權、片面最惠國待遇、協定關稅等機制，將中國由朝貢體系下的天下共主，降格為條約體系下權利義務不對等的次等主權國家，是近代中國從朝貢體系瓦解、被迫編入西方主導國際法秩序的關鍵轉型過程。",
  "資本輸出": "列寧帝國主義論核心概念，指資本主義發展到壟斷階段後，資本家將過剩資本輸往海外投資設廠、承包礦權鐵路等，而非僅輸出商品，是帝國主義擴張的經濟動力。",
  "文明標準": "19世紀西方國際法用以區分是否被視為平等主權國家的資格判准，依政治制度、法律體系是否符合西方標準決定，常被用作合理化不平等條約與治外法權的依據。",
  "保民義舉": "1874年《中日北京專約》用以描述日本出兵台灣行動的措辭，清廷原意僅為賠款了事，卻被日本引申為間接承認其對琉球擁有宗主權的法理依據，是外交辭令模糊性遭利用的經典案例。",
  "離岸平衡者": "現實主義理論中，指海權強國不直接以陸軍長期介入大陸事務，而是利用地理與海權優勢，靠外交手段、財政資助等方式扶植其他陸權國家相互制衡，自身保持較低直接介入成本的策略角色，英國在近代歐陸多次扮演此角色。",
  "近東問題": "19世紀歐洲外交用語，指鄂圖曼帝國（土耳其）國力衰弱後，其龐大領土（尤其巴爾幹半島、黑海海峽）成為列強競逐勢力範圍的焦點，涉及俄國南下擴張野心、英法維持地中海與印度航線利益、以及巴爾幹諸民族獨立運動等多重矛盾，是19世紀歐洲外交的核心議題之一，也是第一次世界大戰爆發的遠因。",
  "大賽局": "19世紀英俄兩國圍繞中亞地區（阿富汗、波斯、中亞汗國）展開的地緣政治角力與情報諜報競逐，英國憂心俄國勢力南下威脅其在印度的核心殖民利益，俄國則持續向中亞擴張版圖，雙方長期維持緊張但未直接兵戎相見的對峙態勢，直到1907年《英俄協約》劃定波斯、阿富汗、西藏勢力範圍才告一段落。與近東問題同屬19世紀英俄矛盾的兩大戰場，但近東問題聚焦巴爾幹半島與黑海海峽，大賽局則聚焦中亞內陸，地理範圍與具體爭議點不同，不宜混淆。",
  "鐵血政策": "俾斯麥用以描述其統一德意志戰略路線的著名說法，主張唯有透過軍事實力（鐵）與戰爭（血），而非國會演說與多數決議，才能真正解決當代重大問題、完成德意志統一大業，是俾斯麥現實政治風格的代名詞。",
  "歐洲協商": "1815年維也納會議後由英俄普奧（後納入法國）五強建立的多邊外交機制，透過定期召開會議協調處理重大國際爭端，取代各國各自為政的做法，是近代史上最早接近集體安全雛形的國際合作嘗試。",
  "委任統治": "一戰後國際聯盟創設的殖民地託管制度，名義上由戰勝國代表國際聯盟監督管理戰敗國原殖民地、協助當地邁向自治，實質上仍延續殖民統治邏輯，是理解兩戰間期國際法進步表象、實質延續特性的重要案例。",
  "姑息政策": "指1930年代英法對德、義、日等修正主義強權的擴張行為採取退讓妥協的外交策略，幻想以滿足其部分領土或政治要求來換取和平，最著名案例為1938年慕尼黑會議對希特勒兼併捷克蘇台德區的讓步，結果非但未能阻止戰爭，反而助長侵略野心。",
  "囂張特權": "法國財政部長季斯卡（後為法國總統）於1960年代用以批評美元作為國際準備貨幣所享有的特殊優勢的用語，指美國得以用本國貨幣直接融通對外貿易逆差與債務，不像其他國家須以外匯儲備支付進口與償債，形同免費享有全球其他國家提供的鑄幣特權。",
  "亞羅號事件": "1856年英國商船亞羅號在廣州遭清朝官員登船搜查、扣押船員，並扯下船上懸掛的英國國旗，英國以此為藉口出兵，是第二次鴉片戰爭的導火線之一。",
  "馬神甫事件": "法國傳教士馬賴神父違法進入廣西內地傳教，遭當地官員處死，法國以此為藉口聯合英國出兵，是第二次鴉片戰爭的另一導火線。",
  "馬尾海戰": "1884年中法越南戰爭期間，法國艦隊突襲福建馬尾軍港，福建水師（自強運動海防建設成果之一）幾乎全軍覆沒，暴露清廷海防建設重硬體購置、輕整體戰略協調的脆弱性。",
  "埃姆斯電報事件": "1870年普魯士國王威廉一世與法國大使在埃姆斯的會談內容，經俾斯麥刻意刪改、改寫得更具挑釁意味後公開發布，藉此激怒法國輿論與政府，是俾斯麥操作輿論、誘使法國主動對普宣戰的著名外交操作案例。",
  "色當戰役": "1870年普法戰爭中的關鍵戰役，法軍在色當遭普軍圍殲，法皇拿破崙三世本人被俘投降，直接導致法蘭西第二帝國瓦解、改建第三共和。",
  "巴巴羅薩行動": "1941年納粹德國入侵蘇聯的軍事行動代號，是希特勒撕毀德蘇互不侵犯條約、開闢東線戰場的行動，也是二戰規模急遽擴大的關鍵轉折。",
  "耆英": "清朝宗室官員，鴉片戰爭後負責代表清廷簽訂《南京條約》《虎門條約》《中美望廈條約》《中法黃埔條約》四項條約，是當時與西方國家談判的最高官員，被部分學者稱為中國史上第一位外交部長。",
  "紐倫堡大審": "1945至1946年同盟國在德國紐倫堡對納粹戰犯進行的國際軍事法庭審判，是近代國際法首次系統性追究國家領導人戰爭罪責與危害人類罪的重要先例，對後續國際刑事法的發展影響深遠。",
  "關東都督府": "日俄戰爭後，日本於1906年在遼東半島設立的殖民統治機關，設於旅順，統轄關東州（旅順大連租借地）及南滿鐵路沿線事務，兼具行政與軍事職能，是日本經營中國東北的核心據點，關東軍即由此發展而來。",
  "台灣民主國": "1895年馬關條約割台消息傳出後，台灣官紳為求自保、避免被日本視為清廷直接抵抗，短暫成立的政權，推舉巡撫唐景崧為總統，但唐景崧與大批官員在日軍登陸後迅即逃亡，實際抵抗轉由丘逢甲、劉永福等人領導的地方義勇軍持續，最終不敵日軍優勢兵力，台灣全島於1895年底淪為日本殖民地，直至1945年二戰結束才光復。",
  "王寵惠": "中華民國第一位派任至常設國際法院（Permanent Court of International Justice）擔任法官的外交家與法學家，對我國近代國際法發展貢獻卓著，是近代中國參與國際司法體系的重要指標人物。",
  "金德柏格陷阱": "指當既有霸權國家能力衰退、卻無新興強權願意或有能力承接提供國際公共財（如維持自由貿易秩序、最後貸款人角色）的責任時，國際體系將出現公共財供給真空，導致經濟秩序混亂甚至危機，常與修昔底德陷阱相提並論——修昔底德陷阱關注霸權更替引發戰爭的風險，金德柏德陷阱則關注霸權缺位導致國際公共財不足的風險，兩者關注面向不同，常考對比題。",
  "全球治理": "指並非由單一「世界政府」主導，而是由國家、國際組織、區域組織、非政府組織、跨國企業等多元行為者共同參與，針對跨國界問題（如氣候變遷、公共衛生、金融穩定等）尋求解決方案的治理模式，核心目標是追求「善治」與人類永續發展，強調不等於建立全球政府。",
  "世界政府": "主張建立一個凌駕於所有主權國家之上、具有最高強制執行權威的全球性中央政府，徹底取代當前以主權國家為基本單位的國際體系，是理想主義／世界主義傳統下最激進的秩序構想，但因觸及國家主權讓渡的根本性障礙，至今仍停留在理論層次，從未真正實現。當代「全球治理」概念常刻意與世界政府做出區隔，強調多元行為者協作而非建立單一世界政府。",
  "體系結構（多極、兩極、單極）": "指國際體系內主要強權數量分布的權力結構型態——多極體系指三個以上具備相當實力的強權並存；兩極體系指僅有兩個超級強權主導體系（如冷戰時期美蘇對抗）；單極體系指僅剩一個具壓倒性優勢的超級強權（如冷戰結束後短暫的美國單極時刻）。沃爾茲主張兩極體系因對抗陣營單純、誤判風險較低，是三種體系結構中最穩定的一種，多極體系則因結盟關係複雜多變，穩定性相對較低。",
  "去風險化": "近年美歐對中國經濟政策的新論述，主張降低對單一國家（尤其中國）供應鏈的過度依賴風險、強化關鍵產業自主生產能力、多元發展貿易夥伴，但不以單純降低生產成本為優先考量，與更激進的「脫鉤」（decoupling，完全切斷經濟往來）在程度與定位上有所區別，是近年美中經貿關係分析的常用框架。",
  "AUKUS": "2021年由澳洲、英國、美國三國組成的印太安全夥伴關係，目的之一是協助澳洲取得核子動力潛艦技術，成立時澳洲總理為莫里森（非後來的艾班尼斯），被北京批評為冷戰思維的延續。",
  "QUAD": "四方安全對話，由美國、日本、印度、澳洲四國組成的印太安全合作機制，2007年由日本首相安倍晉三發起，一般被認為具有圍堵中國崛起的戰略意涵，不包含南韓。",
  "五眼聯盟": "由美國、英國、加拿大、澳洲、紐西蘭五個英語系國家組成的情報共享聯盟，源於冷戰時期的通訊情報合作協議，是西方陣營最核心的情報合作機制之一，不包含南非等國。",
  "CPTPP": "跨太平洋夥伴全面進步協定，由跨太平洋夥伴協定（TPP）在美國退出後演變而來的區域貿易協定，涵蓋智慧財產權保護等高標準規範，主要推動者為日本，美國並非成員國。",
  "RCEP": "區域全面經濟夥伴協定，由東協十國加中國、日本、韓國、澳洲、紐西蘭共同組成的全球最大自由貿易協定，印度曾參與談判但最終退出，並未加入。",
  "印太經濟架構": "IPEF，美國主導、不涉及傳統關稅減讓的印太區域經濟合作框架，聚焦供應鏈韌性、乾淨能源、反貪腐等議題，越南、澳洲等國同時也是CPTPP成員，展現部分國家同時參與多個經濟合作機制的現象。",
  "上海合作組織": "由中國、俄羅斯及中亞多國組成的區域安全與經濟合作組織，秘書處設於北京，工作語言為漢語與俄語（非英語），印度、巴基斯坦、白俄羅斯等國陸續加入為正式成員，蒙古僅為觀察員國。",
  "金磚國家": "BRICS，最初指巴西、俄羅斯、印度、中國、南非五個新興經濟體組成的合作機制，近年持續擴大納入更多新興市場國家，部分成員國（如巴西）同時也是二十國集團（G20）成員，展現新興經濟體在全球治理中角色的提升。",
  "GCTF": "全球合作暨訓練架構，台灣與美國於2015年簽署備忘錄成立的國際合作平台，主要宗旨是拓展台灣的國際參與空間，已針對公共衛生、執法合作、婦女賦權、資訊安全、人道援助等議題舉辦國際研習營，日本、澳洲、加拿大等國陸續成為正式夥伴國。",
  "政府承認／國家承認": "國際法上兩種不同的承認。國家承認是承認一個新產生的政治實體具備國家資格、成為國際法主體；政府承認則是在國家同一性不變的前提下，承認某一政府為該國的合法代表，通常發生在政府以非憲政方式更迭（革命、政變、內戰）時。1949年後各國是否承認中華人民共和國屬政府承認問題——「中國」這個國家的國際法人格未變，爭議在於由哪一個政府代表中國，這正是聯合國中國代表權之爭的法理核心。承認方式另可分為明示／默示、法律上（de jure）／事實上（de facto）承認。",
  "中東鐵路／南滿鐵路／中國長春鐵路": "同一鐵路系統在不同時期的名稱，常考混淆。1896年中俄密約後由俄國修築的東清鐵路（中東鐵路）呈T字形貫穿東北；1905年日俄戰爭後，長春以南的支線轉讓日本，改稱南滿鐵路，成為日本經營滿洲的核心；1945年《中蘇友好同盟條約》將中東鐵路與南滿鐵路幹線合併為「中國長春鐵路」（中長鐵路），由中蘇共同經營30年；1950年中共與蘇聯簽訂《中蘇友好同盟互助條約》後，蘇聯於1952年底將中長鐵路移交中共。",
  "東京審判（遠東國際軍事法庭）": "二戰後同盟國於1946年5月至1948年11月在東京設立的國際軍事法庭，由11國法官組成（我國法官為梅汝璈），審判日本甲級戰犯，東條英機、南京大屠殺負責人松井石根等7人被判處死刑。與歐洲的紐倫堡大審並列為戰後國際刑事審判的兩大先例，確立領導人對破壞和平罪、違反人道罪負個人刑事責任；昭和天皇未被起訴，是常被討論的政治安排。1951年舊金山和約第11條規定日本接受該法庭的判決。",
  "麥克馬洪線": "1914年西姆拉會議期間，英屬印度外務大臣麥克馬洪與西藏代表以換文方式劃定的藏印邊界線，大致沿喜馬拉雅山脊線，將達旺等地劃歸英屬印度。中國中央政府代表並未簽署正式條約，中華民國政府與中華人民共和國政府均不承認此線；印度獨立後則以此線作為東段邊界，是1962年中印邊界戰爭東段衝突的根源。",
  "重要問題案": "依《聯合國憲章》第18條，聯合國大會對「重要問題」的決議須經出席並投票會員國三分之二多數通過。1961年美國主導聯合國大會通過第1668號決議，認定任何改變中國代表權的提案屬重要問題，使中共入會須跨越三分之二門檻，為我國保住席位至1970年；1971年美日改提「變相重要問題案」（主張排除中華民國屬重要問題）遭否決，第2758號決議隨即以簡單多數通過。",
  "漢賊不兩立": "語出諸葛亮〈後出師表〉，冷戰時期被我國政府用來概括外交原則：邦交國一旦承認中共，我國即主動宣布斷交，不與中共並存於同一國家的外交關係或同一國際組織中。1964年法國與中共建交後我國主動斷交即為典型案例；此一原則在1971年聯合國代表權之爭中限制了我國的迴旋空間，1990年代以後隨務實外交的推動而逐步鬆動。",
  "一國兩制": "鄧小平於1980年代初提出、原為解決台灣統一問題所構思的政治安排，主張在中華人民共和國內同時並存社會主義（大陸）與資本主義（港澳台）兩種制度，特別行政區享有高度自治權，現行制度五十年不變。此構想最終先於1997年香港、1999年澳門回歸時實踐，而非用於台灣；1984年鄧小平將其具體定義為「一國兩制」一詞。2019年香港爆發反送中運動、2020年港版國安法通過後，國際社會普遍質疑中共是否確實履行對港承諾，也直接影響台灣內部對一國兩制模式適用於台灣的接受度。",
  "反霸權條款": "1972年《中日聯合聲明》第七條與1978年《中日和平友好條約》第二條均載明，雙方任何一方不應在亞太地區謀求霸權，也反對任何其他國家或國家集團建立這種霸權，即「反霸權條款」。這項條款雖未點名，但普遍被解讀為針對蘇聯在亞太地區的擴張而設計，蘇聯也因此對條約簽訂反應強烈，是1970年代末中、日、美聯手制衡蘇聯外交佈局的具體法律文本表現。",
  "韜光養晦": "鄧小平在1980年代末、1990年代初提出的對外戰略方針，全稱常概括為「冷靜觀察、穩住陣腳、沉著應付、韜光養晦、善於守拙、絕不當頭、有所作為」，主張中國在國力尚未強大之前應保持低調、避免與美國等既有強權正面對抗、專注於國內經濟發展。此一方針延續江澤民、胡錦濤時期，直到2012年習近平上台後，中共外交風格逐漸轉向更為積極、甚至強硬的「大國外交」，與「戰狼外交」的作風形成對比，是常考的路線轉折概念。",
  "圍堵政策": "美國冷戰時期對蘇聯採取的核心戰略構想，源自美國外交官肯楠（George F. Kennan）1946年2月自莫斯科發回國務院的「長電報」，以及他隔年（1947年7月）以化名「X」在《外交事務》季刊發表的〈蘇聯行為的根源〉一文，首次將「圍堵」（containment）一詞引入公共討論。肯楠主張蘇聯的擴張源於其意識形態與內部政權正當性需求，美國應以政治、經濟等手段長期、耐心地圍堵蘇聯勢力擴張，而非訴諸全面軍事對抗。此一構想隨即落實為1947年杜魯門主義（援助希臘、土耳其）與馬歇爾計畫（援助歐洲重建），並延伸為北約等集體防禦組織的建立。1950年代韓戰爆發後，美國國家安全會議第68號文件（NSC-68）進一步將圍堵政策的適用範圍從肯楠原先侷限於歐洲工業重鎮的構想，擴大為全球性、軍事化的圍堵，此一路線調整延續影響此後越戰等美國在亞洲的軍事介入。"
};

  {id:"arrow-war",region:"china",period:"①朝貢體系瓦解期 1839–1860",year:"1856–1860",title:"第二次鴉片戰爭",spec:"core",

    theory:[{label:"現實主義",text:"為最貼近考古題方向：俄國不戰而獲最大利益，是搭便車與離岸平衡的經典操作。俄國之所以在此時特別積極介入中國事務、不動一兵一卒取得外東北巨大領土，與其同時期在[[west|crimean-war|克里米亞戰爭]]中戰敗、被迫接受黑海中立化、西向擴張路線受阻直接相關——俄國西邊碰壁，遂將擴張能量轉向東邊此時正陷於英法聯軍夾擊、無暇他顧的中國，是西堵東進策略轉向的經典案例。"},{label:"自由主義（制度面）",text:"角度：公使駐京、增開口岸可視為列強推動外交常態化制度框架，惟屬強制性輸出而非自願建制。"},{label:"依賴理論／IPE",text:"角度：鴉片貿易合法化＋內地傳教權，代表滲透從口岸擴張至內地。"},{label:"外交史方法論",text:"角度：亞羅號、馬神甫事件屬能動性層次的偶發藉口，修約需求的結構性壓力才是戰爭真正動因。"}]},
  {id:"xinjiang-recovery",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1864–1881",title:"新疆回變與收復、伊犁交涉",spec:"core",
    narrative:"值得注意的是，早在新疆回變爆發前夕的1864年，俄國已依據1860年北京條約含糊的邊界約定，進一步逼迫清廷簽訂《中俄勘分西北界約記》，一次性割讓超過44萬平方公里的西北領土（今巴爾喀什湖以東以南地區），是俄國蠶食中國西北疆域「先勘界割地、後藉亂佔領」兩階段手法的第一步。同年，新疆爆發回變，中亞浩罕國將領阿古柏趁機東來，建立政教合一的哲德沙爾汗國，並獲得英國、鄂圖曼帝國承認，新疆面臨脫離中國版圖的危機。清廷內部曾爆發「海防與塞防之爭」，李鴻章主張放棄新疆專注海防，左宗棠則力主西征收復，最終獲清廷採納。1875年左宗棠奉命督辦新疆軍務，採取「緩進急戰、先北後南」戰略，1877年大破阿古柏勢力，阿古柏兵敗身亡，新疆大部收復。然而伊犁地區在回變期間已遭俄國以「代為保管」名義出兵佔領——這是俄國蠶食西北手法的第二階段，清廷派崇厚赴俄談判，崇厚簽訂的《里瓦幾亞條約》大幅喪失伊犁周邊領土及通商特權，引發朝野嘩然，清廷拒絕批准並將崇厚治罪。清廷改派曾紀澤（曾國藩之子）赴聖彼得堡重新談判，1881年簽訂《伊犁條約》（改訂條約），雖仍割讓部分領土，但成功爭回伊犁主要城區及較有利的通商條件，是近代中國少數透過外交談判「爭回」部分權益的案例。1884年，清廷於新疆正式建省，加強中央對邊疆的直接管轄。",
    knowledge:["「海防塞防之爭」是清末國防戰略辯論的經典案例：李鴻章代表海防優先觀點，左宗棠代表塞防（陸權）優先觀點，最終清廷採取「海塞並重」的折衷政策","沈葆楨也是海防派的共同倡議者，與李鴻章同屬海防陣營——1874年牡丹社事件後，沈葆楨來台加強東南海防、推動開山撫番，主張優先鞏固沿海防務甚於西陲用兵","左宗棠西征收復新疆，是晚清少見的軍事成功案例，展現地方督撫在中央財政困窘下仍能自籌軍餉、完成邊疆平亂的能力","崇厚簽訂的《里瓦幾亞條約》喪權過鉅，清廷拒絕批准並改派曾紀澤重新談判，是近代中國外交史上罕見的「拒籤重談」案例","曾紀澤透過外交談判爭回伊犁主要城區，是近代不平等條約體系下少數透過談判成功挽回權益的個案，常考「曾紀澤修約」的具體成果","1884年新疆建省，反映清廷對邊疆治理從羈縻統治轉向直接行政管轄的轉型"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：海防塞防之爭本質是資源有限下的戰略優先順序辯論，左宗棠西征的成功也展現「地緣鄰接的陸權威脅不能單純用海權思維忽視」。"},{label:"國際公法",text:"角度：崇厚條約與伊犁條約的落差，展現「條約需經批准生效」的國際法原則如何在近代中國外交實踐中被運用以爭取談判空間，是近代國際法「條約締結程序」的實例教材。"},{label:"外交史方法論",text:"角度：曾紀澤的成功談判展現個人外交能力（能動性層次）在既有國力弱勢（結構層次）下仍能發揮一定作用的案例，不宜將近代中國外交史簡化為「純粹被動挨打」的敘事。"},{label:"地緣政治",text:"角度：新疆問題本質是俄國南下擴張與英國防範俄國威脅印度（大博弈，The Great Game）兩大帝國勢力在中亞交會的縮影，可與後續日俄戰爭的地緣政治邏輯相互呼應。"}]},
  {id:"self-strengthening-movement",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"約1861–1895",title:"自強運動",spec:"core",
    narrative:"第二次鴉片戰爭與太平天國之亂的雙重衝擊，讓恭親王奕訢、曾國藩、李鴻章、左宗棠等一批深受衝擊的官員，體認到中國器物層面（船堅砲利）已明顯落後西方，遂發起以「師夷長技以自強」為核心理念的自強運動（又稱洋務運動）。中央方面，恭親王奕訢主導總理各國事務衙門運作，統籌洋務事宜；地方督撫則各自興辦新式軍事工業：曾國藩、李鴻章先後創辦江南製造局（上海）、金陵機器局，左宗棠創辦福州船政局，生產近代化槍砲艦船。海軍建設方面，清廷陸續建立北洋、南洋、福建三支水師，其中又以李鴻章主導的北洋水師規模最盛、耗費國帑最鉅。教育與人才培育方面，清廷於1862年設立同文館培養翻譯與外交人才，並於1872年起陸續派遣留美幼童、福州船政學堂學生赴歐留學，學習近代科學技術與軍事知識。然而，自強運動始終停留在器物層次的模仿，對於西方國力強盛背後的政治體制、教育制度等深層結構性因素涉獵有限，且各地方督撫各自為政、缺乏中央統一整合的戰略協調，這些體制性缺陷在1884年中法戰爭福建水師覆滅、1894年甲午戰爭北洋水師全軍覆沒後，暴露無遺。",
    knowledge:["自強運動又稱洋務運動，兩者為同一場運動的不同慣用稱呼，並非兩件事——常見的名詞混淆陷阱","北洋、南洋、福建三支水師分別由李鴻章、左宗棠（後由沈葆楨接手南洋事務）等不同督撫主導建立，缺乏統一指揮體系，是甲午戰爭北洋水師孤軍應戰、其他水師未馳援的制度性根源","自強運動「重硬體購置、輕整體戰略協調與人才培育制度化」的侷限，可與明治維新中央集權式、由上而下全面現代化的路徑做對照比較，是解釋兩國國力此消彼長的關鍵申論素材","留美幼童計畫因保守派反對西化教育恐危及忠君思想，於1881年提前召回，是自強運動器物現代化與傳統價值觀衝突的具體案例"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：自強運動本質是傳統王朝在外部軍事威脅壓力下，被迫進行的防禦性軍事現代化，目標僅止於恢復足夠的自保能力，而非徹底國力轉型。"},{label:"比較政府與政治",text:"角度：自強運動的地方分權模式（各省督撫各自興辦洋務）與日本明治維新的中央集權模式形成鮮明對比，是解釋兩國近代化成效差異的制度分析核心切入點，詳見[[eastasia|meiji|明治維新]]事件卡。"},{label:"外交史方法論",text:"角度：適合做器物層次改革（自強運動）與制度層次改革（後續戊戌變法）的分層比較，展現晚清現代化嘗試逐步從技術層次深入到制度層次的演進軌跡，卻始終未能觸及根本的君主專制政體本身。"}]},
  {id:"tianjin-massacre",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1870",title:"天津教案",spec:"light",
    narrative:"1870年，天津民間謠傳法國天主教仁慈堂（育嬰堂）以挖眼剖心、拐騙幼童等手段殘害兒童，激起民眾強烈憤慨。群情激憤的天津民眾包圍教堂，並與前往查看的法國領事豐大業發生衝突，豐大業情急之下開槍示警，反而進一步激化民眾情緒，民眾隨即搗毀教堂、育嬰堂，殺害豐大業及多名外國傳教士、教徒。法國聯合英、美等多國軍艦集結大沽口，向清廷施加強大壓力，要求嚴懲兇手、賠款道歉。清廷派曾國藩前往天津查辦，曾國藩基於息事寧人、避免擴大戰端的考量，最終處決十餘名為首民眾、將天津知府知縣革職充軍、賠款白銀，並派使團赴法道歉。此舉在當時輿論眼中被批評為對外軟弱、犧牲百姓討好列強，曾國藩本人也因此清譽受損，鬱鬱寡歡，隔年即調任他職，不久病逝。",
    causal:"天津教案是自強運動器物現代化與民間反教會排外情緒同時並存、卻互相矛盾的具體縮影——一方面清廷力圖學習西方技術以求自強，另一方面民間對西方傳教活動的疑懼與敵意持續累積未解，這股積累的民怨最終在1900年以更大規模的形式在[[china|boxer|義和團事件]]中總爆發，天津教案可視為義和團事件的重要早期預演與遠因。"},
  {id:"burlingame-mission",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1867–1875",title:"蒲安臣使團與早期近代外交建制",spec:"light",
    narrative:"1861年英法聯軍後，清廷設立總理各國事務衙門，是中國第一個專責處理對外事務的中央機構，象徵近代外交建制的起步。1867年，恭親王奕訢上奏推薦卸任的美國駐華公使蒲安臣，由其擔任中國首任全權使節（辦理中外交涉事務大臣），代表中國出使美、英、法、普、俄等國，是中國首次近代外交活動，蒲安臣在美期間代表清廷簽訂《蒲安臣條約》，確立中美互不干涉內政、對等交往的原則。1875年，因馬嘉理事件（英國探勘雲南的翻譯官馬嘉理在滇緬邊境遇害），清廷派郭嵩燾親赴英國道歉，郭嵩燾隨後出任中國首任駐英公使，其出使日記《使西紀程》是第一部系統介紹英國憲政制度的中文著作，但因書中對西方文明的正面描述觸怒保守士大夫，遭清廷下令禁毀，郭嵩燾本人也因此備受抨擊、鬱鬱而終，反映當時朝野對西方認識的巨大落差。馬嘉理事件本身則透過1876年《煙台條約》處理懲兇道歉等條款告一段落，但英國並未就此止步，持續向緬甸方向擴張壓力，最終於1886年透過《中英緬甸條約》，迫使清廷承認英國兼併緬甸，僅換取緬甸循例仍每十年向中國進貢一次的形式性安排，這是繼琉球（1879）、越南（1885）之後，清朝朝貢體系再失一藩的重要指標。",
    causal:"這段時期是中國近代外交建制從無到有的起步階段，與同一時期[[china|self-strengthening-movement|自強運動]]的器物層次改革相呼應，展現清廷嘗試學習西方外交遊戲規則的努力，但郭嵩燾遭禁毀著作、抑鬱而終的遭遇，也預示了後續戊戌變法等更深層制度改革所將面臨的巨大保守阻力，可視為戊戌變法事件的更早期伏筆。緬甸的喪失，也與琉球、越南並列為清朝朝貢體系在19世紀最後20年間全面瓦解的三個具體指標。"}
,
  {id:"ryukyu",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1871–1879",title:"牡丹社事件與琉球問題",spec:"core",
    narrative:"1871年，中日兩國簽訂《中日修好條規》，是中國與東亞鄰國之間少見的對等條約（雙方互不享有治外法權、關稅自主互相尊重），象徵日本此時仍以對等鄰邦身分與中國交往。然而簽約僅三年後，日本便藉牡丹社事件對中國採取類似西方列強的擴張手段——同年琉球宮古島漁民漂流至台灣南部，遭當地原住民殺害54人。日本以琉球為己藩屬為由向清廷交涉，清廷以「生番化外之地」回應。日本藉此於1874年出兵台灣南部，清廷透過英國調停，與日本簽訂《北京專約》，承認日本此次出兵為{{保民義舉}}，並付款換取日軍撤兵。此協議被日本解讀為清廷間接承認其對琉球的宗主權。1879年，日本正式廢琉球藩、改設沖繩縣，完全併吞琉球王國。",
    knowledge:["《中日修好條規》（1871）簽訂僅三年後，日本即藉牡丹社事件對中國採取擴張手段，是「先簽對等條約、卻立刻恃強凌弱」的鮮明反差案例","{{保民義舉}}字眼是關鍵外交陷阱——清廷原意只是賠款了事，卻被日本引申為承認宗主權轉移的法理依據","牡丹社事件是台灣近代化的直接催化劑：沈葆楨來台加強海防、推動開山撫番，並促成1885年台灣建省","琉球原為明清朝貢國，同時向日本薩摩藩納貢形成兩屬格局，1879年後兩屬體制終結","是甲午戰爭前20年中日在台灣、琉球、朝鮮的第一場正面角力"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：日本利用清廷化外之地的模糊表態，精準操作國際法語言完成實質宗主權轉移。"},{label:"建構主義",text:"角度：琉球兩屬體制是朝貢體系彈性主權觀的產物，西方一國一主權體系傳入後此模糊狀態不可持續。"},{label:"國際公法",text:"角度：{{保民義舉}}承認可視為國際法上的默示承認，是研究外交辭令法律效力的經典教材。"},{label:"地緣政治",text:"角度：台灣、琉球、朝鮮構成日本大陸政策向外擴張的第一島鏈起點。"}]},
  {id:"korea-rivalry",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"約1876–1887",title:"中日朝鮮半島權力競逐",spec:"core",
    narrative:"1876年，日本仿效西方列強對日本自身的做法，以武力脅迫朝鮮簽訂《江華條約》，強迫朝鮮開港通商，條約中刻意宣稱「朝鮮為自主之邦，與日本國平等之權」，實質上是刻意否定清朝對朝鮮的傳統宗主權主張，為日後日本介入朝鮮埋下法理伏筆。清廷這時期外交策略也開始轉變——1882年，在李鴻章居中牽線下，朝鮮與美國簽訂《美朝條約》，李鴻章原本堅持要在條約中明文寫入朝鮮是中國屬邦的字句，最終雖未能完整寫入正式條款，但透過朝鮮國王照會美國總統的方式，間接確認了這層宗藩關係，是清廷首次嘗試用近代國際法語言（而非傳統朝貢框架）確認對朝鮮宗主權的重要嘗試。同年，朝鮮爆發壬午兵變（保守軍人反抗改革、攻擊日本使館），日本藉機出兵朝鮮，並脅迫朝鮮簽訂《濟物浦條約》，取得賠款及使館駐兵權；清廷則同時出兵朝鮮，平息事變並將大院君（兵變幕後支持者）擄至中國，展現清廷對朝鮮宗主權的實際軍事介入。1884年，親日的朝鮮開化黨在日本支持下發動政變（甲申事變），一度挾持國王、宣布改革，但駐朝清軍將領袁世凱迅速出兵鎮壓，短短三日即敉平政變，親日政權瓦解。事件後，中日雙方於1885年簽訂《天津協定》，約定雙方同時自朝鮮撤軍，日後若朝鮮有事需出兵須互相知會。同年，英國因憂心俄國藉朝鮮擴張勢力威脅其在遠東的利益，出兵佔領朝鮮外海的巨文島，直到1887年俄國承諾不佔領朝鮮領土後，英國才撤軍，是英俄大博弈延伸至朝鮮半島的具體案例。",
    knowledge:["《江華條約》（1876）刻意宣稱朝鮮為自主之邦，是日本否定清朝對朝宗主權的關鍵法理鋪墊，與稍後美朝條約清廷嘗試確認宗主權的做法形成直接對抗","《美朝條約》（1882）李鴻章欲寫入屬邦字句未竟全功，改以朝鮮國王照會美國總統的間接方式確認宗藩關係，是清廷首次嘗試用近代國際法語言（而非傳統朝貢框架）處理屬國關係的重要嘗試","甲申事變由袁世凱率清軍三日敉平，展現清廷此時仍握有對朝鮮實際軍事介入的能力，與甲午戰爭時期江河日下的局面形成對比","中日天津協定（1885）的共同出兵權條款，十年後正是日本藉東學黨起義出兵朝鮮、進而引爆甲午戰爭的法理依據，兩者因果直接相連","巨文島事件（1885–87）是英俄大博弈延伸至朝鮮半島的具體案例，可與既有大賽局GLOSSARY詞條相互呼應"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：這十餘年間中日雙方在朝鮮半島的權力競逐，是傳統朝貢宗主權與近代條約體系兩套邏輯直接碰撞的縮影，日本步步進逼、清廷則交替使用軍事介入與國際法語言因應，最終仍在甲午戰爭中全面失守。"},{label:"建構主義",text:"角度：江華條約刻意使用「自主之邦」的用詞策略，展現條約文字本身如何被用作否定既有宗藩認同、建構新主權關係的工具，可與牡丹社事件的{{保民義舉}}用詞陷阱做對照。"},{label:"地緣政治",text:"角度：巨文島事件顯示朝鮮半島此時已成為英、俄、中、日四方勢力交會的地緣政治熱點，不只是中日兩國的競逐場域。"},{label:"外交史方法論",text:"角度：適合做20餘年權力競逐的整體因果鏈分析，與既有[[china|ryukyu|牡丹社事件與琉球問題]]共同構成112年三等第4題申論題（明治維新到甲午戰爭間中日在台灣、琉球、朝鮮半島的權力競逐）完整答題素材，最終於[[china|sino-japanese|甲午戰爭]]卡片高潮收尾。"}]},
  {id:"sino-french-war",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1884–1885",title:"中法越南戰爭",spec:"core",
    narrative:"越南長期為清朝傳統屬國，法國自19世紀中葉起逐步蠶食越南，同治年間已實際控制越南南部（交趾支那）及中部。1883年法國進一步壓迫越南簽訂《順化條約》，將越南納為保護國，直接挑戰清朝對越南的宗主權，中法關係急遽惡化。清廷內部對是否出兵援越意見分歧，最終決定出兵支援黑旗軍（劉永福率領的華人武裝力量）及清軍協同抵抗法軍。1884年，法國艦隊突襲福建馬尾軍港，重創新建的福建水師（{{馬尾海戰}}）；同年法軍進犯台灣，砲擊基隆並封鎖台灣海岸，時任台灣防務大臣劉銘傳指揮清軍在滬尾（淡水）擊退法軍登陸企圖，成功保住台灣本島未失守。1885年，清軍在廣西提督馮子材率領下於鎮南關大敗法軍（鎮南關大捷），法軍被迫撤退，是清廷難得的軍事勝利。然而，清廷在軍事佔優的情況下卻選擇議和（李鴻章主導），與法國簽訂《中法新約》（天津條約），承認法國對越南的保護權，越南自此脫離中國傳統朝貢體系，成為法屬印度支那的一部分。",
    knowledge:["同治年間法國已控制越南中南部，是理解中法戰爭爆發背景的重要時序基礎——常考的年代定位題","法國透過1862年、1874年兩次《西貢條約》逐步取得越南南部（交趾支那），第二次西貢條約更要求越南承認外交自主，是法國否定中國對越南宗主權法理基礎的關鍵前置步驟，直接鋪墊1883年順化條約與中法戰爭的爆發","{{馬尾海戰}}（1884）中，福建水師（自強運動海防成果之一）幾乎全軍覆沒，暴露自強運動海防建設的脆弱性","劉銘傳負責台灣防務、成功擊退法軍滬尾登陸，是台灣建省（1885）前的重要軍事貢獻，與牡丹社事件後沈葆楨的台灣近代化建設一脈相承","鎮南關大捷（馮子材，1885）是清廷對外戰爭中少數的軍事勝利，卻仍在「不敗而和」的情況下簽訂喪權條約，是理解晚清外交決策「軍事勝利不必然轉化為談判籌碼」的經典弔詭案例","《中法新約》承認法國保護越南，越南脫離中國朝貢體系，是繼琉球（1879）之後，清朝朝貢體系再失一藩的重要指標"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：鎮南關大捷後清廷仍主動求和，展現決策者（李鴻章）個人的保守求穩心態（能動性層次）如何凌駕於戰場實際優勢（結構層次）之上，是分析「軍事勝利與外交談判籌碼未必成正比」的經典案例。"},{label:"現實主義",text:"角度：法國藉鄂圖曼式的「蠶食」策略逐步併吞越南，展現弱小屬國在強權環伺下難以維持傳統宗主保護關係的無力，也呼應了同期新帝國主義列強瓜分殖民地的整體時代背景。"},{label:"建構主義",text:"角度：清廷對越南的宗主權建立在朝貢體系的階序認知之上，而法國的保護國主張則是西方主權讓渡條約的邏輯，兩者對「宗主權」性質的認知落差，是朝貢體系與條約體系交界處的又一具體案例，可與牡丹社事件、琉球問題的分析框架相互呼應。"},{label:"比較政府與政治",text:"角度：福建水師在馬尾海戰的潰敗，可與北洋水師十年後在甲午戰爭的覆滅相互比較，兩者都暴露自強運動「重硬體購置、輕整體戰略協調與後勤訓練」的制度性缺陷。"}]}
,
  {id:"sino-japanese",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1894–1895",title:"甲午戰爭",spec:"core",
    narrative:"朝鮮長期是清朝傳統屬國，1882年壬午兵變、1884年甲申政變已顯示日本勢力積極介入朝鮮內政（詳見[[china|korea-rivalry|中日朝鮮半島權力競逐]]事件卡）。1894年3月，甲申事變主謀金玉均在上海遭朝鮮政府派遣刺客暗殺身亡，清廷應朝鮮要求協助將其遺體運回朝鮮公開凌遲示眾，此舉激起日本國內強烈反清輿論、將金玉均塑造為改革烈士，是甲午戰爭爆發前夕日本國內主戰情緒高漲的催化劑之一。同年，朝鮮爆發東學黨起義，農民軍攻陷全州，朝鮮國王請求清廷依屬國體制出兵助剿。清廷依1885年《天津條約》知會日本後出兵，日本卻援引同一條約的共同出兵權，藉口保護僑民同時大舉派兵入朝，並在停戰後拒絕撤兵，反而強佔朝鮮王宮、扶植親日政權。1894豐島海戰、平壤之戰、黃海海戰，1895威海衛之戰北洋艦隊全滅，簽《馬關條約》。條約簽訂後，俄法德三國以干涉還遼為由聯合施壓，迫使日本歸還遼東半島，日本則獲清廷追加贖遼費3000萬兩補償；此舉直接誘發1897–98年列強競相劃分在華勢力範圍的熱潮。",
    knowledge:["1885年《天津條約》規定中日雙方出兵朝鮮須互相知會（共同出兵權）——日本正是利用此條款取得出兵朝鮮的法理依據","《馬關條約》：承認朝鮮獨立、割遼東半島/台灣/澎湖、賠款2億兩、開沙市重慶蘇州杭州、允許日本在華設廠（象徵{{資本輸出}}時代開始）","三國干涉還遼（1895）是甲午戰後到八國聯軍間關鍵過渡環節，直接連結1897–98瓜分勢力範圍熱潮","割台消息傳出後，台灣官紳為求自保、避免被日本視為清廷直接抵抗，於1895年5月宣布成立「{{台灣民主國}}」，推舉巡撫唐景崧為總統，然而唐景崧與大批官員在日軍登陸後迅即逃亡，抵抗實際由丘逢甲、劉永福等人領導的地方義勇軍持續至同年10月，最終不敵日軍優勢兵力而告終，台灣全島淪為日本殖民地直至1945年"],
    theory:[{label:"現實主義",text:"為最貼近考古題方向，尤其三國干涉還遼：日本挑戰東亞傳統中心構成權力轉移，三國干涉還遼為權力平衡教科書案例。"},{label:"民族主義",text:"角度：日本以戰勝完成國族建構驗收，中國戰敗則刺激知識菁英從天朝意識轉向民族危機意識。"},{label:"依賴理論／IPE",text:"角度：允許日本設廠象徵列強對華侵略由商品輸出轉向{{資本輸出}}，可嫁接列寧帝國主義論。"},{label:"比較政府與政治",text:"角度：可比較日本明治維新中央集權式現代化 vs 清朝洋務運動局部現代化的成果檢驗。"},{label:"外交史方法論",text:"角度：東學黨起義屬能動性層次的偶發導火線，清日對朝鮮宗主權的結構性競逐才是戰爭根本動因。"}]},
  {id:"sino-russian-secret",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1896",title:"中俄密約",spec:"core",
    narrative:"甲午戰敗後，清廷面臨日本崛起威脅，加上三國干涉還遼讓清廷誤判俄國為可靠盟友。1896年沙皇尼古拉二世加冕，李鴻章赴俄祝賀，俄國財政大臣維特趁機密商，雙方簽訂《中俄禦敵互相援助條約》。條約表面是軍事同盟，實際核心是換取俄國修築中東鐵路連接西伯利亞鐵路，俄國可在戰時使用中國口岸，鐵路沿線享有實質管轄權。",
    knowledge:["密約名為共同防日，實為李鴻章聯俄制日戰略下的產物，也暴露此策略過度信任單一強權、反而引狼入室的致命弱點","中東鐵路成為俄國深入東北的合法管道，鐵路沿線護路駐軍權成為後續佔領東北的法理依據","直接鋪路1897–98年瓜分危機，也是日俄戰爭（1904–05）根本遠因"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：這是聯合次強制衡新興強權的{{扈從}}策略操作，卻是教科書等級的失敗案例——最終引狼入室。"},{label:"外交史方法論",text:"角度：適合做決策層次分析——李鴻章個人判斷、清廷體系層次的戰略困境、國際體系層次的權力真空。"},{label:"依賴理論／IPE",text:"角度：中東鐵路是近代中國第一個由外國全權掌控、深入內陸腹地的大型基礎建設特許權。"}]},
  {id:"jiaozhou",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1897–1898",title:"膠州灣事件／瓜分危機",spec:"core",
    narrative:"1897年山東發生巨野教案（又稱曹州教案），德國藉口出兵強佔膠州灣，隔年強迫清廷簽訂《中德膠澳租界條約》，租借膠州灣99年並取得山東鐵路修築權及礦權。德國此舉引發連鎖效應：俄國強租旅順大連、英國強租威海衛及九龍新界、法國強租廣州灣。短短兩年內中國沿海精華地帶被劃分為列強勢力範圍，史稱瓜分危機。",
    knowledge:["租借地與割讓不同：租借地名義上主權仍屬中國，但實際上是列強獨佔的勢力範圍","四強租借地及期限：德國膠州灣（99年）、俄國旅大（25年）、英國威海衛+九龍新界（99年）、法國廣州灣（99年）","瓜分勢力範圍大致劃分：法國主要在西南（雲南、廣西、廣東西南部）、英國主要在長江流域、德國主要在山東與黃河流域、俄國主要在長城以北與東北——常考的省份配對題","瓜分危機是美國門戶開放政策（1899）真正的近因，比義和團事件更早，但門戶開放照會僅獲列強模糊、原則性回應，並未獲得所有國家明確一致同意"],
    theory:[{label:"現實主義",text:"最貼近：列強瓜分是純粹的勢力範圍競逐，體現無政府狀態下的{{安全困境}}——德國一動，俄英法立即跟進。"},{label:"國際公法",text:"角度：租借地法律性質模糊，適合深入談主權與治理權分離概念。"},{label:"依賴理論／IPE",text:"角度：勢力範圍瓜分將中國經濟版圖依附於不同列強資本，是基礎建設邊陲化。"},{label:"自由主義／國際制度",text:"角度：美國門戶開放政策正是對這波瓜分危機的直接回應。"}]},
  {id:"hundred-days",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1898",title:"戊戌變法",spec:"light",
    narrative:"甲午戰敗刺激，康有為梁啟超公車上書。1898年光緒帝頒布變法詔書（百日維新），推動政治教育軍事改革。慈禧發動戊戌政變，光緒被幽禁，變法失敗，僅103天。",
    causal:"直接由甲午戰敗刺激而起。變法失敗間接強化保守排外勢力主導地位，為兩年後義和團事件埋下政治伏筆。"},
  {id:"boxer",region:"china",period:"②條約體系深化與邊陲化期 1860–1901",year:"1900–1901",title:"八國聯軍",spec:"core",
    narrative:"列強劃分勢力範圍引發民間反抗，義和團扶清滅洋興起，慈禧一度利用義和團向列強宣戰；1900義和團攻擊教堂與使館區，八國聯軍攻入北京，慈禧光緒西逃，1901簽《辛丑條約》。慈禧向十一國宣戰後，兩江總督劉坤一、湖廣總督張之洞等東南各省督撫拒絕執行宣戰詔書，私下與各國駐滬領事協議東南互保，承諾維持地方秩序、保護外國僑民財產，使戰火侷限於華北，東南經濟精華地帶得以倖免於難。美國同時期另外提出門戶開放政策，主張維持中國領土行政完整，與其他列強持續劃分勢力範圍的做法形成路線分歧。",
    knowledge:["《辛丑條約》未割地但性質最嚴重：賠款4.5億兩、使館區劃界駐兵、拆大沽炮台准列強駐軍京津沿線、禁止科舉考試地區停考五年","《辛丑條約》另規定將總理各國事務衙門升格改組為外務部，班列六部之首，是中國近代外交建制史上的關鍵制度化里程碑——從臨時性應急機構（總理衙門）正式轉型為常設中央部會，象徵列強要求清廷外交體制徹底西化、常態化","門戶開放政策代表列強策略出現保全中國以共同宰制與持續劃分勢力範圍兩條路線的分歧","東南互保由劉坤一、張之洞領銜，而非曾國藩——曾國藩已於1872年病逝，114年三等第15題曾以此作為人物時序陷阱","東南互保展現清末中央權威崩解、地方督撫勢力坐大的結構性變化，直接預示民國初年軍閥割據的根源"],
    theory:[{label:"自由主義／國際制度",text:"角度為最貼近考古題方向：美國門戶開放主張機會均等，代表列強對華策略出現路線分歧。"},{label:"現實主義",text:"角度：辛丑條約使館駐兵、拆炮台，本質為確保對清廷軍事嚇阻與武力投射管道常態化。"},{label:"民族主義",text:"角度（反向案例）：義和團為排外民間民族主義，被慈禧工具化對抗列強，卻缺乏現代國家組織能力而慘敗。"},{label:"國際公法",text:"角度：辛丑條約未割地但透過賠款駐軍達成實質主權侵蝕，適合連結{{半主權國家}}概念。"},{label:"依賴理論／IPE",text:"角度：庚子賠款規模為條約體系對中國財政的終極壓榨，屬邊陲化的財政面終點案例。"}]},
  {id:"russo-japanese",region:"china",period:"③清末新政與辛亥革命轉型期 1901–1912",year:"1904–1905",title:"日俄戰爭",spec:"core",
    narrative:"甲午戰爭後俄國藉三國干涉還遼取得在華影響力，義和團事件期間俄國藉口保護中東鐵路出兵佔領東北全境，事後拒絕撤軍。1902年英日同盟簽訂，日本於1904年不宣而戰突襲旅順俄艦，爆發日俄戰爭。戰爭主要在中國東北領土上進行，日本海軍其後全殲俄國波羅的海艦隊，雙方於美國調停下簽訂《朴茨茅斯條約》，日本取得旅順大連租借權、南滿鐵路及庫頁島南半部。",
    knowledge:["戰爭在中國領土進行，交戰雙方均非中國，清廷宣布局外中立，凸顯清末主權淪喪的極致","《朴茨茅斯條約》由美國總統老羅斯福出面調停，老羅斯福因此獲得1906年諾貝爾和平獎","日俄戰爭確立日本在滿洲南部及朝鮮半島的優勢地位，直接鋪路1910年日本正式併吞朝鮮","俄國積極經營遠東、加速興建西伯利亞大鐵路，與1890年[[west|bismarck|俾斯麥同盟體系]]再保條約失效、德俄關係轉冷直接相關——俄國西線外交安全感降低，遂將擴張能量轉向東方尋求補償性拓展，這與稍早[[west|crimean-war|克里米亞戰爭]]後俄國西堵東進轉向中國東北的模式如出一轍，是俄國近代外交史上反覆出現的地緣戰略調整模式"],
    theory:[{label:"現實主義",text:"最貼近：典型的權力平衡與同盟政治操作——英國透過英日同盟扶植日本制衡俄國，戰爭結果直接促成英俄從對立走向合作。"},{label:"建構主義／民族主義",text:"角度：日本戰勝震撼全球，是非白人國家首次擊敗歐洲列強的象徵性事件，顛覆當時普遍的{{文明標準}}種族階序認知。"},{label:"國際公法",text:"角度：清廷局外中立宣告極具諷刺性——自己領土上被兩個外國交戰，自己卻無實質主權可介入。"},{label:"外交史方法論",text:"角度：適合做層次分析——體系層次、國家層次、個人層次。"}]},
  {id:"late-qing-reforms",region:"china",period:"③清末新政與辛亥革命轉型期 1901–1912",year:"1901–1911",title:"清末新政",spec:"core",
    narrative:"經歷義和團事件與八國聯軍的慘痛教訓後，清廷體認到不改革已無法維持統治，慈禧太后自1901年起推動一系列比戊戌變法更全面深入的改革措施，史稱清末新政。教育方面，1905年正式廢除延續逾千年的科舉制度，改設新式學堂，並派遣大批留學生赴日本、歐美學習近代知識。軍事方面，仿照西式編制編練新軍，成為日後民初軍閥勢力的重要淵源。政治方面，清廷宣布預備立憲，於1905年派遣五大臣出洋考察各國憲政，1907年起陸續在各省設立諮議局、中央設立資政院，作為民意代議機構的雛形，並頒布《欽定憲法大綱》，承諾九年後正式實施君主立憲。然而，1911年清廷組成的內閣中，皇族與滿人佔絕大多數，史稱皇族內閣，被輿論普遍解讀為清廷實質上仍不願意真正放棄皇族專制、對立憲派的期待只是虛應故事，這讓原本寄望透過體制內改革達成君主立憲的立憲派人士普遍感到幻滅，紛紛轉而同情、甚至支持革命派的排滿主張，清末新政的改革承諾至此徹底破產。",
    knowledge:["廢除科舉（1905）切斷了傳統士人透過科舉晉身仕途的管道，客觀上瓦解了科舉制度長期以來維繫的社會流動機制與士紳對王朝的向心力","新軍编練雖強化了軍事現代化，卻也培養出後續各省新軍將領割據一方的軍閥勢力，武昌起義本身正是由新軍工程營士兵率先發難","皇族內閣（1911）是壓垮清末新政的最後一根稻草——立憲派原本期待新政能兌現君主立憲承諾，皇族內閣讓其徹底失望轉向革命，是辛亥革命爆發的直接因果起點","諮議局、資政院雖是民意代議機構的雛形，但實際權力有限，仍受制於皇權，未能真正落實權力制衡"],
    theory:[{label:"比較政府與政治",text:"最貼近考古題方向：清末新政的君主立憲嘗試與日本明治維新的君主立憲道路高度相似（皆保留皇室、逐步建立代議機構），但清末新政啟動時間遠遠落後日本三十餘年，且皇族內閣的滿人壟斷權力做法，直接違背君主立憲應有的權力制衡精神，是解釋兩者成敗殊途的關鍵制度分析切入點。"},{label:"外交史方法論",text:"角度：清末新政是自強運動器物層次改革、戊戌變法制度層次改革相繼失敗後，清廷被迫進行的第三次、也是最全面深入的改革嘗試，展現晚清改革不斷升級深化卻始終追不上局勢惡化速度的結構性困境。"},{label:"建構主義",text:"角度：皇族內閣的成立，徹底摧毀了立憲派對清廷改革誠意的信任認同，這種認同崩解直接促成立憲派陣營集體倒向革命派，展現觀念與認同轉變如何能在關鍵時刻加速政權瓦解。"}]},
  {id:"xinhai",region:"china",period:"③清末新政與辛亥革命轉型期 1901–1912",year:"1911",title:"辛亥革命",spec:"light",
    narrative:"清廷推行[[china|late-qing-reforms|清末新政]]但皇族內閣讓立憲派徹底失望，轉而同情革命；各地保路運動引發社會動盪；1911年武昌起義爆發，各省紛紛獨立響應。1912年1月孫中山就任臨時大總統，2月宣統帝退位，清朝覆滅。",
    causal:"直接銜接戊戌變法失敗後保守派掌權的脈絡，可視為制度層次改革失敗這條主線的最終爆發。清朝瓦解直接觸發列強在邊疆地區的連鎖反應，這條線索留待民初外交時期再展開。"},
  {id:"mongolia-tibet-1911",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1911–1914",title:"民初邊疆問題：外蒙獨立與西姆拉條約",spec:"core",
    narrative:"辛亥革命爆發、清朝統治瓦解之際，外蒙古在俄國支持下於1911年宣布獨立，推舉哲布尊丹巴呼圖克圖為大汗，建立大蒙古國。1913年，中俄先簽署雙邊聲明，俄國承認外蒙古為中國宗主權下的自治領土；1915年，中、俄、蒙三方於恰克圖進一步簽署《中俄蒙恰克圖協約》，正式將外蒙古自治的具體框架定案，外蒙古以簽約當事方身分首次列席，形成一種宗主權與自治權並存的模糊過渡狀態。西藏方面，英國自19世紀末即積極介入，1904年英軍入侵拉薩，迫使西藏簽訂《英藏條約》；1906年《中英續訂藏印條約》中，英國承認清朝對西藏的宗主權。清朝瓦解後，英國藉機於1913–14年召集中、英、藏三方於印度西姆拉召開會議，英國代表麥克馬洪提議劃定西藏與印度之間的邊界線（麥克馬洪線），並主張將西藏劃分為內藏、外藏，大幅削弱中國對西藏的實質主權。中國代表雖於會議上簽字，但北京政府事後拒絕正式批准《西姆拉條約》，故此條約及麥克馬洪線在中國歷屆政府立場上始終不被承認。",
    knowledge:["外蒙古問題與西藏問題是同一時期由不同列強（俄國、英國）分別操作的邊疆危機，共同特徵是都利用中國政權更迭的空窗期介入","《西姆拉條約》北京政府簽字但拒絕批准，是近代中國外交史上另一個以程序性抵抗保留法理立場的案例，可與曾紀澤修約案例做對照比較","麥克馬洪線至今仍是中印邊界爭議的歷史根源","1913年中俄雙邊聲明與1915年中俄蒙恰克圖協約是兩份不同文件，前者僅中俄兩國簽署，後者才是外蒙古以當事方身分列席的正式三方協約，常考的文件性質精確辨析題"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：俄、英分別在外蒙、西藏複製利用中央政權真空期擴張勢力範圍的操作模式，與同時期日本在滿蒙的擴張邏輯相互呼應。"},{label:"國際公法",text:"角度：簽字但未批准凸顯近代國際法中條約生效程序如何被弱國用作保留法理立場的最後防線。"},{label:"外交史方法論",text:"角度：適合做中央政權更迭的空窗期如何被外部強權利用的結構性分析，可與辛亥革命事件的與主線因果連結相互呼應。"}]},
  {id:"21-demands",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1915",title:"二十一條要求",spec:"core",
    narrative:"一戰爆發後，日本藉英日同盟對德宣戰，出兵佔領德國在山東的租借地膠州灣及青島，取代德國成為山東的實質控制者。1915年1月，日本駐華公使向袁世凱政府提出二十一條要求，分為五號：第一號要求承認日本繼承德國在山東的一切權益；第二號要求延長旅順大連及南滿、安奉鐵路租期至99年，並給予日本在南滿、東蒙的優越經濟地位；第三號涉及漢冶萍公司中日合辦；第四號要求中國沿海港灣島嶼不得租借或割讓給他國；第五號要求中國政府聘用日本人為政治財政軍事顧問，中日合辦警政與兵工廠等，近乎將中國內政置於日本監督之下。經多輪談判與國內外輿論壓力，日本最終以最後通牒方式，迫使袁世凱政府接受除第五號部分內容外的大部分要求，於同年5月簽訂《中日民四條約》，5月9日被中國民間訂為國恥紀念日。",
    knowledge:["二十一條共五號，其中第五號因侵略性質最露骨、引發列強關切，最終被迫擱置或緩議，並非全部條款都被接受","袁世凱換文承認日本繼承德國在山東權利，成為日後1919年巴黎和會上日本主張取得山東權益的重要憑據，直接連結巴黎和會、五四運動事件","二十一條交涉是最後通牒式外交脅迫的典型案例，展現一戰期間列強無暇東顧之際，日本如何趁虛而入擴大在華權益","日本此時已在東北遼陽設立{{關東都督府}}作為政治軍事統治機關，並在袁世凱死後幕後扶植奉系軍閥張作霖（而非段祺瑞）控制東北，是理解1930年代九一八事變前日本在東北長期經營的背景","1917年，美國與日本另簽訂《藍辛-石井協定》，美國承認日本因地理鄰近在中國享有特殊利益，換取日本重申尊重中國領土完整、維持門戶開放原則，這份妥協性文件某種程度上默許了日本在華勢力持續擴張，可視為美國對日本二十一條要求既成事實的事後追認，直接影響巴黎和會上日本主張繼承山東權益的外交底氣"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：一戰期間歐洲列強深陷戰爭泥沼、無暇兼顧亞洲事務，形成日本在東亞的權力真空與擴張機會。"},{label:"依賴理論／IPE",text:"角度：漢冶萍公司中日合辦的要求，是日本資本輸出、掌控中國核心重工業命脈的具體企圖。"},{label:"外交史方法論",text:"角度：第五號因列強介入而受挫，展現國際輿論與列強利益平衡有時能對單一強權的擴張野心產生一定制約效果。"}]},
  {id:"paris-peace-china",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1919",title:"巴黎和會與五四運動：中國視角",spec:"core",
    narrative:"一戰結束後，中國以戰勝國身分派代表團出席巴黎和會，提出廢除列強在華勢力範圍、取消二十一條、歸還山東權益等訴求。然而和會列強基於大國補償原則的實際權力邏輯，仍決議將德國在山東的權益轉交日本，而非歸還中國。消息傳回北京，1919年5月4日，北京學生發起示威遊行，提出外爭主權、內除國賊口號，要求懲辦簽訂二十一條的親日官員，運動迅速擴及全國各大城市，商人罷市、工人罷工聲援，史稱五四運動。在強大民意壓力下，中國代表團最終拒絕在對德和約上簽字，是巴黎和會參與國中唯一拒籤者。",
    knowledge:["中國是巴黎和會的戰勝國之一，卻仍未能爭回山東權益，直接凸顯弱國無外交——即使身處戰勝方陣營，國力才是決定談判結果的關鍵","五四運動不僅是外交事件，更是中國近代思想史、社會史的重大轉折點，催生新文化運動後期的政治轉向","中國拒籤對德和約，是巴黎和會近30個參與國中唯一的拒籤案例，可與西姆拉條約簽字但拒絕批准的模式相互呼應比較"],
    theory:[{label:"民族主義",text:"最貼近考古題方向：五四運動展現巴黎和會的外交挫敗如何直接轉化為國內政治動員能量，可與甲午戰敗催生戊戌變法的模式做跨時代比較。"},{label:"現實主義",text:"角度：中國雖為戰勝國卻未能爭回權益，印證國際談判結果取決於實力對比而非道德正義的現實主義核心命題。"},{label:"外交史方法論",text:"角度：適合連結分析國內政治動員如何反過來影響外交決策，是研究外交政策與國內政治互動關係的重要案例。"}]},
  {id:"soviet-beijing",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1920s",title:"蘇聯對北京政府的統戰工作",spec:"core",
    narrative:"1917年俄國十月革命後，新成立的蘇維埃政權亟需打破西方列強的外交孤立與經濟封鎖，積極尋求與中國建立關係。1919年，蘇聯發表加拉罕宣言，宣布放棄沙俄時代在中國取得的各項特權，此舉在當時廣受中國知識界與民間好感。蘇聯同時透過共產國際，一方面協助中國共產黨於1921年成立，另一方面也與孫中山領導的中國國民黨接觸，1923年孫中山與蘇聯代表越飛發表孫文越飛宣言，確立聯俄容共、扶助工農政策，蘇聯派遣顧問協助國民黨改組、建立黃埔軍校培養軍事幹部，為北伐奠定基礎。然而蘇聯對華政策的實際執行，仍保有相當程度的自身戰略利益考量（尤其對外蒙古、中東鐵路的持續掌控），並未完全兌現加拉罕宣言的理想化承諾。",
    knowledge:["加拉罕宣言宣布放棄沙俄特權是重要的宣傳攻勢，實際執行時蘇聯仍保留對外蒙古、中東鐵路的控制，理想與實踐存在落差","聯俄容共政策直接促成國民黨改組、黃埔軍校建立，是北伐得以順利推進的重要外部助力，也埋下日後國共分裂的伏筆","蘇聯對中國的統戰邏輯呼應列寧從莫斯科到巴黎的捷徑是經過北京和加爾各答的世界革命策略思維","聯俄容共、革命外交是南方（廣州）政府的外交路線，與同時期北方政府負責的西藏、外蒙、參戰問題、巴黎和會、收回租界關稅自主、華盛頓會議等事務分屬不同陣營——民初中國同時存在兩條外交路線"],
    theory:[{label:"建構主義",text:"最貼近考古題方向：加拉罕宣言的意識形態訴求成功建構蘇聯作為中國的朋友而非傳統帝國主義列強的正面形象，即使實際政策執行未必完全兌現承諾。"},{label:"現實主義",text:"角度：蘇聯對外蒙古、中東鐵路的持續掌控，顯示即使意識形態上標榜反帝，國家利益的地緣政治考量仍是實際政策的最終依歸。"},{label:"依賴理論／IPE",text:"角度：蘇聯提供軍事顧問與資源協助國民黨建軍，某種程度上是另一種形式的外部強權介入中國內政。"}]},
  {id:"washington-conference",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1921–1922",title:"華盛頓會議與九國公約",spec:"core",
    narrative:"一戰後，美國有感於凡爾賽和約未獲美國國會批准、且日本在山東的權益爭議懸而未決，加上英日同盟續約問題牽動美國在太平洋的戰略利益，遂於1921年11月主導召開華盛頓會議，邀集九國與會。會議達成三項重要協議：四國公約（終止英日同盟，改由美英法日四國共同協商太平洋地區事務）；五國海軍公約（限制五國主力艦噸位比例，美英各5、日本3、法義各1.75，是近代史上首次成功的國際軍備管制條約）；九國公約，各國共同承諾尊重中國之主權、獨立及領土與行政完整，確立對華門戶開放、機會均等原則。會外協商中，中日兩國另行簽署《解決山東懸案條約》，日本在美英調停壓力下，同意將山東主權交還中國（但保留部分經濟利權）。",
    knowledge:["出席華盛頓會議的中國代表為北京政府（北洋政府），民初南北分治期間，收回租界、關稅自主、參與國際會議等對外事務主要由北方政府負責，南方（廣州）政府則專注聯俄容共、革命外交路線——常考的南北政府外交分工配對題","華盛頓會議終止了英日同盟，某種程度上削弱了日本在東亞的外交靠山","九國公約將美國門戶開放政策的原則正式多邊條約化，使其從單方面的政策宣示轉變為具有國際法拘束力的多國承諾","山東問題在華盛頓會議上部分解決，但這是列強調停施壓的結果，而非中國自身談判實力的展現","山東問題的解決是透過中日兩國於會外另行簽署的《解決山東懸案條約》（1922），並非九國公約本身的條款內容，是常考的文件歸屬精確辨析題"],
    theory:[{label:"自由主義／國際制度",text:"最貼近考古題方向：華盛頓會議體系透過多邊條約建立戰後太平洋地區的規則性秩序，是繼歐洲凡爾賽體系之後亞太地區版本的規則取代權力嘗試。"},{label:"現實主義",text:"角度：美國主導終止英日同盟、限制日本海軍噸位比例，本質仍是美國藉多邊機制制衡日本在太平洋擴張的權力平衡操作。"},{label:"外交史方法論",text:"角度：山東問題的部分解決是英美對日施壓的結果，適合做弱國透過列強之間的利益矛盾間接爭取有利結果的策略分析。"}]},
  {id:"anti-treaty-movement",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1924–1928",title:"國民革命與廢除不平等條約運動",spec:"core",
    narrative:"孫中山於1924年在廣州召開中國國民黨第一次全國代表大會，發表宣言明確號召廢除不平等條約，將此列為國民革命的核心外交目標之一。1925年5月30日，上海發生日本紗廠槍殺華工事件，引發學生示威遊行聲援，上海公共租界英籍巡捕悍然開槍鎮壓，造成多人死傷，史稱五卅慘案，事件迅速引爆全國性反帝愛國運動高潮。同年，廣州國民政府發動省港大罷工，動員廣州、香港兩地工人聯合罷工，持續長達16個月之久，對香港經濟造成嚴重衝擊。1926年國民革命軍展開北伐，1927年攻克長江中下游後，順勢從英國手中收回漢口、九江英租界，是近代中國首度以實際行動成功收回外國租界的案例。",
    knowledge:["五卅慘案是1925年5月30日，不是五三慘案，日期與名稱常被混淆出題","省港大罷工展現群眾運動作為外交施壓工具的操作模式，與傳統外交談判形成鮮明對比","收回漢口九江英租界（1927）是北伐軍事行動與廢約外交訴求直接結合的具體成果"],
    theory:[{label:"民族主義",text:"最貼近考古題方向：國民革命時期的反帝民族主義動員，將五四運動以來累積的群眾民族主義能量進一步組織化、政治化，成為國民黨北伐動員的重要意識形態資源。"},{label:"現實主義",text:"角度：收回漢口九江英租界證明，當中國自身軍事實力有所提升時，列強讓步的意願與幅度也隨之提高。"},{label:"依賴理論／IPE",text:"角度：省港大罷工透過經濟抵制直接衝擊香港對外貿易與經濟運作，是南方國家依賴理論框架下弱者的武器的早期實踐案例。"}]},
  {id:"mukden-incident",region:"china",period:"④民初外交與多重外患期 1912–1928",year:"1931–1932",title:"九一八事變與滿洲國",spec:"core",
    narrative:"1928年6月，日本關東軍為排除奉系軍閥張作霖對東北的掌控、伺機擴大在滿蒙地區的權益，於瀋陽近郊皇姑屯車站預先埋設炸藥，炸毀張作霖所乘專列，張作霖當場身亡，史稱皇姑屯事件。其子張學良繼承東北統治權後，不顧日本威脅利誘，於同年底宣布東北易幟、改懸青天白日滿地紅旗，名義上歸順國民政府，形式上完成全國統一，卻也讓關東軍對東北權益更加焦慮。日本關東軍長期覬覦中國東北豐富資源與戰略地位，1931年9月18日夜，關東軍軍官在瀋陽近郊柳條湖自行炸毀南滿鐵路一小段路軌，卻反誣稱是中國軍隊所為，以此為藉口迅速出兵攻佔瀋陽，並在數月內席捲東北三省全境，史稱九一八事變。此次行動事前未經東京中央政府正式授權，是關東軍少壯派軍官擅自發動的既成事實。中國政府採取不抵抗政策，一方面寄望國際聯盟主持公道，一方面忙於安內攘外優先剿共，東北迅速淪陷。1932年，日本扶植清朝末代皇帝溥儀成立傀儡政權滿洲國。國際聯盟應中國要求派遣李頓調查團實地調查，1932年提出報告，認定日本行動非屬正當自衛，建議東北由國際共管，但缺乏強制執行力。日本對此不滿，於1933年宣布退出國際聯盟。",
    knowledge:["皇姑屯事件（1928）是關東軍暗殺張作霖的既成事實行動，也未經東京中央授權，與三年後九一八事變的操作模式如出一轍，展現關東軍長期擅自行動、中央政府被迫追認的一貫模式","九一八事變是未經中央政府授權、由地方駐軍擅自發動的既成事實外交案例，與稍後七七事變的爆發模式有相似之處","李頓調查團報告雖認定日本行動不當，但國聯僅能提出建議、缺乏強制制裁機制，直接印證國聯的結構性缺陷","日本退出國聯（1933）是修正主義強權公然挑戰集體安全體系、且毫無後果的重要先例，也鼓舞了日後德義的類似行動"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：九一八事變充分展現當國際集體安全機制缺乏強制執行力時，修正主義強權可以肆無忌憚地以武力片面改變現狀，與國聯在衣索比亞危機的失敗屬同一模式。"},{label:"外交史方法論",text:"角度：適合做地方軍事單位擅自行動、中央政府被迫追認的能動性層次分析。"},{label:"國際公法",text:"角度：滿洲國形式獨立、實質魁儡的政權型態，是研究國家承認要件的重要反面案例。"},{label:"建構主義",text:"角度：日本退出國聯後，其後續外交論述逐漸建構大東亞共榮圈等意識形態，將侵略擴張包裝為正當性敘事。"}]},
  {id:"xian-incident",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1936",title:"西安事變",spec:"core",
    narrative:"九一八事變後，日本持續蠶食華北，但蔣介石領導的國民政府堅持安內攘外政策，主張先徹底剿滅共產黨勢力、再全力對日抗戰，引發國內輿論與部分將領強烈不滿。1936年12月，奉命在陝西督剿共產黨紅軍的東北軍將領張學良（東北淪陷、痛失家鄉的奉系少帥）與西北軍將領楊虎城，因不滿蔣介石堅持剿共優先、消極抗日的政策，於西安發動兵諫，扣押蔣介石本人，要求停止內戰、聯共抗日。事變震驚全國，各方勢力介入斡旋，中國共產黨代表周恩來親赴西安參與談判，蔣介石最終口頭同意停止剿共、聯合各方力量一致對外抗日，張學良隨即親自護送蔣介石返回南京，並自請受罰遭長期軟禁。西安事變促成第二次國共合作（聯共抗日）正式形成，是中國能在隔年七七事變後迅速凝聚全國一致抗日共識的關鍵轉折點。",
    knowledge:["西安事變是由地方將領發動、對中央最高領導人採取兵諫的罕見案例，展現當中央政策與地方將領（尤其痛失家鄉的東北軍）利益認知出現重大落差時，可能引發的體制性震盪","事變促成第二次國共合作（聯共抗日），與1924年孫中山時期的第一次國共合作（聯俄容共）性質不同，前者是抗日民族統一戰線，後者是革命外交路線的一部分，注意不要混淆兩次國共合作的背景與性質","張學良促成兵諫卻自請受罰、護送蔣介石返京，展現其個人政治判斷背後複雜的忠誠與民族大義拉扯"],
    theory:[{label:"外交史方法論",text:"最貼近考古題方向：適合做層次分析——個人層次（張學良痛失東北家鄉的個人動機）、國家層次（國民政府安內攘外政策與地方將領利益的結構性衝突）、系統層次（日本持續擴張對整個中國內部政治格局的外部壓力），三個層次交織促成這場罕見的兵諫事件。"},{label:"建構主義",text:"角度：西安事變促成全國一致對外抗日的民族認同凝聚，展現外部威脅如何能夠暫時弭平原本尖銳對立的國內意識形態分歧（國共內戰）。"}]},
  {id:"marco-polo-bridge",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1937",title:"七七事變與全面抗戰爆發",spec:"core",
    narrative:"九一八事變後，日本持續在華北蠶食擴張，中日關係日趨緊張。1937年7月7日夜，日軍在北平近郊盧溝橋附近進行軍事演習，藉口一名士兵失蹤，要求進入宛平縣城搜查遭拒，隨即砲擊縣城，中國駐軍奮起抵抗，史稱七七事變。事變爆發後，日本國內強硬派主導決策，迅速擴大兵力增援華北，同年8月上海爆發八一三事變，戰火從華北延燒至華東，中日雙方均未正式宣戰，但實質上已進入全面戰爭狀態。國際社會反應相對消極：國聯雖通過決議譴責日本，但缺乏具體制裁能力；英國一度協助打通滇緬公路作為對華後勤補給管道；美國起初維持中立，直到1941年珍珠港事變後才正式對日宣戰、全面援華。",
    knowledge:["七七事變與九一八事變同樣是基層軍事摩擦迅速升級為全面戰爭的模式，但事變後雙方未經正式宣戰即進入全面戰爭狀態，是未宣而戰的重要案例","國際反應相對消極，各國基於自身利益考量未能採取有效集體制裁行動，直到珍珠港事變後美國參戰戰局才根本改觀","中日戰爭與第二次世界大戰時序上有重疊但非完全重合——中日戰爭1937年即全面爆發，早於1939年歐洲二戰爆發","九一八到七七之間的中日關係常考（111年三等考古題）：1932年五一五事件遇刺的是首相犬養毅（「田中義一」為錯誤選項）；1933年長城戰役後簽訂《塘沽協定》；1935年日本策動華北自治運動，外相廣田弘毅提出「廣田三原則」；1937年七七事變","中國政府正式對日宣戰是在1941年12月9日珍珠港事變之後，並同時對德、義宣戰；1937–1941年雙方處於未宣而戰狀態，這段期間的外交發展詳見[[china|early-war-diplomacy|抗戰前期外交：布魯塞爾會議、陶德曼調停與近衛聲明]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：國際社會對七七事變的消極反應，展現當侵略行為未直接威脅到自身核心利益時其他國家傾向姑息旁觀，與西洋史姑息政策對納粹德國擴張的因應模式高度相似。"},{label:"外交史方法論",text:"角度：適合比較七七事變與九一八事變的異同，顯示日本此時已從地方軍部擅自行動逐漸轉為中央決策階層主導的全面侵略。"},{label:"國際公法",text:"角度：中日雙方直到多年後才正式互相宣戰，未宣而戰的狀態如何影響雙方在國際法上的權利義務，是研究戰爭狀態認定的重要案例。"}]},
  {id:"early-war-diplomacy",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1937–1941",title:"抗戰前期外交：布魯塞爾會議、陶德曼調停與近衛聲明",spec:"light",
    narrative:"七七事變後中國對日全面抗戰，但在1941年珍珠港事變前的四年多，中國幾乎是在缺乏正式盟邦的情況下獨力作戰，外交主軸是爭取國際援助、阻止各國承認日本扶植的政權。軍事上，1937年8月淞滬會戰爆發，12月首都南京失陷，日軍入城後大規模屠殺平民與已放下武器的軍人，史稱南京大屠殺；1938年徐州會戰、武漢會戰相繼展開，國民政府以空間換取時間、西遷重慶，同年10月武漢、廣州失守後，戰爭進入相持階段。外交上，1937年8月21日中國與蘇聯簽訂《中蘇互不侵犯條約》，蘇聯隨後提供貸款、軍火與空軍志願隊，是抗戰初期最主要的外援；同年11月，九國公約締約國在比利時召開布魯塞爾會議，日本拒絕出席，會議僅發表宣言而未採取任何制裁；德國駐華大使陶德曼則於1937年底至1938年初居間調停，因日方條件苛刻而破局。日本首相近衛文麿於1938年1月發表第一次近衛聲明，宣布「不以國民政府為對手」，11月再提出建立「東亞新秩序」，12月提出「善鄰友好、共同防共、經濟提攜」的近衛三原則，誘使汪精衛出走，汪於1940年3月在南京成立親日政權，日本並於同年11月與之簽約予以承認。國際環境持續惡化：1940年7月英國為避免與日本衝突，同意封閉滇緬公路三個月；1941年4月日蘇簽訂《日蘇中立條約》，雙方並互相聲明尊重「滿洲國」與外蒙古的領土完整，我國政府提出嚴正抗議。直到1941年12月珍珠港事變後，國民政府才於12月9日正式對日、德、義宣戰，中國抗戰自此併入世界大戰。",
    causal:"本卡填補[[china|marco-polo-bridge|七七事變與全面抗戰爆發]]與[[china|wartime-cooperation|抗戰期間中美英合作]]之間1937–1941年的空白。布魯塞爾會議是1922年九國公約（詳見[[china|washington-conference|華盛頓會議與九國公約]]事件卡）最後一次被援引來約束日本卻宣告失效的場合，與國聯面對九一八事變的無力相互呼應；蘇聯援華與日蘇中立條約的前後反差，顯示蘇聯對華政策始終以自身安全為優先，是理解1945年[[west|yalta-potsdam|雅爾達密約]]犧牲中國權益的前奏。南京大屠殺的罪責，戰後由{{東京審判（遠東國際軍事法庭）}}與南京審判戰犯軍事法庭追究。時序陷阱：中國正式對日宣戰是在1941年12月9日珍珠港事變之後，1937–1941年雙方處於未宣而戰狀態。"},
  {id:"wartime-cooperation",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1941–1945",title:"抗戰期間中美英合作",spec:"core",
    narrative:"自1937年七七事變全面抗戰爆發後，中國在缺乏正式盟邦軍事支援的情況下獨力抵抗日本侵略長達四年餘，期間國民政府一度遷都重慶、以空間換取時間持久抗戰，付出慘重犧牲卻始終未能獲得西方列強實質軍事介入。直到1941年12月珍珠港事變後，美國正式對日宣戰，中國對日抗戰自此併入同盟國陣營對抗軸心國的世界大戰框架，中美英三國合作關係大幅深化。美國透過租借法案大量軍援中國，並派遣史迪威將軍出任中國戰區參謀長；由於日軍佔領緬甸、切斷滇緬公路，中美隨即開闢駝峰航線，飛越喜馬拉雅山脈以空運方式維持對華軍援物資運補。外交層面，美英於1943年正式宣布撤銷在華治外法權及其他不平等條約特權。同年11月，美國總統羅斯福、英國首相邱吉爾邀請國民政府主席蔣中正於埃及召開開羅會議，發表《開羅宣言》，明訂日本戰敗後應將台灣、澎湖歸還中華民國。1944年，中華民國與美英蘇等國共同磋商籌組戰後國際組織方案，為聯合國成立奠定基礎，中華民國並於1945年正式成為聯合國創始會員國及安全理事會常任理事國之一。",
    knowledge:["中國自1937年七七事變起獨力對日抗戰長達四年餘，直到1941年珍珠港事變後才真正獲得美英等國實質軍事合作，這段孤軍奮戰時期是理解中國抗戰貢獻與付出代價的重要背景，常被國際史觀低估或忽略","1943年1月11日，中美於華盛頓簽訂《中美關於取消美國在華治外法權及處理有關問題之條約》、中英於重慶簽訂《中英關於取消英國在華治外法權及其有關特權條約》，正式撤銷治外法權等不平等條約特權，是近代中國自鴉片戰爭以來歷經百年的廢約目標最終形式性完成的重要指標；但英國拒絕交還九龍租借地（新界），我國僅保留日後再提的權利","考點陷阱（112年三等考古題）：美英撤銷在華不平等條約特權是在1943年，「七七事變爆發後美、英迅即撤銷不平等條約」為錯誤選項；同題正確選項為1943年11月開羅會議後發表的《開羅宣言》同意戰後朝鮮獨立","《開羅宣言》（1943年12月1日以新聞公報形式發表，未經三國領袖簽署）雖非正式條約，卻在戰後被視為具有國際法效力的重要文件，是台灣主權歸屬爭議中中華民國政府主張的重要國際法依據之一","中華民國成為聯合國創始會員國及安理會常任理事國，是二戰期間中國對日抗戰貢獻獲得國際承認的具體成果","駝峰航線的高損失率，展現戰時盟國對華支援的實際困難與代價","1945年10月25日，中華民國政府依《開羅宣言》及日本降書，於台北公會堂舉行受降典禮，正式恢復對台灣、澎湖行使主權，史稱台灣光復；此舉的國際法效力後續與1951年舊金山和約（日本僅宣布放棄台澎主權、未明訂歸屬對象）之間的關係，是台灣國際地位爭議中常被提出討論的環節"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：中國對日抗戰的持久消耗，牽制了大量日本陸軍兵力，客觀上減輕了美英在太平洋戰場的壓力，這種戰略價值決定盟友待遇的邏輯，正是中國得以躋身聯合國創始五強之列的根本原因。"},{label:"外交史方法論",text:"角度：適合做戰爭如何加速外交地位躍升的分析，中國從甲午戰敗以來持續積弱的國際地位，在短短數年內實現結構性翻轉。"},{label:"國際公法",text:"角度：1943年廢除治外法權的新約，標誌著近代國際法文明標準歧視性框架對中國的正式終結。"},{label:"依賴理論／IPE",text:"角度：租借法案的軍援本質上仍是一種依賴性的外部支持，也預示了戰後中國持續仰賴美國軍事與經濟支持的格局。"}]},
  {id:"civil-war-mediation",region:"china",period:"⑤國民政府時期／廢除不平等條約期 1928–1949",year:"1945–1949",title:"國共內戰與美國調停",spec:"core",
    narrative:"二戰結束後，中國國民黨與共產黨對戰後政治權力分配的矛盾迅速浮上檯面。美國基於避免中國陷入內戰、期望建立一個穩定親美的統一中國之戰略考量，早在抗戰後期即介入國共調停：1944年羅斯福總統派遣赫爾利（Patrick Hurley）來華，赫爾利隨後出任駐華大使，並於1945年8月親赴延安、陪同毛澤東飛抵重慶，促成蔣中正與毛澤東的重慶會談，雙方於10月10日簽署《雙十協定》，表面上同意和平建國，但軍事衝突並未停止。赫爾利於同年11月辭職，杜魯門總統改派馬歇爾將軍以特使身分於1945年12月20日抵華，促成1946年1月的停戰協定與政治協商會議，並成立由國、共、美三方組成的軍事調處執行部監督停火。然而國共雙方均未真正遵守停戰協議，美國自1946年夏起對華實施軍火禁運，至1947年5月才解除；馬歇爾調停終告失敗，於1947年1月離華返美。國共內戰全面爆發，戰局於1948年後急轉直下，中華民國政府於1949年撤退至台灣。同年8月，美國國務院發表《中國白皮書》，將中國局勢的惡化歸咎於國民政府自身的腐敗無能，而非美國援助不力。美國此後一度採取觀望，甚至考慮放棄協防台灣，直到1950年韓戰爆發才轉而派遣第七艦隊巡弋台海，詳見[[crossstrait|taiwan-strait-crises|台海危機與台美共同防禦]]事件卡。",
    knowledge:["考點陷阱（110年三等考古題）：①史迪威是中國戰區參謀長，並非調停國共的特使，抗戰後期負責調停的是赫爾利；②重慶會談（1945年8–10月）是赫爾利陪同毛澤東赴渝促成，馬歇爾當時尚未來華（1945年12月才抵華），「馬歇爾、蔣中正和毛澤東的重慶會談」為錯誤選項；③對華軍火禁運發生在杜魯門政府時期，羅斯福已於1945年4月去世；正確選項為1949年8月美國國務院發表《中國白皮書》","馬歇爾使華調停是美國在二戰後首次大規模介入中國內政的外交嘗試，其失敗原因常考：國共雙方均缺乏真誠停戰意願、美國本身對兩黨施壓力道有限","《雙十協定》雖名為協定，但實際執行成效極其有限，常考協定簽署與實際履行落差的觀念題","《中國白皮書》（1949）是美國對華政策轉向的重要指標性文件，也預示了韓戰爆發前美國一度考慮放棄協防台灣的政策傾向"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：美國調停國共內戰的核心動機是地緣戰略考量，而非單純的人道或理想主義關懷，調停失敗後美國對國民政府支持力道的動搖也是基於現實評估。"},{label:"外交史方法論",text:"角度：馬歇爾調停的失敗案例顯示，當衝突雙方都認為透過軍事手段獲勝的機率高於透過談判妥協時，外部調停者即使付出大量外交資源，成效仍極為有限。"},{label:"依賴理論／IPE",text:"角度：國民政府對美援的高度依賴，以及美援政策的搖擺不定，直接影響了國共內戰的戰局走向。"},{label:"建構主義",text:"角度：中國白皮書將內戰失利完全歸咎於國民政府腐敗無能的敘事建構，深刻影響了此後數十年美國國內對華政策辯論的基本框架。"}]},
  {id:"prc-founding-1949",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1949–1950",title:"中華人民共和國建政與「一邊倒」外交",spec:"core",
    narrative:"國共內戰勝負大勢已定之際，毛澤東於1949年6月30日發表〈論人民民主專政〉，宣示新政權將「一邊倒」向以蘇聯為首的社會主義陣營。同年9月，中國人民政治協商會議第一屆全體會議在北平召開，通過具有臨時憲法性質的《共同綱領》；10月1日，中華人民共和國中央人民政府宣告成立。中共建政初期的外交遵循毛澤東提出的三原則：「另起爐灶」（不承認國民政府與各國的舊外交關係，一切重新談判建交）、「打掃乾淨屋子再請客」（先清除帝國主義在華特權與影響力，再考慮與西方國家建交）以及「一邊倒」。蘇聯於10月2日率先承認，東歐共產國家隨即跟進；非共產國家中，緬甸、印度相繼於1949年底承認，英國則於1950年1月6日成為第一個承認中共的西方大國，但因中共要求英國先斷絕與在台灣的中華民國政府的關係、並在聯合國代表權問題上表態，雙方直到1954年才互派代辦，1972年才升格為大使級。1949年12月至1950年2月，毛澤東親赴莫斯科與史達林談判，雙方於1950年2月14日簽訂《中蘇友好同盟互助條約》，取代1945年中華民國與蘇聯所簽的《中蘇友好同盟條約》，並另訂協定，約定蘇聯最遲於1952年底前將{{中東鐵路／南滿鐵路／中國長春鐵路}}及旅順海軍基地移交中共（旅順因韓戰延至1955年才交還），同時提供3億美元貸款。中蘇同盟自此成為中共建政初期外交與國家安全的支柱。",
    knowledge:["考點陷阱：《中蘇友好同盟互助條約》（1950年2月14日，中共與蘇聯）與《中蘇友好同盟條約》（1945年8月14日，中華民國與蘇聯）名稱只差「互助」二字，締約主體完全不同；後者詳見[[west|yalta-potsdam|雅爾達會議與戰後歐洲秩序安排]]事件卡","毛澤東外交三原則「一邊倒」「另起爐灶」「打掃乾淨屋子再請客」，常考名詞與內涵配對","各國承認中共屬國際法上的{{政府承認／國家承認}}中的「政府承認」問題：中國作為國家的國際法人格並未改變，爭議在於哪一個政府代表中國，這正是日後聯合國中國代表權之爭的法理根源，詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡","承認時間與建交層級是兩回事：英國1950年即承認中共，卻遲至1972年才建立大使級關係；法國1964年建交即為大使級，是第一個與中共建立大使級關係的西方大國，詳見[[china|sino-french-recognition-1964|中法建交與戴高樂獨立外交]]事件卡","《共同綱領》在1954年《中華人民共和國憲法》制定前具有臨時憲法地位，是比較政府與政治科目的制度沿革考點","1949年也是兩岸分治的起點：中華民國政府遷台後，兩岸各自主張代表中國，此後的軍事對峙詳見[[crossstrait|taiwan-strait-crises|台海危機與台美共同防禦]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：「一邊倒」並非單純的意識形態選擇，而是新政權在美國不承認、內戰尚未完全結束的情勢下，為取得安全保障與經濟援助所做的{{扈從}}與結盟決策；中蘇同盟日後因國家利益分歧而瓦解，印證同盟關係最終取決於利益而非意識形態，詳見[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡。"},{label:"國際公法",text:"角度：政府承認的時點與方式（明示或默示、法律上或事實上承認），以及「另起爐灶」對舊條約繼承的否定立場，都是國際法上政府繼承與條約繼承的典型討論素材。"},{label:"馬克思主義／依賴理論",text:"角度：中共以反帝國主義、反殖民主義論述定位其對外政策，「打掃乾淨屋子」即清除外國在華的經濟與文化勢力，可理解為試圖脫離資本主義世界體系的外交路線。"},{label:"外交史方法論",text:"角度：毛澤東在莫斯科停留長達兩個月，雙方在中長鐵路、旅順等權益上反覆拉鋸，顯示中蘇同盟並非單純的意識形態兄弟情誼，是能動性分析的好案例。"}]},
  {id:"sino-indian-war-1962",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1962",title:"中印邊界戰爭",spec:"light",
    narrative:"中印邊界爭議主要集中在兩段：西段的阿克賽欽由中國實際控制並修築新藏公路，印度主張屬其領土；東段則涉及1914年西姆拉會議期間英屬印度與西藏代表劃定的{{麥克馬洪線}}，印度以此線為界，中國則以歷屆中國中央政府從未承認為由否認其效力。1954年中印簽訂協定、共同倡議和平共處五項原則，兩國一度友好；但1959年西藏發生抗暴事件、達賴喇嘛流亡印度並獲庇護，同年邊境爆發武裝衝突，雙方關係急轉直下。印度總理尼赫魯其後推行「前進政策」，在爭議地區增設哨所。1962年10月20日，中共軍隊在東、西兩段同時發動大規模攻勢，印軍潰敗；11月21日中共宣布單方面停火，並將軍隊後撤至1959年11月7日實際控制線後方20公里處。戰爭期間正值古巴飛彈危機，美、英對印度提供軍事援助，蘇聯則保持中立。戰後巴基斯坦於1963年與中共簽訂邊界協定，兩國關係日益緊密。",
    causal:"東段爭議的源頭是1914年西姆拉會議劃定的麥克馬洪線，詳見[[china|mongolia-tibet-1911|民初邊疆問題：外蒙獨立與西姆拉條約]]事件卡；中印在1954年共同倡議和平共處五項原則（詳見[[modern|third-world-rise|第一次印支戰爭、日內瓦會議與萬隆會議、不結盟運動]]事件卡），八年後即兵戎相見，是檢驗規範宣示與國家利益落差的申論素材。蘇聯在衝突中保持中立被中共視為背叛，是中蘇交惡的重要轉折，詳見[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡；戰後形成的中巴合作、印巴對立格局延續至今，詳見[[modern|india-pakistan-2025|2025年印巴危機]]事件卡。考點提醒：中華民國政府同樣不承認麥克馬洪線與西姆拉條約，兩岸在此問題上立場一致。"},
  {id:"sino-french-recognition-1964",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1964",title:"中法建交與戴高樂獨立外交",spec:"light",
    narrative:"法國總統戴高樂主張法國應在美蘇兩強之外走獨立自主路線，不願事事追隨美國。1964年1月27日，法國與中華人民共和國發表聯合公報，宣布建立外交關係並在三個月內互派大使。公報全文極為簡短，未提及台灣問題，法國起初也未主動與中華民國斷交，外界一度揣測法國有意同時與兩岸維持關係；中共隨即表明，法國承認中華人民共和國政府即意味不再承認中華民國政府。中華民國政府基於「{{漢賊不兩立}}」立場，於1964年2月10日宣布與法國斷交。法國成為第一個與中共建立大使級外交關係的西方大國。此後戴高樂持續推動獨立外交，1966年宣布退出北大西洋公約組織的軍事指揮體系，並先後改善與莫斯科、北京的關係。",
    causal:"中法建交是冷戰期間西方陣營首次出現大國不追隨美國對華政策的缺口，對我國國際處境造成重大衝擊，也預示了1971年聯合國代表權之爭的結果，詳見[[crossstrait|china-representation-un|中國代表權問題與聯合國大會第2758號決議]]事件卡；可與英國1950年即承認中共、卻遲至1972年才升為大使級的模式對照，詳見[[china|prc-founding-1949|中華人民共和國建政與「一邊倒」外交]]事件卡。考點提醒（109年四等考古題）：戴高樂退出北約軍事指揮體系（1966）出於法國獨立自主的外交路線，時間早於1960年代末美國推動的低盪政策，並不屬於低盪政策的後續發展；法國退出的是北約軍事指揮體系而非北約本身，並已於2009年重返，詳見[[org|nato|北大西洋公約組織]]卡。"},
  {id:"sino-japan-normalization-1972",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1972–1978",title:"中日建交與中日和平友好條約",spec:"core",
    narrative:"1972年9月25日至30日，日本首相田中角榮應周恩來邀請訪問中國大陸，9月29日雙方在北京簽署《中華人民共和國政府和日本國政府聯合聲明》（日方稱《日中共同聲明》），宣布自即日起建立外交關係。聲明中，日本政府承認中華人民共和國政府是中國的唯一合法政府；中華人民共和國政府重申台灣是其領土不可分割的一部分，日本政府則表示「充分理解和尊重」中國政府的這一立場，並非「承認」台灣屬於中國，用詞上刻意保留模糊空間。日本外務大臣大平正芳同日在記者會上宣布，因中日邦交正常化，1952年簽訂的《中日和約》（台北和約）已「失去存在的意義，宣告結束」，我國政府隨即發表聲明宣布與日本斷絕外交關係。斷交後，雙方為維持實務關係，於同年12月分別成立民間形式的窗口機構：日本方面成立「交流協會」，我方成立「亞東關係協會」（兩會於2017年分別更名為「日本台灣交流協會」與「台灣日本關係協會」）。1978年8月12日，中日兩國在北京簽訂《中日和平友好條約》，條約核心是雙方約定不在亞太地區謀求霸權、也反對任何國家或國家集團謀求霸權，即「反霸權條款」，被視為針對蘇聯在亞太擴張的外交表態；同年10月，鄧小平赴日本交換該條約批准書，成為中共領導人首次正式訪日。",
    knowledge:["考點陷阱：中日聯合聲明中日本政府對台灣地位的表態是「充分理解和尊重」中華人民共和國的立場，並非「承認並遵守海峽兩岸同屬一個中國」，兩者用詞強度不同（cs-mc-004）","斷交後我國與日本以「亞東關係協會」（我方）與「交流協會」（日方）維持實務往來，2017年分別更名為「台灣日本關係協會」與「日本台灣交流協會」，是常考的機構名稱沿革","《中日和平友好條約》（1978）的核心是「反霸權條款」，與同期美中關係正常化的聯美制蘇戰略互相呼應，詳見[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡","中日邦交正常化談判涉及兩份條約的定位問題：1951年《舊金山和約》與1952年《中日和約》，兩者關係與台灣地位問題緊密相關，詳見[[crossstrait|san-francisco-treaty|舊金山和約與中日和約]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：日本在美中關係正常化的既成事實下迅速跟進與中共建交，是典型的扈從行為；《中日和平友好條約》的反霸權條款則反映日本與中共在對蘇聯戰略上的共同利益。"},{label:"國際公法",text:"角度：日本以「充分理解和尊重」而非「承認」處理台灣地位問題，與美國其後三份聯合公報一致採用「認知」（acknowledge）的模糊用語如出一轍，是研究戰略模糊在外交文件用詞上具體操作的比較案例。"},{label:"外交史方法論",text:"角度：斷交後以「民間機構」名義維持實質關係，是冷戰期間多國處理與台灣關係的共通模式（可與美國《臺灣關係法》、美國在台協會對照），顯示國際政治中形式與實質可以分離操作。"}]},
  {id:"sino-vietnamese-war-1979",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1979",title:"中越戰爭（懲越戰爭）",spec:"light",
    narrative:"越南在1975年統一後轉向親蘇路線，1978年11月與蘇聯簽訂為期25年的友好合作條約，同年12月出兵入侵柬埔寨、推翻中共支持的紅色高棉政權；越南國內同時發生大規模排斥、驅趕華僑事件。中共視越南的親蘇轉向與地區擴張為對其安全的直接威脅。鄧小平於1979年1月底訪問美國期間，即向卡特政府表明中國將對越南採取軍事行動「教訓」越南；2月17日凌晨，解放軍分由廣西、雲南兩路大舉越過中越邊境，攻擊諒山、高平、老街等地，戰事持續至3月16日，中共宣布已達成作戰目標、主動撤軍，越南亦宣布獲勝，雙方傷亡均重。",
    causal:"中越戰爭是鄧小平「聯美制蘇」戰略的具體軍事展現，時間點正好在他訪美之後、《中日和平友好條約》反霸權條款簽署之後，三者共同構成1978–79年中共對蘇聯採取的一致外交路線，詳見[[china|sino-japan-normalization-1972|中日建交與中日和平友好條約]]事件卡。此戰也使中國陷入來自蘇聯（北）、越南（南）的雙重壓力，加深了[[modern|sino-soviet-split|中蘇交惡與珍寶島事件]]事件卡描述的對蘇安全焦慮；戰爭本身可與美國同時期深陷的[[modern|vietnam-war|越戰與越戰越南化政策]]事件卡對照，同樣是大國在中南半島代理衝突的案例。"},
  {id:"deng-xiaoping-diplomacy",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"1978–1992",title:"鄧小平時代外交：改革開放、獨立自主與中蘇關係正常化",spec:"core",
    narrative:"1978年12月，中共十一屆三中全會確立以經濟建設為中心的「改革開放」路線，鄧小平取代華國鋒成為實際最高領導人，外交政策隨之轉向為國內經濟發展服務。1982年中共十二大，鄧小平提出「獨立自主的和平外交政策」，不再明確傾向美蘇任何一方，這也標誌著毛澤東時期「一條線」聯美制蘇戰略的調整。對蘇關係方面，中共提出蘇聯須先消除「三大障礙」——中蘇及中蒙邊境陳兵、蘇聯支持越南入侵柬埔寨、蘇聯出兵阿富汗——中蘇關係正常化談判才能真正推進。隨著蘇聯於1989年2月自阿富汗撤軍、對越南施壓促其考慮自柬埔寨撤軍，三大障礙逐步排除，蘇共總書記戈巴契夫於1989年5月15日至18日正式訪問北京，與鄧小平在人民大會堂會晤，雙方宣布中蘇關係實現正常化，結束自1960年代以來長達近三十年的對立，鄧小平會晤時提出「結束過去、開闢未來」八字方針。這次鄧戈會談恰逢北京天安門廣場學生民主運動的高峰，國際媒體聚集北京採訪，也意外向全球直播了其後六四事件的鎮壓過程。整體而言，鄧小平時期的外交方針被後人概括為「韜光養晦、有所作為」，主張中國應在崛起過程中保持低調、避免過早與美國等既有強權正面對抗，此一方針持續影響中共外交政策數十年，直到2012年習近平上台後才逐漸轉向更為積極甚至強硬的「大國外交」風格。",
    knowledge:["考點陷阱（cs-mc-109）：「韜光養晦」是鄧小平時期奠定的外交方針，習近平上台後的外交風格則被外界稱為「大國外交」或「戰狼外交」，兩者常被拿來對比出題，切勿混淆","中蘇關係正常化的前提「三大障礙」（邊境陳兵、越南侵柬、蘇聯侵阿富汗）常考排序與內容配對；隨1989年蘇聯自阿富汗撤軍（詳見[[modern|soviet-afghan-war|蘇聯入侵阿富汗]]事件卡）而逐步排除","鄧戈會談（1989年5月）恰與六四天安門事件同一時期發生，國際記者原為採訪鄧戈會談而聚集北京，意外成為六四事件對外報導的關鍵因素，詳見[[crossstrait|tiananmen-1989|天安門事件]]事件卡","鄧小平「獨立自主的和平外交政策」（1982）標誌著不再明確選邊美蘇任一陣營，與毛澤東時期「一邊倒」（詳見[[china|prc-founding-1949|中華人民共和國建政與「一邊倒」外交]]事件卡）及其後「一條線」聯美制蘇戰略均不相同，是中共對外戰略路線演變的重要比較節點"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：「韜光養晦」的本質是在國力尚未成熟時避免與既有霸權正面衝突、爭取和平發展的戰略機遇期，是新興強權處理與既有霸權關係的經典守勢策略，可與{{修昔底德陷阱}}詞條對照討論。"},{label:"馬克思主義／共產主義",text:"角度：改革開放引入市場機制卻不放棄共產黨一黨領導，形成「社會主義市場經濟」的獨特路線，對傳統馬克思主義計畫經濟理論構成重大修正，是比較政府與政治科目的重要考點。"},{label:"外交史方法論",text:"角度：中蘇關係正常化歷經近十年談判、以「三大障礙」逐項排除作為推進條件，展現大國關係正常化往往需要具體、可驗證的先決條件，而非單靠意願宣示，可與美中關係正常化的漸進模式對照。"}]},
  {id:"hongkong-macau-handover",region:"china",period:"⑦後冷戰當代國際關係期 1991–迄今",year:"1984–1999",title:"香港與澳門回歸：中英聯合聲明、中葡聯合聲明與一國兩制",spec:"core",
    narrative:"1982年起，英國首相柴契爾夫人與鄧小平就香港前途問題展開多輪談判，英方原欲以主權換治權延續管治，遭中方堅拒。1984年12月19日，中英兩國簽署《中英聯合聲明》，確認中華人民共和國將於1997年7月1日恢復對香港行使主權，並承諾香港特別行政區在回歸後五十年內實行「一國兩制」、保留原有資本主義制度與生活方式不變，設立香港基本法作為特區的憲制性文件（基本法於1990年由中國全國人大通過）。葡萄牙隨後跟進，於1987年4月13日簽署《中葡聯合聲明》，確認澳門於1999年12月20日回歸，同樣實行一國兩制、五十年不變。1997年7月1日，香港正式移交中華人民共和國，成立香港特別行政區；1999年12月20日，澳門同樣移交、成立澳門特別行政區。一國兩制原先是鄧小平為解決台灣問題所構思的方案，最終卻先在香港、澳門付諸實踐，成為中共對台政策論述中經常援引的參照案例。",
    knowledge:["一國兩制構想最早是鄧小平針對台灣問題提出（詳見[[policy|prc-taiwan-policy-evolution|中共對台政策文件沿革]]卡），卻先在香港、澳門實踐，「一國兩制先用於港澳、後及於台灣」的政策論述邏輯是常考重點","《中英聯合聲明》（1984）與《中葡聯合聲明》（1987）都承諾「五十年不變」，但香港基本法（1990年通過）是實踐一國兩制的具體憲制文件，須與兩份聯合聲明本身區分","2020年中國全國人大常委會通過《香港國安法》，被普遍認為實質架空一國兩制承諾，直接影響台灣內部對一國兩制的觀感，詳見[[modern|hong-kong-2019|香港反送中運動與港版國安法]]事件卡；我國因應則修正《香港澳門關係條例》，詳見[[policy|hk-macau-relations-act|香港澳門關係條例]]卡","考點陷阱：陸委會依組織法職掌港澳與大陸事務，但**不包含**金門、馬祖政策（金馬屬於一般的大陸政策事務範疇，非港澳事務），這是常考的職掌範圍精確辨析"],
    theory:[{label:"國際公法",text:"最貼近考古題方向：香港、澳門回歸涉及國際法上的主權移轉（而非國家繼承或政府繼承），中英、中葡聯合聲明是具有國際法拘束力的正式條約，與港版國安法通過後各界質疑中國是否履行條約義務的爭議相互呼應。"},{label:"比較政府與政治",text:"角度：一國兩制下香港基本法設計的行政長官選舉制度、立法會組成方式，以及國安法通過後對香港自治程度的實質改變，是分析「威權治理下有限自治」制度設計的重要案例。"},{label:"建構主義",text:"角度：一國兩制在1980年代原是安撫港人、爭取台灣的正面論述工具，2019年後隨國安法通過，其國際形象已從「制度創新承諾」轉變為「承諾未獲兌現」的負面象徵，顯示同一套政策論述的意義會隨後續實踐而重新被建構。"}]},
  {id:"xi-era-diplomacy",region:"china",period:"⑥兩岸分治外交期 1949–1979",year:"2012–2022",title:"習近平時代外交起點：十八大、一帶一路與大國外交",spec:"core",
    narrative:"2012年11月，中共召開第十八次全國代表大會，習近平接任中共中央總書記，2013年3月再接任國家主席，成為黨政軍最高領導人；此後中共外交政策逐漸告別鄧小平時期「韜光養晦」的低調路線，轉向對外宣示更為積極的「大國外交」。2013年9月至10月，習近平先後在哈薩克與印尼提出「絲綢之路經濟帶」與「21世紀海上絲綢之路」構想，合稱「一帶一路」倡議，透過陸路、海路兩條路線，向沿線國家提供基礎建設融資與投資，是中共近年最重要的對外經濟戰略；為配合一帶一路的資金需求，中國於2016年主導成立亞洲基礎設施投資銀行（AIIB），並強化既有的上海合作組織在安全與經濟領域的整合功能。2017年10月中共十九大，習近平在政治報告中提出「中國特色社會主義進入新時代」的論述，同時修改黨章將「習近平新時代中國特色社會主義思想」寫入指導思想；2022年10月，中共二十大確認習近平打破前兩任總書記的兩屆任期慣例、續任第三屆總書記。整體而言，習近平時期的外交風格，相較於鄧小平時期的低調守成，展現更強的主動介入姿態：解放軍在南海構築島礁、宣布劃設東海防空識別區，並積極介入中東等區域事務的斡旋，外界因此以「大國外交」，甚至更強硬的「戰狼外交」稱呼此一時期的整體對外作風。",
    knowledge:["考點陷阱（cs-mc-163）：一帶一路是習近平於2013年提出，並非胡錦濤；胡錦濤是習近平的前一任總書記（2002–2012），常考人物與政策的錯誤配對","考點陷阱（cs-mc-109）：習近平上台後的外交風格被稱為「大國外交」或「戰狼外交」，與前任鄧小平時期的「韜光養晦」方針形成鮮明對比，詳見[[china|deng-xiaoping-diplomacy|鄧小平時代外交：改革開放、獨立自主與中蘇關係正常化]]事件卡","一帶一路（絲綢之路經濟帶+21世紀海上絲綢之路）與亞洲基礎設施投資銀行（AIIB，2016年開業）是配套的政策工具，前者是倡議本身，後者是提供融資的金融機構，詳見[[org|aiib|亞洲基礎設施投資銀行（AIIB）]]卡","與一帶一路相關但規模較小、常被放在一起考的兩項東南亞經貿佈局：中國與東協於2010年正式啟動《中國－東協自由貿易區》（CAFTA），是當時全球人口最多的自由貿易區；中國則早於2003年即加入《東南亞友好合作條約》（TAC），是東協之外最早加入該條約的大國之一，兩者常與「東協中心性」（ASEAN Centrality，即由東協主導區域整合議程的原則）概念一併申論","十八大（2012接班）、十九大（2017「新時代」論述入黨章）、二十大（2022打破兩屆任期慣例續任）是習近平鞏固權力的三個時間節點，常考時序排列","習近平時期解放軍在南海的具體擴張作為（構築島礁、劃設東海防空識別區），詳見[[modern|south-china-sea|南海爭端]]事件卡"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：一帶一路與AIIB是中國憑藉經濟實力累積，將影響力轉化為地緣政治話語權的具體實踐，也是新興強權挑戰既有國際經濟秩序規則制定權的典型案例。"},{label:"馬克思主義／依賴理論",text:"角度：一帶一路對沿線開發中國家提供基礎建設融資，卻也引發「債務陷阱外交」的批評——即部分受援國因無力償還鉅額貸款，被迫以港口、礦產等關鍵資產作為抵押或長期租讓，形成新型態的經濟依賴關係。"},{label:"建構主義",text:"角度：從「韜光養晦」到「大國外交」的路線轉變，本質上是中共對自身國際身分認同的重新建構——從「發展中國家、避免出頭」轉為「日益自信、尋求與國力相稱的國際地位」，這種身分認知的變化先於、也驅動了具體政策的轉向。"},{label:"地緣政治學",text:"角度：一帶一路的陸路與海路兩條路線設計，呼應傳統地緣政治學中陸權與海權並重的戰略思維，試圖同時強化中國在歐亞大陸腹地與印太海域的影響力布局。"}]},
  {id:"meiji",region:"eastasia",period:"日本近代化起點",year:"1868起",title:"明治維新",spec:"core",
    narrative:"1853年黑船事件打破日本鎖國，倒幕運動興起，1868年明治天皇親政。新政府推動廢藩置縣、殖產興業、富國強兵、文明開化等現代化改革，1871–73年岩倉使節團出訪歐美。",
    knowledge:["廢藩置縣（1871）徹底終結幕藩體制，建立中央集權國家","1889年《大日本帝國憲法》確立君主立憲體制，是東亞第一部近代成文憲法——注意鄂圖曼帝國早於1876年已頒布憲法，故精確表述應為東亞第一部，而非亞洲第一部，是常考的精確用詞陷阱"],
    theory:[{label:"現實主義",text:"最貼近：明治維新是外部壓力下快速完成國家能力建構的案例，中央集權改革與清朝自強運動地方分權模式形成對比。"},{label:"建構主義",text:"角度：文明開化是主動採納西方{{文明標準}}以求平等承認的策略性選擇。"}]},
  {id:"american-revolution",region:"west",period:"①西發里亞體系期 1648–1815",year:"1775–1783",title:"美國獨立戰爭與法國介入",spec:"core",
    narrative:"英屬北美十三殖民地因無代表不納稅等爭議與英國關係惡化，1775年爆發武裝衝突，隔年發表《獨立宣言》。法國基於七年戰爭（1756–63）敗於英國、失去北美殖民地的舊恨，視此為報復良機，於1778年正式承認美國為主權獨立國家並締結同盟條約，派遣軍隊與海軍艦隊協助美軍作戰（法國海軍在約克鎮圍城戰中封鎖海路，是英軍投降的關鍵）。西班牙、荷蘭稍後也相繼加入對英作戰。1783年《巴黎條約》簽訂，英國承認美國獨立。然而法國為此戰爭付出鉅額軍費，國庫幾近枯竭，卻未能從中獲得實質領土或貿易利益回報，反而加劇了法國國內財政危機與階級矛盾，成為六年後（1789年）法國大革命爆發的重要遠因之一。",
    knowledge:["法國是第一個正式承認美國為主權國家的國家（1778）——常考的精確年代與國家配對題","法國介入純粹是地緣政治報復算計（削弱英國），而非意識形態認同共和價值，法國本身當時仍是君主專制國家","法國參戰軍費是壓垮法國財政的最後一根稻草，直接連結到法國大革命（1789）的爆發，可與後續拿破崙戰爭事件串成完整因果鏈","這場戰爭也是近代國際法承認理論的早期實踐案例——一國透過外交承認賦予新生政權國際法主體地位"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：法國介入美國獨立戰爭純粹是傳統權力平衡邏輯下削弱對手（英國）的策略操作，與美國追求的自由民主理念毫無關係。"},{label:"依賴理論／IPE",text:"角度：戰爭費用掏空法國國庫，直接證明軍事介入的財政成本如何反噬介入國自身，可與拿破崙戰爭事件的因果鏈起點相互連結。"},{label:"國際公法",text:"角度：法國的正式承認賦予美國國際法主體地位，是研究近代國家承認制度起源的重要案例。"},{label:"外交史方法論",text:"角度：適合做短期軍事勝利與長期戰略代價不成比例的分析——法國雖助美國獨立成功，卻也親手點燃了六年後顛覆自己王朝的革命火種，是外交決策意外後果的經典教材。"}]},
  {id:"french-revolution",region:"west",period:"①西發里亞體系期 1648–1815",year:"1789–1799",title:"法國大革命",spec:"light",
    narrative:"法國因參與美國獨立戰爭掏空國庫、財政瀕臨破產，加上舊制度下三級社會結構的長期矛盾，路易十六被迫於1789年召開三級會議尋求增稅，第三等級代表另組國民議會、發表網球場宣言，隨即發生巴士底獄事件，大革命爆發。國民議會發布《人權和公民權宣言》，揭示主權在民、自由平等等原則，並於1791年推動君主立憲改革。然而國內激進派與歐洲君主國的敵意持續升高，1792年4月主戰的吉倫特派主導的立法議會率先對奧地利宣戰，普魯士隨即加入奧地利一方，第一次反法同盟戰爭爆發；同年8月巴黎民眾攻入杜樂麗宮，路易十六遭剝奪王室職權並囚禁，9月新成立的國民公會正式宣布廢除君主制、成立第一共和。1793年路易十六被處決，震撼歐洲各君主國，法國陷入雅各賓派主導的恐怖統治，同時頒布全國總動員令，建立起近代史上第一支基於全民徵召的大規模國民軍。1794年熱月政變推翻羅伯斯比爾，恐怖統治結束，改由督政府執政，政局持續動盪，直到1799年拿破崙發動霧月政變掌權，大革命的動盪期正式告終。",
    causal:"法國大革命的意識形態衝擊（主權在民、處決國王）與國民公會主動對奧宣戰的決定，是七次反法同盟戰爭爆發的直接起點，也是[[west|napoleonic-wars|拿破崙戰爭與反法同盟]]事件卡開頭「歐洲君主國深恐革命思想蔓延」的具體歷史依據；全國總動員令建立的國民兵源動員模式，也是拿破崙此後得以發動連續大規模戰爭的軍事基礎。革命輸出的主權在民思想與戰後[[west|vienna-congress|維也納會議與歐洲協商體系]]極力恢復的王朝正統原則直接對立，構成19世紀歐洲外交史「舊秩序 vs 新思潮」對抗的意識形態起點。"},
  {id:"napoleonic-wars",region:"west",period:"①西發里亞體系期 1648–1815",year:"1792–1815",title:"拿破崙戰爭與反法同盟",spec:"core",
    narrative:"法國大革命後，歐洲君主國深恐革命思想蔓延，組成第一次反法同盟干涉法國內政，反遭法軍擊退。拿破崙於1799年霧月政變掌權，1804年稱帝建立法蘭西第一帝國，展開一系列對外征服。英國始終是拿破崙最頑強的對手，先後主導組織了七次反法同盟，糾集普魯士、奧地利、俄羅斯等歐陸強權，運用其海上優勢與財政補貼維持同盟運作。1805年特拉法加海戰，英國海軍徹底摧毀法西聯合艦隊，確立英國制海權。為癱瘓英國經濟命脈，拿破崙自1806年起推行大陸體系（大陸封鎖政策），但英國憑藉海上優勢與殖民地市場化解衝擊，反倒是歐陸國家經濟受創。俄國於1810年退出大陸體系，拿破崙遂於1812年率軍入侵俄國，卻在焦土戰略與嚴冬下慘敗。1813年萊比錫戰役聯軍大敗拿破崙，1814年拿破崙退位，同年召開維也納會議重建歐洲秩序；1815年拿破崙建立百日王朝，最終在滑鐵盧戰役被徹底擊敗，拿破崙戰爭正式落幕。",
    knowledge:["英國對抗拿破崙的核心戰略是以錢養同盟——靠優勢海權維持本土安全，同時財政津貼收買普奧俄等陸權強國持續對法作戰，是{{離岸平衡者}}的經典操作","特拉法加海戰（1805）確立英國19世紀海權霸主地位，直接關聯後續兩強標準海軍政策","大陸體系反而重創歐陸經濟，是拿破崙帝國由盛轉衰的關鍵政策失誤","拿破崙入侵俄國失敗（1812）是帝國崩潰轉捩點，常與後續希特勒入侵蘇聯做跨時代比較","1815年維也納會議在拿破崙戰爭尚未完全落幕前即已召開，是維也納體系起點的關鍵背景"],
    theory:[{label:"現實主義（權力平衡理論）",text:"最貼近考古題方向：七次反法同盟是古典權力平衡理論的教科書案例——單一強權實力膨脹到足以支配歐陸，其餘國家便組成抗衡聯盟制衡，英國作為{{離岸平衡者}}的角色貫穿全程。"},{label:"外交史方法論",text:"角度：適合做層次分析——意識形態擴散、拿破崙個人野心、歐陸君主對政權存續的恐懼，三者交織導致戰爭反覆爆發。"},{label:"依賴理論／IPE",text:"角度：大陸體系本質是最早的大規模經濟制裁嘗試，證明對海權國家實施陸權式封鎖效果有限，反而傷及己方盟友經濟。"},{label:"建構主義",text:"角度：法國大革命輸出的主權在民、民族國家思想衝擊歐洲舊有王朝正統性認知，維也納會議後戰勝國極力壓制此思潮、恢復正統王朝。"}]},
  {id:"vienna-congress",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1814–1815",title:"維也納會議與歐洲協商體系",spec:"core",
    narrative:"拿破崙戰爭結束後，戰勝的英、俄、普、奧四強（加上戰敗的法國由塔列朗代表列席）於1814年9月至1815年6月在維也納召開會議，重建拿破崙戰爭摧毀的歐洲秩序。會議由奧地利首相梅特涅主導，確立三大指導原則：正統原則（恢復戰前正統王朝統治，如法國波旁王朝復辟）、補償原則（戰勝國依貢獻程度分配領土補償）、以及權力平衡原則（刻意扶植中等強國作為緩衝、避免任一強權獨大）。會後，五強建立歐洲協商機制——透過定期召開多邊會議協調處理重大國際爭端，是近代史上第一個接近集體安全雛形的國際合作嘗試，維持了歐洲大國間長達近40年的相對和平。然而此體系本質上是保守王朝聯合鎮壓自由主義與民族主義思潮的工具，1830年比利時獨立、1848年歐洲各地爆發革命浪潮，已顯示體系內部矛盾，直到克里米亞戰爭徹底打破列強協同一致的默契。",
    knowledge:["維也納會議三大原則：正統原則、補償原則、權力平衡原則，是常考的申論核心概念","{{歐洲協商}}是考古題明確考過的專有名詞，指維也納會議後建立的多邊協調機制，不要與後來的國際聯盟或歐洲整合混淆","梅特涅是維也納會議的靈魂人物，其保守主義外交哲學主導了此後近30年的歐洲秩序","1830年比利時獨立、1848年革命浪潮，是歐洲協商體系內部矛盾外顯的早期警訊","1830年比利時獨立的直接觸發點是同年稍早爆發的法國七月革命——巴黎民眾推翻極端保守的復辟波旁王室（查理十世），改由較溫和的奧爾良王室路易腓力繼位，這股革命餘波隨即擴散至荷蘭統治下的比利時，引爆當地脫離獨立的行動，是歐洲協商體系保守王朝聯合鎮壓自由主義根基開始鬆動的第一個具體案例","1830年代至1840年代這段相對平靜的年間，梅特涅保守體系仍持續運作、鎮壓各地零星的自由主義與民族主義騷動，直到1848年全歐洲革命浪潮同時爆發（詳見[[west|frankfurt-parliament|德意志革命與法蘭克福議會]]事件卡），才真正動搖歐洲協商體系的保守根基"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：歐洲協商是近代史上第一個依賴多邊協商機制維持國際和平的實驗性嘗試，可作為20世紀國際聯盟、聯合國等集體安全機制的思想先驅。"},{label:"現實主義",text:"角度：三大原則本質上仍是傳統權力平衡邏輯的延伸，並非真正基於道德或法律原則。"},{label:"建構主義",text:"角度：體系正當性建立在王朝正統這一共享觀念之上，一旦民族主義興起動搖此觀念，體系便難以維繫。"},{label:"外交史方法論",text:"角度：適合比較維也納體系（多邊協商）與後續俾斯麥同盟體系（精算型同盟網絡）在操作邏輯上的差異。"}]},
  {id:"greek-independence",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1821–1832",title:"希臘獨立戰爭",spec:"light",
    narrative:"希臘長期受鄂圖曼帝國統治，1821年希臘民族主義者發動起義，尋求脫離鄂圖曼獨立。起義初期遭鄂圖曼及其藩屬埃及聯軍鎮壓，但希臘獨立訴求在歐洲知識界與浪漫主義思潮中激起廣泛同情（英國詩人拜倫親赴希臘參戰並病逝當地，成為象徵性事件）。1827年，英、法、俄三國基於各自地緣政治考量（英國關切地中海航線、俄國藉東正教同胞情誼南下、法國尋求在地中海的影響力），罕見地聯合組成艦隊，於納瓦里諾海戰擊潰鄂圖曼—埃及聯合艦隊，扭轉戰局。1830年，列強簽署《倫敦議定書》正式承認希臘獨立，1832年希臘正式建國，並依歐洲協商慣例由列強擇定巴伐利亞王子奧圖出任希臘國王。",
    causal:"是[[west|vienna-congress|維也納會議與歐洲協商體系]]卡片中歐洲協商機制少數成功協調多邊軍事干預的案例，可與稍後[[west|crimean-war|克里米亞戰爭]]卡片中協商徹底破局的失敗案例做正反對照，共同構成近東問題從維也納體系邊緣議題演變為壓垮歐洲協商核心矛盾的完整敘事線。"},
  {id:"monroe-doctrine",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1823",title:"門羅主義",spec:"light",
    narrative:"拿破崙戰爭結束後，西班牙、葡萄牙在拉丁美洲的殖民地紛紛掀起獨立浪潮，維也納體系下的保守強權（尤其神聖同盟核心的俄、普、奧）一度醞釀協助西班牙鎮壓美洲獨立運動、恢復殖民統治。美國總統門羅於1823年向國會發表國情咨文，宣示美洲大陸不再是歐洲列強殖民擴張的對象，任何歐洲勢力介入美洲事務將被視為對美國的敵對行為；同時美國也承諾不干涉歐洲列強既有殖民地事務及歐洲內政，形成美洲事務美洲解決、歐洲事務歐洲解決的雙向不介入原則。這份宣言在當時美國國力尚弱、缺乏實質軍事後盾的情況下，主要仰賴英國海軍基於自身商業利益（希望拉美新興市場對英國開放貿易）默許支持才得以生效。",
    causal:"門羅主義是美國孤立主義外交傳統的思想起點，直接呼應[[theory|postwar-order-strategies|大戰後秩序重建三種選擇]]理論卡中棄守／退出戰略的孤立主義傳統——一戰後美國拒絕加入國際聯盟的決定，正是這條孤立主義思想脈絡近百年後的延續。門羅主義也填補了[[west|american-revolution|美國獨立戰爭與法國介入]]（1783）到門戶開放政策（1899）之間美國外交史的長期空白，標誌美國從被動的新生國家轉為主動劃定自身勢力範圍的區域性強權。"},
  {id:"frankfurt-parliament",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1848–1849",title:"德意志革命與法蘭克福議會",spec:"light",
    narrative:"1848年，受法國二月革命（推翻路易腓力、建立第二共和）影響，革命浪潮迅速蔓延至德意志邦聯各邦。同年5月，來自各邦的自由派代表齊聚法蘭克福聖保羅教堂召開國民議會（史稱法蘭克福議會），嘗試以由下而上、議會協商的方式完成德意志統一與立憲改革，並於1849年正式向普魯士國王腓特烈．威廉四世提出德意志皇帝的頭銜。然而普王以不願撿拾陰溝裡的皇冠為由拒絕接受，議會本身缺乏軍隊、財政與強制執行力，各邦君主也拒絕配合，最終遭普魯士軍隊武力驅散，自由派由下而上的統一嘗試徹底失敗。",
    causal:"這場失敗的自由派統一嘗試，與後續[[west|german-unification|德意志統一戰爭]]卡片中俾斯麥由上而下、透過鐵血政策（戰爭而非議會辯論）完成統一形成鮮明對比，是申論題比較不同民族統一路徑的重要素材，也可與既有[[west|italian-unification|義大利統一運動]]卡片中加富爾（由上而下外交操作）與加里波底（由下而上動員）的雙軌對比相互呼應，構成完整的19世紀民族統一路徑類型學。同時也是[[west|vienna-congress|維也納會議與歐洲協商體系]]卡片中提到1848年歐洲各地爆發革命浪潮的德意志邦聯具體體現。"},
  {id:"crimean-war",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1853–1856",title:"克里米亞戰爭",spec:"core",
    narrative:"戰爭源於{{近東問題}}——鄂圖曼帝國國力持續衰弱，其境內龐大領土（尤其巴爾幹半島、黑海海峽）成為列強眼中的權力真空。導火線是法俄圍繞聖地保護權的爭執，俄國沙皇尼古拉一世藉口保護鄂圖曼境內東正教徒權益，於1853年出兵佔領摩爾多瓦、瓦拉幾亞，鄂圖曼隨即對俄宣戰，爆發俄土戰爭。英法唯恐俄國藉此突破黑海、進逼地中海與英國通往印度的航線利益，遂於1854年正式對俄宣戰，加入鄂圖曼一方作戰，薩丁尼亞王國稍後也加入，意圖藉此提升國際地位、爭取列強支持義大利統一。戰事主要在克里米亞半島的塞凡堡展開長期圍城戰，雙方傷亡慘重，俄國最終戰敗求和。1856年參戰各國於巴黎召開和會，簽訂《巴黎和約》，確立黑海中立化——俄國不得在黑海保有海軍艦隊或沿岸軍事設施，同時承認鄂圖曼帝國領土完整、准其加入歐洲協商體系。",
    knowledge:["113年三等第17題考古題官方答案確認：克里米亞戰爭也被稱為僧侶之間的戰爭，因導火線源於天主教與東正教僧侶對聖地管理權的爭執——這是考試官方認定的正確敘述，應試時可放心採用","主要參戰國為英、法、俄、鄂圖曼帝國及薩丁尼亞王國五方，薩丁尼亞加入是外交操作，為義大利統一鋪路","《巴黎和約》最關鍵內容是黑海中立化，而非割地","戰後法國與奧地利並未建立緊密軍事同盟，奧地利在戰爭中態度曖昧、未實際出兵援俄，反而讓法奧關係疏離","巴黎和約規範交戰期間中立國貨物應受保護、不得沒收充公，是海上國際法的重要先例","克里米亞戰爭並非近東問題首次引發列強介入——1830年代埃及總督穆罕默德．阿里兩度率軍挑戰鄂圖曼宗主權（土埃戰爭），列強（尤其英俄）多次介入調停，1841年《倫敦海峽公約》確立博斯普魯斯、達達尼爾海峽平時禁止外國軍艦通行的原則，是近東問題長期發酵的前哨戰，也是黑海中立化概念的先聲"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：這是列強聯手抗衡單一崛起強權的權力平衡經典案例——俄國藉鄂圖曼衰弱意圖南下擴張，英法唯恐俄國打破區域權力平衡，遂結盟介入。"},{label:"地緣政治",text:"角度：{{近東問題}}本質是鄂圖曼帝國衰弱留下的權力真空引發列強競逐，這條線索一路延伸到後續巴爾幹危機、第一次世界大戰爆發背景。"},{label:"國際公法",text:"角度：《巴黎和約》對中立國貨物的保護規範及黑海中立化條款，是近代國際法規範戰爭行為、限制特定海域軍事化的重要先例。"},{label:"外交史方法論",text:"角度：可比較克里米亞戰爭的舊式均勢外交聯合抗衡，與後續俾斯麥同盟體系的精算型同盟網絡在操作邏輯上的差異。"}]},
  {id:"italian-unification",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1859–1870",title:"義大利統一運動",spec:"core",
    narrative:"義大利半島長期分裂為多個邦國，並部分受奧地利宗主。薩丁尼亞王國首相加富爾推動統一大業，深知薩丁尼亞國力不足以獨力對抗奧地利，遂於1858年與法國拿破崙三世秘密會談（普隆比耶密約），換取法國軍事支持對抗奧地利，代價是割讓尼斯、薩伏依予法國。1859年薩丁尼亞挑起與奧地利的戰爭（薩奧戰爭），法軍助陣擊敗奧軍，薩丁尼亞取得倫巴底，但拿破崙三世因擔心普魯士介入及國內壓力，中途與奧地利單獨媾和，未完全實現原先密約承諾。同年，中義大利多個公國透過公民投票併入薩丁尼亞。1860年，民族主義志士加里波底率領紅衫軍自西西里島登陸，席捲兩西西里王國，最終將征服的南義領土獻給薩丁尼亞國王維克多．伊曼紐二世。1861年義大利王國正式建國，但威尼西亞（仍屬奧地利）與羅馬（教皇國，受法國保護）尚未統一。1866年義大利藉普奧戰爭之機與普魯士結盟對抗奧地利，戰後取得威尼西亞。1870年普法戰爭爆發，法軍撤離羅馬防務，義大利趁機佔領羅馬，完成統一大業，定羅馬為首都。",
    knowledge:["加富爾與拿破崙三世的普隆比耶密約（1858）是義大利統一運動關鍵的外交操作——藉助外部強權之力對抗奧地利，以割讓尼斯、薩伏依為代價","拿破崙三世在薩奧戰爭中途撤手，顯示大國介入他國統一進程往往有其自身利益盤算，不會無條件支持到底","加里波底的紅衫軍南征是由下而上民族主義動員的代表，與加富爾由上而下的外交操作路線形成對比","義大利統一最終兩個關鍵拼圖（威尼西亞、羅馬）都是借力其他強權戰爭之機取得，而非義大利自身軍事實力主導","薩奧戰爭（1859）是義大利統一關鍵戰爭，注意與德國統一的普奧戰爭（1866）、普法戰爭（1870）區分，常考混淆題"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：薩丁尼亞藉助法國外部力量對抗奧地利，是小國借助大國權力槓桿完成統一目標的策略操作。"},{label:"民族主義",text:"角度：義大利統一是19世紀民族主義浪潮代表案例，加里波底紅衫軍體現由下而上的動員，與同時期德國由上而下透過王朝戰爭完成統一的路徑形成鮮明對比，正是申論題義大利與德國統一路徑異同的核心比較點。"},{label:"外交史方法論",text:"角度：適合做層次分析——加富爾的外交操作、拿破崙三世的策略性介入與抽手、義大利各邦民族主義情緒，三者交織完成統一。"},{label:"建構主義",text:"角度：義大利統一過程中義大利民族認同的建構本身仍在進行中，統一在政治疆界上完成，但民族認同的實質整合是更長期的過程。"}]},
  {id:"german-unification",region:"west",period:"②維也納體系／歐洲協商期 1815–1871",year:"1864–1871",title:"德意志統一戰爭",spec:"core",
    narrative:"普魯士首相俾斯麥（1862年就任）主張透過鐵血政策完成德意志統一，先前普魯士主導的關稅同盟已在經濟上整合德意志各邦，為政治統一鋪路。1864年，普魯士聯合奧地利共同對丹麥作戰（普丹戰爭），爭奪什列斯威、霍爾斯坦兩公國，丹麥戰敗，兩公國由普奧共管。俾斯麥刻意操作兩公國管理爭端，於1866年挑起普奧戰爭，普魯士憑藉優越的軍事組織與鐵路動員能力速戰速決，七週內擊敗奧地利，戰後俾斯麥對奧地利採取寬大政策，避免奧地利心生報復阻撓後續統一大業，奧地利被排除出德意志邦聯，普魯士主導成立北德意志邦聯。法國拿破崙三世對普魯士崛起深感不安，1866年普奧戰爭後，拿破崙三世試圖購買盧森堡以彌補未獲補償的失落，普魯士民族主義輿論強烈反對，法普一度瀕臨開戰邊緣，最終1867年《倫敦條約》宣布盧森堡永久中立化解危機，這場危機顯示法普關係早在埃姆斯電報事件三年前就已瀕臨破裂。雙方圍繞西班牙王位繼承問題爆發外交爭端，俾斯麥藉{{埃姆斯電報事件}}刻意激怒法國，法國於1870年對普宣戰，爆發普法戰爭。普軍迅速擊潰法軍，拿破崙三世於{{色當戰役}}被俘投降，法蘭西第二帝國瓦解；普軍圍攻巴黎，1871年戰爭結束，《法蘭克福條約》法國割讓阿爾薩斯、洛林予德國並賠款。同年普魯士國王威廉一世在凡爾賽宮鏡廳加冕為德意志帝國皇帝，德國統一大業完成。",
    knowledge:["{{鐵血政策}}意指以軍事實力與現實政治手段（而非自由派議會辯論）達成統一目標，是俾斯麥外交風格的代名詞","關稅同盟（Zollverein）常考：目的並非對抗英法經濟威脅，而是整合德意志經濟、連結領土、創造居民共同記憶、強化內聚力","普丹戰爭（1864）是普魯士聯合奧地利對丹麥作戰，不是排除奧地利——常見錯誤選項陷阱","普奧戰爭後俾斯麥對奧地利採寬大政策，是為減少日後阻撓與復仇心理，展現見好就收的外交智慧","{{埃姆斯電報事件}}是俾斯麥刻意操作輿論、激化法德衝突的經典案例","阿爾薩斯、洛林的割讓是後續法德世仇與第一次世界大戰法德矛盾的直接根源，可與集團對立與一戰結構性起源事件相互連結","俄國在普奧戰爭（1866）與普法戰爭（1870）中選擇中立，是兩條因果線疊加的結果——一是[[west|crimean-war|克里米亞戰爭]]後奧地利的背叛讓俄奧關係疏遠；二是1863年波蘭一月起義期間，普魯士主動與俄國簽訂《阿爾文斯雷本協定》協助封鎖邊境圍堵波蘭叛軍，換取俄國對普魯士的信任與好感"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：俾斯麥的鐵血政策是純粹權力政治的展現，三場戰爭（普丹、普奧、普法）依序精算執行，是有限戰爭達成有限目標的策略典範。"},{label:"外交史方法論",text:"角度：{{埃姆斯電報事件}}展示個人的訊息操作如何直接觸發國家層次的戰爭決策。"},{label:"比較政府與政治",text:"角度：德國統一是由上而下透過王朝戰爭主導完成，與義大利統一外交操作加民族主義動員雙軌並行形成鮮明對比，是申論題核心比較點。"},{label:"依賴理論／IPE",text:"角度：關稅同盟顯示經濟整合可作為政治統一的前導基礎，這條經濟先行、政治隨後的路徑與後續20世紀歐洲整合邏輯遙相呼應。"},{label:"自由主義／功能主義",text:"角度：關稅同盟的整合邏輯可套用[[theory|functionalism|功能主義／新功能主義]]理論框架理解——經濟領域的低階技術性整合（統一關稅、貿易政策）外溢至更高階的政治整合（德意志帝國建立），與20世紀歐洲煤鋼共同體外溢至歐盟政治整合是同一套邏輯跨世紀的兩次實踐，儘管俾斯麥主導的統一過程本身仍以現實主義鐵血政策為主軸，關稅同盟作為前置的經濟整合基礎，仍可視為功能主義路徑的早期歷史先例。"}]},
  {id:"bismarck",region:"west",period:"③俾斯麥同盟體系期 1871–1890",year:"1871–1890",title:"俾斯麥同盟體系",spec:"core",
    narrative:"普法戰爭結束、德意志帝國統一後，俾斯麥外交核心目標轉為維持現狀、孤立法國。建構三皇同盟（1873，1881年重訂）、德奧同盟（1879）、三國同盟（1882，納入義大利）等複雜同盟網絡，1887年更與俄國簽訂{{再保條約}}。1888年威廉二世繼位，1890年俾斯麥下台，新皇拒絕續簽{{再保條約}}，體系隨即瓦解。",
    knowledge:["俾斯麥同盟體系三大支柱的確切年份：德奧同盟（1879）、三皇同盟重訂（1881）、三國同盟（1882）——常考的年份配對題","德奧同盟義務（共同防俄）與{{再保條約}}（對俄中立承諾）彼此矛盾，僅靠俾斯麥本人精算平衡","俾斯麥外交目標是維持現狀而非擴張，與威廉二世世界政策形成對比","三國同盟成立隔年（1883），羅馬尼亞因憂懼俄國擴張威脅（1878年柏林會議後俄國違約併吞比薩拉比亞南部），秘密加入德奧義三國同盟，這條反俄性質的秘密連結，讓俾斯麥同時要兼顧的矛盾承諾又多了一層——對羅馬尼亞、奧匈的防俄義務，與對俄國本身的再保條約中立承諾，體系的精算複雜度與潛在矛盾持續累積","同樣在1887年，英國與義大利、奧匈帝國另外簽署兩次《地中海協定》，約定共同維持地中海、亞得里亞海現狀、防範法俄擴張，與再保條約同年並存，顯示1887年是俾斯麥同盟體系最複雜精密的巔峰——多組同盟義務同時運作、彼此制衡，這種高度依賴精算平衡的體系也預示了俾斯麥下台後迅速瓦解的結構性脆弱"],
    theory:[{label:"現實主義",text:"最貼近：俾斯麥體系是精算型權力平衡極致案例。"},{label:"外交史方法論",text:"角度：體系高度依賴個人能動性，威廉二世上台後迅速瓦解證明此依賴的脆弱性。"}]},
  {id:"berlin-congress-1878",region:"west",period:"③俾斯麥同盟體系期 1871–1890",year:"1875–1878",title:"巴爾幹危機、聖斯泰法諾條約與柏林會議",spec:"core",
    narrative:"1875年，波士尼亞、赫塞哥維納爆發反抗鄂圖曼統治的民族起義，隔年保加利亞也爆發起義，遭鄂圖曼血腥鎮壓（史稱保加利亞暴行），震驚歐洲輿論。俄國藉泛斯拉夫主義、以保護巴爾幹斯拉夫民族為由，於1877年對鄂圖曼宣戰（第十次俄土戰爭），戰勝後於1878年強迫鄂圖曼簽訂《聖斯泰法諾條約》，扶植出一個領土龐大、涵蓋大半巴爾幹半島的大保加利亞作為俄國附庸，實質上讓俄國勢力大幅深入地中海周邊。此舉引發英國、奧匈帝國強烈不安，唯恐俄國藉此打破巴爾幹權力平衡、威脅英國通往印度的地中海航線。俾斯麥自居誠實的掮客，出面斡旋，於1878年召開柏林會議，簽訂《柏林條約》大幅修正聖斯泰法諾條約——將大保加利亞大幅縮小並一分為三，其餘領土歸還鄂圖曼或分配給其他巴爾幹國家，波士尼亞、赫塞哥維納則交由奧匈帝國代管。",
    knowledge:["108年三等第14題考一戰前巴爾幹半島混亂局勢，追溯到鄂圖曼帝國、奧匈帝國、俄羅斯帝國三個帝國的統治與介入，本事件正是三帝國角力的關鍵開端","1878年柏林會議處理的是巴爾幹俄土戰爭後續問題，不要與1884–85年處理瓜分非洲的柏林會議混淆——常考的柏林會議年代與議題配對題","波士尼亞、赫塞哥維納交由奧匈帝國代管，而非正式併吞，這個模糊安排直接埋下[[west|bloc-rivalry|集團對立與一戰結構性起源]]卡片中1908年波士尼亞危機（奧匈正式併吞）的伏筆","1885年，東魯米利亞與保加利亞公國宣布合併，打破柏林條約劃定的邊界安排，引發塞爾維亞與保加利亞之間的戰爭，也讓俄奧關係更趨緊張——俄國原本扶植保加利亞作為附庸，卻對保加利亞脫離掌控、走向獨立自主感到不滿，反而是奧匈默許了這次合併，使俄奧兩國在巴爾幹的角力立場一度逆轉，是1878年柏林會議權宜安排失效的具體案例，也是俾斯麥同盟體系內部矛盾（德奧同盟防俄 vs 再保條約對俄中立）被迫攤牌測試的重要背景","俾斯麥自居誠實的掮客，展現此時德國尚未直接涉入巴爾幹利益、仍能扮演中立調停者角色，與後續威廉二世世界政策時期德國涉入加深形成對比"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：柏林會議是列強為避免俄國藉大保加利亞打破巴爾幹權力平衡而集體介入修正的權力平衡操作，延續了[[west|crimean-war|克里米亞戰爭]]卡片中列強抗衡俄國南下擴張的同一條邏輯主線。"},{label:"建構主義／民族主義",text:"角度：巴爾幹地區斯拉夫民族主義與泛斯拉夫主義的興起，是後續一戰結構性起源中泛斯拉夫主義對泛日耳曼主義對立的直接源頭。"},{label:"外交史方法論",text:"角度：適合連結分析——1878年柏林會議的權宜安排（波士尼亞代管）如何在30年後（1908年）演變成正式併吞危機，展現外交協議中模糊留白條款的長期風險。"}]},
  {id:"berlin-conference",region:"west",period:"③俾斯麥同盟體系期 1871–1890",year:"1884–1885",title:"柏林會議與新帝國主義瓜分非洲",spec:"core",
    narrative:"1870年代起，第二次工業革命帶動歐洲列強對原料與市場的渴求急遽升高，加上蘇伊士運河（1869年開通）大幅縮短歐亞航程、提升非洲戰略地位，列強競相以「探險」「傳教」為名深入非洲內陸，爭奪殖民地的行動日益白熱化，史稱「新帝國主義」。比利時國王利奧波德二世對剛果盆地的私人殖民野心，以及英法在西非、中非的利益衝突，使歐洲列強面臨瓜分非洲失控引發衝突的風險。1884年11月至1885年2月，德國首相俾斯麥在柏林召集英、法、德、比、葡等十餘國召開會議（柏林西非會議），會議確立「有效佔領原則」——列強欲主張某片非洲土地的主權，須證明已建立實質行政管理與軍事駐防，而非僅憑探險隊插旗宣示，此舉大幅加速了列強對非洲內陸的實質佔領競賽。會議承認比利時國王利奧波德二世對剛果自由邦的統治，並確立剛果河、尼日河流域的自由航行與貿易原則。柏林會議後短短二十年間，非洲大陸除衣索比亞、賴比瑞亞外幾乎全數淪為歐洲列強殖民地，史稱「非洲的爭奪戰」（Scramble for Africa）。",
    knowledge:["柏林會議（1884–85）處理的是瓜分非洲的議題，不要與更早的[[west|berlin-congress-1878|1878年柏林會議（巴爾幹危機）]]混淆——常考的柏林會議年代與議題配對題","「有效佔領原則」是柏林會議最重要的制度性遺產，將殖民擴張從口頭宣示轉為要求實質行政與軍事控制，大幅加速了非洲被瓜分的速度","整場會議完全沒有非洲當地統治者或代表參與，是「他人決定他人命運」的殖民主義本質的赤裸展現","蘇伊士運河（1869開通）的戰略價值是英國積極介入埃及、控制運河區的直接動機——埃及原為鄂圖曼帝國名義上的藩屬，1875年埃及財政破產、無力償還蘇伊士運河公司股份債務，英國趁機低價買下埃及持有的運河股份，取得運河控制權的關鍵一步；1882年埃及爆發烏拉比革命（反抗外國財政控制的民族主義起義），英國以保護僑民與運河安全為由出兵鎮壓，自此實質軍事佔領埃及，雖名義上仍尊重鄂圖曼宗主權與埃及自治，實質上已將埃及納入英國勢力範圍，是「新帝國主義」以保護戰略航線為名行實質佔領之實的典型案例，108年三等第20題曾直接命中此一描述","法國因鄂圖曼土耳其國力衰弱而佔領其北非屬地突尼西亞，是舊帝國（鄂圖曼）衰落造成列強擴張真空的典型案例"],
    theory:[{label:"現實主義",text:"最貼近考古題方向：柏林會議是列強為避免因非洲瓜分競爭擦槍走火、引發歐洲大戰而建立的規則協調機制，本質仍是強權主導的權力劃分，只是將potentially衝突的零和競爭「制度化」，降低意外擦槍走火的風險。"},{label:"依賴理論／IPE",text:"角度：非洲爭奪戰是資本主義列強尋求原料產地與商品市場的赤裸展現，符合列寧帝國主義論核心論點，可與甲午戰爭日本設廠、集團對立殖民地爭奪等主線相互呼應，構成全球性的邊陲化案例對照。"},{label:"國際公法",text:"角度：有效佔領原則某種程度上是近代國際法對「主權取得」設下的形式要件，但完全排除當地人民同意，是研究殖民主義時期國際法「合法性建構」侷限性的重要案例。"},{label:"建構主義",text:"角度：德皇威廉二世認為國家適用社會達爾文主義優勝劣敗、適者生存的論點，將帝國主義擴張建構為國家生存競爭的必然邏輯，這種意識形態敘事為赤裸裸的資源掠奪提供了道德正當性的包裝。"}]},
  {id:"bloc-rivalry",region:"west",period:"④集團對立期 1890–1914",year:"1890–1914",title:"集團對立與一戰結構性起源",spec:"core",
    narrative:"1890年俾斯麥下台後，威廉二世推動世界政策，追求德國成為世界殖民強權，自1898年起大力擴建公海艦隊，直接挑戰英國{{兩強標準}}海軍優勢，觸發英德軍備競賽。第二次工業革命後起的德國、義大利等國工業實力迅速追上傳統強權，卻因殖民地瓜分已近尾聲，僅能分得零星殖民地，這正是政治經濟發展不平衡矛盾的具體體現。法國藉機擺脫孤立：1894年法俄同盟成立；英國因{{光榮孤立}}政策難以為繼，1904年簽署英法協約；隨後1907年英俄協約，三國協約正式對抗三國同盟。三大矛盾各自透過具體危機層層堆疊：英德矛盾以海軍軍備競賽為核心；法德矛盾體現在1905年第一次摩洛哥危機與1911年第二次摩洛哥危機；俄奧矛盾根源於巴爾幹半島泛斯拉夫主義與泛日耳曼主義對立，具體衝突包括1908年波士尼亞危機（源於[[west|berlin-congress-1878|1878年柏林會議]]將波士尼亞交由奧匈代管的模糊安排，奧匈此時正式併吞）、1912–13年兩次巴爾幹戰爭。這些危機最終在1914年塞拉耶佛事件引爆第一次世界大戰。",
    knowledge:["政治經濟發展不平衡是列寧帝國主義論核心論點，後起工業強權因殖民地已被瓜分而心生不滿","法俄同盟（1894）打破意識形態相近才結盟的直覺，是純粹現實利益結盟","英法協約、英俄協約本質是劃分殖民地利益範圍，不含自動參戰條款，與同盟法律性質不同","法紹達危機（1898）是英法在蘇丹爭奪殖民地引發的外交衝突，法國最終讓步撤軍，反而促成日後英法協約的形成基礎","德雷福事件（1894–1906，法國猶太裔軍官遭誣陷叛國案）重創法國保守派與王室復辟勢力，鞏固法國共和體制","兩次摩洛哥危機（1905丹吉爾、1911阿加迪爾）都以德國砲艦外交介入告終，但每次反而讓英法關係更緊密","巴爾幹被稱為歐洲火藥庫：1908波士尼亞危機、1912–13兩次巴爾幹戰爭層層堆疊，最終1914塞拉耶佛事件引爆一戰","英國殖民擴張同時奉行3C政策——開普敦、開羅、加爾各答三點串連的鐵路暨戰略構想，由殖民地大臣張伯倫與礦業大亨羅德斯積極推動，目標打通貫穿非洲南北的英屬殖民地走廊；這與德國威廉二世推動的3B政策（柏林—拜占庭—巴格達鐵路）形成直接地緣戰略衝突與競爭，是英德矛盾除海軍軍備競賽外，另一個常被忽略但同樣重要的地緣政治面向，3C vs 3B是世界史教材常見的標準對照組合"],
    theory:[{label:"現實主義（尤其{{修昔底德陷阱}}）",text:"最貼近：崛起強權尋求與實力不相稱的政治地位，觸發既有霸權抗衡反應。"},{label:"建構主義／民族主義",text:"角度：巴爾幹半島泛斯拉夫主義與泛日耳曼主義，是民族主義意識形態被大國工具化、用以擴張地緣政治影響力的案例。"},{label:"依賴理論／IPE",text:"角度：政治經濟發展不平衡呼應列寧帝國主義論核心命題。"},{label:"外交史方法論",text:"角度：適合做完整層次分析——系統層次的多極均勢瓦解、國家層次的德國世界政策、個人層次的威廉二世風格。"}]},
  {id:"wwi-course",region:"west",period:"④集團對立期 1890–1914",year:"1914–1918",title:"第一次世界大戰的爆發與經過",spec:"core",
    narrative:"1914年6月28日，奧匈帝國皇儲斐迪南大公夫婦於塞拉耶佛遇刺，奧匈藉此對塞爾維亞提出最後通牒，7月28日對塞宣戰。俄國基於泛斯拉夫主義展開軍事動員；德國依同盟義務對俄宣戰，並依施里芬計畫於8月對法宣戰，取道比利時入侵法國；英國因德國違反比利時中立承諾對德宣戰。短短一個月內，主要強權依循同盟義務連鎖捲入戰爭。戰爭初期德國速勝計畫受阻（馬恩河戰役），陷入西線壕溝戰的長期消耗僵局。1917年，美國因德國無限制潛艇戰及齊瑪曼電報事件宣布參戰；同年俄國爆發十月革命，與德國於1918年3月簽訂《布列斯特-立陶夫斯克條約》單獨媾和退出戰爭，割讓波蘭、波羅的海三國、芬蘭、烏克蘭等大片領土予德國。1918年同盟國相繼崩潰，德皇退位，11月11日簽署停戰協定，大戰結束。",
    knowledge:["施里芬計畫核心邏輯是先西後東、速戰速決，但計畫失敗導致德國正陷入其最擔心的兩線戰爭","英國參戰的直接觸發點是德國入侵比利時，而非單純同盟義務——英國並無正式軍事同盟條款，參戰保有相當自主性","美國參戰兩大導火線：無限制潛艇戰、齊瑪曼電報事件","俄國退出戰爭讓德國得以西調兵力，一度延長戰爭，但美國參戰的資源優勢最終壓倒同盟國"],
    theory:[{label:"現實主義",text:"角度最貼近考古題方向：一戰爆發完美示範同盟連鎖效應——各國因既有同盟義務被迫捲入原本無關的區域衝突，顯示僵化同盟體系反而可能升高戰爭風險。"},{label:"外交史方法論",text:"角度：適合完整層次分析——系統層次的僵化同盟結構、國家層次的施里芬計畫戰略焦慮、個人層次的斐迪南遇刺偶發性。"},{label:"建構主義",text:"角度：塞爾維亞民族主義、泛斯拉夫主義等意識形態動員是推動衝突升級的重要因素。"},{label:"依賴理論／IPE",text:"角度：美國參戰後大量軍需輸出協約國，加速美國從債務國轉為債權國的角色轉變。"}]},
  {id:"paris-peace",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1919",title:"巴黎和會與凡爾賽體系",spec:"core",
    narrative:"一戰結束後，協約國於1919年1月在巴黎召開和會，由美國總統威爾遜、英國首相勞合喬治、法國總理克里蒙梭三巨頭主導。威爾遜提出十四點原則，主張民族自決、公開外交、建立國際聯盟，但法國堅持對德施以嚴厲懲罰性條款，雙方理念衝突。1919年6月簽訂《凡爾賽條約》：德國須負戰爭罪責並支付鉅額賠款、陸軍限制10萬人以下、萊茵蘭非軍事化、割讓阿爾薩斯洛林、喪失所有海外殖民地（改由戰勝國委任統治）。條約同時創設國際聯盟，但美國參議院未批准條約、未加入國聯，是最大先天缺陷。東亞方面，日本繼承德國在山東權益，中國雖為戰勝國卻未能爭回山東，消息傳回激起五四運動，中國代表團拒絕簽字。",
    knowledge:["十四點原則是威爾遜理想主義外交代表作，核心含公開外交、航行自由、民族自決、建立國際聯盟","美國國會未批准凡爾賽條約、未加入國際聯盟，是這個體系最大的先天缺陷","山東問題是巴黎和會對中國最大的傷害，直接導致五四運動，與膠州灣事件、瓜分危機主線相互連結","{{委任統治}}是戰勝國瓜分戰敗國殖民地的新包裝形式，實質仍是變相殖民","法國堅持嚴厲懲罰德國，埋下納粹崛起的遠因"],
    theory:[{label:"自由主義／國際制度",text:"角度最貼近考古題方向：國際聯盟代表首次系統性嘗試以多邊制度取代權力平衡維持和平，但美國未加入的缺陷印證制度若缺乏強權支持、實效大打折扣。"},{label:"現實主義",text:"角度：法國堅持懲罰性條款是傳統權力平衡思維下削弱對手的策略操作，與威爾遜理想主義形成張力。"},{label:"國際公法",text:"角度：{{委任統治}}制度是國際法首次將殖民地治理國際化的嘗試，為二戰後託管制度埋下先例。"},{label:"民族主義",text:"角度：巴黎和會激起中國五四運動及殖民地世界對民族自決理念的期待與失望，催化了全球殖民地民族主義運動。"}]},
  {id:"ottoman-collapse-turkey",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1918–1923",title:"鄂圖曼帝國滅亡與土耳其共和國建立",spec:"light",
    narrative:"鄂圖曼帝國在一戰期間加入同盟國陣營作戰，戰敗後於1920年被迫簽訂《色佛爾條約》，領土遭協約國大幅瓜分肢解，僅保留安納托利亞高原一小部分核心疆域。這份條約激起土耳其民族主義者的強烈反彈，軍事將領凱末爾（後尊稱阿塔圖克，意為土耳其人之父）拒絕承認條約、領導民族抵抗運動，擊退希臘等國的入侵企圖，並廢黜鄂圖曼蘇丹政權。1923年，凱末爾領導的新政府與協約國重新談判，簽訂《洛桑條約》取代色佛爾條約，確立現代土耳其共和國的疆界範圍，同年10月土耳其共和國正式宣告成立，定都安卡拉，凱末爾出任首任總統。凱末爾隨即推動一系列世俗化、西化改革——廢除哈里發制度（政教合一象徵）、改採拉丁字母取代阿拉伯字母、頒布世俗民法、賦予婦女參政權，將土耳其從鄂圖曼帝國的政教合一遺緒，徹底轉型為現代世俗民族國家。",
    causal:"這是延續近一個世紀近東問題敘事線（自[[west|crimean-war|克里米亞戰爭]]、[[west|berlin-congress-1878|1878年柏林會議]]、[[west|bloc-rivalry|集團對立與一戰結構性起源]]的巴爾幹危機系列）的最終落幕——鄂圖曼帝國這個歐洲病夫最終正式解體，其歐洲領土絕大部分已在此前的巴爾幹戰爭與一戰中喪失，凱末爾的世俗化改革也成為此後其他伊斯蘭世界國家現代化路徑的重要參照對象。"},
  {id:"interwar-collapse",region:"west",period:"⑤兩次大戰間期 1919–1939",year:"1919–1939",title:"兩次大戰間期的和平嘗試與崩潰",spec:"core",
